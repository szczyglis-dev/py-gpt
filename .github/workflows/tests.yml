name: Tests

on:
  push:
    branches:
      - master

  workflow_dispatch:

# Cancel an older test run when a newer commit/run for the same ref starts.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python 3.10 / pytest 7.4.4)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system test dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ffmpeg \
            libdbus-1-3 \
            libegl1 \
            libgl1 \
            libpulse0 \
            portaudio19-dev \
            xauth \
            xvfb

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

          # Keep the CI test runner pinned even if requirements.txt changes later.
          python -m pip install 'pytest==7.4.4'
          python -m pytest --version

      - name: Run tests
        shell: bash
        env:
          ENV_TEST: '1'
          TEST_LANGUAGE: en
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          xvfb-run -a python -m pytest tests -vv
