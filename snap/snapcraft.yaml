name: pygpt
base: core24  # Ubuntu 24.04
version: '2.8.3'
summary: Desktop AI Assistant - o1, gpt-4, gpt-4-vision, chat, assistant, vision.

description: |
  **PyGPT** is **all-in-one** Desktop AI Assistant that provides direct interaction
  with OpenAI language models, including GPT-4, GPT-4 Vision, and GPT-3.5,
  through the OpenAI API. The application also integrates with alternative LLMs.

grade: stable
confinement: strict

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

parts:
  pygpt:
    # source: https://github.com/szczyglis-dev/py-gpt.git
    # source-branch: master
    source: .
    plugin: python

    python-requirements:
      - requirements.txt

    stage-packages:
      - libasound2t64
      - libasound2-data
      - libportaudio2
      - libpulse0
      - ffmpeg
      - gstreamer1.0-libav
      # Qt 6 XCB platform plugin runtime dependencies.
      # Keep these explicit: without kde-neon they are no longer supplied
      # transitively by the desktop extension.
      - libx11-6
      - libx11-xcb1
      - libxext6
      - libxrender1
      - libxi6
      - libxfixes3
      - libsm6
      - libice6
      - libxcb1
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-shm0
      - libxcb-sync1
      - libxcb-util1
      - libxcb-xfixes0
      - libxcb-xkb1
      - libxcb-xinerama0
      - libxcb-xinput0
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libxkbfile1
      - ubuntu-restricted-extras
      - libfreetype6
      - libgtk-3-0t64
      - libpng16-16t64
      - libfontconfig1
      - xkb-data
      - libxapp-gtk3-module
      - xapp-sn-watcher
      - libatomic1
      - packagekit-gtk3-module

      # Playwright Chromium runtime libraries
      - libnss3
      - libxcomposite1
      - libxdamage1
      - libxrandr2
      - libxtst6
      - libcups2t64

      # PipeWire for QtMultimedia
      - libpipewire-0.3-0t64
      - libspa-0.2-modules

      # GStreamer runtime used by QtMultimedia
      - libgstreamer1.0-0
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-pulseaudio

      # GTK3 modules and icon themes
      - libcanberra-gtk3-module
      - adwaita-icon-theme
      - hicolor-icon-theme
      - shared-mime-info

      # Wayland client libs and XKB for cross-display compatibility
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1

    build-packages:
      - execstack
      - portaudio19-dev
      - gstreamer1.0-libav
      - libxcb-cursor0

    override-build: |
      craftctl default

      find "$CRAFT_PART_INSTALL" \
        -name "onnxruntime_pybind11_state*.so" \
        -exec execstack --clear-execstack {} \;

      cp -r "$CRAFT_PART_SRC/snaprun.sh" "$CRAFT_PART_INSTALL/"
      cp -r "$CRAFT_PART_SRC/src" "$CRAFT_PART_INSTALL/"

      # Make all bundled source files readable and all directories traversable
      # by the user running the snap.
      #
      # This fixes directories that accidentally have permissions such as 2700,
      # while not marking every .py file as executable.
      chmod -R a+rX "$CRAFT_PART_INSTALL/src"

      # NLTK cache used by llama_index.
      # NLTK 3.10+ requires the custom data directory to be explicitly allowed.
      NLTK_CACHE="$CRAFT_PART_INSTALL/lib/python3.12/site-packages/llama_index/legacy/_static/nltk_cache"

      mkdir -p "$NLTK_CACHE"
      export NLTK_DATA="$NLTK_CACHE"

      "$CRAFT_PART_INSTALL/bin/python3" -m nltk.downloader \
        -d "$NLTK_CACHE" \
        stopwords punkt punkt_tab

      # Playwright Chromium
      export PLAYWRIGHT_BROWSERS_PATH="$CRAFT_PART_INSTALL/ms-playwright"

      if [ "${CRAFT_ARCH_TRIPLET_BUILD_FOR%%-*}" != "i386" ]; then
        "$CRAFT_PART_INSTALL/bin/python3" -m playwright install chromium
      fi

layout:
  /usr/share/alsa:
    bind: $SNAP/usr/share/alsa

plugs:
  docker:
    interface: docker

  docker-executables:
    interface: content
    content: docker-executables
    target: $SNAP_COMMON/docker-executables

apps:
  pygpt:
    command: snaprun.sh
    extensions: [gpu]

    # PyGPT bundles PySide6/Qt6. Use only the generic GPU extension here;
    # kde-neon is Qt5/KF5-specific and is not needed.

    environment:
      PYTHONPATH: "$PYTHONPATH:$SNAP/usr/lib/python3/dist-packages:$SNAP/src"

      QT_XKB_CONFIG_ROOT: "$SNAP/usr/share/X11/xkb"

      QTWEBENGINEPROCESS_PATH: "$SNAP/lib/python3.12/site-packages/PySide6/Qt/libexec/QtWebEngineProcess"

      # Make QML modules from PySide6 visible
      QML_IMPORT_PATH: "$SNAP/lib/python3.12/site-packages/PySide6/Qt/qml:$SNAP/qml"
      QML2_IMPORT_PATH: "$SNAP/lib/python3.12/site-packages/PySide6/Qt/qml:$SNAP/qml"

      PATH: "$SNAP_COMMON/docker-executables/bin:$PATH"

      QTWEBENGINE_DISABLE_SANDBOX: "1"

      # Allow QtWebEngine to select the right Ozone backend automatically
      # (Wayland/X11)
      QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu-sandbox --ozone-platform-hint=auto"

      PLAYWRIGHT_BROWSERS_PATH: "$SNAP/ms-playwright"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"

      # Make sure Qt loads plugins from bundled PySide6 first
      QT_PLUGIN_PATH: "$SNAP/lib/python3.12/site-packages/PySide6/Qt/plugins:$QT_PLUGIN_PATH"

      # Ensure icon themes and other shared data are visible
      XDG_DATA_DIRS: "$SNAP/usr/share:$SNAP/share:$XDG_DATA_DIRS"

      # Use portals for file dialogs under Wayland/X11
      QT_QPA_PLATFORMTHEME: "xdgdesktopportal"

    plugs:
      - alsa
      - audio-playback
      - audio-record
      - browser-support
      - network
      - network-bind
      - home
      - gsettings
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - unity7
      - camera
      - serial-port
      - docker
      - docker-executables