# .readthedocs.yaml
# Read the Docs configuration for PyHuey documentation.
#
# PyHuey is the cockpit fork tailored for the Monkey-Head-Project / HueyOS.
# Keep the docs build lightweight: do not install the full GUI/runtime stack
# unless the docs explicitly require import-time autodoc against PyHuey modules.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.13"
  apt_packages:
    # Used by Sphinx graph/diagram extensions if enabled.
    - graphviz
    # Useful for Markdown/reStructuredText conversions if docs tooling needs it.
    - pandoc

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt
