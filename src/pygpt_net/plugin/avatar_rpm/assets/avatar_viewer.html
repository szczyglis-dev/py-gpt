<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PyGPT Avatar</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:100vw; height:100vh; overflow:hidden;
    background: linear-gradient(160deg, #0f0c29, #302b63, #24243e);
    font-family: 'Segoe UI', sans-serif;
  }
  #avatar-canvas { width:100%; height:100%; display:block; }
  #loading {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    color:rgba(255,255,255,0.8); text-align:center; font-size:13px;
  }
  .spinner {
    width:36px; height:36px; margin:0 auto 10px;
    border:3px solid rgba(255,255,255,0.2);
    border-top-color:#fff;
    border-radius:50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  #status {
    position:absolute; bottom:12px; left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.6);
    color:white; padding:6px 16px;
    border-radius:20px; font-size:11px;
    opacity:0; transition:opacity 0.3s;
    pointer-events:none;
  }
  #status.visible { opacity:1; }
  #status.speaking { background:rgba(34,197,94,0.75); }
  #open-creator {
    position:absolute; top:10px; right:10px;
    background:rgba(255,255,255,0.15);
    color:white; border:1px solid rgba(255,255,255,0.3);
    border-radius:8px; padding:6px 10px;
    font-size:10px; cursor:pointer;
    backdrop-filter:blur(4px);
    transition:background 0.2s;
  }
  #open-creator:hover { background:rgba(255,255,255,0.25); }
</style>
</head>
<body>
<canvas id="avatar-canvas"></canvas>
<div id="loading"><div class="spinner"></div><span>Loading avatar...</span></div>
<div id="status">💬 Speaking...</div>
<button id="open-creator" onclick="openRPMCreator()">🎭 Edit Avatar</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>

<script>
class AvatarManager {
  constructor() {
    this.scene = null; this.camera = null; this.renderer = null;
    this.avatar = null; this.mixer = null;
    this.clock = new THREE.Clock();
    this.morphAnimations = {};
    this.lipInterval = null;
    this.isSpeaking = false;
    this.init();
  }

  init() {
    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 1000);
    this.camera.position.set(0, 1.5, 2.2);
    this.camera.lookAt(0, 1.4, 0);

    const canvas = document.getElementById('avatar-canvas');
    this.renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
    this.renderer.setSize(innerWidth, innerHeight);
    this.renderer.setPixelRatio(devicePixelRatio);
    this.renderer.outputEncoding = THREE.sRGBEncoding;
    this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
    this.renderer.toneMappingExposure = 1.1;
    this.renderer.shadowMap.enabled = true;

    // Lights
    this.scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const key = new THREE.DirectionalLight(0xfff5e6, 1.0);
    key.position.set(3, 8, 5);
    key.castShadow = true;
    this.scene.add(key);
    const fill = new THREE.DirectionalLight(0xe6f0ff, 0.4);
    fill.position.set(-4, 2, -3);
    this.scene.add(fill);

    window.addEventListener('resize', () => {
      this.camera.aspect = innerWidth/innerHeight;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(innerWidth, innerHeight);
    });
    this.animate();
  }

  loadAvatar(url) {
    const loader = new THREE.GLTFLoader();
    loader.load(
      url,
      (gltf) => {
        if (this.avatar) this.scene.remove(this.avatar);
        this.avatar = gltf.scene;
        this.avatar.traverse(node => {
          if (node.isMesh) {
            node.castShadow = true;
            node.receiveShadow = true;
          }
        });
        if (gltf.animations.length) {
          this.mixer = new THREE.AnimationMixer(this.avatar);
          gltf.animations.forEach(clip => {
            const action = this.mixer.clipAction(clip);
            if (clip.name.toLowerCase().includes('idle')) action.play();
          });
        }
        this.scene.add(this.avatar);
        document.getElementById('loading').style.display = 'none';
      },
      undefined,
      (err) => {
        console.error('Avatar load error:', err);
        document.getElementById('loading').innerHTML =
          '<div style="color:#f87171">⚠️ Error loading avatar.<br>Check the RPM URL in settings.</div>';
      }
    );
  }

  setEmotion(emotion) {
    const map = {
      happy:     { mouthSmile:0.8, eyesClosed:0.0, browInnerUp:0.0 },
      sad:       { mouthFrown:0.7, eyesClosed:0.2, browInnerUp:0.5 },
      surprised: { mouthOpen:0.6, eyesWide:0.9,   browInnerUp:0.8 },
      angry:     { mouthFrown:0.9, browDownRight:0.7, browDownLeft:0.7 },
      thinking:  { eyesClosed:0.15, browInnerUp:0.3 },
      neutral:   { mouthSmile:0.0, eyesClosed:0.0, browInnerUp:0.0 }
    };
    if (!this.avatar) return;
    const morphs = map[emotion] || map.neutral;
    this.avatar.traverse(node => {
      if (node.isMesh && node.morphTargetDictionary && node.morphTargetInfluences) {
        Object.entries(morphs).forEach(([name, val]) => {
          const idx = node.morphTargetDictionary[name];
          if (idx !== undefined) this._smoothMorph(node, idx, val);
        });
      }
    });
  }

  speak(active, volume) {
    this.isSpeaking = active;
    const status = document.getElementById('status');
    if (active) {
      status.classList.add('visible','speaking');
    } else {
      status.classList.remove('visible','speaking');
    }
    if (!this.avatar) return;
    this.avatar.traverse(node => {
      if (node.isMesh && node.morphTargetDictionary) {
        const idx = node.morphTargetDictionary['mouthOpen'];
        if (idx !== undefined) {
          if (active) {
            if (this.lipInterval) clearInterval(this.lipInterval);
            this.lipInterval = setInterval(() => {
              const v = volume * 0.8 + Math.random() * 0.25;
              this._smoothMorph(node, idx, Math.min(1,v), 0.15);
            }, 80);
          } else {
            if (this.lipInterval) clearInterval(this.lipInterval);
            this._smoothMorph(node, idx, 0, 0.2);
          }
        }
      }
    });
  }

  _smoothMorph(mesh, idx, target, speed=0.06) {
    const key = `${mesh.uuid}_${idx}`;
    if (this.morphAnimations[key]) clearInterval(this.morphAnimations[key]);
    this.morphAnimations[key] = setInterval(() => {
      const cur = mesh.morphTargetInfluences[idx] || 0;
      const diff = target - cur;
      if (Math.abs(diff) < 0.005) {
        mesh.morphTargetInfluences[idx] = target;
        clearInterval(this.morphAnimations[key]);
        return;
      }
      mesh.morphTargetInfluences[idx] = cur + diff * speed;
    }, 16);
  }

  animate() {
    requestAnimationFrame(() => this.animate());
    const d = this.clock.getDelta();
    if (this.mixer) this.mixer.update(d);
    if (this.avatar && !this.isSpeaking) {
      const t = Date.now() * 0.001;
      this.avatar.rotation.y = Math.sin(t * 0.3) * 0.08;
      this.avatar.position.y = Math.sin(t * 0.5) * 0.005;
    }
    this.renderer.render(this.scene, this.camera);
  }
}

let avatarManager;

function openRPMCreator() {
  window.open('https://demo.readyplayer.me/avatar', '_blank');
}

new QWebChannel(qt.webChannelTransport, (channel) => {
  window.backend = channel.objects.backend;
  avatarManager = new AvatarManager();
});
</script>
</body>
</html>
