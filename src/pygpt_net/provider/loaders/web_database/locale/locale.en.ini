[LOCALE]
options.query.label = SQL query
options.query.desc = SQL query to read data from database, e.g. SELECT * FROM table
config.uri.label = Uri
config.uri.desc = You can provide a single URI in the form of: {scheme}://{user}:{password}@{host}:{port}/{dbname}, or you can provide each field manually:
config.scheme.label = Database scheme
config.scheme.desc = Database dialect and driver, e.g. postgresql or mysql+pymysql. Used when URI is empty.
config.host.label = Host
config.host.desc = Database server hostname. Used when URI is empty.
config.port.label = Port
config.port.desc = Database server port. Used when URI is empty.
config.user.label = User
config.user.desc = Database login username. Used when URI is empty.
config.password.label = Password
config.password.desc = Database login password. Used when URI is empty.
config.dbname.label = Database name
config.dbname.desc = Database to connect to. Used when URI is empty.
