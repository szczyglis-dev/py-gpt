[LOCALE]
options.commit_sha.label = Commit SHA
options.commit_sha.desc = Commit hash to read instead of a branch. Provide either a commit SHA or a branch.
options.branch.label = Branch
options.branch.desc = Branch name to read, e.g. main. Provide either a branch or a commit SHA.
options.owner.label = Owner
options.owner.desc = GitHub user or organization that owns the repository.
options.repository.label = Repository
options.repository.desc = Repository name within the selected owner or project.
config.token.label = Access token
config.token.desc = GitHub access token. Leave empty to use the configured environment credentials.
config.use_parser.label = Use parser
config.use_parser.desc = Parse repository files using the reader parser.
config.verbose.label = Verbose logging
config.verbose.desc = Enable detailed reader logging.
config.concurrent_requests.label = Concurrent requests
config.concurrent_requests.desc = Maximum number of simultaneous requests to GitHub.
config.timeout.label = Timeout
config.timeout.desc = Request timeout in seconds.
config.retries.label = Retries
config.retries.desc = Number of retries after a failed request.
config.filter_dirs_include.label = Filter dirs include
config.filter_dirs_include.desc = List of directories to include, separated by comma (,)
config.filter_dirs_exclude.label = Filter dirs exclude
config.filter_dirs_exclude.desc = List of directories to exclude, separated by comma (,)
config.filter_file_ext_include.label = Filter file ext include
config.filter_file_ext_include.desc = List of file extensions to include, separated by comma (,)
config.filter_file_ext_exclude.label = Filter file ext exclude
config.filter_file_ext_exclude.desc = list of file extensions to exclude, separated by comma (,)
