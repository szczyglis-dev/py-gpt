[LOCALE]
options.base_url.label = Base URL
options.base_url.desc = Base URL of the Bitbucket server, e.g. https://bitbucket.example.com.
options.project_key.label = Project key
options.project_key.desc = Bitbucket project key containing the repository.
options.branch.label = Branch
options.branch.desc = Branch reference to read, e.g. refs/heads/main. Leave empty to use refs/heads/develop.
options.repository.label = Repository
options.repository.desc = Repository name within the selected owner or project.
config.username.label = Username
config.username.desc = Bitbucket account username used to authenticate requests.
config.api_key.label = API key
config.api_key.desc = Bitbucket API key used to authenticate requests.
config.extensions_to_skip.label = Extensions to skip
config.extensions_to_skip.desc = File extensions to exclude from the repository, separated by commas.
