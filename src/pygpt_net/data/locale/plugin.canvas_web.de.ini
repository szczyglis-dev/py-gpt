[LOCALE]
plugin.name = Leinwand (inline)
plugin.description = BETA. Stellt eine interne Leinwand-/Browser-Laufzeit für HTML und JavaScript, Website-Prototyping, auf den Browser beschränkte Interaktion, Playwright-Automatisierung, Anmerkungen und einen leichten Vorschau-Server bereit. Diese Funktion wird in zukünftigen Versionen weiter ausgebaut.
use_sandbox.label = Sandbox verwenden (Playwright)
use_sandbox.description = Aktiviert das isolierte Playwright-Browser-Backend. Wenn deaktiviert, verwendet Canvas den integrierten QWebEngine-Browser und startet Playwright nicht.
playwright_engine.label = Playwright-Engine
playwright_engine.description = Browser-Engine für das isolierte Playwright-Backend.
playwright_path.label = Playwright-Browser-Verzeichnis
playwright_path.description = Optionaler PLAYWRIGHT_BROWSERS_PATH. Leer lassen, um den Playwright-Standard zu verwenden.
playwright_args.label = Playwright-Browserargumente
playwright_args.description = Optionale, durch Kommas getrennte Startargumente für Chromium/Playwright.
default_width.label = Standardbreite des Viewports
default_width.description = Standardbreite des Browser-Viewports in Pixeln.
default_height.label = Standardhöhe des Viewports
default_height.description = Standardhöhe des Browser-Viewports in Pixeln.
auto_open_split.label = Browser automatisch im geteilten Bildschirm öffnen
auto_open_split.description = Beim ersten agentengesteuerten Öffnen des Browsers in einer Sitzung die Registerkarte Canvas in der zweiten Spalte erstellen/fokussieren und den geteilten Bildschirm anzeigen. Nach manuellem Einklappen nicht erneut erzwingen.
annotation_prompt.label = Benutzeranmerkungen dem Modell bereitstellen
annotation_prompt.description = Fügt ausstehende Browser-/Leinwand-Anmerkungen dem Laufzeit-Systemprompt hinzu.
max_annotations.label = Maximale Anzahl Anmerkungen
max_annotations.description = Maximale Anzahl der in der aktuellen Browsersitzung gespeicherten Anmerkungen.
console_limit.label = Konsolenprotokoll-Limit
console_limit.description = Maximale Anzahl der im Speicher gehaltenen Browser-Konsoleneinträge.
cmd.canvas_open.label = Aktivieren: canvas_open
cmd.canvas_open.description = Öffnet oder navigiert die dauerhafte Leinwand-/Browser-Laufzeit. Standardmäßig wird QWebEngine verwendet; Playwright nur, wenn es in den Plugin-Einstellungen aktiviert ist.
cmd.canvas_change_resolution.label = Aktivieren: canvas_change_resolution
cmd.canvas_change_resolution.description = Ändert Größe und Ausrichtung des Leinwand-/Browser-Viewports.
cmd.canvas_set_html.label = Aktivieren: canvas_set_html
cmd.canvas_set_html.description = Rendert beliebiges HTML/CSS/JavaScript in der dauerhaften Leinwand-/Browser-Laufzeit.
cmd.canvas_get_html.label = Aktivieren: canvas_get_html
cmd.canvas_get_html.description = Gibt die aktuelle Leinwand-/Browser-URL und das serialisierte HTML-Dokument zurück.
cmd.canvas_current.label = Aktivieren: canvas_current
cmd.canvas_current.description = Gibt den aktuellen Sitzungsstatus der Leinwand/des Browsers zurück.
cmd.canvas_close.label = Aktivieren: canvas_close
cmd.canvas_close.description = Schließt die sichtbare Leinwand-Registerkarte in PyGPT, ohne die Browser-Laufzeit im Hintergrund zu beenden.
cmd.canvas_prev.label = Aktivieren: canvas_prev
cmd.canvas_prev.description = Geht im Verlauf der Leinwand/des Browsers zurück.
cmd.canvas_next.label = Aktivieren: canvas_next
cmd.canvas_next.description = Geht im Verlauf der Leinwand/des Browsers vor.
cmd.canvas_reload.label = Aktivieren: canvas_reload
cmd.canvas_reload.description = Lädt das aktuelle Leinwand-/Browser-Dokument neu.
cmd.canvas_screenshot.label = Aktivieren: canvas_screenshot
cmd.canvas_screenshot.description = Erfasst den aktuellen Leinwand-/Browser-Viewport einschließlich des virtuellen Modellcursors.
cmd.canvas_inspect.label = Aktivieren: canvas_inspect
cmd.canvas_inspect.description = Untersucht sichtbare/interaktive DOM-Elemente und gibt stabile Selektoren und Begrenzungen zurück.
cmd.canvas_click.label = Aktivieren: canvas_click
cmd.canvas_click.description = Klickt ein Element oder Viewport-Koordinaten ausschließlich innerhalb der Leinwand/des Browsers.
cmd.canvas_hover.label = Aktivieren: canvas_hover
cmd.canvas_hover.description = Bewegt den virtuellen Modellcursor und führt Hover innerhalb der Leinwand/des Browsers aus.
cmd.canvas_type.label = Aktivieren: canvas_type
cmd.canvas_type.description = Fokussiert ein bearbeitbares Element und gibt Text in der Leinwand/im Browser ein.
cmd.canvas_key.label = Aktivieren: canvas_key
cmd.canvas_key.description = Sendet eine Taste oder Tastenkombination ausschließlich an die Leinwand/den Browser.
cmd.canvas_scroll.label = Aktivieren: canvas_scroll
cmd.canvas_scroll.description = Scrollt den Leinwand-/Browser-Viewport.
cmd.canvas_drag.label = Aktivieren: canvas_drag
cmd.canvas_drag.description = Zieht zwischen zwei Viewport-Koordinaten innerhalb der Leinwand/des Browsers.
cmd.canvas_wait.label = Aktivieren: canvas_wait
cmd.canvas_wait.description = Wartet auf einen Selektor oder für kurze Zeit in der Leinwand-/Browser-Laufzeit.
cmd.canvas_eval.label = Aktivieren: canvas_eval
cmd.canvas_eval.description = Führt JavaScript auf der aktuellen Leinwand-/Browser-Seite aus.
cmd.canvas_select.label = Aktivieren: canvas_select
cmd.canvas_select.description = Wählt eine Option in einem select-Element der Leinwand/des Browsers.
cmd.canvas_check.label = Aktivieren: canvas_check
cmd.canvas_check.description = Setzt den Zustand eines Kontrollkästchens oder Optionsfelds in der Leinwand/im Browser.
cmd.canvas_upload.label = Aktivieren: canvas_upload
cmd.canvas_upload.description = Lädt eine sicherheitsgeprüfte Host-Datei über ein Playwright-Dateifeld in die Leinwand/den Browser hoch.
cmd.canvas_console.label = Aktivieren: canvas_console
cmd.canvas_console.description = Gibt aktuelle JavaScript-Konsolenmeldungen und Seitenfehler der Leinwand/des Browsers zurück.
cmd.canvas_annotations.label = Aktivieren: canvas_annotations
cmd.canvas_annotations.description = Gibt Benutzeranmerkungen der aktuellen Leinwand-/Browser-Sitzung zurück.
cmd.canvas_clear_annotations.label = Aktivieren: canvas_clear_annotations
cmd.canvas_clear_annotations.description = Löscht Leinwand-/Browser-Anmerkungen.
cmd.web_server_start.label = Aktivieren: web_server_start
cmd.web_server_start.description = Startet einen nur über Loopback erreichbaren statischen Vorschau-Server für ein ausgewähltes Arbeitsverzeichnis.
cmd.web_server_current.label = Aktivieren: web_server_current
cmd.web_server_current.description = Gibt den aktuellen Status des Vorschau-Servers zurück.
cmd.web_server_stop.label = Aktivieren: web_server_stop
cmd.web_server_stop.description = Stoppt den Vorschau-Server.
ui.back = Zurück
ui.next = Weiter
ui.reload = Neu laden
ui.open_url = URL öffnen
ui.address_placeholder = URL oder lokalen Pfad eingeben und Enter drücken
ui.enable_hint = Plugin Leinwand aktivieren
ui.copy = Kopieren
ui.select_all = Alles auswählen
ui.annotate_selection = Auswahl für KI annotieren…
ui.annotate_element = Element für KI annotieren…
ui.annotation_title = Für KI annotieren
ui.annotation_selection_prompt = Kommentar / Anweisung für den ausgewählten Inhalt:
ui.annotation_element_prompt = Kommentar / Anweisung für dieses Element:
ui.annotation_added = Leinwand-/Browser-Anmerkung für KI hinzugefügt
ui.annotation_removed = Leinwand-/Browser-Anmerkung entfernt
ui.show_source = Quelltext anzeigen
ui.back_to_canvas = Zurück zu Leinwand / HTML
ui.cancel = Abbrechen
ui.add = Hinzufügen
ui.remove_annotation = Anmerkung entfernen
