[LOCALE]
plugin.name = Python-tulkki
sandbox.label = Hiekkalaatikko
sandbox.description = Poistettu käytöstä: suorittaa Python/IPythonin suoraan isäntäjärjestelmässä (turvaton). Sisäänrakennettu hiekkalaatikko: käyttää uv:n hallitsemaa sisäänrakennettua CPython/IPython-ympäristöä ja käyttöjärjestelmätason eristystä, kun se on saatavilla (keskitasoinen suojaus). Docker: edellyttää asennettua ja käynnissä olevaa Dockeria ja tarjoaa vahvimman eristyksen; se on turvallisin vaihtoehto.
