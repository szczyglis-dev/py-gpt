[LOCALE]
plugin.name = Python-tulkki
sandbox.label = Hiekkalaatikko
sandbox.description = Ei käytössä: suorittaa Python/IPythonin suoraan isäntäkoneessa (turvaton). Sisäinen: suorittaa erillistä uv:n hallitsemaa CPython/IPython-ympäristöä omassa prosessissaan, mutta ei rajoita pääsyä isäntäkoneen tiedostojärjestelmään. Docker: vaatii asennetun ja käynnissä olevan Dockerin ja tarjoaa vahvimman eristyksen; se on turvallisin vaihtoehto. Sallittu/estetty lista koskee erillisiä järjestelmäkomentotyökaluja isäntäkoneessa, sisäisessä sandboxissa ja Dockerissa.

builtin_packages.label = Asennettavat paketit
builtin_packages.description = Sisäänrakennettuun sandboxiin asennettavat Python-pakettivaatimukset. Kirjoita yksi pakettimääritys kullekin riville. Luo sisäänrakennettu venv uudelleen, jotta muutokset tulevat voimaan heti; muuten se luodaan automaattisesti uudelleen seuraavalla sisäänrakennetun sandboxin käyttökerralla.
