sandbox.description = Ei käytössä: suorittaa Python/IPythonin suoraan isäntäkoneessa (turvaton). Sisäinen: suorittaa erillistä uv:n hallitsemaa CPython/IPython-ympäristöä omassa prosessissaan, mutta ei rajoita pääsyä isäntäkoneen tiedostojärjestelmään. Docker: vaatii asennetun ja käynnissä olevan Dockerin ja tarjoaa vahvimman eristyksen; se on turvallisin vaihtoehto.

