sandbox.description = معطّل: يشغّل Python/IPython مباشرة على المضيف (غير آمن). المدمج: يشغّل بيئة CPython/IPython مخصصة يديرها uv في عملية منفصلة، لكنه لا يقيّد الوصول إلى نظام ملفات المضيف. Docker: يتطلب تثبيت Docker وتشغيله ويوفّر أقوى عزل؛ وهو الخيار الأكثر أمانًا. تنطبق قائمة السماح/الحظر على أدوات أوامر النظام المخصصة على المضيف وفي الـ Built-in sandbox وDocker.

