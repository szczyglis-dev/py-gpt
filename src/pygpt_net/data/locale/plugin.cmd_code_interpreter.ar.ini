sandbox.description = معطّل: يشغّل Python/IPython مباشرةً على المضيف (غير آمن). صندوق الحماية المدمج: يشغّل بيئة CPython/IPython مدمجة يديرها uv مع عزل على مستوى نظام التشغيل حيثما كان متاحًا (مستوى أمان متوسط). Docker: يتطلب تثبيت Docker وتشغيله ويوفّر أقوى عزل؛ وهو الخيار الأكثر أمانًا.
