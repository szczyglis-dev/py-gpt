builtin_packages.description = متطلبات حزم Python التي تُثبَّت في صندوق العزل المدمج. أدخل مواصفة حزمة واحدة في كل سطر. أعد إنشاء venv المدمج لتطبيق التغييرات فورًا؛ وإلا فسيُعاد إنشاؤه تلقائيًا عند الاستخدام التالي لصندوق العزل المدمج.
