[LOCALE]
plugin.name = Lienzo (inline)
plugin.description = Proporciona un entorno interno de lienzo/navegador para HTML y JavaScript, prototipado de sitios, interacción limitada al navegador, automatización con Playwright, anotaciones y un servidor ligero de vista previa. Esta función se ampliará en futuras versiones.
use_sandbox.label = Usar sandbox (Playwright)
use_sandbox.description = Activa el backend aislado de navegador Playwright. Si está desactivado, Canvas usa el navegador QWebEngine integrado y no inicia Playwright.
playwright_engine.label = Motor de Playwright
playwright_engine.description = Motor de navegador usado por el backend aislado de Playwright.
playwright_path.label = Directorio de navegadores de Playwright
playwright_path.description = PLAYWRIGHT_BROWSERS_PATH opcional. Déjalo vacío para usar el valor predeterminado de Playwright.
playwright_args.label = Argumentos del navegador Playwright
playwright_args.description = Argumentos de inicio opcionales para Chromium/Playwright separados por comas.
default_width.label = Ancho de vista predeterminado
default_width.description = Ancho predeterminado de la vista del navegador en píxeles.
default_height.label = Alto de vista predeterminado
default_height.description = Alto predeterminado de la vista del navegador en píxeles.
auto_open_split.label = Abrir automáticamente el navegador en pantalla dividida
auto_open_split.description = En la primera apertura del navegador por un agente en una sesión, crea o enfoca la pestaña Canvas en la segunda columna y muestra la pantalla dividida. Si el usuario la oculta después, no volver a forzarla en esa sesión.
annotation_prompt.label = Exponer las anotaciones del usuario al modelo
annotation_prompt.description = Añade las anotaciones pendientes del navegador/lienzo al prompt del sistema de ejecución.
max_annotations.label = Máximo de anotaciones
max_annotations.description = Número máximo de anotaciones conservadas en la sesión actual del navegador.
console_limit.label = Límite del registro de consola
console_limit.description = Número máximo de entradas de la consola del navegador guardadas en memoria.
cmd.canvas_open.label = Activar: canvas_open
cmd.canvas_open.description = Abre o navega por el entorno persistente de lienzo/navegador. QWebEngine se usa por defecto; Playwright solo si está habilitado en la configuración del plugin.
cmd.canvas_change_resolution.label = Activar: canvas_change_resolution
cmd.canvas_change_resolution.description = Cambia el tamaño y la orientación de la vista del lienzo/navegador.
cmd.canvas_set_html.label = Activar: canvas_set_html
cmd.canvas_set_html.description = Renderiza HTML/CSS/JavaScript arbitrario en el entorno persistente de lienzo/navegador.
cmd.canvas_get_html.label = Activar: canvas_get_html
cmd.canvas_get_html.description = Obtiene la URL actual del lienzo/navegador y el documento HTML serializado.
cmd.canvas_current.label = Activar: canvas_current
cmd.canvas_current.description = Obtiene el estado actual de la sesión de lienzo/navegador.
cmd.canvas_close.label = Activar: canvas_close
cmd.canvas_close.description = Cierra la pestaña visible del lienzo en PyGPT sin destruir la sesión del navegador en segundo plano.
cmd.canvas_prev.label = Activar: canvas_prev
cmd.canvas_prev.description = Retrocede en el historial del lienzo/navegador.
cmd.canvas_next.label = Activar: canvas_next
cmd.canvas_next.description = Avanza en el historial del lienzo/navegador.
cmd.canvas_reload.label = Activar: canvas_reload
cmd.canvas_reload.description = Recarga el documento actual del lienzo/navegador.
cmd.canvas_screenshot.label = Activar: canvas_screenshot
cmd.canvas_screenshot.description = Captura la vista actual del lienzo/navegador con el cursor virtual del modelo.
cmd.canvas_inspect.label = Activar: canvas_inspect
cmd.canvas_inspect.description = Inspecciona elementos DOM visibles/interactivos y devuelve selectores estables y límites.
cmd.canvas_click.label = Activar: canvas_click
cmd.canvas_click.description = Hace clic en un elemento o coordenadas solo dentro del lienzo/navegador.
cmd.canvas_hover.label = Activar: canvas_hover
cmd.canvas_hover.description = Mueve el cursor virtual del modelo y realiza hover dentro del lienzo/navegador.
cmd.canvas_type.label = Activar: canvas_type
cmd.canvas_type.description = Enfoca un elemento editable y escribe texto en el lienzo/navegador.
cmd.canvas_key.label = Activar: canvas_key
cmd.canvas_key.description = Envía una tecla o combinación únicamente al lienzo/navegador.
cmd.canvas_scroll.label = Activar: canvas_scroll
cmd.canvas_scroll.description = Desplaza la vista del lienzo/navegador.
cmd.canvas_drag.label = Activar: canvas_drag
cmd.canvas_drag.description = Arrastra entre dos coordenadas de la vista dentro del lienzo/navegador.
cmd.canvas_wait.label = Activar: canvas_wait
cmd.canvas_wait.description = Espera un selector o un breve periodo dentro del entorno de lienzo/navegador.
cmd.canvas_eval.label = Activar: canvas_eval
cmd.canvas_eval.description = Ejecuta JavaScript en la página actual del lienzo/navegador.
cmd.canvas_select.label = Activar: canvas_select
cmd.canvas_select.description = Selecciona una opción de un elemento select en el lienzo/navegador.
cmd.canvas_check.label = Activar: canvas_check
cmd.canvas_check.description = Establece el estado de una casilla o botón de opción en el lienzo/navegador.
cmd.canvas_upload.label = Activar: canvas_upload
cmd.canvas_upload.description = Sube un archivo del host validado por seguridad mediante un campo de archivo Playwright en el lienzo/navegador.
cmd.canvas_console.label = Activar: canvas_console
cmd.canvas_console.description = Obtiene mensajes recientes de la consola JavaScript y errores de página del lienzo/navegador.
cmd.canvas_annotations.label = Activar: canvas_annotations
cmd.canvas_annotations.description = Obtiene las anotaciones del usuario dejadas en la sesión actual de lienzo/navegador.
cmd.canvas_clear_annotations.label = Activar: canvas_clear_annotations
cmd.canvas_clear_annotations.description = Borra las anotaciones del lienzo/navegador.
cmd.web_server_start.label = Activar: web_server_start
cmd.web_server_start.description = Inicia un servidor estático de vista previa solo en loopback para un directorio de trabajo seleccionado.
cmd.web_server_current.label = Activar: web_server_current
cmd.web_server_current.description = Obtiene el estado actual del servidor de vista previa.
cmd.web_server_stop.label = Activar: web_server_stop
cmd.web_server_stop.description = Detiene el servidor de vista previa.
ui.back = Atrás
ui.next = Siguiente
ui.reload = Recargar
ui.open_url = Abrir URL
ui.address_placeholder = Introduce una URL o ruta local y pulsa Intro
ui.enable_hint = Activa el plugin Lienzo
ui.copy = Copiar
ui.select_all = Seleccionar todo
ui.annotate_selection = Anotar selección para la IA…
ui.annotate_element = Anotar elemento para la IA…
ui.annotation_title = Anotar para la IA
ui.annotation_selection_prompt = Comentario / instrucción para el contenido seleccionado:
ui.annotation_element_prompt = Comentario / instrucción para este elemento:
ui.annotation_added = Anotación de lienzo/navegador añadida para la IA
ui.annotation_removed = Anotación de lienzo/navegador eliminada
ui.show_source = Mostrar código fuente
ui.back_to_canvas = Volver al lienzo / HTML
ui.cancel = Cancelar
ui.add = Añadir
ui.remove_annotation = Eliminar anotación
