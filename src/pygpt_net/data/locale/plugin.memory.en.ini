[LOCALE]
auto_attach.description = Automatically append the active global or project memory to the system prompt in every conversation.
auto_attach.label = Auto attach memory to every conversation
auto_attach.tooltip = Automatically append the active global or project memory to the system prompt in every conversation.
auto_attach_project.description = Automatically append memory to the system prompt when the current conversation belongs to a project.
auto_attach_project.label = Auto attach memory only in projects
auto_attach_project.tooltip = Automatically append memory to the system prompt when the current conversation belongs to a project.
cmd.memory_add.description = Add only highly important, durable information to memory for the current global or project scope. Use this tool sparingly; do not use it for routine, temporary, or low-value details.
cmd.memory_add.label = Add to memory
cmd.memory_add.tooltip = Add only important durable information. Use memory_add sparingly.
cmd.memory_clear.description = Clear memory for the current scope. The model must first ask the user for explicit confirmation and call this tool only after confirmation.
cmd.memory_clear.label = Clear memory
cmd.memory_clear.tooltip = Clear memory for the current scope. The model must first ask the user for explicit confirmation and call this tool only after confirmation.
cmd.memory_get.description = Read the complete memory for the current global or project scope.
cmd.memory_get.label = Read memory
cmd.memory_get.tooltip = Read the complete memory for the current global or project scope.
cmd.memory_update.description = Replace the complete memory content for the current global or project scope.
cmd.memory_update.label = Update memory
cmd.memory_update.tooltip = Replace the complete memory content for the current global or project scope.
max_chars.description = Target maximum memory size in characters. The model is asked to stay within this limit; storage allows an additional 300-character safety margin before hard truncation.
max_chars.label = Maximum memory characters
max_chars.tooltip = Target memory size in characters; a 300-character safety margin is allowed before hard truncation.
model_update.description = Model used for automatic memory updates and, when enabled, for refining memory_add operations.
model_update.label = Memory update model
model_update.tooltip = Model used to update and refine memory.
refine_add.description = Applies only to manual memory_add calls. When enabled, the configured memory update model merges and rewrites the added information into the existing memory instead of appending raw text. Automatic end-of-context memory updates are always refined by the model regardless of this setting.
refine_add.label = Refine memory before adding
refine_add.tooltip = Refine manual memory_add calls with the configured model. Automatic context memory updates are always refined.
key_search_content.label = Search memory key content
key_search_content.description = Also search stored key values/content in memory_key_search. Key names are always searched with LIKE. Disabled by default to avoid scanning stored content.
key_search_content.tooltip = Also search key content in memory_key_search. Disabled by default.
cmd.memory_key_get.description = Read raw database-backed memory records by one key or a list of keys from the current global or project scope.
cmd.memory_key_get.label = Read keyed memory
cmd.memory_key_get.tooltip = Read raw keyed memory records from the current global or project scope.
cmd.memory_key_add.description = Store a new raw database value by key for later use in the current global or project scope. Use only for truly important data; existing keys are not overwritten.
cmd.memory_key_add.label = Add keyed memory
cmd.memory_key_add.tooltip = Store a new raw value by key. Use only for truly important data.
cmd.memory_key_append.description = Append raw content exactly as provided to an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_append.label = Append keyed memory
cmd.memory_key_append.tooltip = Append raw content to an existing key without LLM processing.
cmd.memory_key_update.description = Replace the raw content of an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_update.label = Update keyed memory
cmd.memory_key_update.tooltip = Replace raw content for an existing key without LLM processing.
cmd.memory_key_list.description = List only the stored memory key names for the current global or project scope, without content.
cmd.memory_key_list.label = List memory keys
cmd.memory_key_list.tooltip = List memory key names without content.
cmd.memory_key_search.description = Search keyed memory with LIKE matching on key names. Content is searched only when the Search memory key content option is enabled.
cmd.memory_key_search.label = Search memory keys
cmd.memory_key_search.tooltip = Search key names with LIKE and optionally search stored content.
cmd.memory_key_remove.description = Remove one database-backed memory key or a list of keys from the current global or project scope.
cmd.memory_key_remove.label = Remove memory keys
cmd.memory_key_remove.tooltip = Remove one or more stored memory keys from the current scope.
plugin.description = Provides global and per-project long-term memory backed by the local database.
plugin.name = Memory (inline)
