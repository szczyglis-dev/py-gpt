[LOCALE]
plugin.description = Model Context Protocol (MCP) के माध्यम से रिमोट टूल्स तक पहुँच देता है, जिसमें stdio, SSE और Streamable HTTP ट्रांसपोर्ट, प्रति-सर्वर अनुमति/अस्वीकृति फ़िल्टर, Authorization हेडर और टूल कैश शामिल हैं।
plugin.name = MCP
servers.description = MCP सर्वर कॉन्फ़िगर करें। समर्थित ट्रांसपोर्ट: stdio के लिए 'stdio: <command ...>', Streamable HTTP के लिए 'http(s)://...' और SSE के लिए 'http(s)://.../sse' (या 'sse://', 'sse+http(s)://')। छोटे सर्वर नाम के लिए 'label', HTTP/SSE में Authorization हेडर के लिए 'authorization', केवल चुने हुए टूल्स की अनुमति के लिए कॉमा से अलग 'allowed_commands' और टूल्स को ब्लॉक करने के लिए 'disabled_commands' का उपयोग करें।
servers.label = MCP सर्वर
servers.tooltip = MCP Python SDK आवश्यक है। इंस्टॉल करें: pip install "mcp[cli]"
tools_cache_enabled.description = खोजे गए टूल्स को मेमोरी में कैश करता है ताकि हर अनुरोध पर उन्हें फिर से खोजना न पड़े।
tools_cache_enabled.label = टूल सूची कैश करें
tools_cache_enabled.tooltip = सक्षम होने पर टूल खोज के परिणाम प्रत्येक सर्वर के लिए TTL अवधि तक कैश किए जाते हैं।
tools_cache_ttl.description = प्रत्येक सर्वर के टूल कैश का जीवनकाल।
tools_cache_ttl.label = कैश TTL (सेकंड)
tools_cache_ttl.tooltip = TTL बंद करने के लिए 0 सेट करें (अनुशंसित नहीं)।
