[LOCALE]
plugin.name = Doek en HTML
plugin.description = BETA. Biedt een interne tekenveld-/browseromgeving voor HTML en JavaScript, websiteprototyping, browsergebonden interactie, Playwright-automatisering, annotaties en een lichte previewserver. Deze functie wordt in toekomstige versies verder uitgebreid.
use_sandbox.label = Sandbox gebruiken (Playwright)
use_sandbox.description = Schakelt de geïsoleerde Playwright-browserbackend in. Als dit uitstaat, gebruikt Doek en HTML de ingebouwde QWebEngine-browser en wordt Playwright niet gestart.
playwright_engine.label = Playwright-engine
playwright_engine.description = Browserengine die door de geïsoleerde Playwright-backend wordt gebruikt.
playwright_path.label = Map met Playwright-browsers
playwright_path.description = Optionele PLAYWRIGHT_BROWSERS_PATH. Laat leeg om de Playwright-standaard te gebruiken.
playwright_args.label = Playwright-browserargumenten
playwright_args.description = Optionele, door komma’s gescheiden startargumenten voor Chromium/Playwright.
default_width.label = Standaardbreedte van viewport
default_width.description = Standaardbreedte van de browserviewport in pixels.
default_height.label = Standaardhoogte van viewport
default_height.description = Standaardhoogte van de browserviewport in pixels.
auto_open_split.label = Browser automatisch openen in gesplitste weergave
auto_open_split.description = Bij de eerste agentgestuurde browseropening in een sessie wordt het tabblad Doek en HTML in de tweede kolom gemaakt of geactiveerd en de gesplitste weergave getoond. Als de gebruiker die later verbergt, wordt ze in dezelfde sessie niet opnieuw afgedwongen.
annotation_prompt.label = Gebruikersannotaties aan het model tonen
annotation_prompt.description = Voegt wachtende browser-/tekenveldannotaties toe aan de runtime-systeemprompt.
max_annotations.label = Maximumaantal annotaties
max_annotations.description = Maximumaantal annotaties dat in de huidige browsersessie wordt bewaard.
console_limit.label = Limiet van consolelog
console_limit.description = Maximumaantal browserconsole-items dat in het geheugen wordt bewaard.
cmd.canvas_open.label = Inschakelen: canvas_open
cmd.canvas_open.description = Opent of navigeert in de permanente tekenveld-/browseromgeving. QWebEngine wordt standaard gebruikt; Playwright alleen als dit in de plugininstellingen is ingeschakeld.
cmd.canvas_change_resolution.label = Inschakelen: canvas_change_resolution
cmd.canvas_change_resolution.description = Wijzigt grootte en oriëntatie van de tekenveld-/browserviewport.
cmd.canvas_set_html.label = Inschakelen: canvas_set_html
cmd.canvas_set_html.description = Rendert willekeurige HTML/CSS/JavaScript in de permanente tekenveld-/browseromgeving.
cmd.canvas_get_html.label = Inschakelen: canvas_get_html
cmd.canvas_get_html.description = Haalt de huidige tekenveld-/browser-URL en het geserialiseerde HTML-document op.
cmd.canvas_current.label = Inschakelen: canvas_current
cmd.canvas_current.description = Haalt de huidige sessiestatus van tekenveld/browser op.
cmd.canvas_close.label = Inschakelen: canvas_close
cmd.canvas_close.description = Sluit het zichtbare tekenveldtabblad in PyGPT zonder de browsersessie op de achtergrond te beëindigen.
cmd.canvas_prev.label = Inschakelen: canvas_prev
cmd.canvas_prev.description = Gaat terug in de geschiedenis van tekenveld/browser.
cmd.canvas_next.label = Inschakelen: canvas_next
cmd.canvas_next.description = Gaat vooruit in de geschiedenis van tekenveld/browser.
cmd.canvas_reload.label = Inschakelen: canvas_reload
cmd.canvas_reload.description = Herladen van het huidige tekenveld-/browserdocument.
cmd.canvas_screenshot.label = Inschakelen: canvas_screenshot
cmd.canvas_screenshot.description = Maakt een opname van de huidige tekenveld-/browserviewport met de virtuele cursor van het model.
cmd.canvas_inspect.label = Inschakelen: canvas_inspect
cmd.canvas_inspect.description = Inspecteert zichtbare/interactieve DOM-elementen en retourneert stabiele selectors en grenzen.
cmd.canvas_click.label = Inschakelen: canvas_click
cmd.canvas_click.description = Klikt op een element of coördinaten alleen binnen tekenveld/browser.
cmd.canvas_hover.label = Inschakelen: canvas_hover
cmd.canvas_hover.description = Verplaatst de virtuele modelcursor en voert hover uit binnen tekenveld/browser.
cmd.canvas_type.label = Inschakelen: canvas_type
cmd.canvas_type.description = Focust een bewerkbaar element en typt tekst in tekenveld/browser.
cmd.canvas_key.label = Inschakelen: canvas_key
cmd.canvas_key.description = Stuurt een toets of toetscombinatie alleen naar tekenveld/browser.
cmd.canvas_scroll.label = Inschakelen: canvas_scroll
cmd.canvas_scroll.description = Scrollt de tekenveld-/browserviewport.
cmd.canvas_drag.label = Inschakelen: canvas_drag
cmd.canvas_drag.description = Sleept tussen twee viewportcoördinaten binnen tekenveld/browser.
cmd.canvas_wait.label = Inschakelen: canvas_wait
cmd.canvas_wait.description = Wacht op een selector of korte tijd in de tekenveld-/browseromgeving.
cmd.canvas_eval.label = Inschakelen: canvas_eval
cmd.canvas_eval.description = Voert JavaScript uit op de huidige tekenveld-/browserpagina.
cmd.canvas_select.label = Inschakelen: canvas_select
cmd.canvas_select.description = Selecteert een optie in een select-element in tekenveld/browser.
cmd.canvas_check.label = Inschakelen: canvas_check
cmd.canvas_check.description = Stelt de status van een selectievakje of radioknop in tekenveld/browser in.
cmd.canvas_upload.label = Inschakelen: canvas_upload
cmd.canvas_upload.description = Uploadt een beveiligingsgevalideerd hostbestand via een Playwright-bestandsveld in tekenveld/browser.
cmd.canvas_console.label = Inschakelen: canvas_console
cmd.canvas_console.description = Haalt recente JavaScript-consoleberichten en paginafouten op uit tekenveld/browser.
cmd.canvas_annotations.label = Inschakelen: canvas_annotations
cmd.canvas_annotations.description = Haalt gebruikersannotaties op uit de huidige tekenveld-/browsersessie.
cmd.canvas_clear_annotations.label = Inschakelen: canvas_clear_annotations
cmd.canvas_clear_annotations.description = Wist tekenveld-/browserannotaties.
cmd.web_server_start.label = Inschakelen: web_server_start
cmd.web_server_start.description = Start een statische previewserver die alleen via loopback bereikbaar is voor een gekozen werkmap.
cmd.web_server_current.label = Inschakelen: web_server_current
cmd.web_server_current.description = Haalt de huidige status van de previewserver op.
cmd.web_server_stop.label = Inschakelen: web_server_stop
cmd.web_server_stop.description = Stopt de previewserver.
