[LOCALE]
plugin.name = Autonomt läge
plugin.description = Aktiverar autonomt läge i alla chattlägen. VARNING: använd försiktigt; tillsammans med andra plugins kan det ge oväntade resultat.

dynamic_continue.description = Efter varje slutförd körning fungerar ett dolt anrop med den valda modellen som domare, granskar den konfigurerade svansen av den aktuella Human/Assistant-körningen och genererar instruktionen för nästa körning.
dynamic_continue.label = Dynamisk fortsättningsprompt
dynamic_continue_messages.description = Antal av de senaste Assistant-svaren i autonomt läge som inkluderas i varje domaranrop. Den ursprungliga användarinmatningen inkluderas alltid. Ange 0 för att inkludera alla svar som har producerats sedan den användarinmatningen.
dynamic_continue_messages.label = Svar att bedöma
