[LOCALE]
auto_attach.description = Legger automatisk aktivt globalt eller prosjektspesifikt minne til systemprompten i alle samtaler.
auto_attach.label = Legg automatisk ved minne i alle samtaler
auto_attach.tooltip = Legger automatisk aktivt globalt eller prosjektspesifikt minne til systemprompten i alle samtaler.
auto_attach_project.description = Legger automatisk minnet til systemprompten når den gjeldende samtalen tilhører et prosjekt.
auto_attach_project.label = Legg automatisk ved minne bare i prosjekter
auto_attach_project.tooltip = Legger automatisk minnet til systemprompten når den gjeldende samtalen tilhører et prosjekt.
cmd.memory_add.description = Legg bare til svært viktig og varig informasjon i gjeldende globale eller prosjektbaserte minne. Bruk verktøyet sparsomt; ikke lagre rutinemessige, midlertidige eller lite verdifulle detaljer.
cmd.memory_add.label = Legg til i minne
cmd.memory_add.tooltip = Legg bare til viktig varig informasjon. Bruk memory_add sparsomt.
cmd.memory_clear.description = Tømmer minnet for gjeldende område. Modellen må først be brukeren om uttrykkelig bekreftelse og bare kalle dette verktøyet etter bekreftelse.
cmd.memory_clear.label = Tøm minne
cmd.memory_clear.tooltip = Tømmer minnet for gjeldende område. Modellen må først be brukeren om uttrykkelig bekreftelse og bare kalle dette verktøyet etter bekreftelse.
cmd.memory_get.description = Leser hele minnet for gjeldende globale eller prosjektspesifikke område.
cmd.memory_get.label = Les minne
cmd.memory_get.tooltip = Leser hele minnet for gjeldende globale eller prosjektspesifikke område.
cmd.memory_update.description = Erstatter hele minneinnholdet for gjeldende globale eller prosjektspesifikke område.
cmd.memory_update.label = Oppdater minne
cmd.memory_update.tooltip = Erstatter hele minneinnholdet for gjeldende globale eller prosjektspesifikke område.
max_chars.description = Mål for maksimal minnestørrelse i tegn. Modellen blir bedt om å holde seg innenfor denne grensen; 300 ekstra tegn sikkerhetsmargin tillates før hard avkorting.
max_chars.label = Maksimalt antall minnetegn
max_chars.tooltip = Målstørrelse for minnet i tegn; en sikkerhetsmargin på 300 tegn tillates før hard avkorting.
model_update.description = Model for automatiske minneoppdateringer og, når aktivert, for å forbedre memory_add-operasjoner.
model_update.label = Modell for minneoppdatering
model_update.tooltip = Model for å oppdatere og forbedre minnet.
refine_add.description = Gjelder bare manuelle memory_add-kall. Når aktivert, slår den konfigurerte modellen sammen og omskriver den nye informasjonen inn i eksisterende minne i stedet for å legge til rå tekst. Automatiske minneoppdateringer ved slutten av konteksten blir alltid raffinert av modellen uavhengig av denne innstillingen.
refine_add.label = Forbedre minnet før tillegg
refine_add.tooltip = Raffiner manuelle memory_add-kall med den konfigurerte modellen. Automatiske minneoppdateringer raffineres alltid.
plugin.description = Gir globalt og prosjektspesifikt langtidsminne lagret i den lokale databasen.
plugin.name = Memory (inline)
