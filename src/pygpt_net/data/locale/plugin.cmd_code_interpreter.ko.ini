[LOCALE]
plugin.name = Python 인터프리터
sandbox.label = 샌드박스
sandbox.description = 비활성화: Python/IPython을 호스트에서 직접 실행합니다(안전하지 않음). 내장: uv가 관리하는 전용 CPython/IPython 환경을 별도 프로세스에서 실행하지만 호스트 파일 시스템 접근은 제한하지 않습니다. Docker: Docker가 설치되어 실행 중이어야 하며 가장 강력한 격리를 제공합니다. 가장 안전한 옵션입니다. 화이트리스트/블랙리스트는 호스트, 내장 샌드박스 및 Docker의 전용 시스템 명령 도구에 적용됩니다.

builtin_packages.label = 설치할 패키지
builtin_packages.description = 내장 샌드박스에 설치할 Python 패키지 요구 사항입니다. 한 줄에 하나의 패키지 사양을 입력하세요. 변경 사항을 즉시 적용하려면 내장 venv를 다시 만드세요. 그렇지 않으면 다음에 내장 샌드박스를 사용할 때 자동으로 다시 만들어집니다.
