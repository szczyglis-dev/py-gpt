sandbox.description = Letiltva: a rendszerparancsokat közvetlenül a gazdagépen futtatja (nem biztonságos). Beépített sandbox: a parancsokat uv által kezelt beépített CPython-környezetben futtatja operációs rendszer szintű elkülönítéssel, ahol ez elérhető (közepes biztonság). Docker: telepített és futó Docker szükséges hozzá, és ez biztosítja a legerősebb elkülönítést; ez a legbiztonságosabb lehetőség.
