sandbox.label = Sandbox
sandbox.description = Letiltva: a rendszerparancsok közvetlenül a gazdagépen futnak (nem biztonságos). Beépített: a parancsokat egy külön folyamatban futó, uv által kezelt dedikált CPython-környezetben hajtja végre, de nem korlátozza a gazdagép fájlrendszeréhez való hozzáférést. Docker: telepített és futó Dockert igényel, és a legerősebb elkülönítést biztosítja; ez a legbiztonságosabb lehetőség.

