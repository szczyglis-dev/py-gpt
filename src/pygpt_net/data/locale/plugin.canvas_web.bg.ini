[LOCALE]
plugin.name = Платно и HTML
plugin.description = BETA. Предоставя вътрешна среда платно/браузър за HTML и JavaScript, прототипиране на сайтове, действия в рамките на браузъра, автоматизация с Playwright, анотации и лек сървър за преглед. Тази функция ще бъде разширявана в бъдещи версии.
use_sandbox.label = Използвай sandbox (Playwright)
use_sandbox.description = Включва изолирания браузърен backend Playwright. Когато е изключено, Платно и HTML използва вградения QWebEngine и не стартира Playwright.
playwright_engine.label = Playwright енджин
playwright_engine.description = Браузърен енджин за изолирания backend Playwright.
playwright_path.label = Директория на браузърите Playwright
playwright_path.description = Незадължителен PLAYWRIGHT_BROWSERS_PATH. Оставете празно за стойността по подразбиране на Playwright.
playwright_args.label = Аргументи на браузъра Playwright
playwright_args.description = Незадължителни аргументи за стартиране на Chromium/Playwright, разделени със запетаи.
default_width.label = Ширина на viewport по подразбиране
default_width.description = Ширина на viewport на браузъра по подразбиране в пиксели.
default_height.label = Височина на viewport по подразбиране
default_height.description = Височина на viewport на браузъра по подразбиране в пиксели.
auto_open_split.label = Автоматично отваряй браузъра в разделен изглед
auto_open_split.description = При първото отваряне на браузъра от агент в сесията създава или фокусира таба Платно и HTML във втората колона и показва разделен изглед. След ръчно скриване не го налага отново в същата сесия.
annotation_prompt.label = Показвай анотациите на потребителя на модела
annotation_prompt.description = Добавя чакащите анотации на браузъра/платното към системния prompt на средата.
max_annotations.label = Максимален брой анотации
max_annotations.description = Максимален брой анотации, пазени в текущата браузърна сесия.
console_limit.label = Лимит на конзолния журнал
console_limit.description = Максимален брой записи от конзолата на браузъра, пазени в паметта.
cmd.canvas_open.label = Включи: canvas_open
cmd.canvas_open.description = Отваря или навигира постоянната среда платно/браузър. QWebEngine се използва по подразбиране; Playwright само ако е включен в настройките на плъгина.
cmd.canvas_change_resolution.label = Включи: canvas_change_resolution
cmd.canvas_change_resolution.description = Променя размера и ориентацията на viewport на платното/браузъра.
cmd.canvas_set_html.label = Включи: canvas_set_html
cmd.canvas_set_html.description = Рендерира произволен HTML/CSS/JavaScript в постоянната среда платно/браузър.
cmd.canvas_get_html.label = Включи: canvas_get_html
cmd.canvas_get_html.description = Връща текущия URL на платното/браузъра и сериализирания HTML документ.
cmd.canvas_current.label = Включи: canvas_current
cmd.canvas_current.description = Връща текущото състояние на сесията платно/браузър.
cmd.canvas_close.label = Включи: canvas_close
cmd.canvas_close.description = Затваря видимия таб на платното в PyGPT, без да унищожава фоновата браузърна сесия.
cmd.canvas_prev.label = Включи: canvas_prev
cmd.canvas_prev.description = Връща назад в историята на платното/браузъра.
cmd.canvas_next.label = Включи: canvas_next
cmd.canvas_next.description = Преминава напред в историята на платното/браузъра.
cmd.canvas_reload.label = Включи: canvas_reload
cmd.canvas_reload.description = Презарежда текущия документ на платното/браузъра.
cmd.canvas_screenshot.label = Включи: canvas_screenshot
cmd.canvas_screenshot.description = Заснема текущия viewport на платното/браузъра с виртуалния курсор на модела.
cmd.canvas_inspect.label = Включи: canvas_inspect
cmd.canvas_inspect.description = Инспектира видими/интерактивни DOM елементи и връща стабилни селектори и граници.
cmd.canvas_click.label = Включи: canvas_click
cmd.canvas_click.description = Клика елемент или координати само вътре в платното/браузъра.
cmd.canvas_hover.label = Включи: canvas_hover
cmd.canvas_hover.description = Премества виртуалния курсор на модела и изпълнява hover в платното/браузъра.
cmd.canvas_type.label = Включи: canvas_type
cmd.canvas_type.description = Фокусира редактируем елемент и въвежда текст в платното/браузъра.
cmd.canvas_key.label = Включи: canvas_key
cmd.canvas_key.description = Изпраща клавиш или комбинация само към платното/браузъра.
cmd.canvas_scroll.label = Включи: canvas_scroll
cmd.canvas_scroll.description = Превърта viewport на платното/браузъра.
cmd.canvas_drag.label = Включи: canvas_drag
cmd.canvas_drag.description = Влачи между две координати на viewport в платното/браузъра.
cmd.canvas_wait.label = Включи: canvas_wait
cmd.canvas_wait.description = Изчаква селектор или кратко време в средата платно/браузър.
cmd.canvas_eval.label = Включи: canvas_eval
cmd.canvas_eval.description = Изпълнява JavaScript в текущата страница на платното/браузъра.
cmd.canvas_select.label = Включи: canvas_select
cmd.canvas_select.description = Избира опция в select елемент на платното/браузъра.
cmd.canvas_check.label = Включи: canvas_check
cmd.canvas_check.description = Задава състоянието на отметка или радио бутон в платното/браузъра.
cmd.canvas_upload.label = Включи: canvas_upload
cmd.canvas_upload.description = Качва проверен за сигурност хост файл чрез Playwright file input в платното/браузъра.
cmd.canvas_console.label = Включи: canvas_console
cmd.canvas_console.description = Връща последни съобщения от JavaScript конзолата и грешки на страницата.
cmd.canvas_annotations.label = Включи: canvas_annotations
cmd.canvas_annotations.description = Връща анотациите на потребителя от текущата сесия платно/браузър.
cmd.canvas_clear_annotations.label = Включи: canvas_clear_annotations
cmd.canvas_clear_annotations.description = Изчиства анотациите на платното/браузъра.
cmd.web_server_start.label = Включи: web_server_start
cmd.web_server_start.description = Стартира статичен сървър за преглед само на loopback за избрана работна директория.
cmd.web_server_current.label = Включи: web_server_current
cmd.web_server_current.description = Връща текущото състояние на сървъра за преглед.
cmd.web_server_stop.label = Включи: web_server_stop
cmd.web_server_stop.description = Спира сървъра за преглед.
ui.back = Назад
ui.next = Напред
ui.reload = Презареди
ui.open_url = Отвори URL
ui.address_placeholder = Въведете URL или локален път и натиснете Enter
ui.copy = Копирай
ui.select_all = Избери всичко
ui.annotate_selection = Анотирай избора за AI…
ui.annotate_element = Анотирай елемента за AI…
ui.annotation_title = Анотация за AI
ui.annotation_selection_prompt = Коментар / инструкция за избраното съдържание:
ui.annotation_element_prompt = Коментар / инструкция за този елемент:
ui.annotation_added = Добавена е анотация на платното/браузъра за AI
ui.annotation_removed = Премахната е анотация на платното/браузъра
ui.show_source = Покажи изходния код
ui.back_to_canvas = Назад към платното / HTML
ui.cancel = Отказ
ui.add = Добавяне
ui.remove_annotation = Премахване на анотацията
