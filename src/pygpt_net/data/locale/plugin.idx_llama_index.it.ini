syntax_prepare_question.label = Prompt per la preparazione della domanda
use_project_index.label = Usa l’indice del progetto se attivo
use_project_index.description = Quando la conversazione corrente è in un progetto, usa il suo indice isolato invece degli indici globali configurati.
