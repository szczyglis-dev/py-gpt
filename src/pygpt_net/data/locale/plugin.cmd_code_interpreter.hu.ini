[LOCALE]
plugin.name = Python-értelmező
sandbox.label = Sandbox
sandbox.description = Letiltva: a Python/IPython közvetlenül a gazdagépen fut (nem biztonságos). Beépített: egy külön folyamatban futó, uv által kezelt dedikált CPython/IPython-környezetet használ, de nem korlátozza a gazdagép fájlrendszeréhez való hozzáférést. Docker: telepített és futó Dockert igényel, és a legerősebb elkülönítést biztosítja; ez a legbiztonságosabb lehetőség. Az engedélyezési/tiltólista a dedikált rendszerparancs-eszközökre érvényes a gazdagépen, a beépített sandboxban és Dockerben.

builtin_packages.label = Telepítendő csomagok
builtin_packages.description = A beépített sandboxba telepített Python-csomagkövetelmények. Soronként egy csomagspecifikációt adjon meg. A módosítások azonnali alkalmazásához hozza létre újra a beépített venv-et; ellenkező esetben az automatikusan újra létrejön a beépített sandbox következő használatakor.
