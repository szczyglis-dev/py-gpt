sandbox.description = Letiltva: a Python/IPython közvetlenül a gazdagépen fut (nem biztonságos). Beépített sandbox: uv által kezelt beépített CPython/IPython-környezetet futtat operációs rendszer szintű elkülönítéssel, ahol ez elérhető (közepes biztonság). Docker: telepített és futó Docker szükséges hozzá, és ez biztosítja a legerősebb elkülönítést; ez a legbiztonságosabb lehetőség.
