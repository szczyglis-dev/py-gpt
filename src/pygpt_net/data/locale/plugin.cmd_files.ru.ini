cmd.cwd.description = Получение текущего рабочего каталога.
cmd.file_index.description = Индексирование файлов или каталогов с помощью LlamaIndex.
cmd.pack_archive.description = Упаковка файлов или каталогов в архивы ZIP/TAR.
cmd.unpack_archive.description = Распаковка архивов ZIP/TAR.
cmd.find.description = Поиск файлов или каталогов.
