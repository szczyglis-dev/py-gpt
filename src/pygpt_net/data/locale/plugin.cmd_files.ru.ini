cmd.read_file.description = Чтение файлов.
cmd.query_file.description = Запросы к файлам с помощью LlamaIndex.
cmd.save_file.description = Сохранение текстовых файлов.
cmd.append_file.description = Добавление содержимого в текстовые файлы.
cmd.delete_file.description = Удаление файлов.
cmd.list_dir.description = Просмотр содержимого каталога.
cmd.tree.description = Отображение дерева каталогов.
cmd.mkdir.description = Создание каталогов.
cmd.download_file.description = Загрузка файлов.
cmd.rmdir.description = Удаление каталогов.
cmd.copy_file.description = Копирование файлов.
cmd.copy_dir.description = Рекурсивное копирование каталогов.
cmd.move.description = Перемещение или переименование файлов и каталогов.
