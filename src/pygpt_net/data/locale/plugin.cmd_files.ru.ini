[LOCALE]
plugin.name = Доступ к файлам
plugin.description = Предоставляет доступ к файловой системе вашего компьютера.\nПредоставляет команды для чтения и записи файлов.

cmd.send_file.description = Загрузка файлов как вложений чата.
