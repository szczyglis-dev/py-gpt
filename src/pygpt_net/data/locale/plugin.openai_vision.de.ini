[LOCALE]
cmd.camera_capture.description = Aktiviert die Ausführung des camera_capture.\nWenn aktiviert, kann das Modell selbst Bilder von der Kamera aufnehmen. Die Option "Befehle ausführen" muss aktiviert sein.
cmd.camera_capture.label = Aktivieren: Bilder von der Kamera aufnehmen
cmd.camera_capture.tooltip = Beispiel-prompt: Mach ein Bild von meiner Webcam.
cmd.make_screenshot.description = Aktiviert die Ausführung des make_screenshot.\nWenn aktiviert, kann das Modell selbstständig Screenshots erstellen. Die Option "Befehle ausführen" muss aktiviert sein.
cmd.make_screenshot.label = Aktivieren: Screenshots machen
cmd.make_screenshot.tooltip = Beispiel-prompt: Mach einen Screenshot und beschreibe, was du siehst.
model.description = Bildfähiges Chat-Modell, das vorübergehend für die Bildanalyse verwendet wird. Es kann ein Modell jedes unterstützten Anbieters verwendet werden; Standard ist "gpt-4o".
model.label = Modell
plugin.description = Fügt den unterstützten Chat-Modi Bildanalyse hinzu. Wenn Bildinhalte erkannt werden, leitet PyGPT die Anfrage vorübergehend über den Chat-Modus mit dem konfigurierten bildfähigen Modell. Modelle jedes unterstützten Anbieters können ausgewählt werden.
plugin.name = Vision (inline)
prompt.description = Prompt für die Inline-Bildanalyse. Er wird dem aktuellen System-Prompt hinzugefügt oder ersetzt ihn, während das temporäre bildfähige Modell im Chat-Modus verwendet wird.
prompt.label = Prompt
replace_prompt.description = Ersetze den gesamten System-Prompt durch den Bildanalyse-Prompt, anstatt ihn an den aktuellen Prompt anzuhängen.
replace_prompt.label = Prompt ersetzen
