[LOCALE]
auto_attach.description = Liittää aktiivisen globaalin tai projektikohtaisen muistin automaattisesti jokaisen keskustelun järjestelmäkehotteeseen.
auto_attach.label = Liitä muisti automaattisesti jokaiseen keskusteluun
auto_attach.tooltip = Liittää aktiivisen globaalin tai projektikohtaisen muistin automaattisesti jokaisen keskustelun järjestelmäkehotteeseen.
auto_attach_project.description = Liittää muistin automaattisesti järjestelmäkehotteeseen, kun nykyinen keskustelu kuuluu projektiin.
auto_attach_project.label = Liitä muisti automaattisesti vain projekteissa
auto_attach_project.tooltip = Liittää muistin automaattisesti järjestelmäkehotteeseen, kun nykyinen keskustelu kuuluu projektiin.
cmd.memory_add.description = Lisää vain erittäin tärkeää ja pysyvää tietoa nykyiseen globaaliin tai projektikohtaiseen muistiin. Käytä työkalua säästeliäästi; älä tallenna rutiininomaisia, tilapäisiä tai vähäarvoisia yksityiskohtia.
cmd.memory_add.label = Lisää muistiin
cmd.memory_add.tooltip = Lisää vain tärkeää ja pysyvää tietoa. Käytä memory_add-toimintoa säästeliäästi.
cmd.memory_clear.description = Tyhjentää nykyisen alueen muistin. Mallin on ensin pyydettävä käyttäjältä nimenomainen vahvistus ja kutsuttava tätä työkalua vasta vahvistuksen jälkeen.
cmd.memory_clear.label = Tyhjennä muisti
cmd.memory_clear.tooltip = Tyhjentää nykyisen alueen muistin. Mallin on ensin pyydettävä käyttäjältä nimenomainen vahvistus ja kutsuttava tätä työkalua vasta vahvistuksen jälkeen.
cmd.memory_get.description = Lukee nykyisen globaalin tai projektikohtaisen alueen koko muistin.
cmd.memory_get.label = Lue muisti
cmd.memory_get.tooltip = Lukee nykyisen globaalin tai projektikohtaisen alueen koko muistin.
cmd.memory_update.description = Korvaa nykyisen globaalin tai projektikohtaisen alueen koko muistisisällön.
cmd.memory_update.label = Päivitä muisti
cmd.memory_update.tooltip = Korvaa nykyisen globaalin tai projektikohtaisen alueen koko muistisisällön.
max_chars.description = Muistin tavoiteltu enimmäiskoko merkkeinä. Mallia pyydetään pysymään tämän rajan sisällä; ennen kovaa katkaisua sallitaan lisäksi 300 merkin turvamarginaali.
max_chars.label = Muistin merkkien enimmäismäärä
max_chars.tooltip = Muistin tavoitekoko merkkeinä; ennen kovaa katkaisua sallitaan 300 merkin turvamarginaali.
model_update.description = Malli automaattisiin muistipäivityksiin ja, kun käytössä, memory_add-toimintojen muokkaukseen.
model_update.label = Muistin päivitysmalli
model_update.tooltip = Malli muistin päivittämiseen ja muokkaamiseen.
refine_add.description = Koskee vain manuaalisia memory_add-kutsuja. Kun asetus on käytössä, määritetty muistin päivitysmalli yhdistää ja muotoilee lisätyn tiedon uudelleen olemassa olevaan muistiin raakatekstin lisäämisen sijaan. Kontekstin lopussa tehtävät automaattiset muistipäivitykset mallinnetaan aina uudelleen tästä asetuksesta riippumatta.
refine_add.label = Muokkaa muistia ennen lisäämistä
refine_add.tooltip = Muotoile manuaaliset memory_add-kutsut määritetyllä mallilla. Automaattiset muistipäivitykset muotoillaan aina uudelleen.
key_search_content.label = Search memory key content
key_search_content.description = Also search stored key values/content in memory_key_search. Key names are always searched with LIKE. Disabled by default to avoid scanning stored content.
key_search_content.tooltip = Also search key content in memory_key_search. Disabled by default.
cmd.memory_key_get.description = Read raw database-backed memory records by one key or a list of keys from the current global or project scope.
cmd.memory_key_get.label = Read keyed memory
cmd.memory_key_get.tooltip = Read raw keyed memory records from the current global or project scope.
cmd.memory_key_add.description = Store a new raw database value by key for later use in the current global or project scope. Use only for truly important data; existing keys are not overwritten.
cmd.memory_key_add.label = Add keyed memory
cmd.memory_key_add.tooltip = Store a new raw value by key. Use only for truly important data.
cmd.memory_key_append.description = Append raw content exactly as provided to an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_append.label = Append keyed memory
cmd.memory_key_append.tooltip = Append raw content to an existing key without LLM processing.
cmd.memory_key_update.description = Replace the raw content of an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_update.label = Update keyed memory
cmd.memory_key_update.tooltip = Replace raw content for an existing key without LLM processing.
cmd.memory_key_list.description = List only the stored memory key names for the current global or project scope, without content.
cmd.memory_key_list.label = List memory keys
cmd.memory_key_list.tooltip = List memory key names without content.
cmd.memory_key_search.description = Search keyed memory with LIKE matching on key names. Content is searched only when the Search memory key content option is enabled.
cmd.memory_key_search.label = Search memory keys
cmd.memory_key_search.tooltip = Search key names with LIKE and optionally search stored content.
cmd.memory_key_remove.description = Remove one database-backed memory key or a list of keys from the current global or project scope.
cmd.memory_key_remove.label = Remove memory keys
cmd.memory_key_remove.tooltip = Remove one or more stored memory keys from the current scope.
plugin.description = Tarjoaa paikalliseen tietokantaan tallennetun globaalin ja projektikohtaisen pitkäkestoisen muistin.
plugin.name = Memory (inline)
