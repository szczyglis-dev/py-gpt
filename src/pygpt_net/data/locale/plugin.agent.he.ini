[LOCALE]
plugin.name = מצב אוטונומי
plugin.description = מפעיל מצב אוטונומי בכל מצב צ׳אט. אזהרה: יש להשתמש בזהירות; בשילוב תוספים אחרים עלולות להתקבל תוצאות בלתי צפויות.

dynamic_continue.description = לאחר כל מעבר שהושלם, קריאה מוסתרת המשתמשת במודל שנבחר פועלת כשופטת, בודקת את הזנב המוגדר של הרצת Human/Assistant הנוכחית ומייצרת את ההנחיה למעבר הבא.
dynamic_continue.label = הנחיית המשך דינמית
dynamic_continue_messages.description = מספר תגובות ה-Assistant האחרונות במצב אוטונומי שנכללות בכל בקשת שופט. קלט המשתמש המקורי נכלל תמיד. הגדר 0 כדי לכלול את כל התגובות שנוצרו מאז קלט המשתמש הזה.
dynamic_continue_messages.label = תגובות לשיפוט
