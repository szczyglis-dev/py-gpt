sandbox.description = معطّل: يشغّل أوامر النظام مباشرة على المضيف (غير آمن). المدمج: يشغّل الأوامر في بيئة CPython مخصصة يديرها uv ضمن عملية منفصلة، لكنه لا يقيّد الوصول إلى نظام ملفات المضيف. Docker: يتطلب تثبيت Docker وتشغيله ويوفّر أقوى عزل؛ وهو الخيار الأكثر أمانًا.

