sandbox.label = صندوق الحماية
sandbox.description = معطّل: يشغّل أوامر النظام مباشرةً على المضيف (غير آمن). صندوق الحماية المدمج: يشغّل الأوامر في بيئة CPython مدمجة يديرها uv مع عزل على مستوى نظام التشغيل حيثما كان متاحًا (مستوى أمان متوسط). Docker: يتطلب تثبيت Docker وتشغيله ويوفّر أقوى عزل؛ وهو الخيار الأكثر أمانًا.
