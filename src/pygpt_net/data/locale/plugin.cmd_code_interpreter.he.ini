sandbox.description = מושבת: מפעיל Python/IPython ישירות על המארח (לא בטוח). ארגז חול מובנה: מפעיל סביבת CPython/IPython מובנית המנוהלת על ידי uv עם בידוד ברמת מערכת ההפעלה כאשר הוא זמין (רמת אבטחה בינונית). Docker: דורש ש-Docker יהיה מותקן ופועל ומספק את הבידוד החזק ביותר; זו האפשרות הבטוחה ביותר.
