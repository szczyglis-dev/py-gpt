sandbox.description = מושבת: מריץ Python/IPython ישירות על המארח (לא בטוח). מובנה: מריץ סביבת CPython/IPython ייעודית המנוהלת ב-uv בתהליך נפרד, אך אינו מגביל גישה למערכת הקבצים של המארח. Docker: דורש ש-Docker יהיה מותקן ופועל ומספק את הבידוד החזק ביותר; זו האפשרות הבטוחה ביותר.

