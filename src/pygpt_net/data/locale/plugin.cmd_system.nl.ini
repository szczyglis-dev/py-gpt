sandbox.description = Uitgeschakeld: voert systeemopdrachten rechtstreeks op de host uit (onveilig). Ingebouwde sandbox: voert opdrachten uit in een ingebouwde, door uv beheerde CPython-omgeving met isolatie op OS-niveau waar beschikbaar (gemiddelde beveiliging). Docker: vereist dat Docker is geïnstalleerd en actief is en biedt de sterkste isolatie; dit is de veiligste optie.
