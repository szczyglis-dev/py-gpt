sandbox.description = Uitgeschakeld: voert systeemopdrachten rechtstreeks op de host uit (onveilig). Ingebouwd: voert opdrachten uit in een speciale door uv beheerde CPython-omgeving in een afzonderlijk proces, maar beperkt de toegang tot het bestandssysteem van de host niet. Docker: vereist dat Docker is geïnstalleerd en actief is en biedt de sterkste isolatie; dit is de veiligste optie.

