[LOCALE]
sandbox.label = Sandbox
sandbox.description = Uitgeschakeld: voert systeemopdrachten rechtstreeks op de host uit (onveilig). Ingebouwd: voert opdrachten uit in een speciale door uv beheerde CPython-omgeving in een afzonderlijk proces, maar beperkt de toegang tot het bestandssysteem van de host niet. Docker: vereist dat Docker is geïnstalleerd en actief is en biedt de sterkste isolatie; dit is de veiligste optie. De whitelist/blacklist geldt voor de speciale systeemopdrachttools op de host, in de ingebouwde sandbox en in Docker.

builtin_packages.label = Te installeren pakketten
builtin_packages.description = Python-pakketvereisten die in de ingebouwde sandbox worden geïnstalleerd. Voer één pakketspecificatie per regel in. Maak de ingebouwde venv opnieuw om wijzigingen direct toe te passen; anders wordt deze automatisch opnieuw gemaakt bij het volgende gebruik van de ingebouwde sandbox.
