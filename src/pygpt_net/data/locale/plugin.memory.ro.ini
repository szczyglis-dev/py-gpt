[LOCALE]
auto_attach.description = Atașează automat memoria globală sau de proiect activă la promptul de sistem al fiecărei conversații.
auto_attach.label = Atașează automat memoria la fiecare conversație
auto_attach.tooltip = Atașează automat memoria globală sau de proiect activă la promptul de sistem al fiecărei conversații.
auto_attach_project.description = Atașează automat memoria la promptul de sistem când conversația curentă aparține unui proiect.
auto_attach_project.label = Atașează automat memoria doar în proiecte
auto_attach_project.tooltip = Atașează automat memoria la promptul de sistem când conversația curentă aparține unui proiect.
cmd.memory_add.description = Adăugați numai informații foarte importante și durabile în memoria globală sau de proiect curentă. Folosiți instrumentul cu moderație; nu salvați detalii de rutină, temporare sau de mică valoare.
cmd.memory_add.label = Adaugă în memorie
cmd.memory_add.tooltip = Adăugați numai informații importante și durabile. Folosiți memory_add cu moderație.
cmd.memory_clear.description = Șterge memoria domeniului curent. Modelul trebuie să ceară mai întâi confirmarea explicită a utilizatorului și să apeleze acest instrument doar după confirmare.
cmd.memory_clear.label = Șterge memoria
cmd.memory_clear.tooltip = Șterge memoria domeniului curent. Modelul trebuie să ceară mai întâi confirmarea explicită a utilizatorului și să apeleze acest instrument doar după confirmare.
cmd.memory_get.description = Citește memoria completă pentru domeniul global sau de proiect curent.
cmd.memory_get.label = Citește memoria
cmd.memory_get.tooltip = Citește memoria completă pentru domeniul global sau de proiect curent.
cmd.memory_update.description = Înlocuiește întregul conținut al memoriei pentru domeniul global sau de proiect curent.
cmd.memory_update.label = Actualizează memoria
cmd.memory_update.tooltip = Înlocuiește întregul conținut al memoriei pentru domeniul global sau de proiect curent.
max_chars.description = Dimensiunea maximă țintă a memoriei în caractere. Modelului i se cere să rămână în această limită; sunt permise încă 300 de caractere ca marjă de siguranță înainte de trunchierea strictă.
max_chars.label = Numărul maxim de caractere ale memoriei
max_chars.tooltip = Dimensiunea țintă a memoriei în caractere; este permisă o marjă de siguranță de 300 de caractere înainte de trunchiere.
model_update.description = Model folosit pentru actualizări automate ale memoriei și, dacă este activat, pentru rafinarea operațiilor memory_add.
model_update.label = Model de actualizare a memoriei
model_update.tooltip = Model folosit pentru actualizarea și rafinarea memoriei.
refine_add.description = Se aplică numai apelurilor manuale memory_add. Când este activată, modelul configurat de actualizare a memoriei integrează și reformulează informația adăugată în memoria existentă în loc să atașeze text brut. Actualizările automate ale memoriei la finalul contextului sunt întotdeauna rafinate de model, indiferent de această setare.
refine_add.label = Rafinează memoria înainte de adăugare
refine_add.tooltip = Rafinează apelurile manuale memory_add cu modelul configurat. Actualizările automate ale memoriei sunt întotdeauna rafinate.
key_search_content.label = Search memory key content
key_search_content.description = Also search stored key values/content in memory_key_search. Key names are always searched with LIKE. Disabled by default to avoid scanning stored content.
key_search_content.tooltip = Also search key content in memory_key_search. Disabled by default.
cmd.memory_key_get.description = Read raw database-backed memory records by one key or a list of keys from the current global or project scope.
cmd.memory_key_get.label = Read keyed memory
cmd.memory_key_get.tooltip = Read raw keyed memory records from the current global or project scope.
cmd.memory_key_add.description = Store a new raw database value by key for later use in the current global or project scope. Use only for truly important data; existing keys are not overwritten.
cmd.memory_key_add.label = Add keyed memory
cmd.memory_key_add.tooltip = Store a new raw value by key. Use only for truly important data.
cmd.memory_key_append.description = Append raw content exactly as provided to an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_append.label = Append keyed memory
cmd.memory_key_append.tooltip = Append raw content to an existing key without LLM processing.
cmd.memory_key_update.description = Replace the raw content of an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_update.label = Update keyed memory
cmd.memory_key_update.tooltip = Replace raw content for an existing key without LLM processing.
cmd.memory_key_list.description = List only the stored memory key names for the current global or project scope, without content.
cmd.memory_key_list.label = List memory keys
cmd.memory_key_list.tooltip = List memory key names without content.
cmd.memory_key_search.description = Search keyed memory with LIKE matching on key names. Content is searched only when the Search memory key content option is enabled.
cmd.memory_key_search.label = Search memory keys
cmd.memory_key_search.tooltip = Search key names with LIKE and optionally search stored content.
cmd.memory_key_remove.description = Remove one database-backed memory key or a list of keys from the current global or project scope.
cmd.memory_key_remove.label = Remove memory keys
cmd.memory_key_remove.tooltip = Remove one or more stored memory keys from the current scope.
plugin.description = Oferă memorie pe termen lung globală și per proiect, stocată în baza de date locală.
plugin.name = Memorie (inline)

