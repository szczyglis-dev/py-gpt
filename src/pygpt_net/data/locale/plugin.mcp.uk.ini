[LOCALE]
plugin.description = Надає доступ до віддалених інструментів через Model Context Protocol (MCP), включно з транспортами stdio, SSE та Streamable HTTP, фільтрами дозволу/блокування для кожного сервера, підтримкою заголовка Authorization і кешем інструментів.
plugin.name = MCP
servers.description = Налаштуйте сервери MCP. Підтримувані транспорти: 'stdio: <command ...>' для stdio, 'http(s)://...' для Streamable HTTP і 'http(s)://.../sse' (або 'sse://', 'sse+http(s)://') для SSE. Використовуйте 'label' як коротку назву сервера, 'authorization' для заголовка Authorization у HTTP/SSE, 'allowed_commands' (через кому) як список дозволених інструментів, а 'disabled_commands' — для блокування інструментів цього сервера.
servers.label = Сервери MCP
servers.tooltip = Потрібен MCP Python SDK. Встановлення: pip install "mcp[cli]"
tools_cache_enabled.description = Вмикає кеш виявлених інструментів у пам’яті, щоб не виконувати повторне виявлення для кожного запиту.
tools_cache_enabled.label = Кешувати список інструментів
tools_cache_enabled.tooltip = Якщо ввімкнено, результати виявлення інструментів кешуються окремо для кожного сервера на час TTL.
tools_cache_ttl.description = Час життя кешу інструментів для кожного сервера.
tools_cache_ttl.label = TTL кешу (секунди)
tools_cache_ttl.tooltip = Встановіть 0, щоб вимкнути TTL (не рекомендовано).
