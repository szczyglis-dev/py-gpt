[LOCALE]
auto_attach.description = Voegt het actieve globale of projectgeheugen automatisch toe aan de systeemprompt van elk gesprek.
auto_attach.label = Geheugen automatisch aan elk gesprek toevoegen
auto_attach.tooltip = Voegt het actieve globale of projectgeheugen automatisch toe aan de systeemprompt van elk gesprek.
auto_attach_project.description = Voegt het geheugen automatisch toe aan de systeemprompt wanneer het huidige gesprek bij een project hoort.
auto_attach_project.label = Geheugen alleen in projecten automatisch toevoegen
auto_attach_project.tooltip = Voegt het geheugen automatisch toe aan de systeemprompt wanneer het huidige gesprek bij een project hoort.
cmd.memory_add.description = Voeg alleen zeer belangrijke, duurzame informatie toe aan het huidige globale of projectgeheugen. Gebruik deze tool spaarzaam; sla geen routinematige, tijdelijke of weinig waardevolle details op.
cmd.memory_add.label = Aan geheugen toevoegen
cmd.memory_add.tooltip = Voeg alleen belangrijke duurzame informatie toe. Gebruik memory_add spaarzaam.
cmd.memory_clear.description = Wist het geheugen voor de huidige scope. Het model moet eerst om expliciete bevestiging van de gebruiker vragen en deze tool pas daarna aanroepen.
cmd.memory_clear.label = Geheugen wissen
cmd.memory_clear.tooltip = Wist het geheugen voor de huidige scope. Het model moet eerst om expliciete bevestiging van de gebruiker vragen en deze tool pas daarna aanroepen.
cmd.memory_get.description = Leest het volledige geheugen voor de huidige globale of projectscope.
cmd.memory_get.label = Geheugen lezen
cmd.memory_get.tooltip = Leest het volledige geheugen voor de huidige globale of projectscope.
cmd.memory_update.description = Vervangt de volledige geheugeninhoud voor de huidige globale of projectscope.
cmd.memory_update.label = Geheugen bijwerken
cmd.memory_update.tooltip = Vervangt de volledige geheugeninhoud voor de huidige globale of projectscope.
max_chars.description = Doel voor de maximale geheugengrootte in tekens. Het model wordt gevraagd binnen deze limiet te blijven; vóór harde afkapping is een extra veiligheidsmarge van 300 tekens toegestaan.
max_chars.label = Maximum aantal geheugentekens
max_chars.tooltip = Doelgrootte van het geheugen in tekens; vóór harde afkapping geldt een veiligheidsmarge van 300 tekens.
model_update.description = Model voor automatische geheugenupdates en, indien ingeschakeld, voor het verfijnen van memory_add-bewerkingen.
model_update.label = Model voor geheugenupdate
model_update.tooltip = Model voor het bijwerken en verfijnen van geheugen.
refine_add.description = Geldt alleen voor handmatige memory_add-aanroepen. Indien ingeschakeld voegt het geconfigureerde geheugenmodel de toegevoegde informatie samen met het bestaande geheugen en herschrijft die, in plaats van ruwe tekst toe te voegen. Automatische geheugenupdates aan het einde van de context worden altijd door het model verfijnd, ongeacht deze instelling.
refine_add.label = Geheugen verfijnen vóór toevoegen
refine_add.tooltip = Verfijn handmatige memory_add-aanroepen met het geconfigureerde model. Automatische geheugenupdates worden altijd verfijnd.
key_search_content.label = Search memory key content
key_search_content.description = Also search stored key values/content in memory_key_search. Key names are always searched with LIKE. Disabled by default to avoid scanning stored content.
key_search_content.tooltip = Also search key content in memory_key_search. Disabled by default.
cmd.memory_key_get.description = Read raw database-backed memory records by one key or a list of keys from the current global or project scope.
cmd.memory_key_get.label = Read keyed memory
cmd.memory_key_get.tooltip = Read raw keyed memory records from the current global or project scope.
cmd.memory_key_add.description = Store a new raw database value by key for later use in the current global or project scope. Use only for truly important data; existing keys are not overwritten.
cmd.memory_key_add.label = Add keyed memory
cmd.memory_key_add.tooltip = Store a new raw value by key. Use only for truly important data.
cmd.memory_key_append.description = Append raw content exactly as provided to an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_append.label = Append keyed memory
cmd.memory_key_append.tooltip = Append raw content to an existing key without LLM processing.
cmd.memory_key_update.description = Replace the raw content of an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_update.label = Update keyed memory
cmd.memory_key_update.tooltip = Replace raw content for an existing key without LLM processing.
cmd.memory_key_list.description = List only the stored memory key names for the current global or project scope, without content.
cmd.memory_key_list.label = List memory keys
cmd.memory_key_list.tooltip = List memory key names without content.
cmd.memory_key_search.description = Search keyed memory with LIKE matching on key names. Content is searched only when the Search memory key content option is enabled.
cmd.memory_key_search.label = Search memory keys
cmd.memory_key_search.tooltip = Search key names with LIKE and optionally search stored content.
cmd.memory_key_remove.description = Remove one database-backed memory key or a list of keys from the current global or project scope.
cmd.memory_key_remove.label = Remove memory keys
cmd.memory_key_remove.tooltip = Remove one or more stored memory keys from the current scope.
plugin.description = Biedt globaal en projectspecifiek langetermijngeheugen dat in de lokale database wordt opgeslagen.
plugin.name = Geheugen (inline)

