[LOCALE]
auto_attach.description = Automaticky pripojí aktívnu globálnu alebo projektovú pamäť k systémovému promptu každej konverzácie.
auto_attach.label = Automaticky pripojiť pamäť ku každej konverzácii
auto_attach.tooltip = Automaticky pripojí aktívnu globálnu alebo projektovú pamäť k systémovému promptu každej konverzácie.
auto_attach_project.description = Automaticky pripojí pamäť k systémovému promptu, keď aktuálna konverzácia patrí do projektu.
auto_attach_project.label = Automaticky pripojiť pamäť iba v projektoch
auto_attach_project.tooltip = Automaticky pripojí pamäť k systémovému promptu, keď aktuálna konverzácia patrí do projektu.
cmd.memory_add.description = Pridávajte iba veľmi dôležité a trvalé informácie do aktuálnej globálnej alebo projektovej pamäte. Tento nástroj používajte striedmo; neukladajte rutinné, dočasné ani málo hodnotné detaily.
cmd.memory_add.label = Pridať do pamäte
cmd.memory_add.tooltip = Pridávajte iba dôležité trvalé informácie. memory_add používajte striedmo.
cmd.memory_clear.description = Vymaže pamäť aktuálneho rozsahu. Model musí najprv požiadať používateľa o výslovné potvrdenie a tento nástroj zavolať až po potvrdení.
cmd.memory_clear.label = Vymazať pamäť
cmd.memory_clear.tooltip = Vymaže pamäť aktuálneho rozsahu. Model musí najprv požiadať používateľa o výslovné potvrdenie a tento nástroj zavolať až po potvrdení.
cmd.memory_get.description = Načíta celú pamäť pre aktuálny globálny alebo projektový rozsah.
cmd.memory_get.label = Načítať pamäť
cmd.memory_get.tooltip = Načíta celú pamäť pre aktuálny globálny alebo projektový rozsah.
cmd.memory_update.description = Nahradí celý obsah pamäte aktuálneho globálneho alebo projektového rozsahu.
cmd.memory_update.label = Aktualizovať pamäť
cmd.memory_update.tooltip = Nahradí celý obsah pamäte aktuálneho globálneho alebo projektového rozsahu.
max_chars.description = Cieľová maximálna veľkosť pamäte v znakoch. Model má zostať v tomto limite; pred tvrdým orezaním je povolená dodatočná bezpečnostná rezerva 300 znakov.
max_chars.label = Maximálny počet znakov pamäte
max_chars.tooltip = Cieľová veľkosť pamäte v znakoch; pred tvrdým orezaním je povolená bezpečnostná rezerva 300 znakov.
model_update.description = Model používaný na automatické aktualizácie pamäte a voliteľne na úpravu operácií memory_add.
model_update.label = Model aktualizácie pamäte
model_update.tooltip = Model používaný na aktualizáciu a úpravu pamäte.
refine_add.description = Platí iba pre manuálne volania memory_add. Ak je zapnuté, nakonfigurovaný model aktualizácie pamäte zlúči a preformuluje pridávanú informáciu s existujúcou pamäťou namiesto pripojenia surového textu. Automatické aktualizácie pamäte po skončení kontextu model vždy prepracuje bez ohľadu na toto nastavenie.
refine_add.label = Upraviť pamäť pred pridaním
refine_add.tooltip = Prepracuje manuálne volania memory_add nakonfigurovaným modelom. Automatické aktualizácie pamäte sa vždy prepracujú.
key_search_content.label = Search memory key content
key_search_content.description = Also search stored key values/content in memory_key_search. Key names are always searched with LIKE. Disabled by default to avoid scanning stored content.
key_search_content.tooltip = Also search key content in memory_key_search. Disabled by default.
cmd.memory_key_get.description = Read raw database-backed memory records by one key or a list of keys from the current global or project scope.
cmd.memory_key_get.label = Read keyed memory
cmd.memory_key_get.tooltip = Read raw keyed memory records from the current global or project scope.
cmd.memory_key_add.description = Store a new raw database value by key for later use in the current global or project scope. Use only for truly important data; existing keys are not overwritten.
cmd.memory_key_add.label = Add keyed memory
cmd.memory_key_add.tooltip = Store a new raw value by key. Use only for truly important data.
cmd.memory_key_append.description = Append raw content exactly as provided to an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_append.label = Append keyed memory
cmd.memory_key_append.tooltip = Append raw content to an existing key without LLM processing.
cmd.memory_key_update.description = Replace the raw content of an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_update.label = Update keyed memory
cmd.memory_key_update.tooltip = Replace raw content for an existing key without LLM processing.
cmd.memory_key_list.description = List only the stored memory key names for the current global or project scope, without content.
cmd.memory_key_list.label = List memory keys
cmd.memory_key_list.tooltip = List memory key names without content.
cmd.memory_key_search.description = Search keyed memory with LIKE matching on key names. Content is searched only when the Search memory key content option is enabled.
cmd.memory_key_search.label = Search memory keys
cmd.memory_key_search.tooltip = Search key names with LIKE and optionally search stored content.
cmd.memory_key_remove.description = Remove one database-backed memory key or a list of keys from the current global or project scope.
cmd.memory_key_remove.label = Remove memory keys
cmd.memory_key_remove.tooltip = Remove one or more stored memory keys from the current scope.
plugin.description = Poskytuje globálnu a projektovú dlhodobú pamäť uloženú v lokálnej databáze.
plugin.name = Memory (inline)
