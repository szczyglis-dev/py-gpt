sandbox.description = अक्षम: Python/IPython को सीधे होस्ट पर चलाता है (असुरक्षित)। बिल्ट-इन: uv द्वारा प्रबंधित समर्पित CPython/IPython वातावरण को अलग प्रोसेस में चलाता है, लेकिन होस्ट फ़ाइल सिस्टम तक पहुँच को सीमित नहीं करता। Docker: Docker का इंस्टॉल और चालू होना आवश्यक है और यह सबसे मजबूत आइसोलेशन देता है; यह सबसे सुरक्षित विकल्प है।. व्हाइटलिस्ट/ब्लैकलिस्ट होस्ट, बिल्ट-इन सैंडबॉक्स और Docker में समर्पित सिस्टम-कमांड टूल्स पर लागू होती है।

