sandbox.description = अक्षम: Python/IPython को सीधे होस्ट पर चलाता है (असुरक्षित)। अंतर्निहित सैंडबॉक्स: uv द्वारा प्रबंधित अंतर्निहित CPython/IPython वातावरण को OS-स्तरीय अलगाव के साथ चलाता है, जहाँ उपलब्ध हो (मध्यम सुरक्षा)। Docker: Docker का इंस्टॉल और चालू होना आवश्यक है और यह सबसे मजबूत अलगाव प्रदान करता है; यह सबसे सुरक्षित विकल्प है।
