[LOCALE]
plugin.name = קנבס (inline)
plugin.description = BETA. מספק סביבת משטח ציור/דפדפן פנימית ל-HTML ו-JavaScript, אב-טיפוס לאתרים, אינטראקציה תחומה לדפדפן, אוטומציית Playwright, הערות ושרת תצוגה מקדימה קל. התכונה תורחב בגרסאות עתידיות.
use_sandbox.label = השתמש בארגז חול (Playwright)
use_sandbox.description = מפעיל את מנגנון הדפדפן המבודד של Playwright. כאשר האפשרות כבויה, Canvas משתמש בדפדפן QWebEngine המובנה ואינו מנסה להפעיל את Playwright.
playwright_engine.label = מנוע Playwright
playwright_engine.description = מנוע הדפדפן שבו משתמש מנגנון Playwright המבודד.
playwright_path.label = תיקיית דפדפני Playwright
playwright_path.description = נתיב PLAYWRIGHT_BROWSERS_PATH אופציונלי. השאר ריק כדי להשתמש בברירת המחדל של Playwright.
playwright_args.label = ארגומנטים לדפדפן Playwright
playwright_args.description = ארגומנטים אופציונליים להפעלת Chromium/Playwright, מופרדים בפסיקים.
default_width.label = רוחב ברירת מחדל של התצוגה
default_width.description = רוחב ברירת המחדל של חלון התצוגה בדפדפן, בפיקסלים.
default_height.label = גובה ברירת מחדל של התצוגה
default_height.description = גובה ברירת המחדל של חלון התצוגה בדפדפן, בפיקסלים.
auto_open_split.label = פתח את הדפדפן אוטומטית בתצוגה מפוצלת
auto_open_split.description = בפתיחה הראשונה של הדפדפן על ידי סוכן במהלך ההפעלה, יוצר או ממקד את לשונית Canvas בעמודה השנייה ומציג תצוגה מפוצלת. אם המשתמש מסתיר אותה לאחר מכן, היא לא תיכפה שוב באותה הפעלה.
annotation_prompt.label = חשוף את הערות המשתמש למודל
annotation_prompt.description = מצרף הערות ממתינות של הדפדפן/משטח הציור להנחיית המערכת של סביבת הריצה.
max_annotations.label = מספר הערות מרבי
max_annotations.description = המספר המרבי של הערות שנשמרות בהפעלת הדפדפן הנוכחית.
console_limit.label = מגבלת יומן המסוף
console_limit.description = המספר המרבי של רשומות מסוף הדפדפן שנשמרות בזיכרון.
cmd.canvas_open.label = הפעל: canvas_open
cmd.canvas_open.description = פותח או מנווט בסביבת משטח הציור/הדפדפן המתמשכת. QWebEngine משמש כברירת מחדל; Playwright רק כאשר הוא מופעל בהגדרות התוסף.
cmd.canvas_change_resolution.label = הפעל: canvas_change_resolution
cmd.canvas_change_resolution.description = משנה את הגודל והכיוון של חלון התצוגה של משטח הציור/הדפדפן.
cmd.canvas_set_html.label = הפעל: canvas_set_html
cmd.canvas_set_html.description = מרנדר תוכן HTML/CSS/JavaScript שרירותי בסביבת משטח הציור/הדפדפן המתמשכת.
cmd.canvas_get_html.label = הפעל: canvas_get_html
cmd.canvas_get_html.description = מחזיר את כתובת ה-URL הנוכחית של משטח הציור/הדפדפן ואת מסמך ה-HTML המסודר.
cmd.canvas_current.label = הפעל: canvas_current
cmd.canvas_current.description = מחזיר את המצב הנוכחי של הפעלת משטח הציור/הדפדפן.
cmd.canvas_close.label = הפעל: canvas_close
cmd.canvas_close.description = סוגר את לשונית משטח הציור הגלויה ב-PyGPT בלי להרוס את הפעלת הדפדפן שפועלת ברקע.
cmd.canvas_prev.label = הפעל: canvas_prev
cmd.canvas_prev.description = חוזר אחורה בהיסטוריית משטח הציור/הדפדפן.
cmd.canvas_next.label = הפעל: canvas_next
cmd.canvas_next.description = מתקדם קדימה בהיסטוריית משטח הציור/הדפדפן.
cmd.canvas_reload.label = הפעל: canvas_reload
cmd.canvas_reload.description = טוען מחדש את המסמך הנוכחי של משטח הציור/הדפדפן.
cmd.canvas_screenshot.label = הפעל: canvas_screenshot
cmd.canvas_screenshot.description = מצלם את חלון התצוגה הנוכחי של משטח הציור/הדפדפן יחד עם הסמן הווירטואלי של המודל.
cmd.canvas_inspect.label = הפעל: canvas_inspect
cmd.canvas_inspect.description = בודק רכיבי DOM גלויים ואינטראקטיביים ומחזיר בוררים יציבים וגבולות של רכיבים.
cmd.canvas_click.label = הפעל: canvas_click
cmd.canvas_click.description = לוחץ על רכיב או קואורדינטות בתוך משטח הציור/הדפדפן בלבד.
cmd.canvas_hover.label = הפעל: canvas_hover
cmd.canvas_hover.description = מזיז את הסמן הווירטואלי של המודל ומבצע ריחוף בתוך משטח הציור/הדפדפן.
cmd.canvas_type.label = הפעל: canvas_type
cmd.canvas_type.description = ממקד רכיב שניתן לעריכה ומקליד טקסט בתוך משטח הציור/הדפדפן.
cmd.canvas_key.label = הפעל: canvas_key
cmd.canvas_key.description = שולח מקש או קיצור מקשים רק למשטח הציור/הדפדפן.
cmd.canvas_scroll.label = הפעל: canvas_scroll
cmd.canvas_scroll.description = גולל את חלון התצוגה של משטח הציור/הדפדפן.
cmd.canvas_drag.label = הפעל: canvas_drag
cmd.canvas_drag.description = גורר בין שתי נקודות תצוגה בתוך משטח הציור/הדפדפן.
cmd.canvas_wait.label = הפעל: canvas_wait
cmd.canvas_wait.description = ממתין לבורר או לזמן קצר בסביבת משטח הציור/הדפדפן.
cmd.canvas_eval.label = הפעל: canvas_eval
cmd.canvas_eval.description = מריץ JavaScript בדף הנוכחי של משטח הציור/הדפדפן.
cmd.canvas_select.label = הפעל: canvas_select
cmd.canvas_select.description = בוחר אפשרות ברכיב select בתוך משטח הציור/הדפדפן.
cmd.canvas_check.label = הפעל: canvas_check
cmd.canvas_check.description = מגדיר את המצב של תיבת סימון או כפתור רדיו בתוך משטח הציור/הדפדפן.
cmd.canvas_upload.label = הפעל: canvas_upload
cmd.canvas_upload.description = מעלה קובץ מהמחשב שאומת מבחינת אבטחה דרך שדה קובץ של Playwright בתוך משטח הציור/הדפדפן.
cmd.canvas_console.label = הפעל: canvas_console
cmd.canvas_console.description = מחזיר הודעות מסוף JavaScript אחרונות ושגיאות דף ממשטח הציור/הדפדפן.
cmd.canvas_annotations.label = הפעל: canvas_annotations
cmd.canvas_annotations.description = מחזיר הערות משתמש שנשארו בהפעלת משטח הציור/הדפדפן הנוכחית.
cmd.canvas_clear_annotations.label = הפעל: canvas_clear_annotations
cmd.canvas_clear_annotations.description = מנקה את הערות משטח הציור/הדפדפן.
cmd.web_server_start.label = הפעל: web_server_start
cmd.web_server_start.description = מפעיל שרת תצוגה מקדימה סטטי מקומי המאזין ל-loopback בלבד עבור תיקיית עבודה נבחרת.
cmd.web_server_current.label = הפעל: web_server_current
cmd.web_server_current.description = מחזיר את המצב הנוכחי של שרת התצוגה המקדימה.
cmd.web_server_stop.label = הפעל: web_server_stop
cmd.web_server_stop.description = עוצר את שרת התצוגה המקדימה.
ui.back = אחורה
