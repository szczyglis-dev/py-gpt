ui.address_placeholder = הזן URL או נתיב מקומי ולחץ Enter
ui.enable_hint = הפעל את תוסף הקנבס
ui.copy = העתק
ui.select_all = בחר הכול
ui.annotate_selection = הוסף הערה לבחירה עבור AI…
ui.annotate_element = הוסף הערה לרכיב עבור AI…
ui.annotation_title = הערה עבור AI
ui.annotation_selection_prompt = הערה / הוראה לתוכן שנבחר:
ui.annotation_element_prompt = הערה / הוראה לרכיב הזה:
ui.annotation_added = נוספה הערת משטח ציור/דפדפן עבור AI
ui.annotation_removed = הוסרה הערת משטח ציור/דפדפן
ui.show_source = הצג מקור
ui.back_to_canvas = חזרה למשטח הציור / HTML
ui.cancel = ביטול
ui.add = הוסף
ui.remove_annotation = הסר הערה
