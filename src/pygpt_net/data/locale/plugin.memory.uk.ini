[LOCALE]
auto_attach.description = Автоматично додає активну глобальну або проєктну пам’ять до системного промпта кожної розмови.
auto_attach.label = Автоматично додавати пам’ять до кожної розмови
auto_attach.tooltip = Автоматично додає активну глобальну або проєктну пам’ять до системного промпта кожної розмови.
auto_attach_project.description = Автоматично додає пам’ять до системного промпта, коли поточна розмова належить до проєкту.
auto_attach_project.label = Автоматично додавати пам’ять лише у проєктах
auto_attach_project.tooltip = Автоматично додає пам’ять до системного промпта, коли поточна розмова належить до проєкту.
cmd.memory_add.description = Додавайте лише дуже важливу й тривалу інформацію до поточної глобальної або проєктної пам’яті. Використовуйте цей інструмент ощадливо; не зберігайте рутинні, тимчасові або малозначущі деталі.
cmd.memory_add.label = Додати до пам’яті
cmd.memory_add.tooltip = Додавайте лише важливу тривалу інформацію. Використовуйте memory_add ощадливо.
cmd.memory_clear.description = Очищає пам’ять поточної області. Модель повинна спочатку попросити явне підтвердження користувача й викликати цей інструмент лише після підтвердження.
cmd.memory_clear.label = Очистити пам’ять
cmd.memory_clear.tooltip = Очищає пам’ять поточної області. Модель повинна спочатку попросити явне підтвердження користувача й викликати цей інструмент лише після підтвердження.
cmd.memory_get.description = Читає повну пам’ять для поточної глобальної або проєктної області.
cmd.memory_get.label = Прочитати пам’ять
cmd.memory_get.tooltip = Читає повну пам’ять для поточної глобальної або проєктної області.
cmd.memory_update.description = Повністю замінює вміст пам’яті поточної глобальної або проєктної області.
cmd.memory_update.label = Оновити пам’ять
cmd.memory_update.tooltip = Повністю замінює вміст пам’яті поточної глобальної або проєктної області.
max_chars.description = Цільовий максимальний розмір пам’яті в символах. Модель має залишатися в цьому ліміті; перед жорстким обрізанням дозволяється додатковий запас у 300 символів.
max_chars.label = Максимальна кількість символів пам’яті
max_chars.tooltip = Цільовий розмір пам’яті в символах; перед жорстким обрізанням дозволяється запас у 300 символів.
model_update.description = Модель для автоматичних оновлень пам’яті та, якщо ввімкнено, редагування операцій memory_add.
model_update.label = Модель оновлення пам’яті
model_update.tooltip = Модель для оновлення й редагування пам’яті.
refine_add.description = Застосовується лише до ручних викликів memory_add. Якщо ввімкнено, налаштована модель оновлення пам’яті об’єднує та переформульовує додану інформацію з наявною пам’яттю замість простого додавання сирого тексту. Автоматичні оновлення пам’яті після завершення контексту завжди редагуються моделлю незалежно від цього параметра.
refine_add.label = Редагувати пам’ять перед додаванням
refine_add.tooltip = Редагує ручні виклики memory_add налаштованою моделлю. Автоматичні оновлення пам’яті завжди редагуються.
plugin.description = Надає глобальну та проєктну довготривалу пам’ять, що зберігається в локальній базі даних.
plugin.name = Memory (inline)
