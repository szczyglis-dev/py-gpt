[LOCALE]
auto_attach.description = Føjer automatisk den aktive globale eller projektspecifikke hukommelse til systemprompten i alle samtaler.
auto_attach.label = Vedhæft automatisk hukommelse til alle samtaler
auto_attach.tooltip = Føjer automatisk den aktive globale eller projektspecifikke hukommelse til systemprompten i alle samtaler.
auto_attach_project.description = Føjer automatisk hukommelsen til systemprompten, når den aktuelle samtale tilhører et projekt.
auto_attach_project.label = Vedhæft kun automatisk hukommelse i projekter
auto_attach_project.tooltip = Føjer automatisk hukommelsen til systemprompten, når den aktuelle samtale tilhører et projekt.
cmd.memory_add.description = Tilføj kun meget vigtige og varige oplysninger til den aktuelle globale eller projektbaserede hukommelse. Brug værktøjet sparsomt; gem ikke rutinemæssige, midlertidige eller uvæsentlige detaljer.
cmd.memory_add.label = Føj til hukommelse
cmd.memory_add.tooltip = Tilføj kun vigtige varige oplysninger. Brug memory_add sparsomt.
cmd.memory_clear.description = Rydder hukommelsen for det aktuelle område. Modellen skal først bede brugeren om udtrykkelig bekræftelse og må kun kalde dette værktøj efter bekræftelsen.
cmd.memory_clear.label = Ryd hukommelse
cmd.memory_clear.tooltip = Rydder hukommelsen for det aktuelle område. Modellen skal først bede brugeren om udtrykkelig bekræftelse og må kun kalde dette værktøj efter bekræftelsen.
cmd.memory_get.description = Læser hele hukommelsen for det aktuelle globale eller projektspecifikke område.
cmd.memory_get.label = Læs hukommelse
cmd.memory_get.tooltip = Læser hele hukommelsen for det aktuelle globale eller projektspecifikke område.
cmd.memory_update.description = Erstatter hele hukommelsesindholdet for det aktuelle globale eller projektspecifikke område.
cmd.memory_update.label = Opdater hukommelse
cmd.memory_update.tooltip = Erstatter hele hukommelsesindholdet for det aktuelle globale eller projektspecifikke område.
max_chars.description = Mål for maksimal hukommelsesstørrelse i tegn. Modellen bedes holde sig inden for denne grænse; der tillades yderligere 300 tegn som sikkerhedsmargin før hård afkortning.
max_chars.label = Maksimalt antal hukommelsestegn
max_chars.tooltip = Målstørrelse for hukommelsen i tegn; en sikkerhedsmargin på 300 tegn tillades før hård afkortning.
model_update.description = Model til automatiske hukommelsesopdateringer og, når aktiveret, til at forfine memory_add-handlinger.
model_update.label = Model til hukommelsesopdatering
model_update.tooltip = Model til at opdatere og forfine hukommelsen.
refine_add.description = Gælder kun manuelle memory_add-kald. Når den er aktiveret, fletter og omskriver den konfigurerede model den tilføjede information ind i den eksisterende hukommelse i stedet for at tilføje rå tekst. Automatiske hukommelsesopdateringer ved afslutning af konteksten bliver altid raffineret af modellen uanset denne indstilling.
refine_add.label = Forfin hukommelsen før tilføjelse
refine_add.tooltip = Raffinér manuelle memory_add-kald med den konfigurerede model. Automatiske hukommelsesopdateringer raffineres altid.
plugin.description = Giver global og projektspecifik langtidshukommelse lagret i den lokale database.
plugin.name = Memory (inline)
