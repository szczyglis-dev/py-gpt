sandbox.description = Inaktiverad: kör Python/IPython direkt på värden (osäkert). Inbyggd: kör en dedikerad uv-hanterad CPython/IPython-miljö i en separat process, men begränsar inte åtkomsten till värdens filsystem. Docker: kräver att Docker är installerat och körs och ger den starkaste isoleringen; det är det säkraste alternativet.

