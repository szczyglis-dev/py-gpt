[LOCALE]
cmd.camera_capture.description = Habilita la ejecución del comando camera_capture.\nSi está habilitado, el modelo podrá capturar imágenes de la cámara por sí mismo. La opción Ejecutar comandos debe estar habilitada.
cmd.camera_capture.label = Habilitar: captura de imágenes de la cámara
cmd.camera_capture.tooltip = Ejemplo de prompt: Captura una imagen de mi webcam.
cmd.make_screenshot.description = Habilita la ejecución del comando make_screenshot.\nSi está habilitado, el modelo podrá hacer capturas de pantalla por sí mismo. La opción Ejecutar comandos debe estar habilitada.
cmd.make_screenshot.label = Habilitar: hacer capturas de pantalla
cmd.make_screenshot.tooltip = Ejemplo de prompt: Haz una captura de pantalla y describe lo que ves.
model.description = Modelo de Chat con capacidad de imagen usado temporalmente para el análisis de imágenes. Puede usarse cualquier proveedor compatible; el valor predeterminado es "gpt-4o".
model.label = Modelo
plugin.description = Añade análisis de imágenes a los modos de chat compatibles. Cuando se detecta contenido de imagen, PyGPT dirige temporalmente la consulta por el modo Chat con el modelo con capacidad de imagen configurado. Se pueden seleccionar modelos de cualquier proveedor compatible.
plugin.name = Vision (inline)
prompt.description = Prompt usado para el análisis de imágenes en línea. Se añade al prompt del sistema actual o lo reemplaza mientras se usa temporalmente el modelo con capacidad de imagen en modo Chat.
prompt.label = Prompt
replace_prompt.description = Reemplaza todo el prompt del sistema con el prompt de análisis de imagen en lugar de añadirlo al prompt actual.
replace_prompt.label = Reemplazar prompt
