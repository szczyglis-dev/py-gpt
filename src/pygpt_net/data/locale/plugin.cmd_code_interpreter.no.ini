plugin.name = Python-tolker
sandbox.label = Sandkasse
sandbox.description = Deaktivert: kjører Python/IPython direkte på verten (usikkert). Innebygd sandkasse: kjører et innebygd uv-administrert CPython/IPython-miljø med isolasjon på OS-nivå der det er tilgjengelig (middels sikkerhet). Docker: krever at Docker er installert og kjører, og gir den sterkeste isolasjonen; dette er det sikreste alternativet.
