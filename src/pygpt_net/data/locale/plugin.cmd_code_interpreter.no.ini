sandbox.description = Deaktivert: kjører Python/IPython direkte på verten (usikkert). Innebygd: kjører et dedikert uv-administrert CPython/IPython-miljø i en separat prosess, men begrenser ikke tilgangen til vertens filsystem. Docker: krever at Docker er installert og kjører og gir den sterkeste isolasjonen; det er det sikreste alternativet.

