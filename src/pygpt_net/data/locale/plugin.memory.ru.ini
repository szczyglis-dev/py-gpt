[LOCALE]
auto_attach.description = Автоматически добавляет активную глобальную или проектную память в системный промпт каждого разговора.
auto_attach.label = Автоматически добавлять память в каждый разговор
auto_attach.tooltip = Автоматически добавляет активную глобальную или проектную память в системный промпт каждого разговора.
auto_attach_project.description = Автоматически добавляет память в системный промпт, когда текущий разговор относится к проекту.
auto_attach_project.label = Автоматически добавлять память только в проектах
auto_attach_project.tooltip = Автоматически добавляет память в системный промпт, когда текущий разговор относится к проекту.
cmd.memory_add.description = Добавляйте только очень важную и долговечную информацию в текущую глобальную или проектную память. Используйте этот инструмент экономно; не сохраняйте рутинные, временные или малоценные детали.
cmd.memory_add.label = Добавить в память
cmd.memory_add.tooltip = Добавляйте только важную долговечную информацию. Используйте memory_add экономно.
cmd.memory_clear.description = Очищает память текущей области. Модель должна сначала запросить явное подтверждение пользователя и вызывать этот инструмент только после подтверждения.
cmd.memory_clear.label = Очистить память
cmd.memory_clear.tooltip = Очищает память текущей области. Модель должна сначала запросить явное подтверждение пользователя и вызывать этот инструмент только после подтверждения.
cmd.memory_get.description = Читает всю память для текущей глобальной или проектной области.
cmd.memory_get.label = Прочитать память
cmd.memory_get.tooltip = Читает всю память для текущей глобальной или проектной области.
cmd.memory_update.description = Полностью заменяет содержимое памяти текущей глобальной или проектной области.
cmd.memory_update.label = Обновить память
cmd.memory_update.tooltip = Полностью заменяет содержимое памяти текущей глобальной или проектной области.
max_chars.description = Целевой максимальный размер памяти в символах. Модель должна оставаться в этом лимите; перед жёстким обрезанием допускается дополнительный запас в 300 символов.
max_chars.label = Максимальное число символов памяти
max_chars.tooltip = Целевой размер памяти в символах; перед жёстким обрезанием допускается запас в 300 символов.
model_update.description = Модель для автоматического обновления памяти и, если включено, редактирования операций memory_add.
model_update.label = Модель обновления памяти
model_update.tooltip = Модель для обновления и редактирования памяти.
refine_add.description = Применяется только к ручным вызовам memory_add. Если включено, настроенная модель обновления памяти объединяет и переформулирует добавляемую информацию с существующей памятью вместо простого добавления сырого текста. Автоматические обновления памяти после завершения контекста всегда редактируются моделью независимо от этой настройки.
refine_add.label = Редактировать память перед добавлением
refine_add.tooltip = Редактирует ручные вызовы memory_add настроенной моделью. Автоматические обновления памяти всегда редактируются.
plugin.description = Обеспечивает глобальную и проектную долговременную память, хранящуюся в локальной базе данных.
plugin.name = Memory (inline)
