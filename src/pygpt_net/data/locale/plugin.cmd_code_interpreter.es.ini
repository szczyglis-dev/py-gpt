use_ipython.label = Usar IPython
use_ipython.description = Usar el intérprete IPython. Cuando está desactivado, se usa el intérprete estándar de Python.
sandbox.label = Sandbox
sandbox.description = Desactivado: ejecuta Python/IPython directamente en el host (no seguro). Integrado: ejecuta un entorno CPython/IPython dedicado administrado por uv en un proceso separado, pero no restringe el acceso al sistema de archivos del host. Docker: requiere Docker instalado y en ejecución y proporciona el aislamiento más fuerte; es la opción más segura. La lista blanca/negra se aplica a las herramientas dedicadas de comandos del sistema en el host, en el sandbox integrado y en Docker.

