sandbox.label = Sandlåda
sandbox.description = Inaktiverad: kör systemkommandon direkt på värden (osäkert). Inbyggd sandlåda: kör kommandon i en inbyggd uv-hanterad CPython-miljö med isolering på OS-nivå där det är tillgängligt (medelhög säkerhet). Docker: kräver att Docker är installerat och körs och ger den starkaste isoleringen; det är det säkraste alternativet.
