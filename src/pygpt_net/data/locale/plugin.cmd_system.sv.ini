sandbox.label = Sandlåda
sandbox.description = Inaktiverad: kör systemkommandon direkt på värden (osäkert). Inbyggd: kör kommandon i en dedikerad uv-hanterad CPython-miljö i en separat process, men begränsar inte åtkomsten till värdens filsystem. Docker: kräver att Docker är installerat och körs och ger den starkaste isoleringen; det är det säkraste alternativet. Vitlista/svartlista gäller för de dedikerade systemkommandoverktygen på värden, i den inbyggda sandboxen och i Docker.

