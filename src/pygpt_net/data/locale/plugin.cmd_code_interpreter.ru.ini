[LOCALE]
plugin.name = Интерпретатор Python
sandbox.label = Песочница
sandbox.description = Отключено: запускает Python/IPython непосредственно на хосте (небезопасно). Встроенная песочница: запускает встроенную среду CPython/IPython под управлением uv с изоляцией на уровне ОС, где она доступна (средний уровень безопасности). Docker: требует установленного и запущенного Docker и обеспечивает самую сильную изоляцию; это самый безопасный вариант.
