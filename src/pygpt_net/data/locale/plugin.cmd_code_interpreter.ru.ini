plugin.name = Интерпретатор Python
sandbox.label = Песочница
sandbox.description = Отключено: запускает Python/IPython непосредственно на хосте (небезопасно). Встроенный: запускает выделенную среду CPython/IPython под управлением uv в отдельном процессе, но не ограничивает доступ к файловой системе хоста. Docker: требует установленного и запущенного Docker и обеспечивает самую сильную изоляцию; это самый безопасный вариант.

