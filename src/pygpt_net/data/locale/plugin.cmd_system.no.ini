sandbox.label = Sandkasse
sandbox.description = Deaktivert: kjører systemkommandoer direkte på verten (usikkert). Innebygd sandkasse: kjører kommandoer i et innebygd uv-administrert CPython-miljø med isolasjon på OS-nivå der det er tilgjengelig (middels sikkerhet). Docker: krever at Docker er installert og kjører, og gir den sterkeste isolasjonen; dette er det sikreste alternativet.
