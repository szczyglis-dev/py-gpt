sandbox.label = Sandkasse
sandbox.description = Deaktivert: kjører systemkommandoer direkte på verten (usikkert). Innebygd: kjører kommandoer i et dedikert uv-administrert CPython-miljø i en separat prosess, men begrenser ikke tilgangen til vertens filsystem. Docker: krever at Docker er installert og kjører og gir den sterkeste isolasjonen; det er det sikreste alternativet.

