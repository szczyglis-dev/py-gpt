[LOCALE]
auto_attach.description = Automatycznie dołącza aktywną pamięć globalną lub projektową do prompta systemowego w każdej rozmowie.
auto_attach.label = Automatycznie dołączaj pamięć do każdej rozmowy
auto_attach.tooltip = Automatycznie dołącza aktywną pamięć globalną lub projektową do prompta systemowego w każdej rozmowie.
auto_attach_project.description = Automatycznie dołącza pamięć do prompta systemowego, gdy bieżąca rozmowa należy do projektu.
auto_attach_project.label = Automatycznie dołączaj pamięć tylko w projektach
auto_attach_project.tooltip = Automatycznie dołącza pamięć do prompta systemowego, gdy bieżąca rozmowa należy do projektu.
cmd.memory_add.description = Dodawaj tylko bardzo istotne i trwałe informacje do pamięci globalnej lub projektowej. Używaj tego narzędzia oszczędnie; nie zapisuj rutynowych, tymczasowych ani mało wartościowych szczegółów.
cmd.memory_add.label = Dodaj do pamięci
cmd.memory_add.tooltip = Dodawaj tylko ważne i trwałe informacje. Używaj memory_add oszczędnie.
cmd.memory_clear.description = Czyści pamięć dla bieżącego zakresu. Model musi najpierw poprosić użytkownika o wyraźne potwierdzenie i wywołać to narzędzie dopiero po potwierdzeniu.
cmd.memory_clear.label = Wyczyść pamięć
cmd.memory_clear.tooltip = Czyści pamięć dla bieżącego zakresu. Model musi najpierw poprosić użytkownika o wyraźne potwierdzenie i wywołać to narzędzie dopiero po potwierdzeniu.
cmd.memory_get.description = Odczytuje pełną pamięć dla bieżącego zakresu globalnego lub projektowego.
cmd.memory_get.label = Odczytaj pamięć
cmd.memory_get.tooltip = Odczytuje pełną pamięć dla bieżącego zakresu globalnego lub projektowego.
cmd.memory_update.description = Zastępuje całą zawartość pamięci dla bieżącego zakresu globalnego lub projektowego.
cmd.memory_update.label = Aktualizuj pamięć
cmd.memory_update.tooltip = Zastępuje całą zawartość pamięci dla bieżącego zakresu globalnego lub projektowego.
max_chars.description = Docelowy maksymalny rozmiar pamięci w znakach. Model ma utrzymywać się w tym limicie; zapis dopuszcza dodatkowy margines bezpieczeństwa 300 znaków przed twardym obcięciem.
max_chars.label = Maksymalna liczba znaków pamięci
max_chars.tooltip = Docelowy rozmiar pamięci w znakach; przed twardym obcięciem dopuszczalny jest margines 300 znaków.
model_update.description = Model używany do automatycznych aktualizacji pamięci oraz, gdy włączone, do redagowania operacji memory_add.
model_update.label = Model aktualizacji pamięci
model_update.tooltip = Model używany do aktualizowania i redagowania pamięci.
refine_add.description = Dotyczy tylko ręcznych wywołań memory_add. Po włączeniu skonfigurowany model aktualizacji pamięci scala i przeredagowuje dodawaną informację z istniejącą pamięcią zamiast dopisywać surowy tekst. Automatyczne aktualizacje pamięci po zakończeniu kontekstu są zawsze redagowane przez model niezależnie od tego ustawienia.
refine_add.label = Redaguj pamięć przed dodaniem
refine_add.tooltip = Redaguj ręczne wywołania memory_add przy użyciu skonfigurowanego modelu. Automatyczne aktualizacje pamięci kontekstu są zawsze redagowane.
key_search_content.label = Szukaj także w zawartości pamięci po kluczach
key_search_content.description = W memory_key_search przeszukuje również zapisane wartości/zawartość. Nazwy kluczy są zawsze wyszukiwane przez LIKE. Domyślnie wyłączone, aby uniknąć skanowania całej zawartości.
key_search_content.tooltip = W memory_key_search przeszukuje również zawartość kluczy. Domyślnie wyłączone.
cmd.memory_key_get.description = Odczytuje surowe rekordy pamięci z bazy po jednym kluczu lub liście kluczy dla bieżącego zakresu globalnego lub projektowego.
cmd.memory_key_get.label = Odczytaj pamięć po kluczu
cmd.memory_key_get.tooltip = Odczytuje surowe rekordy pamięci po kluczach z bieżącego zakresu.
cmd.memory_key_add.description = Zapisuje nową surową wartość w bazie pod kluczem do późniejszego użycia w bieżącym zakresie globalnym lub projektowym. Używaj tylko dla naprawdę ważnych danych; istniejące klucze nie są nadpisywane.
cmd.memory_key_add.label = Dodaj pamięć po kluczu
cmd.memory_key_add.tooltip = Zapisuje nową surową wartość pod kluczem. Używaj tylko dla naprawdę ważnych danych.
cmd.memory_key_append.description = Dopisuje surową treść dokładnie w podanej postaci do istniejącego klucza pamięci w bieżącym zakresie globalnym lub projektowym. Używaj tylko dla naprawdę ważnych danych.
cmd.memory_key_append.label = Dopisz do pamięci po kluczu
cmd.memory_key_append.tooltip = Dopisuje surową treść do istniejącego klucza bez obróbki przez LLM.
cmd.memory_key_update.description = Zastępuje surową treść istniejącego klucza pamięci w bieżącym zakresie globalnym lub projektowym. Używaj tylko dla naprawdę ważnych danych.
cmd.memory_key_update.label = Aktualizuj pamięć po kluczu
cmd.memory_key_update.tooltip = Zastępuje surową treść istniejącego klucza bez obróbki przez LLM.
cmd.memory_key_list.description = Zwraca wyłącznie nazwy zapisanych kluczy pamięci dla bieżącego zakresu globalnego lub projektowego, bez zawartości.
cmd.memory_key_list.label = Lista kluczy pamięci
cmd.memory_key_list.tooltip = Zwraca listę nazw kluczy bez ich zawartości.
cmd.memory_key_search.description = Wyszukuje pamięć po kluczach przez LIKE. Zawartość jest przeszukiwana tylko po włączeniu opcji Szukaj także w zawartości pamięci po kluczach.
cmd.memory_key_search.label = Szukaj kluczy pamięci
cmd.memory_key_search.tooltip = Wyszukuje nazwy kluczy przez LIKE i opcjonalnie także ich zawartość.
cmd.memory_key_remove.description = Usuwa jeden klucz pamięci lub listę kluczy z bieżącego zakresu globalnego lub projektowego.
cmd.memory_key_remove.label = Usuń klucze pamięci
cmd.memory_key_remove.tooltip = Usuwa jeden lub więcej zapisanych kluczy pamięci z bieżącego zakresu.
plugin.description = Zapewnia długoterminową pamięć globalną i per projekt, przechowywaną w lokalnej bazie danych.
plugin.name = Memory (inline)
