[LOCALE]
sandbox.label = Песочница
sandbox.description = Отключено: запускает системные команды непосредственно на хосте (небезопасно). Встроенная песочница: запускает команды во встроенной среде CPython под управлением uv с изоляцией на уровне ОС, где она доступна (средний уровень безопасности). Docker: требует установленного и запущенного Docker и обеспечивает самую сильную изоляцию; это самый безопасный вариант.
