[LOCALE]
sandbox.label = Песочница
sandbox.description = Отключено: запускает системные команды непосредственно на хосте (небезопасно). Встроенный: запускает команды в выделенной среде CPython под управлением uv в отдельном процессе, но не ограничивает доступ к файловой системе хоста. Docker: требует установленного и запущенного Docker и обеспечивает самую сильную изоляцию; это самый безопасный вариант. Белый/чёрный список применяется к выделенным инструментам системных команд на хосте, во встроенной песочнице и в Docker.

builtin_packages.label = Пакеты для установки
builtin_packages.description = Требования к пакетам Python, устанавливаемым во встроенную песочницу. Укажите по одной спецификации пакета в строке. Пересоздайте встроенное venv, чтобы применить изменения сразу; иначе оно будет автоматически пересоздано при следующем использовании встроенной песочницы.
