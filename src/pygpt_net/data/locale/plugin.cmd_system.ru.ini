sandbox.label = Песочница
sandbox.description = Отключено: запускает системные команды непосредственно на хосте (небезопасно). Встроенный: запускает команды в выделенной среде CPython под управлением uv в отдельном процессе, но не ограничивает доступ к файловой системе хоста. Docker: требует установленного и запущенного Docker и обеспечивает самую сильную изоляцию; это самый безопасный вариант.

