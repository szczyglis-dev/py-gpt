[LOCALE]
plugin.name = 캔버스
plugin.description = BETA. HTML/JavaScript, 웹사이트 프로토타이핑, 브라우저 범위 상호작용, Playwright 자동화, 주석 및 경량 미리보기 서버를 위한 내부 캔버스/브라우저 런타임을 제공합니다. 이 기능은 향후 릴리스에서 계속 확장될 예정입니다.
use_sandbox.label = 샌드박스 사용(Playwright)
use_sandbox.description = 격리된 Playwright 브라우저 백엔드를 활성화합니다. 비활성화하면 Canvas은 내장 QWebEngine 브라우저를 사용하며 Playwright를 시작하지 않습니다.
playwright_engine.label = Playwright 엔진
playwright_engine.description = 격리된 Playwright 백엔드에서 사용하는 브라우저 엔진입니다.
playwright_path.label = Playwright 브라우저 디렉터리
playwright_path.description = 선택적 PLAYWRIGHT_BROWSERS_PATH입니다. Playwright 기본값을 사용하려면 비워 두세요.
playwright_args.label = Playwright 브라우저 인수
playwright_args.description = 선택적인 Chromium/Playwright 실행 인수를 쉼표로 구분하여 지정합니다.
default_width.label = 기본 뷰포트 너비
default_width.description = 브라우저 뷰포트의 기본 너비(픽셀)입니다.
default_height.label = 기본 뷰포트 높이
default_height.description = 브라우저 뷰포트의 기본 높이(픽셀)입니다.
auto_open_split.label = 브라우저를 분할 화면으로 자동 열기
auto_open_split.description = 세션에서 에이전트가 브라우저를 처음 열 때 두 번째 열의 Canvas 탭을 만들거나 포커스하고 분할 화면을 표시합니다. 사용자가 이후 숨기면 같은 세션에서 다시 강제로 열지 않습니다.
annotation_prompt.label = 사용자 주석을 모델에 제공
annotation_prompt.description = 대기 중인 브라우저/캔버스 주석을 런타임 시스템 프롬프트에 추가합니다.
max_annotations.label = 최대 주석 수
max_annotations.description = 현재 브라우저 세션에 보관할 최대 주석 수입니다.
console_limit.label = 콘솔 로그 제한
console_limit.description = 메모리에 보관할 최대 브라우저 콘솔 항목 수입니다.
cmd.canvas_open.label = 활성화: canvas_open
cmd.canvas_open.description = 지속형 캔버스/브라우저 런타임을 열거나 탐색합니다. 기본값은 QWebEngine이며 Playwright는 플러그인 설정에서 활성화된 경우에만 사용합니다.
cmd.canvas_change_resolution.label = 활성화: canvas_change_resolution
cmd.canvas_change_resolution.description = 캔버스/브라우저 뷰포트의 크기와 방향을 변경합니다.
cmd.canvas_set_html.label = 활성화: canvas_set_html
cmd.canvas_set_html.description = 지속형 캔버스/브라우저 런타임에서 임의의 HTML/CSS/JavaScript를 렌더링합니다.
cmd.canvas_get_html.label = 활성화: canvas_get_html
cmd.canvas_get_html.description = 현재 캔버스/브라우저 URL과 직렬화된 HTML 문서를 가져옵니다.
cmd.canvas_current.label = 활성화: canvas_current
cmd.canvas_current.description = 현재 캔버스/브라우저 세션 상태를 가져옵니다.
cmd.canvas_close.label = 활성화: canvas_close
cmd.canvas_close.description = 백그라운드 브라우저 세션을 종료하지 않고 PyGPT의 표시 중인 캔버스 탭을 닫습니다.
cmd.canvas_prev.label = 활성화: canvas_prev
cmd.canvas_prev.description = 캔버스/브라우저 기록에서 뒤로 이동합니다.
cmd.canvas_next.label = 활성화: canvas_next
cmd.canvas_next.description = 캔버스/브라우저 기록에서 앞으로 이동합니다.
cmd.canvas_reload.label = 활성화: canvas_reload
cmd.canvas_reload.description = 현재 캔버스/브라우저 문서를 다시 로드합니다.
cmd.canvas_screenshot.label = 활성화: canvas_screenshot
cmd.canvas_screenshot.description = 모델의 가상 커서를 포함한 현재 캔버스/브라우저 뷰포트를 캡처합니다.
cmd.canvas_inspect.label = 활성화: canvas_inspect
cmd.canvas_inspect.description = 표시되거나 상호작용 가능한 DOM 요소를 검사하고 안정적인 선택자와 요소 경계를 반환합니다.
cmd.canvas_click.label = 활성화: canvas_click
cmd.canvas_click.description = 캔버스/브라우저 내부에서만 요소나 좌표를 클릭합니다.
cmd.canvas_hover.label = 활성화: canvas_hover
cmd.canvas_hover.description = 모델의 가상 커서를 이동하고 캔버스/브라우저 내부에서 호버합니다.
cmd.canvas_type.label = 활성화: canvas_type
cmd.canvas_type.description = 편집 가능한 요소에 포커스를 두고 캔버스/브라우저 안에 텍스트를 입력합니다.
cmd.canvas_key.label = 활성화: canvas_key
cmd.canvas_key.description = 키 또는 키보드 단축키를 캔버스/브라우저에만 보냅니다.
cmd.canvas_scroll.label = 활성화: canvas_scroll
cmd.canvas_scroll.description = 캔버스/브라우저 뷰포트를 스크롤합니다.
cmd.canvas_drag.label = 활성화: canvas_drag
cmd.canvas_drag.description = 캔버스/브라우저 안에서 두 뷰포트 좌표 사이를 드래그합니다.
cmd.canvas_wait.label = 활성화: canvas_wait
cmd.canvas_wait.description = 캔버스/브라우저 런타임에서 선택자 또는 짧은 시간 동안 대기합니다.
cmd.canvas_eval.label = 활성화: canvas_eval
cmd.canvas_eval.description = 현재 캔버스/브라우저 페이지에서 JavaScript를 실행합니다.
cmd.canvas_select.label = 활성화: canvas_select
cmd.canvas_select.description = 캔버스/브라우저의 select 요소에서 옵션을 선택합니다.
cmd.canvas_check.label = 활성화: canvas_check
cmd.canvas_check.description = 캔버스/브라우저의 체크박스 또는 라디오 버튼 상태를 설정합니다.
cmd.canvas_upload.label = 활성화: canvas_upload
cmd.canvas_upload.description = 보안 검증된 호스트 파일을 Playwright 파일 입력을 통해 캔버스/브라우저에 업로드합니다.
cmd.canvas_console.label = 활성화: canvas_console
cmd.canvas_console.description = 캔버스/브라우저의 최근 JavaScript 콘솔 메시지와 페이지 오류를 가져옵니다.
cmd.canvas_annotations.label = 활성화: canvas_annotations
cmd.canvas_annotations.description = 현재 캔버스/브라우저 세션에 사용자가 남긴 주석을 가져옵니다.
cmd.canvas_clear_annotations.label = 활성화: canvas_clear_annotations
cmd.canvas_clear_annotations.description = 캔버스/브라우저 주석을 지웁니다.
cmd.web_server_start.label = 활성화: web_server_start
cmd.web_server_start.description = 선택한 작업 디렉터리에 대해 loopback 전용 로컬 정적 미리보기 서버를 시작합니다.
cmd.web_server_current.label = 활성화: web_server_current
cmd.web_server_current.description = 현재 미리보기 서버 상태를 가져옵니다.
cmd.web_server_stop.label = 활성화: web_server_stop
cmd.web_server_stop.description = 미리보기 서버를 중지합니다.
ui.back = 뒤로
ui.next = 앞으로
ui.reload = 다시 로드
ui.open_url = URL 열기
ui.address_placeholder = URL 또는 로컬 경로를 입력하고 Enter를 누르세요
ui.copy = 복사
ui.select_all = 모두 선택
ui.annotate_selection = AI용 선택 영역 주석…
ui.annotate_element = AI용 요소 주석…
ui.annotation_title = AI용 주석
ui.annotation_selection_prompt = 선택한 내용에 대한 설명 / 지시:
ui.annotation_element_prompt = 이 요소에 대한 설명 / 지시:
ui.annotation_added = AI용 캔버스/브라우저 주석을 추가했습니다
ui.annotation_removed = 캔버스/브라우저 주석을 제거했습니다
ui.show_source = 소스 보기
ui.back_to_canvas = 캔버스 / HTML로 돌아가기
ui.cancel = 취소
ui.add = 추가
ui.remove_annotation = 주석 제거
