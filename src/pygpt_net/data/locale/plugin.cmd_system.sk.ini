[LOCALE]
sandbox.label = Sandbox
sandbox.description = Vypnuté: spúšťa systémové príkazy priamo na hostiteľovi (nebezpečné). Vstavané: spúšťa príkazy vo vyhradenom prostredí CPython spravovanom pomocou uv v samostatnom procese, ale neobmedzuje prístup k súborovému systému hostiteľa. Docker: vyžaduje nainštalovaný a spustený Docker a poskytuje najsilnejšiu izoláciu; je to najbezpečnejšia možnosť. Biely/čierny zoznam sa vzťahuje na vyhradené nástroje systémových príkazov na hostiteľovi, vo vstavanom sandboxe aj v Dockeri.

builtin_packages.label = Balíky na inštaláciu
builtin_packages.description = Požiadavky na Python balíky inštalované do vstavaného sandboxu. Zadajte jednu špecifikáciu balíka na riadok. Ak chcete zmeny použiť okamžite, znovu vytvorte vstavané venv; inak sa automaticky znovu vytvorí pri ďalšom použití vstavaného sandboxu.
