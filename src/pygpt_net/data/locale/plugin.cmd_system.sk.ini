sandbox.label = Sandbox
sandbox.description = Vypnuté: spúšťa systémové príkazy priamo na hostiteľovi (nebezpečné). Vstavaný sandbox: spúšťa príkazy vo vstavanom prostredí CPython spravovanom pomocou uv s izoláciou na úrovni OS, ak je dostupná (stredná úroveň zabezpečenia). Docker: vyžaduje nainštalovaný a spustený Docker a poskytuje najsilnejšiu izoláciu; je to najbezpečnejšia možnosť.
