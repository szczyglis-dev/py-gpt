sandbox.label = Sandbox
sandbox.description = Vypnuté: spúšťa systémové príkazy priamo na hostiteľovi (nebezpečné). Vstavané: spúšťa príkazy vo vyhradenom prostredí CPython spravovanom pomocou uv v samostatnom procese, ale neobmedzuje prístup k súborovému systému hostiteľa. Docker: vyžaduje nainštalovaný a spustený Docker a poskytuje najsilnejšiu izoláciu; je to najbezpečnejšia možnosť.

