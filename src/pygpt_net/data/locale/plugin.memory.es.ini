[LOCALE]
auto_attach.description = Añade automáticamente la memoria global o del proyecto activa al prompt del sistema en cada conversación.
auto_attach.label = Adjuntar memoria automáticamente a cada conversación
auto_attach.tooltip = Añade automáticamente la memoria global o del proyecto activa al prompt del sistema en cada conversación.
auto_attach_project.description = Añade automáticamente la memoria al prompt del sistema cuando la conversación actual pertenece a un proyecto.
auto_attach_project.label = Adjuntar memoria automáticamente solo en proyectos
auto_attach_project.tooltip = Añade automáticamente la memoria al prompt del sistema cuando la conversación actual pertenece a un proyecto.
cmd.memory_add.description = Añade solo información muy importante y duradera a la memoria global o del proyecto actual. Usa esta herramienta con moderación; no guardes detalles rutinarios, temporales o de poco valor.
cmd.memory_add.label = Añadir a la memoria
cmd.memory_add.tooltip = Añade solo información importante y duradera. Usa memory_add con moderación.
cmd.memory_clear.description = Borra la memoria del ámbito actual. El modelo debe pedir primero una confirmación explícita al usuario y usar esta herramienta solo después de confirmarla.
cmd.memory_clear.label = Borrar memoria
cmd.memory_clear.tooltip = Borra la memoria del ámbito actual. El modelo debe pedir primero una confirmación explícita al usuario y usar esta herramienta solo después de confirmarla.
cmd.memory_get.description = Lee la memoria completa del ámbito global o de proyecto actual.
cmd.memory_get.label = Leer memoria
cmd.memory_get.tooltip = Lee la memoria completa del ámbito global o de proyecto actual.
cmd.memory_update.description = Sustituye todo el contenido de memoria del ámbito global o de proyecto actual.
cmd.memory_update.label = Actualizar memoria
cmd.memory_update.tooltip = Sustituye todo el contenido de memoria del ámbito global o de proyecto actual.
max_chars.description = Tamaño máximo objetivo de la memoria en caracteres. Se pide al modelo que se mantenga dentro de este límite; se permiten 300 caracteres adicionales de margen de seguridad antes del truncado forzado.
max_chars.label = Máximo de caracteres de memoria
max_chars.tooltip = Tamaño objetivo de la memoria en caracteres; se permite un margen de seguridad de 300 caracteres antes del truncado.
model_update.description = Modelo usado para actualizaciones automáticas de memoria y, si está activado, para refinar operaciones memory_add.
model_update.label = Modelo de actualización de memoria
model_update.tooltip = Modelo usado para actualizar y refinar la memoria.
refine_add.description = Se aplica solo a llamadas manuales a memory_add. Si está activado, el modelo configurado de actualización de memoria combina y reescribe la información añadida dentro de la memoria existente en lugar de anexar texto bruto. Las actualizaciones automáticas de memoria al finalizar el contexto siempre son refinadas por el modelo, independientemente de esta opción.
refine_add.label = Refinar la memoria antes de añadir
refine_add.tooltip = Refina llamadas manuales a memory_add con el modelo configurado. Las actualizaciones automáticas de memoria siempre se refinan.
plugin.description = Proporciona memoria a largo plazo global y por proyecto respaldada por la base de datos local.
plugin.name = Memory (inline)
