[LOCALE]
auto_attach.description = מצרף אוטומטית את הזיכרון הגלובלי או של הפרויקט הפעיל לפרומפט המערכת בכל שיחה.
auto_attach.label = צרף זיכרון אוטומטית לכל שיחה
auto_attach.tooltip = מצרף אוטומטית את הזיכרון הגלובלי או של הפרויקט הפעיל לפרומפט המערכת בכל שיחה.
auto_attach_project.description = מצרף אוטומטית את הזיכרון לפרומפט המערכת כאשר השיחה הנוכחית שייכת לפרויקט.
auto_attach_project.label = צרף זיכרון אוטומטית רק בפרויקטים
auto_attach_project.tooltip = מצרף אוטומטית את הזיכרון לפרומפט המערכת כאשר השיחה הנוכחית שייכת לפרויקט.
cmd.memory_add.description = הוסף לזיכרון הגלובלי או לזיכרון הפרויקט הנוכחי רק מידע חשוב מאוד ועמיד. השתמש בכלי במשורה; אל תשמור פרטים שגרתיים, זמניים או בעלי ערך נמוך.
cmd.memory_add.label = הוסף לזיכרון
cmd.memory_add.tooltip = הוסף רק מידע חשוב ועמיד. השתמש ב-memory_add במשורה.
cmd.memory_clear.description = מנקה את הזיכרון בתחום הנוכחי. על המודל לבקש תחילה אישור מפורש מהמשתמש ולהפעיל כלי זה רק לאחר האישור.
cmd.memory_clear.label = נקה זיכרון
cmd.memory_clear.tooltip = מנקה את הזיכרון בתחום הנוכחי. על המודל לבקש תחילה אישור מפורש מהמשתמש ולהפעיל כלי זה רק לאחר האישור.
cmd.memory_get.description = קורא את כל הזיכרון עבור התחום הגלובלי או תחום הפרויקט הנוכחי.
cmd.memory_get.label = קרא זיכרון
cmd.memory_get.tooltip = קורא את כל הזיכרון עבור התחום הגלובלי או תחום הפרויקט הנוכחי.
cmd.memory_update.description = מחליף את כל תוכן הזיכרון עבור התחום הגלובלי או תחום הפרויקט הנוכחי.
cmd.memory_update.label = עדכן זיכרון
cmd.memory_update.tooltip = מחליף את כל תוכן הזיכרון עבור התחום הגלובלי או תחום הפרויקט הנוכחי.
max_chars.description = גודל היעד המרבי של הזיכרון בתווים. המודל מתבקש להישאר בתוך מגבלה זו; לפני חיתוך קשיח מותר מרווח ביטחון נוסף של 300 תווים.
max_chars.label = מספר מרבי של תווים בזיכרון
max_chars.tooltip = גודל יעד של הזיכרון בתווים; מותר מרווח ביטחון של 300 תווים לפני חיתוך קשיח.
model_update.description = המודל המשמש לעדכוני זיכרון אוטומטיים, ואם מופעל, לעיבוד פעולות memory_add.
model_update.label = מודל עדכון זיכרון
model_update.tooltip = מודל לעדכון ולעיבוד הזיכרון.
refine_add.description = חל רק על קריאות ידניות ל-memory_add. כאשר האפשרות פעילה, מודל עדכון הזיכרון שהוגדר ממזג ומנסח מחדש את המידע שנוסף בתוך הזיכרון הקיים במקום לצרף טקסט גולמי. עדכוני זיכרון אוטומטיים בסיום הקשר תמיד עוברים עיבוד מחדש על ידי המודל ללא קשר להגדרה זו.
refine_add.label = עיבוד הזיכרון לפני הוספה
refine_add.tooltip = מעבד קריאות ידניות ל-memory_add בעזרת המודל שהוגדר. עדכוני זיכרון אוטומטיים תמיד עוברים עיבוד מחדש.
key_search_content.label = Search memory key content
key_search_content.description = Also search stored key values/content in memory_key_search. Key names are always searched with LIKE. Disabled by default to avoid scanning stored content.
key_search_content.tooltip = Also search key content in memory_key_search. Disabled by default.
cmd.memory_key_get.description = Read raw database-backed memory records by one key or a list of keys from the current global or project scope.
cmd.memory_key_get.label = Read keyed memory
cmd.memory_key_get.tooltip = Read raw keyed memory records from the current global or project scope.
cmd.memory_key_add.description = Store a new raw database value by key for later use in the current global or project scope. Use only for truly important data; existing keys are not overwritten.
cmd.memory_key_add.label = Add keyed memory
cmd.memory_key_add.tooltip = Store a new raw value by key. Use only for truly important data.
cmd.memory_key_append.description = Append raw content exactly as provided to an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_append.label = Append keyed memory
cmd.memory_key_append.tooltip = Append raw content to an existing key without LLM processing.
cmd.memory_key_update.description = Replace the raw content of an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_update.label = Update keyed memory
cmd.memory_key_update.tooltip = Replace raw content for an existing key without LLM processing.
cmd.memory_key_list.description = List only the stored memory key names for the current global or project scope, without content.
cmd.memory_key_list.label = List memory keys
cmd.memory_key_list.tooltip = List memory key names without content.
cmd.memory_key_search.description = Search keyed memory with LIKE matching on key names. Content is searched only when the Search memory key content option is enabled.
cmd.memory_key_search.label = Search memory keys
cmd.memory_key_search.tooltip = Search key names with LIKE and optionally search stored content.
cmd.memory_key_remove.description = Remove one database-backed memory key or a list of keys from the current global or project scope.
cmd.memory_key_remove.label = Remove memory keys
cmd.memory_key_remove.tooltip = Remove one or more stored memory keys from the current scope.
plugin.description = מספק זיכרון ארוך טווח גלובלי ולפי פרויקט, המאוחסן במסד הנתונים המקומי.
plugin.name = Memory (inline)
