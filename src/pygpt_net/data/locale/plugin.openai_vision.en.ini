[LOCALE]
cmd.camera_capture.description = Enable camera_capture command execution.\nIf enabled, the model will be able to capture images from the camera itself. The + Tools option must be enabled.
cmd.camera_capture.label = Enable: capturing images from the camera
cmd.camera_capture.tooltip = Example prompt: Capture the image from my webcam.
cmd.make_screenshot.description = Enable make_screenshot command execution.\nIf enabled, the model will be able to make screenshots itself. The + Tools option must be enabled.
cmd.make_screenshot.label = Enable: making screenshots
cmd.make_screenshot.tooltip = Example prompt: Make a screenshot and describe what you see.
model.description = Image-capable Chat model used temporarily for image analysis. Any supported provider can be used; the default is "gpt-4o".
model.label = Model
plugin.description = Adds image analysis to supported chat modes. When image content is detected, PyGPT temporarily routes the turn through Chat with the configured image-capable model. Models from any supported provider can be selected.
plugin.name = Vision (inline)
prompt.description = Prompt used for inline image analysis. It is appended to or replaces the current system prompt while the temporary image-capable model is used in Chat mode.
prompt.label = Prompt
replace_prompt.description = Replace the whole system prompt with the image-analysis prompt instead of appending it to the current prompt.
replace_prompt.label = Replace prompt
