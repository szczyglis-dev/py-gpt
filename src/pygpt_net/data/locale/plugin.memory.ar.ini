[LOCALE]
auto_attach.description = يضيف تلقائيًا الذاكرة العامة أو ذاكرة المشروع النشطة إلى موجه النظام في كل محادثة.
auto_attach.label = إرفاق الذاكرة تلقائيًا بكل محادثة
auto_attach.tooltip = يضيف تلقائيًا الذاكرة العامة أو ذاكرة المشروع النشطة إلى موجه النظام في كل محادثة.
auto_attach_project.description = يضيف الذاكرة تلقائيًا إلى موجه النظام عندما تنتمي المحادثة الحالية إلى مشروع.
auto_attach_project.label = إرفاق الذاكرة تلقائيًا في المشاريع فقط
auto_attach_project.tooltip = يضيف الذاكرة تلقائيًا إلى موجه النظام عندما تنتمي المحادثة الحالية إلى مشروع.
cmd.memory_add.description = أضف فقط معلومات شديدة الأهمية وطويلة الأمد إلى الذاكرة العامة أو ذاكرة المشروع الحالية. استخدم الأداة باعتدال ولا تحفظ تفاصيل روتينية أو مؤقتة أو منخفضة القيمة.
cmd.memory_add.label = إضافة إلى الذاكرة
cmd.memory_add.tooltip = أضف فقط معلومات مهمة ودائمة. استخدم memory_add باعتدال.
cmd.memory_clear.description = يمسح ذاكرة النطاق الحالي. يجب على النموذج أولًا طلب تأكيد صريح من المستخدم، ثم استدعاء هذه الأداة فقط بعد التأكيد.
cmd.memory_clear.label = مسح الذاكرة
cmd.memory_clear.tooltip = يمسح ذاكرة النطاق الحالي. يجب على النموذج أولًا طلب تأكيد صريح من المستخدم، ثم استدعاء هذه الأداة فقط بعد التأكيد.
cmd.memory_get.description = يقرأ الذاكرة الكاملة للنطاق العام أو نطاق المشروع الحالي.
cmd.memory_get.label = قراءة الذاكرة
cmd.memory_get.tooltip = يقرأ الذاكرة الكاملة للنطاق العام أو نطاق المشروع الحالي.
cmd.memory_update.description = يستبدل محتوى الذاكرة بالكامل للنطاق العام أو نطاق المشروع الحالي.
cmd.memory_update.label = تحديث الذاكرة
cmd.memory_update.tooltip = يستبدل محتوى الذاكرة بالكامل للنطاق العام أو نطاق المشروع الحالي.
max_chars.description = الحجم الأقصى المستهدف للذاكرة بعدد الأحرف. يُطلب من النموذج البقاء ضمن هذا الحد؛ ويُسمح بهامش أمان إضافي قدره 300 حرف قبل الاقتطاع الصارم.
max_chars.label = الحد الأقصى لأحرف الذاكرة
max_chars.tooltip = الحجم المستهدف للذاكرة بالأحرف؛ يُسمح بهامش أمان قدره 300 حرف قبل الاقتطاع الصارم.
model_update.description = النموذج المستخدم لتحديثات الذاكرة التلقائية، وعند التفعيل، لتنقيح عمليات memory_add.
model_update.label = نموذج تحديث الذاكرة
model_update.tooltip = النموذج المستخدم لتحديث الذاكرة وتنقيحها.
refine_add.description = ينطبق فقط على استدعاءات memory_add اليدوية. عند تفعيله، يستخدم نموذج تحديث الذاكرة المُعد لدمج المعلومات المضافة وإعادة صياغتها داخل الذاكرة الحالية بدل إلحاق النص الخام. تحديثات الذاكرة التلقائية عند نهاية السياق تُعاد صياغتها دائمًا بواسطة النموذج بغض النظر عن هذا الإعداد.
refine_add.label = تنقيح الذاكرة قبل الإضافة
refine_add.tooltip = يعيد صياغة استدعاءات memory_add اليدوية بالنموذج المُعد. تحديثات الذاكرة التلقائية تُعاد صياغتها دائمًا.
key_search_content.label = Search memory key content
key_search_content.description = Also search stored key values/content in memory_key_search. Key names are always searched with LIKE. Disabled by default to avoid scanning stored content.
key_search_content.tooltip = Also search key content in memory_key_search. Disabled by default.
cmd.memory_key_get.description = Read raw database-backed memory records by one key or a list of keys from the current global or project scope.
cmd.memory_key_get.label = Read keyed memory
cmd.memory_key_get.tooltip = Read raw keyed memory records from the current global or project scope.
cmd.memory_key_add.description = Store a new raw database value by key for later use in the current global or project scope. Use only for truly important data; existing keys are not overwritten.
cmd.memory_key_add.label = Add keyed memory
cmd.memory_key_add.tooltip = Store a new raw value by key. Use only for truly important data.
cmd.memory_key_append.description = Append raw content exactly as provided to an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_append.label = Append keyed memory
cmd.memory_key_append.tooltip = Append raw content to an existing key without LLM processing.
cmd.memory_key_update.description = Replace the raw content of an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_update.label = Update keyed memory
cmd.memory_key_update.tooltip = Replace raw content for an existing key without LLM processing.
cmd.memory_key_list.description = List only the stored memory key names for the current global or project scope, without content.
cmd.memory_key_list.label = List memory keys
cmd.memory_key_list.tooltip = List memory key names without content.
cmd.memory_key_search.description = Search keyed memory with LIKE matching on key names. Content is searched only when the Search memory key content option is enabled.
cmd.memory_key_search.label = Search memory keys
cmd.memory_key_search.tooltip = Search key names with LIKE and optionally search stored content.
cmd.memory_key_remove.description = Remove one database-backed memory key or a list of keys from the current global or project scope.
cmd.memory_key_remove.label = Remove memory keys
cmd.memory_key_remove.tooltip = Remove one or more stored memory keys from the current scope.
plugin.description = توفر ذاكرة طويلة الأمد عامة ولكل مشروع، مخزنة في قاعدة البيانات المحلية.
plugin.name = Memory (inline)
