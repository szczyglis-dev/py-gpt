[LOCALE]
plugin.name = Canvas
plugin.description = BETA. Zapewnia wewnętrzne środowisko kanwy i przeglądarki do HTML i JavaScript, prototypowania stron, sterowania przeglądarką w obrębie widoku, automatyzacji Playwright, adnotacji i lekkiego serwera podglądu. Funkcja będzie rozwijana i rozszerzana w kolejnych wersjach.
use_sandbox.label = Użyj sandboxa (Playwright)
use_sandbox.description = Włącza izolowany backend przeglądarki Playwright. Gdy opcja jest wyłączona, Canvas używa wbudowanego QWebEngine i nie uruchamia Playwright.
playwright_engine.label = Silnik Playwright
playwright_engine.description = Silnik przeglądarki używany przez izolowany backend Playwright.
playwright_path.label = Katalog przeglądarek Playwright
playwright_path.description = Opcjonalna ścieżka PLAYWRIGHT_BROWSERS_PATH. Pozostaw puste, aby użyć wartości domyślnej Playwright.
playwright_args.label = Argumenty przeglądarki Playwright
playwright_args.description = Opcjonalne argumenty uruchomieniowe Chromium/Playwright rozdzielone przecinkami.
default_width.label = Domyślna szerokość widoku
default_width.description = Domyślna szerokość widoku przeglądarki w pikselach.
default_height.label = Domyślna wysokość widoku
default_height.description = Domyślna wysokość widoku przeglądarki w pikselach.
auto_open_split.label = Automatycznie otwieraj przeglądarkę w podzielonym widoku
auto_open_split.description = Przy pierwszym otwarciu przeglądarki przez agenta w danej sesji utwórz lub uaktywnij kartę Canvas w drugiej kolumnie i pokaż podzielony widok. Po ręcznym ukryciu nie wymuszaj go ponownie w tej sesji.
annotation_prompt.label = Udostępniaj adnotacje użytkownika modelowi
annotation_prompt.description = Dołącza oczekujące adnotacje przeglądarki/kanwy do systemowego prompta środowiska.
max_annotations.label = Maksymalna liczba adnotacji
max_annotations.description = Maksymalna liczba adnotacji przechowywanych w bieżącej sesji przeglądarki.
console_limit.label = Limit logu konsoli
console_limit.description = Maksymalna liczba wpisów konsoli przeglądarki przechowywanych w pamięci.
cmd.canvas_open.label = Włącz: canvas_open
cmd.canvas_open.description = Otwiera lub nawiguje trwałe środowisko kanwy/przeglądarki. Domyślnie używany jest QWebEngine; Playwright tylko po włączeniu w ustawieniach plugina.
cmd.canvas_change_resolution.label = Włącz: canvas_change_resolution
cmd.canvas_change_resolution.description = Zmienia rozmiar i orientację widoku kanwy/przeglądarki.
cmd.canvas_set_html.label = Włącz: canvas_set_html
cmd.canvas_set_html.description = Renderuje dowolny HTML/CSS/JavaScript w trwałym środowisku kanwy/przeglądarki.
cmd.canvas_get_html.label = Włącz: canvas_get_html
cmd.canvas_get_html.description = Pobiera bieżący URL kanwy/przeglądarki i zserializowany dokument HTML.
cmd.canvas_current.label = Włącz: canvas_current
cmd.canvas_current.description = Pobiera bieżący stan sesji kanwy/przeglądarki.
cmd.canvas_close.label = Włącz: canvas_close
cmd.canvas_close.description = Zamyka widoczną kartę kanwy w PyGPT bez niszczenia działającej w tle sesji przeglądarki.
cmd.canvas_prev.label = Włącz: canvas_prev
cmd.canvas_prev.description = Przechodzi wstecz w historii kanwy/przeglądarki.
cmd.canvas_next.label = Włącz: canvas_next
cmd.canvas_next.description = Przechodzi naprzód w historii kanwy/przeglądarki.
cmd.canvas_reload.label = Włącz: canvas_reload
cmd.canvas_reload.description = Przeładowuje bieżący dokument kanwy/przeglądarki.
cmd.canvas_screenshot.label = Włącz: canvas_screenshot
cmd.canvas_screenshot.description = Wykonuje zrzut bieżącego widoku kanwy/przeglądarki wraz z wirtualnym kursorem modelu.
cmd.canvas_inspect.label = Włącz: canvas_inspect
cmd.canvas_inspect.description = Analizuje widoczne i interaktywne elementy DOM w kanwie/przeglądarce oraz zwraca stabilne selektory i granice elementów.
cmd.canvas_click.label = Włącz: canvas_click
cmd.canvas_click.description = Klika element lub współrzędne widoku wyłącznie wewnątrz kanwy/przeglądarki.
cmd.canvas_hover.label = Włącz: canvas_hover
cmd.canvas_hover.description = Przesuwa wirtualny kursor modelu i wykonuje najechanie wewnątrz kanwy/przeglądarki.
cmd.canvas_type.label = Włącz: canvas_type
cmd.canvas_type.description = Ustawia fokus na edytowalnym elemencie i wpisuje tekst w kanwie/przeglądarce.
cmd.canvas_key.label = Włącz: canvas_key
cmd.canvas_key.description = Wysyła klawisz lub skrót klawiaturowy wyłącznie do kanwy/przeglądarki.
cmd.canvas_scroll.label = Włącz: canvas_scroll
cmd.canvas_scroll.description = Przewija widok kanwy/przeglądarki.
cmd.canvas_drag.label = Włącz: canvas_drag
cmd.canvas_drag.description = Przeciąga między dwoma punktami widoku kanwy/przeglądarki.
cmd.canvas_wait.label = Włącz: canvas_wait
cmd.canvas_wait.description = Czeka na selektor lub przez krótki czas w środowisku kanwy/przeglądarki.
cmd.canvas_eval.label = Włącz: canvas_eval
cmd.canvas_eval.description = Wykonuje JavaScript w bieżącej stronie kanwy/przeglądarki.
cmd.canvas_select.label = Włącz: canvas_select
cmd.canvas_select.description = Wybiera opcję w elemencie select w kanwie/przeglądarce.
cmd.canvas_check.label = Włącz: canvas_check
cmd.canvas_check.description = Ustawia stan pola wyboru lub przycisku radiowego w kanwie/przeglądarce.
cmd.canvas_upload.label = Włącz: canvas_upload
cmd.canvas_upload.description = Przesyła zweryfikowany pod kątem bezpieczeństwa plik hosta przez pole pliku Playwright w kanwie/przeglądarce.
cmd.canvas_console.label = Włącz: canvas_console
cmd.canvas_console.description = Pobiera ostatnie komunikaty konsoli JavaScript i błędy strony z kanwy/przeglądarki.
cmd.canvas_annotations.label = Włącz: canvas_annotations
cmd.canvas_annotations.description = Pobiera adnotacje użytkownika pozostawione w bieżącej sesji kanwy/przeglądarki.
cmd.canvas_clear_annotations.label = Włącz: canvas_clear_annotations
cmd.canvas_clear_annotations.description = Czyści adnotacje kanwy/przeglądarki.
cmd.web_server_start.label = Włącz: web_server_start
cmd.web_server_start.description = Uruchamia lokalny statyczny serwer podglądu tylko na loopbacku dla wybranego katalogu roboczego.
cmd.web_server_current.label = Włącz: web_server_current
cmd.web_server_current.description = Pobiera bieżący stan serwera podglądu.
cmd.web_server_stop.label = Włącz: web_server_stop
cmd.web_server_stop.description = Zatrzymuje serwer podglądu.
ui.back = Wstecz
ui.next = Dalej
ui.reload = Przeładuj
ui.open_url = Otwórz URL
ui.address_placeholder = Wpisz URL lub lokalną ścieżkę i naciśnij Enter
ui.copy = Kopiuj
ui.select_all = Zaznacz wszystko
ui.annotate_selection = Dodaj adnotację do zaznaczenia dla AI…
ui.annotate_element = Dodaj adnotację do elementu dla AI…
ui.annotation_title = Adnotacja dla AI
ui.annotation_selection_prompt = Komentarz / instrukcja do zaznaczonej treści:
ui.annotation_element_prompt = Komentarz / instrukcja dla tego elementu:
ui.annotation_added = Dodano adnotację kanwy/przeglądarki dla AI
ui.annotation_removed = Usunięto adnotację kanwy/przeglądarki
ui.show_source = Pokaż źródło
ui.back_to_canvas = Wróć do Kanwy / HTML
ui.cancel = Anuluj
ui.add = Dodaj
ui.remove_annotation = Usuń adnotację
