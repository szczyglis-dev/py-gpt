[LOCALE]
plugin.name = Интерпретатор на Python
sandbox.label = Sandbox
sandbox.description = Изключено: стартира Python/IPython директно на хоста (небезопасно). Вградено: стартира отделна CPython/IPython среда, управлявана от uv, в отделен процес, но не ограничава достъпа до файловата система на хоста. Docker: изисква инсталиран и работещ Docker и осигурява най-силна изолация; това е най-безопасната опция. Белият/черният списък се прилага към специалните инструменти за системни команди на хоста, във вградения sandbox и в Docker.

