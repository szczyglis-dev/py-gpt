[LOCALE]
plugin.name = Интерпретатор на Python
sandbox.label = Sandbox
sandbox.description = Изключено: изпълнява Python/IPython директно на хоста (небезопасно). Вграден sandbox: изпълнява вградена CPython/IPython среда, управлявана от uv, с изолация на ниво ОС, когато е налична (средно ниво на сигурност). Docker: изисква инсталиран и работещ Docker и осигурява най-силната изолация; това е най-безопасната опция.
