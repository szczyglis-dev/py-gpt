plugin.name = Interpret Pythonu
sandbox.label = Sandbox
sandbox.description = Vypnuté: spúšťa Python/IPython priamo na hostiteľovi (nebezpečné). Vstavaný sandbox: spúšťa vstavané prostredie CPython/IPython spravované pomocou uv s izoláciou na úrovni OS, ak je dostupná (stredná úroveň zabezpečenia). Docker: vyžaduje nainštalovaný a spustený Docker a poskytuje najsilnejšiu izoláciu; je to najbezpečnejšia možnosť.
