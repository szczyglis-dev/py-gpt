[LOCALE]
sandbox.label = Sandbox
sandbox.description = Изключено: изпълнява системните команди директно на хоста (небезопасно). Вграден sandbox: изпълнява командите във вградена CPython среда, управлявана от uv, с изолация на ниво ОС, когато е налична (средно ниво на сигурност). Docker: изисква инсталиран и работещ Docker и осигурява най-силната изолация; това е най-безопасната опция.
