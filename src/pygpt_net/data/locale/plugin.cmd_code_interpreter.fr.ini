[LOCALE]
attach_output.description = Attacher la saisie/sortie à la fenêtre de l'interpréteur de code Python.
attach_output.label = Se connecter à la fenêtre de l'interpréteur de code Python
output_max_entries.description = Nombre maximal de blocs d’entrée/sortie conservés dans la fenêtre de l’interpréteur de code Python. Définissez 0 pour désactiver la limite.
output_max_entries.label = Nombre maximal d’entrées dans la fenêtre de l’interpréteur
auto_cwd.description = Append automatiquement le répertoire de travail courant à la commande sys_exec.
auto_cwd.label = Append automatique de CWD à sys_exec
cmd.clear_python_output.description = Cela permet d'effacer la sortie de la fenêtre de l’interpréteur de code Python.
cmd.clear_python_output.label = Activer : clear_python_output
cmd.code_execute_all.description = Cela permet l'exécution de la totalité du code Python dans la fenêtre de l'interpréteur.
cmd.code_execute_all.label = Activer : Génération et exécution du code Python
cmd.code_execute.description = Cela permet l'exécution de code Python (générer et exécuter à partir d'un fichier).
cmd.code_execute_file.description = Cela permet l'exécution de code Python à partir d'un fichier .py existant.
cmd.code_execute_file.label = Activer : Exécution du code Python (à partir d'un fichier)
cmd.code_execute.label = Activer : Génération et exécution du code Python
cmd.get_python_input.description = Cela permet de récupérer la totalité du code saisi (de la section d'édition) de la fenêtre de l'interpréteur de code Python.
cmd.get_python_input.label = Activer : get_python_input
cmd.get_python_output.description = Cela permet de récupérer la sortie de la fenêtre de l'interpréteur de code Python.
cmd.get_python_output.label = Activer : get_python_output
cmd.ipython_sys_exec.description = Lorsqu’elle est activée, elle permet d’exécuter des commandes système/shell dans le même environnement que l’IPython de Code Interpreter (dans le conteneur Docker IPython en mode sandbox, sinon sur l’hôte).
cmd.ipython_sys_exec.label = Activer : exécuter une commande système IPython
cmd.python_sys_exec.description = Lorsqu’elle est activée, elle permet d’exécuter des commandes système/shell dans le même environnement que l’interpréteur de code Python hérité (dans son conteneur Docker en mode sandbox, sinon sur l’hôte).
cmd.python_sys_exec.label = Activer : exécuter une commande système Python héritée
cmd.sys_exec.description = Cela fournit l'exécution des commandes système.
cmd.sys_exec.label = Activer : exécution de commande système
docker_entrypoint.description = Commande à exécuter lors du démarrage du conteneur
docker_entrypoint.label = Docker Entrypoint
docker_ports.description = Mappage des ports Docker : docker <> hôte. Vous pouvez définir le protocole (dans la clé DOCKER) avec 8888/tcp ou laisser la partie protocole vide pour utiliser le protocole par défaut (TCP)
docker_ports.label = Docker Ports
docker_volumes.description = Mappage des volumes Docker : docker <> hôte, {workdir} - espace réservé pour le répertoire de travail actuel sur la machine hôte. Le mode r/w sera utilisé.
docker_volumes.label = Docker Volumes
plugin.description = Fournit l'exécution du code Python
plugin.name = Interpréteur de code (v2)
python_cmd_tpl.description = Modèle de commande Python à exécuter, utilisez {filename} comme espace réservé pour le nom de fichier.
python_cmd_tpl.label = Modèle de commande Python
sandbox_docker.description = Exécute des commandes et du code dans un bac à sable (conteneur Docker). Docker doit être installé et en cours d'exécution.
sandbox_docker_image.description = Image Docker à utiliser pour le bac à sable.
sandbox_docker_image.label = Image Docker
sandbox_docker.label = Bac à sable (conteneur Docker)
docker_run_as_root.label = Exécuter en tant que root
docker_run_as_root.description = Exécute le bac à sable Docker Python en tant que root. Lorsque cette option est désactivée, l’image de bac à sable par défaut s’exécute avec l’utilisateur non privilégié 'pygpt' et sudo sans mot de passe peut être utilisé pour les commandes nécessitant les privilèges root.
ipython_run_as_root.label = Exécuter en tant que root
ipython_run_as_root.description = Exécute le bac à sable Docker IPython en tant que root. Lorsque cette option est désactivée, l’image de bac à sable par défaut s’exécute avec l’utilisateur non privilégié 'pygpt' et sudo sans mot de passe peut être utilisé pour les commandes nécessitant les privilèges root.

cmd.ipython_execute.description = Exécuter du code Python dans le noyau IPython actuel.
cmd.ipython_kernel_restart.description = Redémarrer le noyau IPython.
cmd.render_html_output.description = Afficher du HTML/JS dans HTML Canvas.
cmd.get_html_output.description = Récupérer la sortie actuelle de HTML Canvas.
