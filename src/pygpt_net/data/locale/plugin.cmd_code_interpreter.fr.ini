cmd.python_exec.label = Activer : Exécuter du code Python
cmd.ipython_sys_exec.description = Lorsqu’elle est activée, elle permet d’exécuter des commandes système/shell dans le même environnement que l’interpréteur IPython (dans le conteneur Docker IPython en mode sandbox, sinon sur l’hôte). La liste blanche/noire s’applique aux outils dédiés de commandes système sur l’hôte, dans le sandbox intégré et dans Docker.
cmd.ipython_sys_exec.label = Activer : exécuter une commande système IPython
cmd.python_sys_exec.description = Lorsqu’elle est activée, elle permet d’exécuter des commandes système/shell dans le même environnement que l’interpréteur Python hérité (dans son conteneur Docker en mode sandbox, sinon sur l’hôte). La liste blanche/noire s’applique aux outils dédiés de commandes système sur l’hôte, dans le sandbox intégré et dans Docker.
cmd.python_sys_exec.label = Activer : exécuter une commande système Python héritée
cmd.sys_exec.description = Cela fournit l'exécution des commandes système. La liste blanche/noire s’applique aux outils dédiés de commandes système sur l’hôte, dans le sandbox intégré et dans Docker.
cmd.sys_exec.label = Activer : exécution de commande système
docker_entrypoint.description = Commande à exécuter lors du démarrage du conteneur
docker_entrypoint.label = Docker Entrypoint
docker_ports.description = Mappage des ports Docker : docker <> hôte. Vous pouvez définir le protocole (dans la clé DOCKER) avec 8888/tcp ou laisser la partie protocole vide pour utiliser le protocole par défaut (TCP)
docker_ports.label = Docker Ports
docker_volumes.description = Mappage des volumes Docker : docker <> hôte, {workdir} - espace réservé pour le répertoire de travail actuel sur la machine hôte. Le mode r/w sera utilisé.
docker_volumes.label = Docker Volumes
plugin.description = Fournit l'exécution du code Python
