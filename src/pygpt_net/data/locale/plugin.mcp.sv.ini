[LOCALE]
plugin.description = Ger åtkomst till fjärrverktyg via Model Context Protocol (MCP), inklusive stdio, SSE och Streamable HTTP, med tillåt/blockera-filter per server, stöd för Authorization-header och verktygscache.
plugin.name = MCP
servers.description = Konfigurera MCP-servrar. Transporter som stöds: 'stdio: <command ...>' för stdio, 'http(s)://...' för Streamable HTTP och 'http(s)://.../sse' (eller 'sse://', 'sse+http(s)://') för SSE. Använd 'label' som kort servernamn, 'authorization' för Authorization-header vid HTTP/SSE, 'allowed_commands' (kommaseparerat) för att endast tillåta vissa verktyg och 'disabled_commands' för att blockera verktyg från servern.
servers.label = MCP-servrar
servers.tooltip = Kräver MCP Python SDK. Installera: pip install "mcp[cli]"
tools_cache_enabled.description = Aktiverar en minnescache för upptäckta verktyg så att de inte behöver upptäckas på nytt vid varje förfrågan.
tools_cache_enabled.label = Cacha verktygslistan
tools_cache_enabled.tooltip = När detta är aktiverat cachas resultaten av verktygsupptäckten per server under TTL-tiden.
tools_cache_ttl.description = Livslängd för verktygscachen per server.
tools_cache_ttl.label = Cache-TTL (sekunder)
tools_cache_ttl.tooltip = Ange 0 för att inaktivera TTL (rekommenderas inte).
