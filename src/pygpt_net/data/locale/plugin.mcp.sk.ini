[LOCALE]
plugin.description = Poskytuje prístup k vzdialeným nástrojom cez Model Context Protocol (MCP), vrátane prenosov stdio, SSE a Streamable HTTP, s filtrami povolenia/zakázania pre jednotlivé servery, podporou hlavičky Authorization a vyrovnávacou pamäťou nástrojov.
plugin.name = MCP
servers.description = Nastavte MCP servery. Podporované prenosy: 'stdio: <command ...>' pre stdio, 'http(s)://...' pre Streamable HTTP a 'http(s)://.../sse' (alebo 'sse://', 'sse+http(s)://') pre SSE. 'label' použite ako krátky názov servera, 'authorization' pre hlavičku Authorization pri HTTP/SSE, 'allowed_commands' (oddelené čiarkami) ako zoznam povolených nástrojov a 'disabled_commands' na blokovanie nástrojov servera.
servers.label = MCP servery
servers.tooltip = Vyžaduje MCP Python SDK. Inštalácia: pip install "mcp[cli]"
tools_cache_enabled.description = Zapne vyrovnávaciu pamäť objavených nástrojov, aby sa nemuseli znova zisťovať pri každej požiadavke.
tools_cache_enabled.label = Ukladať zoznam nástrojov do vyrovnávacej pamäte
tools_cache_enabled.tooltip = Ak je zapnuté, výsledky zisťovania nástrojov sa ukladajú pre každý server počas doby TTL.
tools_cache_ttl.description = Doba platnosti vyrovnávacej pamäte nástrojov pre každý server.
tools_cache_ttl.label = TTL vyrovnávacej pamäte (sekundy)
tools_cache_ttl.tooltip = Nastavte 0 na vypnutie TTL (neodporúča sa).
