[LOCALE]
sandbox.label = Sandbox
sandbox.description = Deaktiveret: kører systemkommandoer direkte på værten (usikkert). Indbygget sandbox: kører kommandoer i et indbygget uv-administreret CPython-miljø med OS-niveau-isolering, hvor det er tilgængeligt (middel sikkerhed). Docker: kræver, at Docker er installeret og kører, og giver den stærkeste isolation; det er den sikreste mulighed.
