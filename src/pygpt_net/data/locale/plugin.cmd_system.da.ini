[LOCALE]
sandbox.label = Sandbox
sandbox.description = Deaktiveret: kører systemkommandoer direkte på værten (usikkert). Indbygget: kører kommandoer i et dedikeret uv-administreret CPython-miljø i en separat proces, men begrænser ikke adgangen til værtens filsystem. Docker: kræver, at Docker er installeret og kører, og giver den stærkeste isolation; det er den sikreste mulighed.

