plugin.description = Activa el modo autónomo en cualquier modo de chat. ADVERTENCIA: úsalo con precaución; junto con otros plugins puede producir resultados inesperados.
plugin.name = Modo autónomo
prompts.description = Prompt utilizado para instruir cómo manejar el modo autónomo; puedes crear tantos prompts como quieras. El primer prompt activo de la lista se utilizará para manejar el modo autónomo. INFO: ¡Se requiere al menos un prompt activo!
prompts.label = Prompts
prompts.tooltip = Prompts utilizados para instruir cómo manejar el modo autónomo.
reverse_roles.description = Si está habilitado, los roles se invertirán entre iteraciones (solo en modo de Completación).
