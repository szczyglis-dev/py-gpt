[LOCALE]
auto_attach.description = Hängt den aktiven globalen oder projektbezogenen Speicher automatisch an den System-Prompt jedes Gesprächs an.
auto_attach.label = Speicher automatisch an jedes Gespräch anhängen
auto_attach.tooltip = Hängt den aktiven globalen oder projektbezogenen Speicher automatisch an den System-Prompt jedes Gesprächs an.
auto_attach_project.description = Hängt den Speicher automatisch an den System-Prompt an, wenn das aktuelle Gespräch zu einem Projekt gehört.
auto_attach_project.label = Speicher nur in Projekten automatisch anhängen
auto_attach_project.tooltip = Hängt den Speicher automatisch an den System-Prompt an, wenn das aktuelle Gespräch zu einem Projekt gehört.
cmd.memory_add.description = Nur sehr wichtige, dauerhafte Informationen zum aktuellen globalen oder projektbezogenen Speicher hinzufügen. Dieses Tool sparsam verwenden; keine routinemäßigen, temporären oder geringwertigen Details speichern.
cmd.memory_add.label = Zum Speicher hinzufügen
cmd.memory_add.tooltip = Nur wichtige dauerhafte Informationen hinzufügen. memory_add sparsam verwenden.
cmd.memory_clear.description = Löscht den Speicher des aktuellen Bereichs. Das Modell muss zuerst ausdrücklich um Bestätigung bitten und dieses Werkzeug erst nach der Bestätigung aufrufen.
cmd.memory_clear.label = Speicher löschen
cmd.memory_clear.tooltip = Löscht den Speicher des aktuellen Bereichs. Das Modell muss zuerst ausdrücklich um Bestätigung bitten und dieses Werkzeug erst nach der Bestätigung aufrufen.
cmd.memory_get.description = Liest den vollständigen Speicher für den aktuellen globalen oder projektbezogenen Bereich.
cmd.memory_get.label = Speicher lesen
cmd.memory_get.tooltip = Liest den vollständigen Speicher für den aktuellen globalen oder projektbezogenen Bereich.
cmd.memory_update.description = Ersetzt den vollständigen Speicherinhalt des aktuellen globalen oder projektbezogenen Bereichs.
cmd.memory_update.label = Speicher aktualisieren
cmd.memory_update.tooltip = Ersetzt den vollständigen Speicherinhalt des aktuellen globalen oder projektbezogenen Bereichs.
max_chars.description = Zielwert für die maximale Speichergröße in Zeichen. Das Modell soll innerhalb dieses Limits bleiben; vor dem harten Abschneiden sind zusätzlich 300 Zeichen Sicherheitsreserve erlaubt.
max_chars.label = Maximale Anzahl Speicherzeichen
max_chars.tooltip = Zielgröße des Speichers in Zeichen; vor dem harten Abschneiden gilt eine Sicherheitsreserve von 300 Zeichen.
model_update.description = Modell für automatische Speicheraktualisierungen und optional zum Überarbeiten von memory_add-Vorgängen.
model_update.label = Modell für Speicheraktualisierung
model_update.tooltip = Modell zum Aktualisieren und Überarbeiten des Speichers.
refine_add.description = Gilt nur für manuelle memory_add-Aufrufe. Wenn aktiviert, führt das konfigurierte Speicher-Aktualisierungsmodell die hinzugefügte Information mit dem vorhandenen Speicher zusammen und formuliert sie neu, statt Rohtext anzuhängen. Automatische Speicheraktualisierungen am Kontextende werden unabhängig von dieser Einstellung immer vom Modell überarbeitet.
refine_add.label = Speicher vor dem Hinzufügen überarbeiten
refine_add.tooltip = Manuelle memory_add-Aufrufe mit dem konfigurierten Modell überarbeiten. Automatische Kontext-Speicherupdates werden immer überarbeitet.
key_search_content.label = Search memory key content
key_search_content.description = Also search stored key values/content in memory_key_search. Key names are always searched with LIKE. Disabled by default to avoid scanning stored content.
key_search_content.tooltip = Also search key content in memory_key_search. Disabled by default.
cmd.memory_key_get.description = Read raw database-backed memory records by one key or a list of keys from the current global or project scope.
cmd.memory_key_get.label = Read keyed memory
cmd.memory_key_get.tooltip = Read raw keyed memory records from the current global or project scope.
cmd.memory_key_add.description = Store a new raw database value by key for later use in the current global or project scope. Use only for truly important data; existing keys are not overwritten.
cmd.memory_key_add.label = Add keyed memory
cmd.memory_key_add.tooltip = Store a new raw value by key. Use only for truly important data.
cmd.memory_key_append.description = Append raw content exactly as provided to an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_append.label = Append keyed memory
cmd.memory_key_append.tooltip = Append raw content to an existing key without LLM processing.
cmd.memory_key_update.description = Replace the raw content of an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_update.label = Update keyed memory
cmd.memory_key_update.tooltip = Replace raw content for an existing key without LLM processing.
cmd.memory_key_list.description = List only the stored memory key names for the current global or project scope, without content.
cmd.memory_key_list.label = List memory keys
cmd.memory_key_list.tooltip = List memory key names without content.
cmd.memory_key_search.description = Search keyed memory with LIKE matching on key names. Content is searched only when the Search memory key content option is enabled.
cmd.memory_key_search.label = Search memory keys
cmd.memory_key_search.tooltip = Search key names with LIKE and optionally search stored content.
cmd.memory_key_remove.description = Remove one database-backed memory key or a list of keys from the current global or project scope.
cmd.memory_key_remove.label = Remove memory keys
cmd.memory_key_remove.tooltip = Remove one or more stored memory keys from the current scope.
plugin.description = Stellt einen globalen und projektbezogenen Langzeitspeicher in der lokalen Datenbank bereit.
plugin.name = Memory (inline)
