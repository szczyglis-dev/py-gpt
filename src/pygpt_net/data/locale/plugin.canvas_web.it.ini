[LOCALE]
plugin.name = Tela (inline)
plugin.description = BETA. Fornisce un ambiente interno tela/browser per HTML e JavaScript, prototipazione di siti, interazione limitata al browser, automazione Playwright, annotazioni e un server leggero di anteprima. Questa funzionalità verrà ampliata nelle versioni future.
use_sandbox.label = Usa sandbox (Playwright)
use_sandbox.description = Abilita il backend browser Playwright isolato. Se disabilitato, Canvas usa il browser QWebEngine integrato e non avvia Playwright.
playwright_engine.label = Motore Playwright
playwright_engine.description = Motore del browser usato dal backend Playwright isolato.
playwright_path.label = Directory dei browser Playwright
playwright_path.description = PLAYWRIGHT_BROWSERS_PATH opzionale. Lascia vuoto per usare il valore predefinito di Playwright.
playwright_args.label = Argomenti browser Playwright
playwright_args.description = Argomenti di avvio opzionali per Chromium/Playwright separati da virgole.
default_width.label = Larghezza viewport predefinita
default_width.description = Larghezza predefinita della viewport del browser in pixel.
default_height.label = Altezza viewport predefinita
default_height.description = Altezza predefinita della viewport del browser in pixel.
auto_open_split.label = Apri automaticamente il browser in schermo diviso
auto_open_split.description = Alla prima apertura del browser da parte di un agente nella sessione, crea o attiva la scheda Canvas nella seconda colonna e mostra lo schermo diviso. Se l’utente lo chiude, non forzarlo di nuovo nella stessa sessione.
annotation_prompt.label = Mostra le annotazioni utente al modello
annotation_prompt.description = Aggiunge le annotazioni in attesa di browser/tela al prompt di sistema del runtime.
max_annotations.label = Numero massimo di annotazioni
max_annotations.description = Numero massimo di annotazioni conservate nella sessione browser corrente.
console_limit.label = Limite log console
console_limit.description = Numero massimo di voci della console del browser conservate in memoria.
cmd.canvas_open.label = Abilita: canvas_open
cmd.canvas_open.description = Apre o naviga nel runtime persistente tela/browser. QWebEngine è usato per impostazione predefinita; Playwright solo se abilitato nelle impostazioni del plugin.
cmd.canvas_change_resolution.label = Abilita: canvas_change_resolution
cmd.canvas_change_resolution.description = Cambia dimensioni e orientamento della viewport tela/browser.
cmd.canvas_set_html.label = Abilita: canvas_set_html
cmd.canvas_set_html.description = Renderizza HTML/CSS/JavaScript arbitrario nel runtime persistente tela/browser.
cmd.canvas_get_html.label = Abilita: canvas_get_html
cmd.canvas_get_html.description = Ottiene l’URL corrente della tela/browser e il documento HTML serializzato.
cmd.canvas_current.label = Abilita: canvas_current
cmd.canvas_current.description = Ottiene lo stato corrente della sessione tela/browser.
cmd.canvas_close.label = Abilita: canvas_close
cmd.canvas_close.description = Chiude la scheda visibile della tela in PyGPT senza distruggere la sessione browser in background.
cmd.canvas_prev.label = Abilita: canvas_prev
cmd.canvas_prev.description = Torna indietro nella cronologia tela/browser.
cmd.canvas_next.label = Abilita: canvas_next
cmd.canvas_next.description = Avanza nella cronologia tela/browser.
cmd.canvas_reload.label = Abilita: canvas_reload
cmd.canvas_reload.description = Ricarica il documento corrente tela/browser.
cmd.canvas_screenshot.label = Abilita: canvas_screenshot
cmd.canvas_screenshot.description = Acquisisce la viewport corrente tela/browser con il cursore virtuale del modello.
cmd.canvas_inspect.label = Abilita: canvas_inspect
cmd.canvas_inspect.description = Ispeziona gli elementi DOM visibili/interattivi e restituisce selettori stabili e limiti.
cmd.canvas_click.label = Abilita: canvas_click
cmd.canvas_click.description = Fa clic su un elemento o coordinate solo all’interno della tela/browser.
cmd.canvas_hover.label = Abilita: canvas_hover
cmd.canvas_hover.description = Muove il cursore virtuale del modello ed esegue hover nella tela/browser.
cmd.canvas_type.label = Abilita: canvas_type
cmd.canvas_type.description = Mette a fuoco un elemento modificabile e digita testo nella tela/browser.
cmd.canvas_key.label = Abilita: canvas_key
cmd.canvas_key.description = Invia un tasto o una combinazione solo alla tela/browser.
cmd.canvas_scroll.label = Abilita: canvas_scroll
cmd.canvas_scroll.description = Scorre la viewport tela/browser.
cmd.canvas_drag.label = Abilita: canvas_drag
cmd.canvas_drag.description = Trascina tra due coordinate della viewport nella tela/browser.
cmd.canvas_wait.label = Abilita: canvas_wait
cmd.canvas_wait.description = Attende un selettore o per un breve periodo nel runtime tela/browser.
cmd.canvas_eval.label = Abilita: canvas_eval
cmd.canvas_eval.description = Esegue JavaScript nella pagina corrente tela/browser.
cmd.canvas_select.label = Abilita: canvas_select
cmd.canvas_select.description = Seleziona un’opzione in un elemento select nella tela/browser.
cmd.canvas_check.label = Abilita: canvas_check
cmd.canvas_check.description = Imposta lo stato di una casella di controllo o radio nella tela/browser.
cmd.canvas_upload.label = Abilita: canvas_upload
cmd.canvas_upload.description = Carica un file host convalidato per la sicurezza tramite un input file Playwright nella tela/browser.
cmd.canvas_console.label = Abilita: canvas_console
cmd.canvas_console.description = Ottiene i messaggi recenti della console JavaScript e gli errori pagina della tela/browser.
cmd.canvas_annotations.label = Abilita: canvas_annotations
cmd.canvas_annotations.description = Ottiene le annotazioni utente lasciate nella sessione tela/browser corrente.
cmd.canvas_clear_annotations.label = Abilita: canvas_clear_annotations
cmd.canvas_clear_annotations.description = Cancella le annotazioni tela/browser.
cmd.web_server_start.label = Abilita: web_server_start
cmd.web_server_start.description = Avvia un server statico di anteprima solo loopback per una directory di lavoro selezionata.
cmd.web_server_current.label = Abilita: web_server_current
cmd.web_server_current.description = Ottiene lo stato corrente del server di anteprima.
cmd.web_server_stop.label = Abilita: web_server_stop
cmd.web_server_stop.description = Arresta il server di anteprima.
ui.back = Indietro
ui.next = Avanti
ui.reload = Ricarica
ui.open_url = Apri URL
ui.address_placeholder = Inserisci URL o percorso locale e premi Invio
ui.enable_hint = Abilita il plugin Tela
ui.copy = Copia
ui.select_all = Seleziona tutto
ui.annotate_selection = Annota selezione per l’IA…
ui.annotate_element = Annota elemento per l’IA…
ui.annotation_title = Annota per l’IA
ui.annotation_selection_prompt = Commento / istruzione per il contenuto selezionato:
ui.annotation_element_prompt = Commento / istruzione per questo elemento:
ui.annotation_added = Annotazione tela/browser aggiunta per l’IA
ui.annotation_removed = Annotazione tela/browser rimossa
ui.show_source = Mostra sorgente
ui.back_to_canvas = Torna a Tela / HTML
ui.cancel = Annulla
ui.add = Aggiungi
ui.remove_annotation = Rimuovi annotazione
