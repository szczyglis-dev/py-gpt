[LOCALE]
auto_attach.description = Automaticky připojí aktivní globální nebo projektovou paměť k systémovému promptu každé konverzace.
auto_attach.label = Automaticky připojit paměť ke každé konverzaci
auto_attach.tooltip = Automaticky připojí aktivní globální nebo projektovou paměť k systémovému promptu každé konverzace.
auto_attach_project.description = Automaticky připojí paměť k systémovému promptu, pokud aktuální konverzace patří do projektu.
auto_attach_project.label = Automaticky připojit paměť pouze v projektech
auto_attach_project.tooltip = Automaticky připojí paměť k systémovému promptu, pokud aktuální konverzace patří do projektu.
cmd.memory_add.description = Přidávejte jen velmi důležité a trvalé informace do aktuální globální nebo projektové paměti. Tento nástroj používejte střídmě; neukládejte rutinní, dočasné ani málo hodnotné detaily.
cmd.memory_add.label = Přidat do paměti
cmd.memory_add.tooltip = Přidávejte jen důležité trvalé informace. memory_add používejte střídmě.
cmd.memory_clear.description = Vymaže paměť aktuálního rozsahu. Model musí nejprve požádat uživatele o výslovné potvrzení a tento nástroj zavolat až poté.
cmd.memory_clear.label = Vymazat paměť
cmd.memory_clear.tooltip = Vymaže paměť aktuálního rozsahu. Model musí nejprve požádat uživatele o výslovné potvrzení a tento nástroj zavolat až poté.
cmd.memory_get.description = Načte celou paměť pro aktuální globální nebo projektový rozsah.
cmd.memory_get.label = Načíst paměť
cmd.memory_get.tooltip = Načte celou paměť pro aktuální globální nebo projektový rozsah.
cmd.memory_update.description = Nahradí celý obsah paměti aktuálního globálního nebo projektového rozsahu.
cmd.memory_update.label = Aktualizovat paměť
cmd.memory_update.tooltip = Nahradí celý obsah paměti aktuálního globálního nebo projektového rozsahu.
max_chars.description = Cílová maximální velikost paměti ve znacích. Model má zůstat v tomto limitu; před tvrdým oříznutím je povolena dodatečná bezpečnostní rezerva 300 znaků.
max_chars.label = Maximální počet znaků paměti
max_chars.tooltip = Cílová velikost paměti ve znacích; před tvrdým oříznutím je povolena bezpečnostní rezerva 300 znaků.
model_update.description = Model používaný pro automatické aktualizace paměti a volitelně pro úpravu operací memory_add.
model_update.label = Model aktualizace paměti
model_update.tooltip = Model používaný k aktualizaci a úpravě paměti.
refine_add.description = Platí pouze pro ruční volání memory_add. Je-li zapnuto, nakonfigurovaný model aktualizace paměti sloučí a přeformuluje přidávanou informaci do stávající paměti místo prostého připojení surového textu. Automatické aktualizace paměti na konci kontextu model vždy přepracuje bez ohledu na toto nastavení.
refine_add.label = Upravit paměť před přidáním
refine_add.tooltip = Přepracuje ruční volání memory_add nakonfigurovaným modelem. Automatické aktualizace paměti se vždy přepracují.
plugin.description = Poskytuje globální a projektovou dlouhodobou paměť uloženou v místní databázi.
plugin.name = Memory (inline)
