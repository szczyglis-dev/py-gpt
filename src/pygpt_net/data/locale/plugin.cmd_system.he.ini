sandbox.description = מושבת: מפעיל פקודות מערכת ישירות על המארח (לא בטוח). ארגז חול מובנה: מפעיל פקודות בסביבת CPython מובנית המנוהלת על ידי uv עם בידוד ברמת מערכת ההפעלה כאשר הוא זמין (רמת אבטחה בינונית). Docker: דורש ש-Docker יהיה מותקן ופועל ומספק את הבידוד החזק ביותר; זו האפשרות הבטוחה ביותר.
