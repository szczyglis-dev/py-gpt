sandbox.description = מושבת: מריץ פקודות מערכת ישירות על המארח (לא בטוח). מובנה: מריץ את הפקודות בסביבת CPython ייעודית המנוהלת ב-uv בתהליך נפרד, אך אינו מגביל גישה למערכת הקבצים של המארח. Docker: דורש ש-Docker יהיה מותקן ופועל ומספק את הבידוד החזק ביותר; זו האפשרות הבטוחה ביותר. רשימת ההרשאה/חסימה חלה על כלי פקודות המערכת הייעודיים במארח, בארגז החול המובנה וב-Docker.

