[LOCALE]
plugin.name = Modo autónomo
plugin.description = Ativa o modo autónomo em qualquer modo de chat. AVISO: use com cuidado; em conjunto com outros plugins pode produzir resultados inesperados.

dynamic_continue.description = Após cada passagem concluída, uma chamada oculta usando o modelo selecionado atua como juiz, analisa a cauda configurada da execução Human/Assistant atual e gera a instrução para a próxima passagem.
dynamic_continue.label = Prompt de continuação dinâmico
dynamic_continue_messages.description = Número das respostas mais recentes do assistente no modo Autônomo incluídas em cada solicitação ao juiz. A entrada original do usuário é sempre incluída. Defina 0 para incluir todas as respostas produzidas desde essa entrada do usuário.
dynamic_continue_messages.label = Respostas para avaliar
