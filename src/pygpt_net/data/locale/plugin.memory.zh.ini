[LOCALE]
auto_attach.description = 自动把当前全局或项目记忆添加到每次对话的系统提示词中。
auto_attach.label = 自动将记忆附加到每次对话
auto_attach.tooltip = 自动把当前全局或项目记忆添加到每次对话的系统提示词中。
auto_attach_project.description = 当当前对话属于某个项目时，自动把记忆添加到系统提示词中。
auto_attach_project.label = 仅在项目中自动附加记忆
auto_attach_project.tooltip = 当当前对话属于某个项目时，自动把记忆添加到系统提示词中。
cmd.memory_add.description = 仅向当前全局或项目记忆添加非常重要且持久的信息。请谨慎使用此工具；不要保存日常、临时或低价值的细节。
cmd.memory_add.label = 添加到记忆
cmd.memory_add.tooltip = 仅添加重要且持久的信息。谨慎使用 memory_add。
cmd.memory_clear.description = 清除当前范围的记忆。模型必须先向用户请求明确确认，并且只能在确认后调用此工具。
cmd.memory_clear.label = 清除记忆
cmd.memory_clear.tooltip = 清除当前范围的记忆。模型必须先向用户请求明确确认，并且只能在确认后调用此工具。
cmd.memory_get.description = 读取当前全局或项目范围的完整记忆。
cmd.memory_get.label = 读取记忆
cmd.memory_get.tooltip = 读取当前全局或项目范围的完整记忆。
cmd.memory_update.description = 替换当前全局或项目范围的全部记忆内容。
cmd.memory_update.label = 更新记忆
cmd.memory_update.tooltip = 替换当前全局或项目范围的全部记忆内容。
max_chars.description = 以字符数表示的记忆目标最大大小。模型会被要求保持在此限制内；在强制截断前额外允许 300 个字符的安全余量。
max_chars.label = 最大记忆字符数
max_chars.tooltip = 以字符数表示的记忆目标大小；强制截断前允许额外 300 个字符的安全余量。
model_update.description = 用于自动更新记忆，并在启用时用于整理 memory_add 操作的模型。
model_update.label = 记忆更新模型
model_update.tooltip = 用于更新和整理记忆的模型。
refine_add.description = 仅适用于手动 memory_add 调用。启用后，已配置的记忆更新模型会将新增信息与现有记忆合并并重写，而不是直接追加原始文本。上下文结束时的自动记忆更新始终会由模型重新整理，不受此设置影响。
refine_add.label = 添加前整理记忆
refine_add.tooltip = 使用已配置模型整理手动 memory_add。自动上下文记忆更新始终会被重新整理。
plugin.description = 提供由本地数据库存储的全局和项目级长期记忆。
plugin.name = Memory (inline)
