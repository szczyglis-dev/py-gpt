[LOCALE]
plugin.name = Lærred og HTML
plugin.description = BETA. Giver et internt lærred-/browsermiljø til HTML og JavaScript, webprototyper, browserafgrænset interaktion, Playwright-automatisering, annotationer og en let preview-server. Funktionen vil blive udvidet i fremtidige versioner.
use_sandbox.label = Brug sandbox (Playwright)
use_sandbox.description = Aktiverer den isolerede Playwright-browserbackend. Når den er slået fra, bruger Lærred og HTML den indbyggede QWebEngine-browser og starter ikke Playwright.
playwright_engine.label = Playwright-motor
playwright_engine.description = Browsermotor brugt af den isolerede Playwright-backend.
playwright_path.label = Playwright-browsermappe
playwright_path.description = Valgfri PLAYWRIGHT_BROWSERS_PATH. Lad feltet være tomt for at bruge Playwright-standarden.
playwright_args.label = Playwright-browserargumenter
playwright_args.description = Valgfrie, kommaseparerede startargumenter til Chromium/Playwright.
default_width.label = Standardbredde for viewport
default_width.description = Standardbredde for browserens viewport i pixels.
default_height.label = Standardhøjde for viewport
default_height.description = Standardhøjde for browserens viewport i pixels.
auto_open_split.label = Åbn automatisk browseren i opdelt visning
auto_open_split.description = Ved første agentstyrede browseråbning i en session oprettes eller fokuseres fanen Lærred og HTML i anden kolonne, og opdelt visning vises. Hvis brugeren senere skjuler den, tvinges den ikke frem igen i samme session.
annotation_prompt.label = Vis brugerannotationer til modellen
annotation_prompt.description = Føjer ventende browser-/lærredannotationer til runtime-systemprompten.
max_annotations.label = Maksimalt antal annotationer
max_annotations.description = Maksimalt antal annotationer, der gemmes i den aktuelle browsersession.
console_limit.label = Grænse for konsollog
console_limit.description = Maksimalt antal browserkonsolposter, der gemmes i hukommelsen.
cmd.canvas_open.label = Aktivér: canvas_open
cmd.canvas_open.description = Åbner eller navigerer i det vedvarende lærred-/browsermiljø. QWebEngine bruges som standard; Playwright kun når det er aktiveret i pluginindstillingerne.
cmd.canvas_change_resolution.label = Aktivér: canvas_change_resolution
cmd.canvas_change_resolution.description = Ændrer størrelse og retning på lærredets/browserens viewport.
cmd.canvas_set_html.label = Aktivér: canvas_set_html
cmd.canvas_set_html.description = Renderer vilkårlig HTML/CSS/JavaScript i det vedvarende lærred-/browsermiljø.
cmd.canvas_get_html.label = Aktivér: canvas_get_html
cmd.canvas_get_html.description = Henter den aktuelle lærred-/browser-URL og det serialiserede HTML-dokument.
cmd.canvas_current.label = Aktivér: canvas_current
cmd.canvas_current.description = Henter den aktuelle sessionsstatus for lærred/browser.
cmd.canvas_close.label = Aktivér: canvas_close
cmd.canvas_close.description = Lukker den synlige lærredfane i PyGPT uden at afslutte browsersessionen i baggrunden.
cmd.canvas_prev.label = Aktivér: canvas_prev
cmd.canvas_prev.description = Går tilbage i lærredets/browserens historik.
cmd.canvas_next.label = Aktivér: canvas_next
cmd.canvas_next.description = Går frem i lærredets/browserens historik.
cmd.canvas_reload.label = Aktivér: canvas_reload
cmd.canvas_reload.description = Genindlæser det aktuelle lærred-/browserdokument.
cmd.canvas_screenshot.label = Aktivér: canvas_screenshot
cmd.canvas_screenshot.description = Tager et billede af den aktuelle lærred-/browserviewport med modellens virtuelle markør.
cmd.canvas_inspect.label = Aktivér: canvas_inspect
cmd.canvas_inspect.description = Inspicerer synlige/interaktive DOM-elementer og returnerer stabile selektorer og grænser.
cmd.canvas_click.label = Aktivér: canvas_click
cmd.canvas_click.description = Klikker på et element eller viewportkoordinater kun inde i lærred/browser.
cmd.canvas_hover.label = Aktivér: canvas_hover
cmd.canvas_hover.description = Flytter modellens virtuelle markør og udfører hover inde i lærred/browser.
cmd.canvas_type.label = Aktivér: canvas_type
cmd.canvas_type.description = Fokuserer et redigerbart element og skriver tekst i lærred/browser.
cmd.canvas_key.label = Aktivér: canvas_key
cmd.canvas_key.description = Sender en tast eller tastekombination kun til lærred/browser.
cmd.canvas_scroll.label = Aktivér: canvas_scroll
cmd.canvas_scroll.description = Ruller lærredets/browserens viewport.
cmd.canvas_drag.label = Aktivér: canvas_drag
cmd.canvas_drag.description = Trækker mellem to viewportkoordinater inde i lærred/browser.
cmd.canvas_wait.label = Aktivér: canvas_wait
cmd.canvas_wait.description = Venter på en selektor eller i kort tid i lærred-/browsermiljøet.
cmd.canvas_eval.label = Aktivér: canvas_eval
cmd.canvas_eval.description = Kører JavaScript på den aktuelle lærred-/browserside.
cmd.canvas_select.label = Aktivér: canvas_select
cmd.canvas_select.description = Vælger en mulighed i et select-element i lærred/browser.
cmd.canvas_check.label = Aktivér: canvas_check
cmd.canvas_check.description = Indstiller tilstanden for et afkrydsningsfelt eller radioknap i lærred/browser.
cmd.canvas_upload.label = Aktivér: canvas_upload
cmd.canvas_upload.description = Uploader en sikkerhedsgodkendt værtsfil via et Playwright-filfelt i lærred/browser.
cmd.canvas_console.label = Aktivér: canvas_console
cmd.canvas_console.description = Henter nylige JavaScript-konsolmeddelelser og sidefejl fra lærred/browser.
cmd.canvas_annotations.label = Aktivér: canvas_annotations
cmd.canvas_annotations.description = Henter brugerannotationer fra den aktuelle lærred-/browsersession.
cmd.canvas_clear_annotations.label = Aktivér: canvas_clear_annotations
cmd.canvas_clear_annotations.description = Rydder lærred-/browserannotationer.
cmd.web_server_start.label = Aktivér: web_server_start
cmd.web_server_start.description = Starter en statisk preview-server kun på loopback for en valgt arbejdsmappe.
cmd.web_server_current.label = Aktivér: web_server_current
cmd.web_server_current.description = Henter den aktuelle status for preview-serveren.
cmd.web_server_stop.label = Aktivér: web_server_stop
cmd.web_server_stop.description = Stopper preview-serveren.
