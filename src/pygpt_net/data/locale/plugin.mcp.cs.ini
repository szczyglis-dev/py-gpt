[LOCALE]
plugin.description = Poskytuje přístup ke vzdáleným nástrojům přes Model Context Protocol (MCP), včetně přenosů stdio, SSE a Streamable HTTP, s filtry povolení/zakázání pro jednotlivé servery, podporou hlavičky Authorization a mezipamětí nástrojů.
plugin.name = MCP
servers.description = Nastavte MCP servery. Podporované přenosy: 'stdio: <command ...>' pro stdio, 'http(s)://...' pro Streamable HTTP a 'http(s)://.../sse' (nebo 'sse://', 'sse+http(s)://') pro SSE. 'label' použijte jako krátký název serveru, 'authorization' pro hlavičku Authorization u HTTP/SSE, 'allowed_commands' (oddělené čárkami) jako seznam povolených nástrojů a 'disabled_commands' jako seznam zakázaných nástrojů.
servers.label = MCP servery
servers.tooltip = Vyžaduje MCP Python SDK. Instalace: pip install "mcp[cli]"
tools_cache_enabled.description = Zapne mezipaměť objevených nástrojů v paměti, aby se nemusely znovu zjišťovat při každém dotazu.
tools_cache_enabled.label = Ukládat seznam nástrojů do mezipaměti
tools_cache_enabled.tooltip = Je-li zapnuto, výsledky zjišťování nástrojů se ukládají do mezipaměti pro každý server po dobu TTL.
tools_cache_ttl.description = Doba platnosti mezipaměti nástrojů pro každý server.
tools_cache_ttl.label = TTL mezipaměti (sekundy)
tools_cache_ttl.tooltip = Nastavte 0 pro vypnutí TTL (nedoporučuje se).
