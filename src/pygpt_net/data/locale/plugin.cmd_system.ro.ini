sandbox.description = Dezactivat: rulează comenzile de sistem direct pe gazdă (nesigur). Sandbox încorporat: rulează comenzile într-un mediu CPython încorporat, gestionat de uv, cu izolare la nivelul sistemului de operare acolo unde este disponibilă (securitate medie). Docker: necesită Docker instalat și pornit și oferă cea mai puternică izolare; este cea mai sigură opțiune.
