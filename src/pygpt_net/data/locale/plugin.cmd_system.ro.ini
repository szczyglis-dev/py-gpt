sandbox.description = Dezactivat: rulează comenzile de sistem direct pe gazdă (nesigur). Integrat: rulează comenzile într-un mediu CPython dedicat, gestionat de uv, într-un proces separat, dar nu restricționează accesul la sistemul de fișiere al gazdei. Docker: necesită Docker instalat și pornit și oferă cea mai puternică izolare; este cea mai sigură opțiune.

