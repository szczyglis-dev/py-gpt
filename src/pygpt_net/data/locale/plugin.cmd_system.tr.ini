sandbox.description = Devre dışı: sistem komutlarını doğrudan ana sistemde çalıştırır (güvenli değil). Yerleşik: komutları uv tarafından yönetilen özel bir CPython ortamında ayrı bir süreçte çalıştırır, ancak ana sistemin dosya sistemine erişimi kısıtlamaz. Docker: Docker’ın kurulu ve çalışır durumda olmasını gerektirir ve en güçlü yalıtımı sağlar; en güvenli seçenektir.

