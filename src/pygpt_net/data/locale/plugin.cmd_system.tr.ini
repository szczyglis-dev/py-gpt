sandbox.label = Korumalı alan
sandbox.description = Devre dışı: sistem komutlarını doğrudan ana sistemde çalıştırır (güvenli değil). Yerleşik korumalı alan: komutları uv tarafından yönetilen yerleşik bir CPython ortamında, kullanılabildiğinde işletim sistemi düzeyinde yalıtımla çalıştırır (orta düzey güvenlik). Docker: Docker'ın kurulu ve çalışıyor olmasını gerektirir ve en güçlü yalıtımı sağlar; en güvenli seçenektir.
