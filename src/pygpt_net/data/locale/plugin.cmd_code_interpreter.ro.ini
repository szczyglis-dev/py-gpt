plugin.name = Interpret Python
sandbox.label = Sandbox
sandbox.description = Dezactivat: rulează Python/IPython direct pe gazdă (nesigur). Integrat: rulează un mediu CPython/IPython dedicat, gestionat de uv, într-un proces separat, dar nu restricționează accesul la sistemul de fișiere al gazdei. Docker: necesită Docker instalat și pornit și oferă cea mai puternică izolare; este cea mai sigură opțiune.

