[LOCALE]
auto_attach.description = Ajoute automatiquement la mémoire globale ou de projet active au prompt système de chaque conversation.
auto_attach.label = Joindre automatiquement la mémoire à chaque conversation
auto_attach.tooltip = Ajoute automatiquement la mémoire globale ou de projet active au prompt système de chaque conversation.
auto_attach_project.description = Ajoute automatiquement la mémoire au prompt système lorsque la conversation actuelle appartient à un projet.
auto_attach_project.label = Joindre automatiquement la mémoire uniquement dans les projets
auto_attach_project.tooltip = Ajoute automatiquement la mémoire au prompt système lorsque la conversation actuelle appartient à un projet.
cmd.memory_add.description = Ajoute uniquement des informations très importantes et durables à la mémoire globale ou de projet actuelle. Utilise cet outil avec parcimonie ; n’enregistre pas les détails routiniers, temporaires ou de faible valeur.
cmd.memory_add.label = Ajouter à la mémoire
cmd.memory_add.tooltip = Ajoute uniquement des informations importantes et durables. Utilise memory_add avec parcimonie.
cmd.memory_clear.description = Efface la mémoire de la portée actuelle. Le modèle doit d’abord demander une confirmation explicite à l’utilisateur et n’appeler cet outil qu’après confirmation.
cmd.memory_clear.label = Effacer la mémoire
cmd.memory_clear.tooltip = Efface la mémoire de la portée actuelle. Le modèle doit d’abord demander une confirmation explicite à l’utilisateur et n’appeler cet outil qu’après confirmation.
cmd.memory_get.description = Lit la mémoire complète pour la portée globale ou de projet actuelle.
cmd.memory_get.label = Lire la mémoire
cmd.memory_get.tooltip = Lit la mémoire complète pour la portée globale ou de projet actuelle.
cmd.memory_update.description = Remplace tout le contenu de la mémoire pour la portée globale ou de projet actuelle.
cmd.memory_update.label = Mettre à jour la mémoire
cmd.memory_update.tooltip = Remplace tout le contenu de la mémoire pour la portée globale ou de projet actuelle.
max_chars.description = Taille maximale cible de la mémoire en caractères. Le modèle doit rester dans cette limite ; 300 caractères supplémentaires de marge de sécurité sont autorisés avant la troncature forcée.
max_chars.label = Nombre maximal de caractères mémoire
max_chars.tooltip = Taille cible de la mémoire en caractères ; une marge de sécurité de 300 caractères est autorisée avant la troncature.
model_update.description = Modèle utilisé pour les mises à jour automatiques de la mémoire et, si activé, pour affiner les opérations memory_add.
model_update.label = Modèle de mise à jour de la mémoire
model_update.tooltip = Modèle utilisé pour mettre à jour et affiner la mémoire.
refine_add.description = S’applique uniquement aux appels manuels à memory_add. Lorsqu’elle est activée, le modèle de mise à jour de mémoire configuré fusionne et reformule l’information ajoutée dans la mémoire existante au lieu d’ajouter du texte brut. Les mises à jour automatiques de mémoire en fin de contexte sont toujours reformulées par le modèle, quel que soit ce réglage.
refine_add.label = Affiner la mémoire avant ajout
refine_add.tooltip = Reformule les appels manuels à memory_add avec le modèle configuré. Les mises à jour automatiques de mémoire sont toujours reformulées.
plugin.description = Fournit une mémoire à long terme globale et par projet stockée dans la base de données locale.
plugin.name = Memory (inline)
