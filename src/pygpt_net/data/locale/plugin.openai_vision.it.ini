[LOCALE]
cmd.camera_capture.description = Abilita l'esecuzione del comando camera_capture.\nSe abilitato, il modello sarà in grado di catturare immagini dalla camera stessa. L'opzione Esegui comandi deve essere abilitata.
cmd.camera_capture.label = Abilita: cattura immagini dalla camera
cmd.camera_capture.tooltip = Esempio di prompt: Cattura l'immagine dalla mia webcam.
cmd.make_screenshot.description = Abilita l'esecuzione del comando make_screenshot.\nSe abilitato, il modello sarà in grado di effettuare screenshot di per sé. L'opzione Esegui comandi deve essere abilitata.
cmd.make_screenshot.label = Abilita: creazione di screenshot
cmd.make_screenshot.tooltip = Esempio di prompt: Fai uno screenshot e descrivi ciò che vedi.
model.description = Modello Chat con supporto immagini usato temporaneamente per l’analisi delle immagini. È possibile usare qualsiasi provider supportato; il valore predefinito è "gpt-4o".
model.label = Modello
plugin.description = Aggiunge l’analisi delle immagini alle modalità chat supportate. Quando viene rilevato contenuto visivo, PyGPT instrada temporaneamente la richiesta attraverso la modalità Chat usando il modello con supporto immagini configurato. È possibile selezionare modelli di qualsiasi provider supportato.
plugin.name = Vision (inline)
prompt.description = Prompt usato per l’analisi immagini inline. Viene aggiunto al prompt di sistema corrente o lo sostituisce durante l’uso temporaneo del modello con supporto immagini in modalità Chat.
prompt.label = Prompt
replace_prompt.description = Sostituisce l’intero prompt di sistema con il prompt di analisi dell’immagine invece di aggiungerlo al prompt corrente.
replace_prompt.label = Sostituisci prompt
