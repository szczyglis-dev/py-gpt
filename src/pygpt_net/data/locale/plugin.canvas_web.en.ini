[LOCALE]
plugin.name = Canvas
plugin.description = BETA. Provides an internal canvas/web browser runtime for HTML, JavaScript, website prototyping, scoped browser computer-use, Playwright sandbox automation, annotations and a lightweight preview server. This feature will be expanded in future releases.
use_sandbox.label = Use sandbox (Playwright)
use_sandbox.description = Enable the isolated Playwright browser backend. When disabled, Canvas uses the built-in QWebEngine browser and does not try to launch Playwright.
playwright_engine.label = Playwright engine
playwright_engine.description = Browser engine used by the isolated Playwright backend.
playwright_path.label = Playwright browsers directory
playwright_path.description = Optional PLAYWRIGHT_BROWSERS_PATH. Leave empty to use the Playwright default.
playwright_args.label = Playwright browser args
playwright_args.description = Optional comma-separated launch arguments for Chromium/Playwright.
default_width.label = Default viewport width
default_width.description = Default browser viewport width in pixels.
default_height.label = Default viewport height
default_height.description = Default browser viewport height in pixels.
auto_open_split.label = Auto-open browser in split screen
auto_open_split.description = On the first agent browser open in an application session, create/focus the Canvas tab in the second column and reveal split screen. If the user later collapses split screen, do not force it open again in that session.
annotation_prompt.label = Expose user annotations to the model
annotation_prompt.description = Append pending browser/canvas annotations to the runtime system prompt.
max_annotations.label = Maximum annotations
max_annotations.description = Maximum annotations retained in the current browser session.
console_limit.label = Console log limit
console_limit.description = Maximum browser console entries retained in memory.
cmd.canvas_open.label = Enable: canvas_open
cmd.canvas_open.description = Open or navigate the persistent canvas/web browser. QWebEngine is used by default; Playwright is used only when enabled in plugin settings.
cmd.canvas_change_resolution.label = Enable: canvas_change_resolution
cmd.canvas_change_resolution.description = Change the canvas/web browser viewport size and orientation.
cmd.canvas_set_html.label = Enable: canvas_set_html
cmd.canvas_set_html.description = Render arbitrary HTML/CSS/JavaScript in the persistent canvas/web browser runtime.
cmd.canvas_get_html.label = Enable: canvas_get_html
cmd.canvas_get_html.description = Get the current canvas/web browser URL and serialized HTML document.
cmd.canvas_current.label = Enable: canvas_current
cmd.canvas_current.description = Get current canvas/web browser session state.
cmd.canvas_close.label = Enable: canvas_close
cmd.canvas_close.description = Close the canvas tab in the PyGPT application without destroying the background canvas/web browser runtime.
cmd.canvas_prev.label = Enable: canvas_prev
cmd.canvas_prev.description = Go back in canvas/web browser history.
cmd.canvas_next.label = Enable: canvas_next
cmd.canvas_next.description = Go forward in canvas/web browser history.
cmd.canvas_reload.label = Enable: canvas_reload
cmd.canvas_reload.description = Reload the current canvas/web browser document.
cmd.canvas_screenshot.label = Enable: canvas_screenshot
cmd.canvas_screenshot.description = Capture the current canvas/web browser viewport with the model virtual cursor.
cmd.canvas_inspect.label = Enable: canvas_inspect
cmd.canvas_inspect.description = Inspect visible/interactive DOM elements in the canvas/web browser and return stable selectors and bounds.
cmd.canvas_click.label = Enable: canvas_click
cmd.canvas_click.description = Click an element or viewport coordinate inside the canvas/web browser only.
cmd.canvas_hover.label = Enable: canvas_hover
cmd.canvas_hover.description = Move the model virtual cursor and hover inside the canvas/web browser.
cmd.canvas_type.label = Enable: canvas_type
cmd.canvas_type.description = Focus an editable element and type text in the canvas/web browser.
cmd.canvas_key.label = Enable: canvas_key
cmd.canvas_key.description = Send a keyboard key or chord to the canvas/web browser only.
cmd.canvas_scroll.label = Enable: canvas_scroll
cmd.canvas_scroll.description = Scroll the canvas/web browser viewport.
cmd.canvas_drag.label = Enable: canvas_drag
cmd.canvas_drag.description = Drag between two canvas/web browser viewport coordinates.
cmd.canvas_wait.label = Enable: canvas_wait
cmd.canvas_wait.description = Wait for a selector or a short duration in the canvas/web browser runtime.
cmd.canvas_eval.label = Enable: canvas_eval
cmd.canvas_eval.description = Evaluate JavaScript scoped to the current canvas/web browser page.
cmd.canvas_select.label = Enable: canvas_select
cmd.canvas_select.description = Select an option in a select element in the canvas/web browser.
cmd.canvas_check.label = Enable: canvas_check
cmd.canvas_check.description = Set a checkbox or radio state in the canvas/web browser.
cmd.canvas_upload.label = Enable: canvas_upload
cmd.canvas_upload.description = Upload a security-validated host file through a Playwright file input in the canvas/web browser.
cmd.canvas_console.label = Enable: canvas_console
cmd.canvas_console.description = Get recent JavaScript console messages and page errors from the canvas/web browser.
cmd.canvas_annotations.label = Enable: canvas_annotations
cmd.canvas_annotations.description = Get user annotations left on the current canvas/web browser session.
cmd.canvas_clear_annotations.label = Enable: canvas_clear_annotations
cmd.canvas_clear_annotations.description = Clear canvas/web browser annotations.
cmd.web_server_start.label = Enable: web_server_start
cmd.web_server_start.description = Start a loopback-only static preview server rooted in a selected working directory for use with the canvas/web browser.
cmd.web_server_current.label = Enable: web_server_current
cmd.web_server_current.description = Get current preview server state.
cmd.web_server_stop.label = Enable: web_server_stop
cmd.web_server_stop.description = Stop the preview server.
ui.back = Back
ui.next = Next
ui.reload = Reload
ui.open_url = Open URL
ui.address_placeholder = Enter URL or local path and press Enter
ui.copy = Copy
ui.select_all = Select all
ui.annotate_selection = Annotate selection for AI…
ui.annotate_element = Annotate element for AI…
ui.annotation_title = Annotate for AI
ui.annotation_selection_prompt = Comment / instruction for the selected content:
ui.annotation_element_prompt = Comment / instruction for this element:
ui.annotation_added = Canvas/web browser annotation added for AI
ui.annotation_removed = Canvas/web browser annotation removed

ui.show_source = Show source
ui.back_to_canvas = Back to Canvas / HTML
ui.cancel = Cancel
ui.add = Add
ui.remove_annotation = Remove annotation
