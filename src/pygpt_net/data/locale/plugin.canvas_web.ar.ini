[LOCALE]
plugin.name = لوحة (inline)
plugin.description = BETA. يوفّر بيئة داخلية للوحة الرسم/المتصفح لتشغيل HTML وJavaScript، وإنشاء نماذج أولية لمواقع الويب، والتفاعل ضمن المتصفح، وأتمتة Playwright، والتعليقات التوضيحية، وخادم معاينة خفيف. سيتم توسيع هذه الميزة في الإصدارات المستقبلية.
use_sandbox.label = استخدام البيئة المعزولة (Playwright)
use_sandbox.description = يفعّل الواجهة الخلفية المعزولة لمتصفح Playwright. عند تعطيله، تستخدم Canvas متصفح QWebEngine المدمج ولا تحاول تشغيل Playwright.
playwright_engine.label = محرك Playwright
playwright_engine.description = محرك المتصفح المستخدم بواسطة الواجهة الخلفية المعزولة لـ Playwright.
playwright_path.label = دليل متصفحات Playwright
playwright_path.description = مسار PLAYWRIGHT_BROWSERS_PATH اختياري. اتركه فارغًا لاستخدام القيمة الافتراضية لـ Playwright.
playwright_args.label = وسائط متصفح Playwright
playwright_args.description = وسائط تشغيل اختيارية لـ Chromium/Playwright مفصولة بفواصل.
default_width.label = عرض نافذة العرض الافتراضي
default_width.description = العرض الافتراضي لنافذة المتصفح بالبكسل.
default_height.label = ارتفاع نافذة العرض الافتراضي
default_height.description = الارتفاع الافتراضي لنافذة المتصفح بالبكسل.
auto_open_split.label = فتح المتصفح تلقائيًا في العرض المقسّم
auto_open_split.description = عند أول فتح للمتصفح بواسطة وكيل في الجلسة، ينشئ أو يركّز علامة تبويب Canvas في العمود الثاني ويعرض العرض المقسّم. إذا أخفاها المستخدم لاحقًا فلن يفرضها مجددًا في الجلسة نفسها.
annotation_prompt.label = إتاحة تعليقات المستخدم للنموذج
annotation_prompt.description = يلحق التعليقات المعلّقة للمتصفح/لوحة الرسم بموجّه النظام الخاص ببيئة التشغيل.
max_annotations.label = الحد الأقصى للتعليقات
max_annotations.description = الحد الأقصى لعدد التعليقات المحفوظة في جلسة المتصفح الحالية.
console_limit.label = حد سجل وحدة التحكم
console_limit.description = الحد الأقصى لعدد إدخالات وحدة تحكم المتصفح المحفوظة في الذاكرة.
cmd.canvas_open.label = تفعيل: canvas_open
cmd.canvas_open.description = يفتح بيئة لوحة الرسم/المتصفح الدائمة أو يتنقل فيها. يُستخدم QWebEngine افتراضيًا؛ ويُستخدم Playwright فقط عند تفعيله في إعدادات الإضافة.
cmd.canvas_change_resolution.label = تفعيل: canvas_change_resolution
cmd.canvas_change_resolution.description = يغيّر حجم واتجاه نافذة عرض لوحة الرسم/المتصفح.
cmd.canvas_set_html.label = تفعيل: canvas_set_html
cmd.canvas_set_html.description = يعرض محتوى HTML/CSS/JavaScript عشوائيًا في بيئة لوحة الرسم/المتصفح الدائمة.
cmd.canvas_get_html.label = تفعيل: canvas_get_html
cmd.canvas_get_html.description = يجلب عنوان URL الحالي للوحة الرسم/المتصفح ومستند HTML المتسلسل.
cmd.canvas_current.label = تفعيل: canvas_current
cmd.canvas_current.description = يجلب الحالة الحالية لجلسة لوحة الرسم/المتصفح.
cmd.canvas_close.label = تفعيل: canvas_close
cmd.canvas_close.description = يغلق علامة تبويب لوحة الرسم المرئية في PyGPT دون إنهاء جلسة المتصفح التي تعمل في الخلفية.
cmd.canvas_prev.label = تفعيل: canvas_prev
cmd.canvas_prev.description = ينتقل إلى الخلف في سجل لوحة الرسم/المتصفح.
cmd.canvas_next.label = تفعيل: canvas_next
cmd.canvas_next.description = ينتقل إلى الأمام في سجل لوحة الرسم/المتصفح.
cmd.canvas_reload.label = تفعيل: canvas_reload
cmd.canvas_reload.description = يعيد تحميل مستند لوحة الرسم/المتصفح الحالي.
cmd.canvas_screenshot.label = تفعيل: canvas_screenshot
cmd.canvas_screenshot.description = يلتقط صورة لنافذة عرض لوحة الرسم/المتصفح الحالية مع المؤشر الافتراضي للنموذج.
cmd.canvas_inspect.label = تفعيل: canvas_inspect
cmd.canvas_inspect.description = يفحص عناصر DOM المرئية والتفاعلية في لوحة الرسم/المتصفح ويعيد محددات مستقرة وحدود العناصر.
cmd.canvas_click.label = تفعيل: canvas_click
cmd.canvas_click.description = ينقر على عنصر أو إحداثيات داخل لوحة الرسم/المتصفح فقط.
cmd.canvas_hover.label = تفعيل: canvas_hover
cmd.canvas_hover.description = يحرّك المؤشر الافتراضي للنموذج وينفّذ تمرير المؤشر داخل لوحة الرسم/المتصفح.
cmd.canvas_type.label = تفعيل: canvas_type
cmd.canvas_type.description = يركّز عنصرًا قابلًا للتحرير ويكتب نصًا داخل لوحة الرسم/المتصفح.
cmd.canvas_key.label = تفعيل: canvas_key
cmd.canvas_key.description = يرسل مفتاحًا أو اختصار لوحة مفاتيح إلى لوحة الرسم/المتصفح فقط.
cmd.canvas_scroll.label = تفعيل: canvas_scroll
cmd.canvas_scroll.description = يمرّر نافذة عرض لوحة الرسم/المتصفح.
cmd.canvas_drag.label = تفعيل: canvas_drag
cmd.canvas_drag.description = يسحب بين نقطتين في نافذة العرض داخل لوحة الرسم/المتصفح.
cmd.canvas_wait.label = تفعيل: canvas_wait
cmd.canvas_wait.description = ينتظر محددًا أو مدة قصيرة في بيئة لوحة الرسم/المتصفح.
cmd.canvas_eval.label = تفعيل: canvas_eval
cmd.canvas_eval.description = ينفّذ JavaScript في صفحة لوحة الرسم/المتصفح الحالية.
cmd.canvas_select.label = تفعيل: canvas_select
cmd.canvas_select.description = يختار خيارًا في عنصر select داخل لوحة الرسم/المتصفح.
cmd.canvas_check.label = تفعيل: canvas_check
cmd.canvas_check.description = يضبط حالة مربع اختيار أو زر اختيار في لوحة الرسم/المتصفح.
cmd.canvas_upload.label = تفعيل: canvas_upload
cmd.canvas_upload.description = يرفع ملفًا من المضيف تم التحقق من أمانه عبر حقل ملفات Playwright داخل لوحة الرسم/المتصفح.
cmd.canvas_console.label = تفعيل: canvas_console
cmd.canvas_console.description = يجلب رسائل وحدة تحكم JavaScript الحديثة وأخطاء الصفحة من لوحة الرسم/المتصفح.
cmd.canvas_annotations.label = تفعيل: canvas_annotations
cmd.canvas_annotations.description = يجلب تعليقات المستخدم التي تركها في جلسة لوحة الرسم/المتصفح الحالية.
cmd.canvas_clear_annotations.label = تفعيل: canvas_clear_annotations
cmd.canvas_clear_annotations.description = يمسح تعليقات لوحة الرسم/المتصفح.
cmd.web_server_start.label = تفعيل: web_server_start
cmd.web_server_start.description = يشغّل خادم معاينة ثابتًا محليًا على loopback فقط لمجلد العمل المحدد.
cmd.web_server_current.label = تفعيل: web_server_current
cmd.web_server_current.description = يجلب الحالة الحالية لخادم المعاينة.
cmd.web_server_stop.label = تفعيل: web_server_stop
cmd.web_server_stop.description = يوقف خادم المعاينة.
