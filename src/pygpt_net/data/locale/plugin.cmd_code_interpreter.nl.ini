plugin.name = Python-interpreter
sandbox.label = Sandbox
sandbox.description = Uitgeschakeld: voert Python/IPython rechtstreeks op de host uit (onveilig). Ingebouwde sandbox: voert een ingebouwde, door uv beheerde CPython/IPython-omgeving uit met isolatie op OS-niveau waar beschikbaar (gemiddelde beveiliging). Docker: vereist dat Docker is geïnstalleerd en actief is en biedt de sterkste isolatie; dit is de veiligste optie.
