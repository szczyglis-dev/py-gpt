sandbox.description = 已禁用：直接在主机上运行 Python/IPython（不安全）。内置：在独立进程中运行由 uv 管理的专用 CPython/IPython 环境，但不会限制对主机文件系统的访问。Docker：需要安装并运行 Docker，并提供最强的隔离；这是最安全的选项。 白名单/黑名单适用于主机、内置沙盒和 Docker 中的专用系统命令工具。

