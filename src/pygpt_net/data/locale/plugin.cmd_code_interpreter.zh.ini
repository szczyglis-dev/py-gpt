ipython_run_as_root.label = 以 root 身份运行
ipython_run_as_root.description = 以 root 身份运行 IPython Docker 沙箱。关闭时，默认沙箱镜像以非特权用户 'pygpt' 运行；对于需要 root 权限的命令，可以使用无需密码的 sudo。
