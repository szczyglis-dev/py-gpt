[LOCALE]
plugin.name = स्वायत्त मोड
plugin.description = किसी भी चैट मोड में स्वायत्त मोड सक्षम करता है। चेतावनी: सावधानी से उपयोग करें; अन्य प्लगइनों के साथ अप्रत्याशित परिणाम हो सकते हैं।

dynamic_continue.description = हर पूर्ण पास के बाद चुने गए मॉडल की एक छिपी हुई कॉल जज की तरह काम करती है, मौजूदा Human/Assistant रन के कॉन्फ़िगर किए गए अंतिम हिस्से की समीक्षा करती है और अगले पास के लिए निर्देश बनाती है।
dynamic_continue.label = डायनेमिक कंटिन्यूएशन प्रॉम्प्ट
dynamic_continue_messages.description = हर जज अनुरोध में शामिल की जाने वाली Autonomous Assistant की सबसे हाल की प्रतिक्रियाओं की संख्या। मूल उपयोगकर्ता इनपुट हमेशा शामिल रहता है। उस उपयोगकर्ता इनपुट के बाद बनी सभी प्रतिक्रियाएँ शामिल करने के लिए 0 सेट करें।
dynamic_continue_messages.label = जज के लिए प्रतिक्रियाएँ
