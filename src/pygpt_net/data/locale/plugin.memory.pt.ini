[LOCALE]
auto_attach.description = Anexa automaticamente a memória global ou do projeto ativa ao prompt do sistema em cada conversa.
auto_attach.label = Anexar memória automaticamente a todas as conversas
auto_attach.tooltip = Anexa automaticamente a memória global ou do projeto ativa ao prompt do sistema em cada conversa.
auto_attach_project.description = Anexa automaticamente a memória ao prompt do sistema quando a conversa atual pertence a um projeto.
auto_attach_project.label = Anexar memória automaticamente apenas em projetos
auto_attach_project.tooltip = Anexa automaticamente a memória ao prompt do sistema quando a conversa atual pertence a um projeto.
cmd.memory_add.description = Adiciona apenas informações muito importantes e duradouras à memória global ou de projeto atual. Use esta ferramenta com moderação; não salve detalhes rotineiros, temporários ou de pouco valor.
cmd.memory_add.label = Adicionar à memória
cmd.memory_add.tooltip = Adicione apenas informações importantes e duradouras. Use memory_add com moderação.
cmd.memory_clear.description = Limpa a memória do escopo atual. O modelo deve primeiro pedir confirmação explícita ao usuário e chamar esta ferramenta somente após a confirmação.
cmd.memory_clear.label = Limpar memória
cmd.memory_clear.tooltip = Limpa a memória do escopo atual. O modelo deve primeiro pedir confirmação explícita ao usuário e chamar esta ferramenta somente após a confirmação.
cmd.memory_get.description = Lê a memória completa do escopo global ou de projeto atual.
cmd.memory_get.label = Ler memória
cmd.memory_get.tooltip = Lê a memória completa do escopo global ou de projeto atual.
cmd.memory_update.description = Substitui todo o conteúdo da memória do escopo global ou de projeto atual.
cmd.memory_update.label = Atualizar memória
cmd.memory_update.tooltip = Substitui todo o conteúdo da memória do escopo global ou de projeto atual.
max_chars.description = Tamanho máximo alvo da memória em caracteres. O modelo é instruído a permanecer dentro desse limite; são permitidos 300 caracteres adicionais de margem de segurança antes do corte rígido.
max_chars.label = Máximo de caracteres da memória
max_chars.tooltip = Tamanho alvo da memória em caracteres; é permitida uma margem de segurança de 300 caracteres antes do corte rígido.
model_update.description = Modelo usado para atualizações automáticas da memória e, quando ativado, para refinar operações memory_add.
model_update.label = Modelo de atualização da memória
model_update.tooltip = Modelo usado para atualizar e refinar a memória.
refine_add.description = Aplica-se apenas a chamadas manuais de memory_add. Quando ativado, o modelo configurado de atualização de memória mescla e reescreve a informação adicionada na memória existente em vez de anexar texto bruto. As atualizações automáticas de memória ao final do contexto são sempre refinadas pelo modelo, independentemente desta opção.
refine_add.label = Refinar a memória antes de adicionar
refine_add.tooltip = Refina chamadas manuais de memory_add com o modelo configurado. As atualizações automáticas de memória são sempre refinadas.
key_search_content.label = Search memory key content
key_search_content.description = Also search stored key values/content in memory_key_search. Key names are always searched with LIKE. Disabled by default to avoid scanning stored content.
key_search_content.tooltip = Also search key content in memory_key_search. Disabled by default.
cmd.memory_key_get.description = Read raw database-backed memory records by one key or a list of keys from the current global or project scope.
cmd.memory_key_get.label = Read keyed memory
cmd.memory_key_get.tooltip = Read raw keyed memory records from the current global or project scope.
cmd.memory_key_add.description = Store a new raw database value by key for later use in the current global or project scope. Use only for truly important data; existing keys are not overwritten.
cmd.memory_key_add.label = Add keyed memory
cmd.memory_key_add.tooltip = Store a new raw value by key. Use only for truly important data.
cmd.memory_key_append.description = Append raw content exactly as provided to an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_append.label = Append keyed memory
cmd.memory_key_append.tooltip = Append raw content to an existing key without LLM processing.
cmd.memory_key_update.description = Replace the raw content of an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_update.label = Update keyed memory
cmd.memory_key_update.tooltip = Replace raw content for an existing key without LLM processing.
cmd.memory_key_list.description = List only the stored memory key names for the current global or project scope, without content.
cmd.memory_key_list.label = List memory keys
cmd.memory_key_list.tooltip = List memory key names without content.
cmd.memory_key_search.description = Search keyed memory with LIKE matching on key names. Content is searched only when the Search memory key content option is enabled.
cmd.memory_key_search.label = Search memory keys
cmd.memory_key_search.tooltip = Search key names with LIKE and optionally search stored content.
cmd.memory_key_remove.description = Remove one database-backed memory key or a list of keys from the current global or project scope.
cmd.memory_key_remove.label = Remove memory keys
cmd.memory_key_remove.tooltip = Remove one or more stored memory keys from the current scope.
plugin.description = Fornece memória de longo prazo global e por projeto armazenada no banco de dados local.
plugin.name = Memory (inline)
