[LOCALE]
plugin.name = 자율 모드
plugin.description = 모든 채팅 모드에서 자율 모드를 활성화합니다. 경고: 다른 플러그인과 함께 사용할 경우 예기치 않은 결과가 발생할 수 있으므로 주의하세요.

dynamic_continue.description = 각 패스가 완료된 후 선택한 모델을 사용하는 숨겨진 호출이 심사자 역할을 하며, 현재 Human/Assistant 실행의 설정된 마지막 구간을 검토하고 다음 패스의 지시를 생성합니다.
dynamic_continue.label = 동적 연속 프롬프트
dynamic_continue_messages.description = 각 심사 요청에 포함할 Autonomous Assistant의 최근 응답 수입니다. 원래 사용자 입력은 항상 포함됩니다. 0으로 설정하면 해당 사용자 입력 이후 생성된 모든 응답을 포함합니다.
dynamic_continue_messages.label = 심사할 응답 수
