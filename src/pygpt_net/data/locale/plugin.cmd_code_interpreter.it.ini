use_ipython.label = Usa IPython
use_ipython.description = Usa l’interprete IPython. Quando è disattivato, viene usato l’interprete Python standard.
sandbox.label = Sandbox
sandbox.description = Disabilitato: esegue Python/IPython direttamente sull’host (non sicuro). Integrato: esegue un ambiente CPython/IPython dedicato gestito da uv in un processo separato, ma non limita l’accesso al file system dell’host. Docker: richiede Docker installato e in esecuzione e offre l’isolamento più forte; è l’opzione più sicura. La whitelist/blacklist si applica agli strumenti dedicati ai comandi di sistema sull’host, nel sandbox integrato e in Docker.

builtin_packages.label = Pacchetti da installare
builtin_packages.description = Requisiti dei pacchetti Python installati nella sandbox integrata. Inserisci una specifica di pacchetto per riga. Ricrea il venv integrato per applicare subito le modifiche; in caso contrario verrà ricreato automaticamente al successivo utilizzo della sandbox integrata.
