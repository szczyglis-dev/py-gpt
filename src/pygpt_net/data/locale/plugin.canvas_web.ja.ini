[LOCALE]
plugin.name = キャンバス (inline)
plugin.description = BETA. HTML/JavaScript、Webサイトのプロトタイピング、ブラウザー内操作、Playwright自動化、注釈、軽量プレビューサーバー向けの内部キャンバス/ブラウザーランタイムを提供します。 この機能は今後のリリースでさらに拡張されます。
use_sandbox.label = サンドボックスを使用 (Playwright)
use_sandbox.description = 分離されたPlaywrightブラウザーバックエンドを有効にします。無効時はCanvasが内蔵QWebEngineブラウザーを使用し、Playwrightを起動しません。
playwright_engine.label = Playwrightエンジン
playwright_engine.description = 分離Playwrightバックエンドで使用するブラウザーエンジンです。
playwright_path.label = Playwrightブラウザーのディレクトリ
playwright_path.description = 任意のPLAYWRIGHT_BROWSERS_PATHです。Playwrightの既定値を使用する場合は空欄にします。
playwright_args.label = Playwrightブラウザー引数
playwright_args.description = Chromium/Playwrightの任意の起動引数をカンマ区切りで指定します。
default_width.label = 既定のビューポート幅
default_width.description = ブラウザービューポートの既定幅（ピクセル）です。
default_height.label = 既定のビューポート高さ
default_height.description = ブラウザービューポートの既定高さ（ピクセル）です。
auto_open_split.label = ブラウザーを分割表示で自動的に開く
auto_open_split.description = セッション中にエージェントが初めてブラウザーを開いたとき、2列目のCanvasタブを作成またはフォーカスして分割表示を開きます。ユーザーが後で非表示にした場合、そのセッションでは再度強制表示しません。
annotation_prompt.label = ユーザー注釈をモデルに公開
annotation_prompt.description = 保留中のブラウザー/キャンバス注釈をランタイムのシステムプロンプトに追加します。
max_annotations.label = 注釈の最大数
max_annotations.description = 現在のブラウザーセッションで保持する注釈の最大数です。
console_limit.label = コンソールログ上限
console_limit.description = メモリに保持するブラウザーコンソールエントリの最大数です。
cmd.canvas_open.label = 有効化: canvas_open
cmd.canvas_open.description = 永続キャンバス/ブラウザーランタイムを開く、または移動します。既定はQWebEngineで、Playwrightはプラグイン設定で有効な場合のみ使用します。
cmd.canvas_change_resolution.label = 有効化: canvas_change_resolution
cmd.canvas_change_resolution.description = キャンバス/ブラウザーのビューポートサイズと向きを変更します。
cmd.canvas_set_html.label = 有効化: canvas_set_html
cmd.canvas_set_html.description = 永続キャンバス/ブラウザーランタイムに任意のHTML/CSS/JavaScriptをレンダリングします。
cmd.canvas_get_html.label = 有効化: canvas_get_html
cmd.canvas_get_html.description = 現在のキャンバス/ブラウザーURLとシリアル化されたHTMLドキュメントを取得します。
cmd.canvas_current.label = 有効化: canvas_current
cmd.canvas_current.description = 現在のキャンバス/ブラウザーセッション状態を取得します。
cmd.canvas_close.label = 有効化: canvas_close
cmd.canvas_close.description = バックグラウンドのブラウザーセッションを破棄せず、PyGPTの表示中キャンバスタブを閉じます。
cmd.canvas_prev.label = 有効化: canvas_prev
cmd.canvas_prev.description = キャンバス/ブラウザー履歴を戻ります。
cmd.canvas_next.label = 有効化: canvas_next
cmd.canvas_next.description = キャンバス/ブラウザー履歴を進みます。
cmd.canvas_reload.label = 有効化: canvas_reload
cmd.canvas_reload.description = 現在のキャンバス/ブラウザードキュメントを再読み込みします。
cmd.canvas_screenshot.label = 有効化: canvas_screenshot
cmd.canvas_screenshot.description = モデルの仮想カーソルを含む現在のキャンバス/ブラウザービューポートをキャプチャします。
cmd.canvas_inspect.label = 有効化: canvas_inspect
cmd.canvas_inspect.description = 表示中/操作可能なDOM要素を検査し、安定したセレクターと要素境界を返します。
cmd.canvas_click.label = 有効化: canvas_click
cmd.canvas_click.description = キャンバス/ブラウザー内だけで要素または座標をクリックします。
cmd.canvas_hover.label = 有効化: canvas_hover
cmd.canvas_hover.description = モデルの仮想カーソルを移動し、キャンバス/ブラウザー内でホバーします。
cmd.canvas_type.label = 有効化: canvas_type
cmd.canvas_type.description = 編集可能要素にフォーカスし、キャンバス/ブラウザー内にテキストを入力します。
cmd.canvas_key.label = 有効化: canvas_key
cmd.canvas_key.description = キーまたはキーボードショートカットをキャンバス/ブラウザーだけに送信します。
cmd.canvas_scroll.label = 有効化: canvas_scroll
cmd.canvas_scroll.description = キャンバス/ブラウザーのビューポートをスクロールします。
cmd.canvas_drag.label = 有効化: canvas_drag
cmd.canvas_drag.description = キャンバス/ブラウザー内の2つのビューポート座標間をドラッグします。
cmd.canvas_wait.label = 有効化: canvas_wait
cmd.canvas_wait.description = キャンバス/ブラウザーランタイムでセレクターまたは短時間待機します。
cmd.canvas_eval.label = 有効化: canvas_eval
cmd.canvas_eval.description = 現在のキャンバス/ブラウザーページでJavaScriptを実行します。
cmd.canvas_select.label = 有効化: canvas_select
cmd.canvas_select.description = キャンバス/ブラウザーのselect要素でオプションを選択します。
cmd.canvas_check.label = 有効化: canvas_check
cmd.canvas_check.description = キャンバス/ブラウザーのチェックボックスまたはラジオボタンの状態を設定します。
cmd.canvas_upload.label = 有効化: canvas_upload
cmd.canvas_upload.description = セキュリティ検証済みのホストファイルをPlaywrightのファイル入力からキャンバス/ブラウザーへアップロードします。
cmd.canvas_console.label = 有効化: canvas_console
cmd.canvas_console.description = キャンバス/ブラウザーの最近のJavaScriptコンソールメッセージとページエラーを取得します。
cmd.canvas_annotations.label = 有効化: canvas_annotations
cmd.canvas_annotations.description = 現在のキャンバス/ブラウザーセッションにユーザーが残した注釈を取得します。
cmd.canvas_clear_annotations.label = 有効化: canvas_clear_annotations
cmd.canvas_clear_annotations.description = キャンバス/ブラウザーの注釈を消去します。
cmd.web_server_start.label = 有効化: web_server_start
cmd.web_server_start.description = 選択した作業ディレクトリ向けにloopback限定のローカル静的プレビューサーバーを開始します。
cmd.web_server_current.label = 有効化: web_server_current
cmd.web_server_current.description = 現在のプレビューサーバー状態を取得します。
cmd.web_server_stop.label = 有効化: web_server_stop
cmd.web_server_stop.description = プレビューサーバーを停止します。
ui.back = 戻る
ui.next = 進む
ui.reload = 再読み込み
ui.open_url = URLを開く
ui.address_placeholder = URLまたはローカルパスを入力してEnterを押してください
ui.enable_hint = キャンバスプラグインを有効化
ui.copy = コピー
ui.select_all = すべて選択
ui.annotate_selection = AI向けに選択範囲へ注釈…
ui.annotate_element = AI向けに要素へ注釈…
ui.annotation_title = AI向け注釈
ui.annotation_selection_prompt = 選択した内容へのコメント / 指示:
ui.annotation_element_prompt = この要素へのコメント / 指示:
ui.annotation_added = AI向けキャンバス/ブラウザー注釈を追加しました
ui.annotation_removed = キャンバス/ブラウザー注釈を削除しました
ui.show_source = ソースを表示
ui.back_to_canvas = キャンバス / HTMLへ戻る
ui.cancel = キャンセル
ui.add = 追加
ui.remove_annotation = 注釈を削除
