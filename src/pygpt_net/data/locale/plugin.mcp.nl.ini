[LOCALE]
plugin.description = Biedt toegang tot externe tools via het Model Context Protocol (MCP), inclusief stdio, SSE en Streamable HTTP, met toestaan/blokkeren-filters per server, ondersteuning voor de Authorization-header en een toolcache.
plugin.name = MCP
servers.description = Configureer MCP-servers. Ondersteunde transporten: 'stdio: <command ...>' voor stdio, 'http(s)://...' voor Streamable HTTP en 'http(s)://.../sse' (of 'sse://', 'sse+http(s)://') voor SSE. Gebruik 'label' als korte servernaam, 'authorization' voor de Authorization-header bij HTTP/SSE, 'allowed_commands' (kommagescheiden) om alleen opgegeven tools toe te staan en 'disabled_commands' om tools van deze server te blokkeren.
servers.label = MCP-servers
servers.tooltip = Vereist de MCP Python SDK. Installeren: pip install "mcp[cli]"
tools_cache_enabled.description = Schakelt een geheugencache voor ontdekte tools in zodat ze niet bij elke aanvraag opnieuw hoeven te worden gedetecteerd.
tools_cache_enabled.label = Toollijst cachen
tools_cache_enabled.tooltip = Indien ingeschakeld worden de resultaten van tooldetectie per server gedurende de TTL opgeslagen.
tools_cache_ttl.description = Levensduur van de toolcache per server.
tools_cache_ttl.label = Cache-TTL (seconden)
tools_cache_ttl.tooltip = Stel in op 0 om TTL uit te schakelen (niet aanbevolen).
