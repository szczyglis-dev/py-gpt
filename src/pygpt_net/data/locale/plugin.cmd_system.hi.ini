sandbox.label = सैंडबॉक्स
sandbox.description = अक्षम: सिस्टम कमांड सीधे होस्ट पर चलाता है (असुरक्षित)। अंतर्निहित सैंडबॉक्स: uv द्वारा प्रबंधित अंतर्निहित CPython वातावरण में कमांड चलाता है और जहाँ उपलब्ध हो वहाँ OS-स्तरीय अलगाव लागू करता है (मध्यम सुरक्षा)। Docker: Docker का इंस्टॉल और चालू होना आवश्यक है और यह सबसे मजबूत अलगाव प्रदान करता है; यह सबसे सुरक्षित विकल्प है।
