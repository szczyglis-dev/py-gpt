auto_attach.description = Etkin genel veya proje belleğini her konuşmanın sistem istemine otomatik olarak ekler.
auto_attach.label = Belleği her konuşmaya otomatik ekle
auto_attach.tooltip = Etkin genel veya proje belleğini her konuşmanın sistem istemine otomatik olarak ekler.
auto_attach_project.description = Geçerli konuşma bir projeye ait olduğunda belleği sistem istemine otomatik olarak ekler.
auto_attach_project.label = Belleği yalnızca projelerde otomatik ekle
auto_attach_project.tooltip = Geçerli konuşma bir projeye ait olduğunda belleği sistem istemine otomatik olarak ekler.
cmd.memory_add.description = Geçerli genel veya proje belleğine yalnızca çok önemli ve kalıcı bilgiler ekleyin. Bu aracı seyrek kullanın; rutin, geçici veya düşük değerli ayrıntıları kaydetmeyin.
cmd.memory_add.label = Belleğe ekle
cmd.memory_add.tooltip = Yalnızca önemli ve kalıcı bilgiler ekleyin. memory_add’i seyrek kullanın.
cmd.memory_clear.description = Geçerli kapsamın belleğini temizler. Model önce kullanıcıdan açık onay istemeli ve bu aracı yalnızca onaydan sonra çağırmalıdır.
cmd.memory_clear.label = Belleği temizle
cmd.memory_clear.tooltip = Geçerli kapsamın belleğini temizler. Model önce kullanıcıdan açık onay istemeli ve bu aracı yalnızca onaydan sonra çağırmalıdır.
cmd.memory_get.description = Geçerli genel veya proje kapsamının tüm belleğini okur.
cmd.memory_get.label = Belleği oku
cmd.memory_get.tooltip = Geçerli genel veya proje kapsamının tüm belleğini okur.
cmd.memory_update.description = Geçerli genel veya proje kapsamının tüm bellek içeriğini değiştirir.
cmd.memory_update.label = Belleği güncelle
cmd.memory_update.tooltip = Geçerli genel veya proje kapsamının tüm bellek içeriğini değiştirir.
max_chars.description = Belleğin karakter cinsinden hedef maksimum boyutu. Modelden bu sınır içinde kalması istenir; sert kırpmadan önce ek 300 karakterlik güvenlik payına izin verilir.
max_chars.label = Maksimum bellek karakteri
max_chars.tooltip = Belleğin karakter cinsinden hedef boyutu; sert kırpmadan önce 300 karakterlik güvenlik payına izin verilir.
model_update.description = Otomatik bellek güncellemeleri ve etkinleştirildiğinde memory_add işlemlerini düzenlemek için kullanılan model.
model_update.label = Bellek güncelleme modeli
model_update.tooltip = Belleği güncellemek ve düzenlemek için kullanılan model.
refine_add.description = Yalnızca manuel memory_add çağrıları için geçerlidir. Etkinleştirildiğinde yapılandırılmış bellek güncelleme modeli eklenen bilgiyi mevcut bellekle birleştirip yeniden yazar; ham metni doğrudan eklemez. Bağlam sonunda yapılan otomatik bellek güncellemeleri bu ayardan bağımsız olarak her zaman model tarafından yeniden düzenlenir.
refine_add.label = Eklemeden önce belleği düzenle
refine_add.tooltip = Manuel memory_add çağrılarını yapılandırılmış modelle yeniden düzenler. Otomatik bellek güncellemeleri her zaman yeniden düzenlenir.
key_search_content.label = Search memory key content
key_search_content.description = Also search stored key values/content in memory_key_search. Key names are always searched with LIKE. Disabled by default to avoid scanning stored content.
key_search_content.tooltip = Also search key content in memory_key_search. Disabled by default.
cmd.memory_key_get.description = Read raw database-backed memory records by one key or a list of keys from the current global or project scope.
cmd.memory_key_get.label = Read keyed memory
cmd.memory_key_get.tooltip = Read raw keyed memory records from the current global or project scope.
cmd.memory_key_add.description = Store a new raw database value by key for later use in the current global or project scope. Use only for truly important data; existing keys are not overwritten.
cmd.memory_key_add.label = Add keyed memory
cmd.memory_key_add.tooltip = Store a new raw value by key. Use only for truly important data.
cmd.memory_key_append.description = Append raw content exactly as provided to an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_append.label = Append keyed memory
cmd.memory_key_append.tooltip = Append raw content to an existing key without LLM processing.
cmd.memory_key_update.description = Replace the raw content of an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_update.label = Update keyed memory
cmd.memory_key_update.tooltip = Replace raw content for an existing key without LLM processing.
cmd.memory_key_list.description = List only the stored memory key names for the current global or project scope, without content.
cmd.memory_key_list.label = List memory keys
cmd.memory_key_list.tooltip = List memory key names without content.
cmd.memory_key_search.description = Search keyed memory with LIKE matching on key names. Content is searched only when the Search memory key content option is enabled.
cmd.memory_key_search.label = Search memory keys
cmd.memory_key_search.tooltip = Search key names with LIKE and optionally search stored content.
cmd.memory_key_remove.description = Remove one database-backed memory key or a list of keys from the current global or project scope.
cmd.memory_key_remove.label = Remove memory keys
cmd.memory_key_remove.tooltip = Remove one or more stored memory keys from the current scope.
plugin.description = Yerel veritabanında tutulan genel ve proje bazlı uzun süreli bellek sağlar.
