[LOCALE]
plugin.name = Canvas
plugin.description = BETA. Tarjoaa sisäisen piirtoalue-/selainympäristön HTML:lle ja JavaScriptille, verkkoprototyypeille, selaimeen rajatulle vuorovaikutukselle, Playwright-automaatiolle, merkinnöille ja kevyelle esikatselupalvelimelle. Ominaisuutta laajennetaan tulevissa versioissa.
use_sandbox.label = Käytä hiekkalaatikkoa (Playwright)
use_sandbox.description = Ottaa käyttöön eristetyn Playwright-selainbackendin. Kun se on pois käytöstä, Canvas käyttää sisäänrakennettua QWebEngine-selainta eikä käynnistä Playwrightia.
playwright_engine.label = Playwright-moottori
playwright_engine.description = Eristetyn Playwright-backendin käyttämä selainmoottori.
playwright_path.label = Playwright-selainten hakemisto
playwright_path.description = Valinnainen PLAYWRIGHT_BROWSERS_PATH. Jätä tyhjäksi käyttääksesi Playwrightin oletusta.
playwright_args.label = Playwright-selaimen argumentit
playwright_args.description = Valinnaiset pilkuilla erotetut Chromium/Playwright-käynnistysargumentit.
default_width.label = Näkymän oletusleveys
default_width.description = Selaimen näkymän oletusleveys pikseleinä.
default_height.label = Näkymän oletuskorkeus
default_height.description = Selaimen näkymän oletuskorkeus pikseleinä.
auto_open_split.label = Avaa selain automaattisesti jaettuun näkymään
auto_open_split.description = Kun agentti avaa selaimen ensimmäisen kerran istunnossa, luo tai kohdistaa Canvas -välilehden toiseen sarakkeeseen ja näyttää jaetun näkymän. Jos käyttäjä sulkee sen, sitä ei pakoteta uudelleen samassa istunnossa.
annotation_prompt.label = Näytä käyttäjän merkinnät mallille
annotation_prompt.description = Lisää odottavat selain-/piirtoaluemerkinnät ajonaikaiseen järjestelmäkehotteeseen.
max_annotations.label = Merkintöjen enimmäismäärä
max_annotations.description = Nykyisessä selainistunnossa säilytettävien merkintöjen enimmäismäärä.
console_limit.label = Konsolilokin raja
console_limit.description = Muistissa säilytettävien selaimen konsolimerkintöjen enimmäismäärä.
cmd.canvas_open.label = Ota käyttöön: canvas_open
cmd.canvas_open.description = Avaa tai navigoi pysyvässä piirtoalue-/selainympäristössä. Oletuksena käytetään QWebEngineä; Playwrightia vain, jos se on otettu käyttöön pluginin asetuksissa.
cmd.canvas_change_resolution.label = Ota käyttöön: canvas_change_resolution
cmd.canvas_change_resolution.description = Muuttaa piirtoalueen/selaimen näkymän kokoa ja suuntaa.
cmd.canvas_set_html.label = Ota käyttöön: canvas_set_html
cmd.canvas_set_html.description = Renderöi mielivaltaisen HTML/CSS/JavaScriptin pysyvässä piirtoalue-/selainympäristössä.
cmd.canvas_get_html.label = Ota käyttöön: canvas_get_html
cmd.canvas_get_html.description = Hakee nykyisen piirtoalue-/selain-URL:n ja serialisoidun HTML-dokumentin.
cmd.canvas_current.label = Ota käyttöön: canvas_current
cmd.canvas_current.description = Hakee nykyisen piirtoalue-/selainistunnon tilan.
cmd.canvas_close.label = Ota käyttöön: canvas_close
cmd.canvas_close.description = Sulkee PyGPT:n näkyvän piirtoaluevälilehden lopettamatta taustalla olevaa selainistuntoa.
cmd.canvas_prev.label = Ota käyttöön: canvas_prev
cmd.canvas_prev.description = Siirtyy taaksepäin piirtoalueen/selaimen historiassa.
cmd.canvas_next.label = Ota käyttöön: canvas_next
cmd.canvas_next.description = Siirtyy eteenpäin piirtoalueen/selaimen historiassa.
cmd.canvas_reload.label = Ota käyttöön: canvas_reload
cmd.canvas_reload.description = Lataa nykyisen piirtoalue-/selainasiakirjan uudelleen.
cmd.canvas_screenshot.label = Ota käyttöön: canvas_screenshot
cmd.canvas_screenshot.description = Ottaa kuvan nykyisestä piirtoalue-/selainnäkymästä mallin virtuaalikohdistimen kanssa.
cmd.canvas_inspect.label = Ota käyttöön: canvas_inspect
cmd.canvas_inspect.description = Tarkastaa näkyvät/interaktiiviset DOM-elementit ja palauttaa vakaat valitsimet ja rajat.
cmd.canvas_click.label = Ota käyttöön: canvas_click
cmd.canvas_click.description = Napsauttaa elementtiä tai koordinaatteja vain piirtoalueen/selaimen sisällä.
cmd.canvas_hover.label = Ota käyttöön: canvas_hover
cmd.canvas_hover.description = Siirtää mallin virtuaalikohdistinta ja suorittaa hoverin piirtoalueella/selaimessa.
cmd.canvas_type.label = Ota käyttöön: canvas_type
cmd.canvas_type.description = Kohdistaa muokattavaan elementtiin ja kirjoittaa tekstiä piirtoalueella/selaimessa.
cmd.canvas_key.label = Ota käyttöön: canvas_key
cmd.canvas_key.description = Lähettää näppäimen tai näppäinyhdistelmän vain piirtoalueelle/selaimeen.
cmd.canvas_scroll.label = Ota käyttöön: canvas_scroll
cmd.canvas_scroll.description = Vierittää piirtoalueen/selaimen näkymää.
cmd.canvas_drag.label = Ota käyttöön: canvas_drag
cmd.canvas_drag.description = Vetää kahden näkymäkoordinaatin välillä piirtoalueella/selaimessa.
cmd.canvas_wait.label = Ota käyttöön: canvas_wait
cmd.canvas_wait.description = Odottaa valitsinta tai lyhyen ajan piirtoalue-/selainympäristössä.
cmd.canvas_eval.label = Ota käyttöön: canvas_eval
cmd.canvas_eval.description = Suorittaa JavaScriptin nykyisellä piirtoalue-/selainsivulla.
cmd.canvas_select.label = Ota käyttöön: canvas_select
cmd.canvas_select.description = Valitsee vaihtoehdon select-elementissä piirtoalueella/selaimessa.
cmd.canvas_check.label = Ota käyttöön: canvas_check
cmd.canvas_check.description = Asettaa valintaruudun tai radiopainikkeen tilan piirtoalueella/selaimessa.
cmd.canvas_upload.label = Ota käyttöön: canvas_upload
cmd.canvas_upload.description = Lataa turvallisuustarkistetun isäntätiedoston Playwrightin tiedostokentän kautta piirtoalueelle/selaimeen.
cmd.canvas_console.label = Ota käyttöön: canvas_console
cmd.canvas_console.description = Hakee viimeisimmät JavaScript-konsoliviestit ja sivuvirheet piirtoalueelta/selaimesta.
cmd.canvas_annotations.label = Ota käyttöön: canvas_annotations
cmd.canvas_annotations.description = Hakee käyttäjän merkinnät nykyisestä piirtoalue-/selainistunnosta.
cmd.canvas_clear_annotations.label = Ota käyttöön: canvas_clear_annotations
cmd.canvas_clear_annotations.description = Tyhjentää piirtoalue-/selainmerkinnät.
cmd.web_server_start.label = Ota käyttöön: web_server_start
cmd.web_server_start.description = Käynnistää vain loopbackissa toimivan staattisen esikatselupalvelimen valitulle työhakemistolle.
cmd.web_server_current.label = Ota käyttöön: web_server_current
cmd.web_server_current.description = Hakee esikatselupalvelimen nykyisen tilan.
cmd.web_server_stop.label = Ota käyttöön: web_server_stop
cmd.web_server_stop.description = Pysäyttää esikatselupalvelimen.
