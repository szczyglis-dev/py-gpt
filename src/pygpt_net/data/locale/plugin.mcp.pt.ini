[LOCALE]
plugin.description = Fornece acesso a ferramentas remotas via Model Context Protocol (MCP), incluindo os transportes stdio, SSE e Streamable HTTP, com filtros de permitir/bloquear por servidor, suporte ao cabeçalho Authorization e cache de ferramentas.
plugin.name = MCP
servers.description = Configure servidores MCP. Transportes suportados: 'stdio: <command ...>' para stdio, 'http(s)://...' para Streamable HTTP e 'http(s)://.../sse' (ou 'sse://', 'sse+http(s)://') para SSE. Use 'label' como nome curto do servidor, 'authorization' para enviar o cabeçalho Authorization em HTTP/SSE, 'allowed_commands' (separados por vírgulas) para permitir apenas ferramentas específicas e 'disabled_commands' para bloquear ferramentas do servidor.
servers.label = Servidores MCP
servers.tooltip = Requer o MCP Python SDK. Instalação: pip install "mcp[cli]"
tools_cache_enabled.description = Ativa um cache em memória das ferramentas descobertas para evitar nova descoberta a cada solicitação.
tools_cache_enabled.label = Armazenar lista de ferramentas em cache
tools_cache_enabled.tooltip = Quando ativado, os resultados da descoberta de ferramentas são armazenados em cache por servidor durante o TTL.
tools_cache_ttl.description = Tempo de vida do cache de ferramentas por servidor.
tools_cache_ttl.label = TTL do cache (segundos)
tools_cache_ttl.tooltip = Defina 0 para desativar o TTL (não recomendado).
