[LOCALE]
plugin.name = कैनवास और HTML
plugin.description = BETA. HTML और JavaScript, वेबसाइट प्रोटोटाइपिंग, ब्राउज़र-सीमित इंटरैक्शन, Playwright ऑटोमेशन, एनोटेशन और हल्के प्रीव्यू सर्वर के लिए आंतरिक कैनवास/ब्राउज़र रनटाइम प्रदान करता है। इस सुविधा को भविष्य के संस्करणों में और विस्तारित किया जाएगा।
use_sandbox.label = सैंडबॉक्स उपयोग करें (Playwright)
use_sandbox.description = अलग Playwright ब्राउज़र बैकएंड सक्षम करता है। बंद होने पर कैनवास और HTML अंतर्निहित QWebEngine ब्राउज़र का उपयोग करता है और Playwright शुरू नहीं करता।
playwright_engine.label = Playwright इंजन
playwright_engine.description = अलग Playwright बैकएंड द्वारा उपयोग किया जाने वाला ब्राउज़र इंजन।
playwright_path.label = Playwright ब्राउज़र डायरेक्टरी
playwright_path.description = वैकल्पिक PLAYWRIGHT_BROWSERS_PATH। Playwright का डिफ़ॉल्ट उपयोग करने के लिए खाली छोड़ें।
playwright_args.label = Playwright ब्राउज़र आर्ग्युमेंट्स
playwright_args.description = वैकल्पिक, कॉमा से अलग किए गए Chromium/Playwright लॉन्च आर्ग्युमेंट्स।
default_width.label = डिफ़ॉल्ट व्यूपोर्ट चौड़ाई
default_width.description = ब्राउज़र व्यूपोर्ट की डिफ़ॉल्ट चौड़ाई पिक्सेल में।
default_height.label = डिफ़ॉल्ट व्यूपोर्ट ऊँचाई
default_height.description = ब्राउज़र व्यूपोर्ट की डिफ़ॉल्ट ऊँचाई पिक्सेल में।
auto_open_split.label = ब्राउज़र को स्प्लिट व्यू में अपने-आप खोलें
auto_open_split.description = किसी सत्र में एजेंट द्वारा पहली बार ब्राउज़र खोलने पर दूसरी कॉलम में कैनवास और HTML टैब बनाता या फोकस करता है और स्प्लिट व्यू दिखाता है। उपयोगकर्ता बाद में इसे छिपाए तो उसी सत्र में फिर मजबूर नहीं किया जाता।
annotation_prompt.label = उपयोगकर्ता एनोटेशन मॉडल को दें
annotation_prompt.description = लंबित ब्राउज़र/कैनवास एनोटेशन को रनटाइम सिस्टम प्रॉम्प्ट में जोड़ता है।
max_annotations.label = अधिकतम एनोटेशन
max_annotations.description = वर्तमान ब्राउज़र सत्र में रखे जाने वाले एनोटेशन की अधिकतम संख्या।
console_limit.label = कंसोल लॉग सीमा
console_limit.description = मेमोरी में रखी जाने वाली ब्राउज़र कंसोल प्रविष्टियों की अधिकतम संख्या।
cmd.canvas_open.label = सक्षम करें: canvas_open
cmd.canvas_open.description = स्थायी कैनवास/ब्राउज़र रनटाइम खोलता है या उसमें नेविगेट करता है। डिफ़ॉल्ट रूप से QWebEngine; Playwright केवल प्लगइन सेटिंग में सक्षम होने पर।
cmd.canvas_change_resolution.label = सक्षम करें: canvas_change_resolution
cmd.canvas_change_resolution.description = कैनवास/ब्राउज़र व्यूपोर्ट का आकार और ओरिएंटेशन बदलता है।
cmd.canvas_set_html.label = सक्षम करें: canvas_set_html
cmd.canvas_set_html.description = स्थायी कैनवास/ब्राउज़र रनटाइम में मनचाहा HTML/CSS/JavaScript रेंडर करता है।
cmd.canvas_get_html.label = सक्षम करें: canvas_get_html
cmd.canvas_get_html.description = वर्तमान कैनवास/ब्राउज़र URL और सीरियलाइज़ किया हुआ HTML दस्तावेज़ प्राप्त करता है।
cmd.canvas_current.label = सक्षम करें: canvas_current
cmd.canvas_current.description = वर्तमान कैनवास/ब्राउज़र सत्र की स्थिति प्राप्त करता है।
cmd.canvas_close.label = सक्षम करें: canvas_close
cmd.canvas_close.description = बैकग्राउंड ब्राउज़र सत्र को नष्ट किए बिना PyGPT में दिखाई दे रहा कैनवास टैब बंद करता है।
cmd.canvas_prev.label = सक्षम करें: canvas_prev
cmd.canvas_prev.description = कैनवास/ब्राउज़र इतिहास में पीछे जाता है।
cmd.canvas_next.label = सक्षम करें: canvas_next
cmd.canvas_next.description = कैनवास/ब्राउज़र इतिहास में आगे जाता है।
cmd.canvas_reload.label = सक्षम करें: canvas_reload
cmd.canvas_reload.description = वर्तमान कैनवास/ब्राउज़र दस्तावेज़ को फिर लोड करता है।
cmd.canvas_screenshot.label = सक्षम करें: canvas_screenshot
cmd.canvas_screenshot.description = मॉडल के वर्चुअल कर्सर सहित वर्तमान कैनवास/ब्राउज़र व्यूपोर्ट का स्क्रीनशॉट लेता है।
cmd.canvas_inspect.label = सक्षम करें: canvas_inspect
cmd.canvas_inspect.description = दृश्य/इंटरैक्टिव DOM एलिमेंट्स की जाँच कर स्थिर सेलेक्टर और एलिमेंट सीमाएँ लौटाता है।
cmd.canvas_click.label = सक्षम करें: canvas_click
cmd.canvas_click.description = केवल कैनवास/ब्राउज़र के भीतर किसी एलिमेंट या निर्देशांक पर क्लिक करता है।
cmd.canvas_hover.label = सक्षम करें: canvas_hover
cmd.canvas_hover.description = मॉडल का वर्चुअल कर्सर ले जाता है और कैनवास/ब्राउज़र के भीतर होवर करता है।
cmd.canvas_type.label = सक्षम करें: canvas_type
cmd.canvas_type.description = संपादन योग्य एलिमेंट पर फोकस करके कैनवास/ब्राउज़र में टेक्स्ट टाइप करता है।
cmd.canvas_key.label = सक्षम करें: canvas_key
cmd.canvas_key.description = केवल कैनवास/ब्राउज़र को कोई कुंजी या कीबोर्ड शॉर्टकट भेजता है।
cmd.canvas_scroll.label = सक्षम करें: canvas_scroll
cmd.canvas_scroll.description = कैनवास/ब्राउज़र व्यूपोर्ट स्क्रॉल करता है।
cmd.canvas_drag.label = सक्षम करें: canvas_drag
cmd.canvas_drag.description = कैनवास/ब्राउज़र के भीतर दो व्यूपोर्ट बिंदुओं के बीच ड्रैग करता है।
cmd.canvas_wait.label = सक्षम करें: canvas_wait
cmd.canvas_wait.description = कैनवास/ब्राउज़र रनटाइम में किसी सेलेक्टर या थोड़े समय की प्रतीक्षा करता है।
cmd.canvas_eval.label = सक्षम करें: canvas_eval
cmd.canvas_eval.description = वर्तमान कैनवास/ब्राउज़र पेज में JavaScript चलाता है।
cmd.canvas_select.label = सक्षम करें: canvas_select
cmd.canvas_select.description = कैनवास/ब्राउज़र में select एलिमेंट का विकल्प चुनता है।
cmd.canvas_check.label = सक्षम करें: canvas_check
cmd.canvas_check.description = कैनवास/ब्राउज़र में चेकबॉक्स या रेडियो बटन की स्थिति सेट करता है।
cmd.canvas_upload.label = सक्षम करें: canvas_upload
cmd.canvas_upload.description = सुरक्षा-जाँचा हुआ होस्ट फ़ाइल Playwright फ़ाइल फ़ील्ड के माध्यम से कैनवास/ब्राउज़र में अपलोड करता है।
cmd.canvas_console.label = सक्षम करें: canvas_console
cmd.canvas_console.description = कैनवास/ब्राउज़र से हाल के JavaScript कंसोल संदेश और पेज त्रुटियाँ प्राप्त करता है।
cmd.canvas_annotations.label = सक्षम करें: canvas_annotations
cmd.canvas_annotations.description = वर्तमान कैनवास/ब्राउज़र सत्र में उपयोगकर्ता द्वारा छोड़े गए एनोटेशन प्राप्त करता है।
cmd.canvas_clear_annotations.label = सक्षम करें: canvas_clear_annotations
cmd.canvas_clear_annotations.description = कैनवास/ब्राउज़र एनोटेशन साफ़ करता है।
cmd.web_server_start.label = सक्षम करें: web_server_start
cmd.web_server_start.description = चुनी गई कार्य डायरेक्टरी के लिए केवल loopback पर स्थानीय स्थिर प्रीव्यू सर्वर शुरू करता है।
cmd.web_server_current.label = सक्षम करें: web_server_current
cmd.web_server_current.description = वर्तमान प्रीव्यू सर्वर स्थिति प्राप्त करता है।
cmd.web_server_stop.label = सक्षम करें: web_server_stop
cmd.web_server_stop.description = प्रीव्यू सर्वर रोकता है।
