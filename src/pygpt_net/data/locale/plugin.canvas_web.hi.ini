ui.annotate_element = AI के लिए एलिमेंट पर एनोटेशन करें…
ui.annotation_title = AI के लिए एनोटेशन
ui.annotation_selection_prompt = चुनी हुई सामग्री के लिए टिप्पणी / निर्देश:
