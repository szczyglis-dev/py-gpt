[LOCALE]
plugin.name = Plátno (inline)
plugin.description = Poskytuje interné prostredie plátna/prehliadača pre HTML a JavaScript, prototypovanie webov, interakciu obmedzenú na prehliadač, automatizáciu Playwright, anotácie a ľahký náhľadový server. Táto funkcia bude v budúcich verziách ďalej rozširovaná.
use_sandbox.label = Použiť sandbox (Playwright)
use_sandbox.description = Zapne izolovaný backend prehliadača Playwright. Ak je vypnutý, Canvas používa vstavaný QWebEngine a Playwright nespúšťa.
playwright_engine.label = Engine Playwright
playwright_engine.description = Engine prehliadača používaný izolovaným backendom Playwright.
playwright_path.label = Adresár prehliadačov Playwright
playwright_path.description = Voliteľný PLAYWRIGHT_BROWSERS_PATH. Nechajte prázdne pre predvolenú hodnotu Playwright.
playwright_args.label = Argumenty prehliadača Playwright
playwright_args.description = Voliteľné spúšťacie argumenty Chromium/Playwright oddelené čiarkami.
default_width.label = Predvolená šírka viewportu
default_width.description = Predvolená šírka viewportu prehliadača v pixeloch.
default_height.label = Predvolená výška viewportu
default_height.description = Predvolená výška viewportu prehliadača v pixeloch.
auto_open_split.label = Automaticky otvoriť prehliadač v rozdelenom zobrazení
auto_open_split.description = Pri prvom otvorení prehliadača agentom v relácii vytvorí alebo zameria kartu Canvas v druhom stĺpci a zobrazí rozdelené zobrazenie. Po ručnom skrytí ho v tej istej relácii znova nevynucuje.
annotation_prompt.label = Sprístupniť anotácie používateľa modelu
annotation_prompt.description = Pridá čakajúce anotácie prehliadača/plátna do systémového promptu behu.
max_annotations.label = Maximálny počet anotácií
max_annotations.description = Maximálny počet anotácií uchovaných v aktuálnej relácii prehliadača.
console_limit.label = Limit protokolu konzoly
console_limit.description = Maximálny počet položiek konzoly prehliadača uchovaných v pamäti.
cmd.canvas_open.label = Povoliť: canvas_open
cmd.canvas_open.description = Otvorí alebo naviguje trvalé prostredie plátna/prehliadača. Predvolený je QWebEngine; Playwright len po povolení v nastavení pluginu.
cmd.canvas_change_resolution.label = Povoliť: canvas_change_resolution
cmd.canvas_change_resolution.description = Zmení veľkosť a orientáciu viewportu plátna/prehliadača.
cmd.canvas_set_html.label = Povoliť: canvas_set_html
cmd.canvas_set_html.description = Vyrenderuje ľubovoľné HTML/CSS/JavaScript v trvalom prostredí plátna/prehliadača.
cmd.canvas_get_html.label = Povoliť: canvas_get_html
cmd.canvas_get_html.description = Vráti aktuálnu URL plátna/prehliadača a serializovaný HTML dokument.
cmd.canvas_current.label = Povoliť: canvas_current
cmd.canvas_current.description = Vráti aktuálny stav relácie plátna/prehliadača.
cmd.canvas_close.label = Povoliť: canvas_close
cmd.canvas_close.description = Zavrie viditeľnú kartu plátna v PyGPT bez ukončenia relácie prehliadača na pozadí.
cmd.canvas_prev.label = Povoliť: canvas_prev
cmd.canvas_prev.description = Prejde späť v histórii plátna/prehliadača.
cmd.canvas_next.label = Povoliť: canvas_next
cmd.canvas_next.description = Prejde dopredu v histórii plátna/prehliadača.
cmd.canvas_reload.label = Povoliť: canvas_reload
cmd.canvas_reload.description = Znovu načíta aktuálny dokument plátna/prehliadača.
cmd.canvas_screenshot.label = Povoliť: canvas_screenshot
cmd.canvas_screenshot.description = Vytvorí snímku aktuálneho viewportu plátna/prehliadača vrátane virtuálneho kurzora modelu.
cmd.canvas_inspect.label = Povoliť: canvas_inspect
cmd.canvas_inspect.description = Preskúma viditeľné/interaktívne prvky DOM a vráti stabilné selektory a hranice.
cmd.canvas_click.label = Povoliť: canvas_click
cmd.canvas_click.description = Klikne na prvok alebo súradnice iba v plátne/prehliadači.
cmd.canvas_hover.label = Povoliť: canvas_hover
cmd.canvas_hover.description = Presunie virtuálny kurzor modelu a vykoná hover v plátne/prehliadači.
cmd.canvas_type.label = Povoliť: canvas_type
cmd.canvas_type.description = Zameria upraviteľný prvok a zadá text v plátne/prehliadači.
cmd.canvas_key.label = Povoliť: canvas_key
cmd.canvas_key.description = Odošle kláves alebo klávesovú skratku iba do plátna/prehliadača.
cmd.canvas_scroll.label = Povoliť: canvas_scroll
cmd.canvas_scroll.description = Posunie viewport plátna/prehliadača.
cmd.canvas_drag.label = Povoliť: canvas_drag
cmd.canvas_drag.description = Pretiahne medzi dvoma súradnicami viewportu v plátne/prehliadači.
cmd.canvas_wait.label = Povoliť: canvas_wait
cmd.canvas_wait.description = Počká na selektor alebo krátky čas v prostredí plátna/prehliadača.
cmd.canvas_eval.label = Povoliť: canvas_eval
cmd.canvas_eval.description = Spustí JavaScript na aktuálnej stránke plátna/prehliadača.
cmd.canvas_select.label = Povoliť: canvas_select
cmd.canvas_select.description = Vyberie možnosť v prvku select v plátne/prehliadači.
cmd.canvas_check.label = Povoliť: canvas_check
cmd.canvas_check.description = Nastaví stav zaškrtávacieho alebo prepínacieho prvku v plátne/prehliadači.
cmd.canvas_upload.label = Povoliť: canvas_upload
cmd.canvas_upload.description = Nahrá bezpečnostne overený hostiteľský súbor cez súborový vstup Playwright v plátne/prehliadači.
cmd.canvas_console.label = Povoliť: canvas_console
cmd.canvas_console.description = Vráti nedávne správy konzoly JavaScript a chyby stránky z plátna/prehliadača.
cmd.canvas_annotations.label = Povoliť: canvas_annotations
cmd.canvas_annotations.description = Vráti anotácie používateľa z aktuálnej relácie plátna/prehliadača.
cmd.canvas_clear_annotations.label = Povoliť: canvas_clear_annotations
cmd.canvas_clear_annotations.description = Vymaže anotácie plátna/prehliadača.
cmd.web_server_start.label = Povoliť: web_server_start
cmd.web_server_start.description = Spustí statický náhľadový server dostupný iba cez loopback pre vybraný pracovný adresár.
cmd.web_server_current.label = Povoliť: web_server_current
cmd.web_server_current.description = Vráti aktuálny stav náhľadového servera.
cmd.web_server_stop.label = Povoliť: web_server_stop
cmd.web_server_stop.description = Zastaví náhľadový server.
