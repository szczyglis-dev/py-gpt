[LOCALE]
auto_attach.description = Aggiunge automaticamente la memoria globale o di progetto attiva al prompt di sistema in ogni conversazione.
auto_attach.label = Allega automaticamente la memoria a ogni conversazione
auto_attach.tooltip = Aggiunge automaticamente la memoria globale o di progetto attiva al prompt di sistema in ogni conversazione.
auto_attach_project.description = Aggiunge automaticamente la memoria al prompt di sistema quando la conversazione corrente appartiene a un progetto.
auto_attach_project.label = Allega automaticamente la memoria solo nei progetti
auto_attach_project.tooltip = Aggiunge automaticamente la memoria al prompt di sistema quando la conversazione corrente appartiene a un progetto.
cmd.memory_add.description = Aggiunge solo informazioni molto importanti e durevoli alla memoria globale o di progetto corrente. Usa questo strumento con parsimonia; non salvare dettagli di routine, temporanei o di scarso valore.
cmd.memory_add.label = Aggiungi alla memoria
cmd.memory_add.tooltip = Aggiungi solo informazioni importanti e durevoli. Usa memory_add con parsimonia.
cmd.memory_clear.description = Cancella la memoria dell’ambito corrente. Il modello deve prima chiedere una conferma esplicita all’utente e chiamare questo strumento solo dopo la conferma.
cmd.memory_clear.label = Cancella memoria
cmd.memory_clear.tooltip = Cancella la memoria dell’ambito corrente. Il modello deve prima chiedere una conferma esplicita all’utente e chiamare questo strumento solo dopo la conferma.
cmd.memory_get.description = Legge la memoria completa per l’ambito globale o di progetto corrente.
cmd.memory_get.label = Leggi memoria
cmd.memory_get.tooltip = Legge la memoria completa per l’ambito globale o di progetto corrente.
cmd.memory_update.description = Sostituisce l’intero contenuto della memoria per l’ambito globale o di progetto corrente.
cmd.memory_update.label = Aggiorna memoria
cmd.memory_update.tooltip = Sostituisce l’intero contenuto della memoria per l’ambito globale o di progetto corrente.
max_chars.description = Dimensione massima obiettivo della memoria in caratteri. Al modello viene chiesto di restare entro questo limite; sono consentiti 300 caratteri aggiuntivi di margine di sicurezza prima del troncamento forzato.
max_chars.label = Numero massimo di caratteri della memoria
max_chars.tooltip = Dimensione obiettivo della memoria in caratteri; sono consentiti 300 caratteri di margine di sicurezza prima del troncamento.
model_update.description = Modello usato per gli aggiornamenti automatici della memoria e, se abilitato, per rielaborare le operazioni memory_add.
model_update.label = Modello di aggiornamento memoria
model_update.tooltip = Modello usato per aggiornare e rielaborare la memoria.
refine_add.description = Si applica solo alle chiamate manuali a memory_add. Se attivata, il modello configurato per l’aggiornamento della memoria integra e riscrive l’informazione aggiunta nella memoria esistente invece di accodare testo grezzo. Gli aggiornamenti automatici della memoria a fine contesto vengono sempre rielaborati dal modello indipendentemente da questa impostazione.
refine_add.label = Rielabora la memoria prima di aggiungere
refine_add.tooltip = Rielabora le chiamate manuali a memory_add con il modello configurato. Gli aggiornamenti automatici della memoria vengono sempre rielaborati.
plugin.description = Fornisce memoria a lungo termine globale e per progetto memorizzata nel database locale.
plugin.name = Memory (inline)
