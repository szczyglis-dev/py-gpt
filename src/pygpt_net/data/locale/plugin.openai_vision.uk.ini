[LOCALE]
cmd.camera_capture.description = Дозволяє виконання команди camera_capture.\nЯкщо увімкнено, модель зможе самостійно захоплювати зображення з камери. Опція Виконання команд повинна бути активована.
cmd.camera_capture.label = Увімкнення: захоплення зображень з камери
cmd.camera_capture.tooltip = Приклад prompt: Захопи зображення з моєї веб-камери.
cmd.make_screenshot.description = Дозволяє виконання команди make_screenshot.\nЯкщо увімкнено, модель зможе самостійно робити знімки екрану. Опція Виконання команд повинна бути активована.
cmd.make_screenshot.label = Увімкнення: створення знімків екрану
cmd.make_screenshot.tooltip = Приклад prompt: Зроби знімок екрана і опиши, що ти бачиш.
model.description = Модель Chat із підтримкою зображень, яка тимчасово використовується для аналізу зображень. Можна використовувати модель будь-якого підтримуваного провайдера; типово це "gpt-4o".
model.label = Модель
plugin.description = Додає аналіз зображень до підтримуваних режимів чату. Коли виявлено зображення, PyGPT тимчасово спрямовує запит через режим Chat із налаштованою моделлю, що підтримує зображення. Можна вибирати моделі будь-якого підтримуваного провайдера.
plugin.name = Vision (inline)
prompt.description = Prompt для вбудованого аналізу зображень. Він додається до поточного системного prompt або замінює його під час тимчасового використання моделі з підтримкою зображень у режимі Chat.
prompt.label = Prompt
replace_prompt.description = Замінює весь системний prompt на prompt аналізу зображення замість додавання його до поточного prompt.
replace_prompt.label = Замінити prompt
