[LOCALE]
plugin.name = Rityta och HTML
plugin.description = BETA. Ger en intern arbetsyta/webbläsarmiljö för HTML och JavaScript, webbprototyper, webbläsarbegränsad interaktion, Playwright-automatisering, annoteringar och en lätt förhandsvisningsserver. Funktionen kommer att byggas ut i framtida versioner.
use_sandbox.label = Använd sandbox (Playwright)
use_sandbox.description = Aktiverar den isolerade Playwright-webbläsarbackenden. När den är avstängd använder Rityta och HTML den inbyggda QWebEngine-webbläsaren och startar inte Playwright.
playwright_engine.label = Playwright-motor
playwright_engine.description = Webbläsarmotor som används av den isolerade Playwright-backenden.
playwright_path.label = Playwright-webbläsarkatalog
playwright_path.description = Valfri PLAYWRIGHT_BROWSERS_PATH. Lämna tomt för att använda Playwrights standard.
playwright_args.label = Playwright-webbläsarargument
playwright_args.description = Valfria, kommaseparerade startargument för Chromium/Playwright.
default_width.label = Standardbredd för visningsyta
default_width.description = Standardbredd för webbläsarens visningsyta i pixlar.
default_height.label = Standardhöjd för visningsyta
default_height.description = Standardhöjd för webbläsarens visningsyta i pixlar.
auto_open_split.label = Öppna webbläsaren automatiskt i delad vy
auto_open_split.description = Vid första agentstyrda webbläsaröppningen i en session skapas eller fokuseras fliken Rityta och HTML i den andra kolumnen och delad vy visas. Om användaren senare döljer den tvingas den inte fram igen i samma session.
annotation_prompt.label = Visa användarannoteringar för modellen
annotation_prompt.description = Lägger väntande webbläsar-/arbetsyteannoteringar till runtime-systemprompten.
max_annotations.label = Maximalt antal annoteringar
max_annotations.description = Maximalt antal annoteringar som sparas i den aktuella webbläsarsessionen.
console_limit.label = Gräns för konsollogg
console_limit.description = Maximalt antal poster i webbläsarkonsolen som sparas i minnet.
cmd.canvas_open.label = Aktivera: canvas_open
cmd.canvas_open.description = Öppnar eller navigerar i den beständiga arbetsyta-/webbläsarmiljön. QWebEngine används som standard; Playwright endast när det är aktiverat i plugininställningarna.
cmd.canvas_change_resolution.label = Aktivera: canvas_change_resolution
cmd.canvas_change_resolution.description = Ändrar storlek och orientering för arbetsytans/webbläsarens visningsyta.
cmd.canvas_set_html.label = Aktivera: canvas_set_html
cmd.canvas_set_html.description = Renderar valfri HTML/CSS/JavaScript i den beständiga arbetsyta-/webbläsarmiljön.
cmd.canvas_get_html.label = Aktivera: canvas_get_html
cmd.canvas_get_html.description = Hämtar aktuell arbetsyta-/webbläsar-URL och det serialiserade HTML-dokumentet.
cmd.canvas_current.label = Aktivera: canvas_current
cmd.canvas_current.description = Hämtar aktuell sessionsstatus för arbetsyta/webbläsare.
cmd.canvas_close.label = Aktivera: canvas_close
cmd.canvas_close.description = Stänger den synliga arbetsytefliken i PyGPT utan att avsluta webbläsarsessionen i bakgrunden.
cmd.canvas_prev.label = Aktivera: canvas_prev
cmd.canvas_prev.description = Går bakåt i arbetsytans/webbläsarens historik.
cmd.canvas_next.label = Aktivera: canvas_next
cmd.canvas_next.description = Går framåt i arbetsytans/webbläsarens historik.
cmd.canvas_reload.label = Aktivera: canvas_reload
cmd.canvas_reload.description = Laddar om aktuellt arbetsyta-/webbläsardokument.
cmd.canvas_screenshot.label = Aktivera: canvas_screenshot
cmd.canvas_screenshot.description = Tar en bild av aktuell arbetsyta-/webbläsarvy med modellens virtuella markör.
cmd.canvas_inspect.label = Aktivera: canvas_inspect
cmd.canvas_inspect.description = Inspekterar synliga/interaktiva DOM-element och returnerar stabila selektorer och gränser.
cmd.canvas_click.label = Aktivera: canvas_click
cmd.canvas_click.description = Klickar på ett element eller koordinater endast inne i arbetsyta/webbläsare.
cmd.canvas_hover.label = Aktivera: canvas_hover
cmd.canvas_hover.description = Flyttar modellens virtuella markör och utför hover inne i arbetsyta/webbläsare.
cmd.canvas_type.label = Aktivera: canvas_type
cmd.canvas_type.description = Fokuserar ett redigerbart element och skriver text i arbetsyta/webbläsare.
cmd.canvas_key.label = Aktivera: canvas_key
cmd.canvas_key.description = Skickar en tangent eller tangentkombination endast till arbetsyta/webbläsare.
cmd.canvas_scroll.label = Aktivera: canvas_scroll
cmd.canvas_scroll.description = Rullar arbetsytans/webbläsarens visningsyta.
cmd.canvas_drag.label = Aktivera: canvas_drag
cmd.canvas_drag.description = Drar mellan två koordinater i arbetsyta/webbläsare.
cmd.canvas_wait.label = Aktivera: canvas_wait
cmd.canvas_wait.description = Väntar på en selektor eller en kort tid i arbetsyta-/webbläsarmiljön.
cmd.canvas_eval.label = Aktivera: canvas_eval
cmd.canvas_eval.description = Kör JavaScript på aktuell arbetsyta-/webbläsarsida.
cmd.canvas_select.label = Aktivera: canvas_select
cmd.canvas_select.description = Väljer ett alternativ i ett select-element i arbetsyta/webbläsare.
cmd.canvas_check.label = Aktivera: canvas_check
cmd.canvas_check.description = Ställer in läget för en kryssruta eller radioknapp i arbetsyta/webbläsare.
cmd.canvas_upload.label = Aktivera: canvas_upload
cmd.canvas_upload.description = Laddar upp en säkerhetsvaliderad värdfil via ett Playwright-filfält i arbetsyta/webbläsare.
cmd.canvas_console.label = Aktivera: canvas_console
cmd.canvas_console.description = Hämtar senaste JavaScript-konsolmeddelanden och sidfel från arbetsyta/webbläsare.
cmd.canvas_annotations.label = Aktivera: canvas_annotations
cmd.canvas_annotations.description = Hämtar användarannoteringar från aktuell arbetsyta-/webbläsarsession.
cmd.canvas_clear_annotations.label = Aktivera: canvas_clear_annotations
cmd.canvas_clear_annotations.description = Rensar arbetsyta-/webbläsarannoteringar.
cmd.web_server_start.label = Aktivera: web_server_start
cmd.web_server_start.description = Startar en statisk förhandsvisningsserver endast på loopback för en vald arbetskatalog.
cmd.web_server_current.label = Aktivera: web_server_current
cmd.web_server_current.description = Hämtar aktuell status för förhandsvisningsservern.
cmd.web_server_stop.label = Aktivera: web_server_stop
cmd.web_server_stop.description = Stoppar förhandsvisningsservern.
