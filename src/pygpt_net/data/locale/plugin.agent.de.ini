[LOCALE]
auto_stop.description = Wenn aktiviert, wird das Plugin nach Erreichen des Ziels stoppen.
auto_stop.label = Auto-Stopp nach Erreichen des Ziels
auto_stop.tooltip = Wenn aktiviert, wird das Plugin nach Erreichen des Ziels stoppen.
iterations.description = Wie viele Iterationen sollen ausgeführt werden? 0 = unendlich.\nWARNUNG: Das Setzen auf 0 kann viele Anfragen und eine starke Token-Nutzung verursachen!
iterations.label = Iterationen
iterations.tooltip = Wie viele Iterationen sollen ausgeführt werden? 0 = unendlich.\nWARNUNG: Das Setzen auf 0 kann viele Anfragen und eine starke Token-Nutzung verursachen!
plugin.description = Aktiviert den autonomen Modus in jedem Chat-Modus. WARNUNG: Bitte vorsichtig verwenden; zusammen mit anderen Plugins sind unerwartete Ergebnisse möglich.
plugin.name = Autonomer Modus
prompts.description = Prompt, der anweist, wie der autonome Modus behandelt werden soll; du kannst so viele Prompts erstellen, wie du möchtest. Der erste aktive Prompt auf der Liste wird verwendet, um den autonomen Modus zu handhaben. INFO: Mindestens ein aktiver Prompt ist erforderlich!
prompts.label = Prompts
prompts.tooltip = Prompts, die anweisen, wie der autonome Modus gehandhabt werden soll.
reverse_roles.description = Wenn aktiviert, werden die Rollen zwischen den Iterationen umgekehrt (nur im Vervollständigungsmodus).
reverse_roles.label = Rollenumkehr zwischen Iterationen
reverse_roles.tooltip = Wenn aktiviert, werden die Rollen zwischen den Iterationen umgekehrt.
use_extended.description = Wenn aktiviert, wird der erweiterte Prompt anstelle des standardmäßigen verwendet.
use_extended.label = Erweiterten Prompt verwenden
always_continue.description = Wenn aktiviert, setzt der Agent das Schlussfolgern fort, bis er manuell gestoppt wird.
always_continue.label = Immer fortfahren...
always_continue.tooltip = Wenn aktiviert, setzt der Agent das Schlussfolgern fort, bis er manuell gestoppt wird.

