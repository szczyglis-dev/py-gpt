[LOCALE]
plugin.description = Oferă acces la instrumente la distanță prin Model Context Protocol (MCP), inclusiv transporturile stdio, SSE și Streamable HTTP, cu filtre de permitere/blocare pe server, suport pentru antetul Authorization și cache pentru instrumente.
plugin.name = MCP
servers.description = Configurați serverele MCP. Transporturi acceptate: 'stdio: <command ...>' pentru stdio, 'http(s)://...' pentru Streamable HTTP și 'http(s)://.../sse' (sau 'sse://', 'sse+http(s)://') pentru SSE. Folosiți 'label' ca nume scurt al serverului, 'authorization' pentru antetul Authorization la HTTP/SSE, 'allowed_commands' (separate prin virgulă) pentru a permite doar anumite instrumente și 'disabled_commands' pentru a bloca instrumente ale serverului.
servers.label = Servere MCP
servers.tooltip = Necesită MCP Python SDK. Instalare: pip install "mcp[cli]"
tools_cache_enabled.description = Activează un cache în memorie pentru instrumentele descoperite, evitând redescoperirea lor la fiecare cerere.
tools_cache_enabled.label = Memorează lista de instrumente în cache
tools_cache_enabled.tooltip = Când este activat, rezultatele descoperirii instrumentelor sunt memorate în cache separat pentru fiecare server pe durata TTL.
tools_cache_ttl.description = Durata de viață a cache-ului de instrumente pentru fiecare server.
tools_cache_ttl.label = TTL cache (secunde)
tools_cache_ttl.tooltip = Setați 0 pentru a dezactiva TTL (nerecomandat).
