[LOCALE]
plugin.name = 画布和 HTML
plugin.description = BETA. 提供内部画布/浏览器运行环境，用于 HTML 与 JavaScript、网站原型、浏览器范围内交互、Playwright 自动化、批注以及轻量预览服务器。 此功能将在后续版本中继续扩展。
use_sandbox.label = 使用沙箱 (Playwright)
use_sandbox.description = 启用隔离的 Playwright 浏览器后端。关闭时，画布和 HTML 使用内置 QWebEngine 浏览器，并且不会尝试启动 Playwright。
playwright_engine.label = Playwright 引擎
playwright_engine.description = 隔离 Playwright 后端使用的浏览器引擎。
playwright_path.label = Playwright 浏览器目录
playwright_path.description = 可选的 PLAYWRIGHT_BROWSERS_PATH。留空以使用 Playwright 默认值。
playwright_args.label = Playwright 浏览器参数
playwright_args.description = 可选的 Chromium/Playwright 启动参数，使用逗号分隔。
default_width.label = 默认视口宽度
default_width.description = 浏览器视口的默认宽度（像素）。
default_height.label = 默认视口高度
default_height.description = 浏览器视口的默认高度（像素）。
auto_open_split.label = 自动在分屏中打开浏览器
auto_open_split.description = 在一次会话中代理首次打开浏览器时，在第二列创建或聚焦“画布和 HTML”标签并显示分屏。如果用户之后将其隐藏，则本会话不会再次强制打开。
annotation_prompt.label = 向模型提供用户批注
annotation_prompt.description = 将待处理的浏览器/画布批注附加到运行时系统提示中。
max_annotations.label = 最大批注数
max_annotations.description = 当前浏览器会话中保留的最大批注数量。
console_limit.label = 控制台日志上限
console_limit.description = 内存中保留的最大浏览器控制台条目数。
cmd.canvas_open.label = 启用: canvas_open
cmd.canvas_open.description = 打开或导航持久画布/浏览器运行环境。默认使用 QWebEngine；只有在插件设置中启用后才使用 Playwright。
cmd.canvas_change_resolution.label = 启用: canvas_change_resolution
cmd.canvas_change_resolution.description = 更改画布/浏览器视口的尺寸和方向。
cmd.canvas_set_html.label = 启用: canvas_set_html
cmd.canvas_set_html.description = 在持久画布/浏览器运行环境中渲染任意 HTML/CSS/JavaScript。
cmd.canvas_get_html.label = 启用: canvas_get_html
cmd.canvas_get_html.description = 获取当前画布/浏览器 URL 和序列化后的 HTML 文档。
cmd.canvas_current.label = 启用: canvas_current
cmd.canvas_current.description = 获取当前画布/浏览器会话状态。
cmd.canvas_close.label = 启用: canvas_close
cmd.canvas_close.description = 关闭 PyGPT 中可见的画布标签，但不销毁后台浏览器会话。
cmd.canvas_prev.label = 启用: canvas_prev
cmd.canvas_prev.description = 在画布/浏览器历史记录中后退。
cmd.canvas_next.label = 启用: canvas_next
cmd.canvas_next.description = 在画布/浏览器历史记录中前进。
cmd.canvas_reload.label = 启用: canvas_reload
cmd.canvas_reload.description = 重新加载当前画布/浏览器文档。
cmd.canvas_screenshot.label = 启用: canvas_screenshot
cmd.canvas_screenshot.description = 截取当前画布/浏览器视口，并包含模型的虚拟光标。
cmd.canvas_inspect.label = 启用: canvas_inspect
cmd.canvas_inspect.description = 检查可见/可交互 DOM 元素，并返回稳定选择器和元素边界。
cmd.canvas_click.label = 启用: canvas_click
cmd.canvas_click.description = 仅在画布/浏览器内部点击元素或坐标。
cmd.canvas_hover.label = 启用: canvas_hover
cmd.canvas_hover.description = 移动模型虚拟光标，并在画布/浏览器内部执行悬停。
cmd.canvas_type.label = 启用: canvas_type
cmd.canvas_type.description = 聚焦可编辑元素并在画布/浏览器中输入文本。
cmd.canvas_key.label = 启用: canvas_key
cmd.canvas_key.description = 仅向画布/浏览器发送按键或键盘快捷键。
cmd.canvas_scroll.label = 启用: canvas_scroll
cmd.canvas_scroll.description = 滚动画布/浏览器视口。
cmd.canvas_drag.label = 启用: canvas_drag
cmd.canvas_drag.description = 在画布/浏览器中的两个视口坐标之间拖动。
cmd.canvas_wait.label = 启用: canvas_wait
cmd.canvas_wait.description = 在画布/浏览器运行环境中等待选择器或短暂等待。
cmd.canvas_eval.label = 启用: canvas_eval
cmd.canvas_eval.description = 在当前画布/浏览器页面中执行 JavaScript。
cmd.canvas_select.label = 启用: canvas_select
cmd.canvas_select.description = 在画布/浏览器的 select 元素中选择选项。
cmd.canvas_check.label = 启用: canvas_check
cmd.canvas_check.description = 设置画布/浏览器中复选框或单选按钮的状态。
cmd.canvas_upload.label = 启用: canvas_upload
cmd.canvas_upload.description = 通过 Playwright 文件输入控件将经过安全校验的主机文件上传到画布/浏览器。
cmd.canvas_console.label = 启用: canvas_console
cmd.canvas_console.description = 获取画布/浏览器最近的 JavaScript 控制台消息和页面错误。
cmd.canvas_annotations.label = 启用: canvas_annotations
cmd.canvas_annotations.description = 获取用户在当前画布/浏览器会话中留下的批注。
cmd.canvas_clear_annotations.label = 启用: canvas_clear_annotations
cmd.canvas_clear_annotations.description = 清除画布/浏览器批注。
cmd.web_server_start.label = 启用: web_server_start
cmd.web_server_start.description = 为选定工作目录启动仅监听 loopback 的本地静态预览服务器。
cmd.web_server_current.label = 启用: web_server_current
cmd.web_server_current.description = 获取当前预览服务器状态。
cmd.web_server_stop.label = 启用: web_server_stop
cmd.web_server_stop.description = 停止预览服务器。
ui.back = 后退
ui.next = 前进
ui.reload = 重新加载
ui.open_url = 打开 URL
ui.address_placeholder = 输入 URL 或本地路径并按 Enter
ui.copy = 复制
ui.select_all = 全选
ui.annotate_selection = 为 AI 批注所选内容…
ui.annotate_element = 为 AI 批注元素…
ui.annotation_title = 为 AI 添加批注
ui.annotation_selection_prompt = 对所选内容的评论 / 指令：
ui.annotation_element_prompt = 对此元素的评论 / 指令：
ui.annotation_added = 已为 AI 添加画布/浏览器批注
ui.annotation_removed = 已移除画布/浏览器批注
ui.show_source = 显示源代码
ui.back_to_canvas = 返回画布 / HTML
ui.cancel = 取消
ui.add = 添加
ui.remove_annotation = 移除批注
