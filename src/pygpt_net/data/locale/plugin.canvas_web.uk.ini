[LOCALE]
plugin.name = Полотно (inline)
plugin.description = Надає внутрішнє середовище полотна/браузера для HTML і JavaScript, прототипування сайтів, дій у межах браузера, автоматизації Playwright, анотацій і легкого сервера попереднього перегляду. Цю функцію буде розширено в майбутніх версіях.
use_sandbox.label = Використовувати пісочницю (Playwright)
use_sandbox.description = Вмикає ізольований браузерний backend Playwright. Якщо вимкнено, Canvas використовує вбудований QWebEngine і не запускає Playwright.
playwright_engine.label = Рушій Playwright
playwright_engine.description = Рушій браузера для ізольованого backend Playwright.
playwright_path.label = Каталог браузерів Playwright
playwright_path.description = Необов’язковий PLAYWRIGHT_BROWSERS_PATH. Залиште порожнім для типового значення Playwright.
playwright_args.label = Аргументи браузера Playwright
playwright_args.description = Необов’язкові аргументи запуску Chromium/Playwright, розділені комами.
default_width.label = Типова ширина області перегляду
default_width.description = Типова ширина області перегляду браузера в пікселях.
default_height.label = Типова висота області перегляду
default_height.description = Типова висота області перегляду браузера в пікселях.
auto_open_split.label = Автоматично відкривати браузер у розділеному вигляді
auto_open_split.description = Під час першого відкриття браузера агентом у сесії створює або фокусує вкладку Canvas у другій колонці та показує розділений вигляд. Після ручного приховування не примушує відкривати його знову в цій сесії.
annotation_prompt.label = Передавати анотації користувача моделі
annotation_prompt.description = Додає очікувані анотації браузера/полотна до системного prompt середовища виконання.
max_annotations.label = Максимум анотацій
max_annotations.description = Максимальна кількість анотацій, що зберігаються в поточній сесії браузера.
console_limit.label = Ліміт журналу консолі
console_limit.description = Максимальна кількість записів консолі браузера, що зберігаються в пам’яті.
cmd.canvas_open.label = Увімкнути: canvas_open
cmd.canvas_open.description = Відкриває або виконує навігацію в постійному середовищі полотна/браузера. Типово використовується QWebEngine; Playwright — лише якщо його ввімкнено в налаштуваннях плагіна.
cmd.canvas_change_resolution.label = Увімкнути: canvas_change_resolution
cmd.canvas_change_resolution.description = Змінює розмір і орієнтацію області перегляду полотна/браузера.
cmd.canvas_set_html.label = Увімкнути: canvas_set_html
cmd.canvas_set_html.description = Відображає довільний HTML/CSS/JavaScript у постійному середовищі полотна/браузера.
cmd.canvas_get_html.label = Увімкнути: canvas_get_html
cmd.canvas_get_html.description = Повертає поточний URL полотна/браузера та серіалізований HTML-документ.
cmd.canvas_current.label = Увімкнути: canvas_current
cmd.canvas_current.description = Повертає поточний стан сесії полотна/браузера.
cmd.canvas_close.label = Увімкнути: canvas_close
cmd.canvas_close.description = Закриває видиму вкладку полотна в PyGPT, не знищуючи фонову сесію браузера.
cmd.canvas_prev.label = Увімкнути: canvas_prev
cmd.canvas_prev.description = Переходить назад в історії полотна/браузера.
cmd.canvas_next.label = Увімкнути: canvas_next
cmd.canvas_next.description = Переходить уперед в історії полотна/браузера.
cmd.canvas_reload.label = Увімкнути: canvas_reload
cmd.canvas_reload.description = Перезавантажує поточний документ полотна/браузера.
cmd.canvas_screenshot.label = Увімкнути: canvas_screenshot
cmd.canvas_screenshot.description = Створює знімок поточної області перегляду полотна/браузера з віртуальним курсором моделі.
cmd.canvas_inspect.label = Увімкнути: canvas_inspect
cmd.canvas_inspect.description = Перевіряє видимі/інтерактивні DOM-елементи та повертає стабільні селектори й межі.
cmd.canvas_click.label = Увімкнути: canvas_click
cmd.canvas_click.description = Натискає елемент або координати лише всередині полотна/браузера.
cmd.canvas_hover.label = Увімкнути: canvas_hover
cmd.canvas_hover.description = Переміщує віртуальний курсор моделі та виконує наведення всередині полотна/браузера.
cmd.canvas_type.label = Увімкнути: canvas_type
cmd.canvas_type.description = Фокусує редагований елемент і вводить текст у полотні/браузері.
cmd.canvas_key.label = Увімкнути: canvas_key
cmd.canvas_key.description = Надсилає клавішу або комбінацію лише до полотна/браузера.
cmd.canvas_scroll.label = Увімкнути: canvas_scroll
cmd.canvas_scroll.description = Прокручує область перегляду полотна/браузера.
cmd.canvas_drag.label = Увімкнути: canvas_drag
cmd.canvas_drag.description = Перетягує між двома координатами області перегляду в полотні/браузері.
cmd.canvas_wait.label = Увімкнути: canvas_wait
cmd.canvas_wait.description = Чекає на селектор або короткий час у середовищі полотна/браузера.
cmd.canvas_eval.label = Увімкнути: canvas_eval
cmd.canvas_eval.description = Виконує JavaScript на поточній сторінці полотна/браузера.
cmd.canvas_select.label = Увімкнути: canvas_select
cmd.canvas_select.description = Вибирає варіант в елементі select полотна/браузера.
cmd.canvas_check.label = Увімкнути: canvas_check
cmd.canvas_check.description = Встановлює стан прапорця або перемикача в полотні/браузері.
cmd.canvas_upload.label = Увімкнути: canvas_upload
cmd.canvas_upload.description = Завантажує перевірений правилами безпеки файл хоста через файлове поле Playwright у полотні/браузері.
cmd.canvas_console.label = Увімкнути: canvas_console
cmd.canvas_console.description = Повертає останні повідомлення консолі JavaScript і помилки сторінки полотна/браузера.
cmd.canvas_annotations.label = Увімкнути: canvas_annotations
cmd.canvas_annotations.description = Повертає анотації користувача поточної сесії полотна/браузера.
cmd.canvas_clear_annotations.label = Увімкнути: canvas_clear_annotations
cmd.canvas_clear_annotations.description = Очищає анотації полотна/браузера.
cmd.web_server_start.label = Увімкнути: web_server_start
cmd.web_server_start.description = Запускає статичний сервер попереднього перегляду лише на loopback для вибраного робочого каталогу.
cmd.web_server_current.label = Увімкнути: web_server_current
cmd.web_server_current.description = Повертає поточний стан сервера попереднього перегляду.
cmd.web_server_stop.label = Увімкнути: web_server_stop
cmd.web_server_stop.description = Зупиняє сервер попереднього перегляду.
ui.back = Назад
ui.next = Далі
ui.reload = Перезавантажити
ui.open_url = Відкрити URL
ui.address_placeholder = Введіть URL або локальний шлях і натисніть Enter
ui.enable_hint = Увімкніть плагін Полотно
ui.copy = Копіювати
ui.select_all = Вибрати все
ui.annotate_selection = Анотувати виділення для ШІ…
ui.annotate_element = Анотувати елемент для ШІ…
ui.annotation_title = Анотація для ШІ
ui.annotation_selection_prompt = Коментар / інструкція для виділеного вмісту:
ui.annotation_element_prompt = Коментар / інструкція для цього елемента:
ui.annotation_added = Анотацію полотна/браузера додано для ШІ
ui.annotation_removed = Анотацію полотна/браузера видалено
ui.show_source = Показати вихідний код
ui.back_to_canvas = Назад до полотна / HTML
ui.cancel = Скасувати
ui.add = Додати
ui.remove_annotation = Видалити анотацію
