[LOCALE]
plugin.name = Pânză (inline)
plugin.description = Oferă un mediu intern de pânză/browser pentru HTML și JavaScript, prototipare web, interacțiune limitată la browser, automatizare Playwright, adnotări și un server ușor de previzualizare. Această funcționalitate va fi extinsă în versiunile viitoare.
use_sandbox.label = Folosește sandbox (Playwright)
use_sandbox.description = Activează backendul izolat de browser Playwright. Când este dezactivat, Canvas folosește browserul QWebEngine încorporat și nu pornește Playwright.
playwright_engine.label = Motor Playwright
playwright_engine.description = Motorul de browser folosit de backendul izolat Playwright.
playwright_path.label = Director browsere Playwright
playwright_path.description = PLAYWRIGHT_BROWSERS_PATH opțional. Lăsați gol pentru valoarea implicită Playwright.
playwright_args.label = Argumente browser Playwright
playwright_args.description = Argumente opționale de pornire Chromium/Playwright separate prin virgulă.
default_width.label = Lățime implicită viewport
default_width.description = Lățimea implicită a viewportului browserului în pixeli.
default_height.label = Înălțime implicită viewport
default_height.description = Înălțimea implicită a viewportului browserului în pixeli.
auto_open_split.label = Deschide automat browserul în ecran divizat
auto_open_split.description = La prima deschidere a browserului de către un agent într-o sesiune, creează sau focalizează fila Canvas în a doua coloană și afișează ecranul divizat. Dacă utilizatorul îl ascunde ulterior, nu îl forțează din nou în aceeași sesiune.
annotation_prompt.label = Expune adnotările utilizatorului modelului
annotation_prompt.description = Adaugă adnotările în așteptare ale browserului/pânzei la promptul de sistem al runtime-ului.
max_annotations.label = Număr maxim de adnotări
max_annotations.description = Numărul maxim de adnotări păstrate în sesiunea curentă a browserului.
console_limit.label = Limită jurnal consolă
console_limit.description = Numărul maxim de intrări din consola browserului păstrate în memorie.
cmd.canvas_open.label = Activează: canvas_open
cmd.canvas_open.description = Deschide sau navighează în mediul persistent pânză/browser. QWebEngine este folosit implicit; Playwright doar dacă este activat în setările pluginului.
cmd.canvas_change_resolution.label = Activează: canvas_change_resolution
cmd.canvas_change_resolution.description = Schimbă dimensiunea și orientarea viewportului pânză/browser.
cmd.canvas_set_html.label = Activează: canvas_set_html
cmd.canvas_set_html.description = Randează HTML/CSS/JavaScript arbitrar în mediul persistent pânză/browser.
cmd.canvas_get_html.label = Activează: canvas_get_html
cmd.canvas_get_html.description = Obține URL-ul curent al pânzei/browserului și documentul HTML serializat.
cmd.canvas_current.label = Activează: canvas_current
cmd.canvas_current.description = Obține starea curentă a sesiunii pânză/browser.
cmd.canvas_close.label = Activează: canvas_close
cmd.canvas_close.description = Închide fila vizibilă a pânzei în PyGPT fără a distruge sesiunea browserului din fundal.
cmd.canvas_prev.label = Activează: canvas_prev
cmd.canvas_prev.description = Revine în istoricul pânzei/browserului.
cmd.canvas_next.label = Activează: canvas_next
cmd.canvas_next.description = Avansează în istoricul pânzei/browserului.
cmd.canvas_reload.label = Activează: canvas_reload
cmd.canvas_reload.description = Reîncarcă documentul curent pânză/browser.
cmd.canvas_screenshot.label = Activează: canvas_screenshot
cmd.canvas_screenshot.description = Capturează viewportul curent pânză/browser cu cursorul virtual al modelului.
cmd.canvas_inspect.label = Activează: canvas_inspect
cmd.canvas_inspect.description = Inspectează elementele DOM vizibile/interactive și returnează selectori stabili și limite.
cmd.canvas_click.label = Activează: canvas_click
cmd.canvas_click.description = Face clic pe un element sau coordonate doar în interiorul pânzei/browserului.
cmd.canvas_hover.label = Activează: canvas_hover
cmd.canvas_hover.description = Mută cursorul virtual al modelului și execută hover în pânză/browser.
cmd.canvas_type.label = Activează: canvas_type
cmd.canvas_type.description = Focalizează un element editabil și introduce text în pânză/browser.
cmd.canvas_key.label = Activează: canvas_key
cmd.canvas_key.description = Trimite o tastă sau combinație doar către pânză/browser.
cmd.canvas_scroll.label = Activează: canvas_scroll
cmd.canvas_scroll.description = Derulează viewportul pânzei/browserului.
cmd.canvas_drag.label = Activează: canvas_drag
cmd.canvas_drag.description = Trage între două coordonate ale viewportului în pânză/browser.
cmd.canvas_wait.label = Activează: canvas_wait
cmd.canvas_wait.description = Așteaptă un selector sau o perioadă scurtă în mediul pânză/browser.
cmd.canvas_eval.label = Activează: canvas_eval
cmd.canvas_eval.description = Execută JavaScript în pagina curentă pânză/browser.
cmd.canvas_select.label = Activează: canvas_select
cmd.canvas_select.description = Selectează o opțiune într-un element select din pânză/browser.
cmd.canvas_check.label = Activează: canvas_check
cmd.canvas_check.description = Setează starea unei casete de selectare sau a unui buton radio în pânză/browser.
cmd.canvas_upload.label = Activează: canvas_upload
cmd.canvas_upload.description = Încarcă un fișier gazdă validat de securitate printr-un câmp de fișier Playwright în pânză/browser.
cmd.canvas_console.label = Activează: canvas_console
cmd.canvas_console.description = Obține mesajele recente din consola JavaScript și erorile paginii din pânză/browser.
cmd.canvas_annotations.label = Activează: canvas_annotations
cmd.canvas_annotations.description = Obține adnotările utilizatorului din sesiunea curentă pânză/browser.
cmd.canvas_clear_annotations.label = Activează: canvas_clear_annotations
cmd.canvas_clear_annotations.description = Șterge adnotările pânzei/browserului.
cmd.web_server_start.label = Activează: web_server_start
cmd.web_server_start.description = Pornește un server static de previzualizare doar pe loopback pentru un director de lucru selectat.
cmd.web_server_current.label = Activează: web_server_current
cmd.web_server_current.description = Obține starea curentă a serverului de previzualizare.
cmd.web_server_stop.label = Activează: web_server_stop
cmd.web_server_stop.description = Oprește serverul de previzualizare.
