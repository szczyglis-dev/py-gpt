sandbox.label = Sandbox
sandbox.description = Vypnuto: spouští systémové příkazy přímo na hostiteli (nebezpečné). Vestavěné: spouští příkazy ve vyhrazeném prostředí CPython spravovaném pomocí uv v samostatném procesu, ale neomezuje přístup k souborovému systému hostitele. Docker: vyžaduje nainstalovaný a spuštěný Docker a poskytuje nejsilnější izolaci; je to nejbezpečnější možnost. Bílá/černá listina se vztahuje na vyhrazené nástroje systémových příkazů na hostiteli, ve vestavěném sandboxu i v Dockeru.

