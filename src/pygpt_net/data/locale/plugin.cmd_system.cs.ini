sandbox.label = Sandbox
sandbox.description = Vypnuto: spouští systémové příkazy přímo na hostiteli (nebezpečné). Vestavěný sandbox: spouští příkazy ve vestavěném prostředí CPython spravovaném pomocí uv s izolací na úrovni OS, pokud je dostupná (střední úroveň zabezpečení). Docker: vyžaduje nainstalovaný a spuštěný Docker a poskytuje nejsilnější izolaci; je to nejbezpečnější možnost.
