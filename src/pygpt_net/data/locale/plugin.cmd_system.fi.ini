sandbox.label = Hiekkalaatikko
sandbox.description = Poistettu käytöstä: suorittaa järjestelmäkomennot suoraan isäntäjärjestelmässä (turvaton). Sisäänrakennettu hiekkalaatikko: suorittaa komennot uv:n hallitsemassa sisäänrakennetussa CPython-ympäristössä ja käyttää käyttöjärjestelmätason eristystä, kun se on saatavilla (keskitasoinen suojaus). Docker: edellyttää asennettua ja käynnissä olevaa Dockeria ja tarjoaa vahvimman eristyksen; se on turvallisin vaihtoehto.
