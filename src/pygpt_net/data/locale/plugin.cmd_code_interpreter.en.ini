use_ipython.label = Use IPython
use_ipython.description = Use the IPython interpreter. When disabled, use the standard Python interpreter.
sandbox.label = Sandbox
sandbox.description = Disabled: runs Python/IPython directly on the host (unsafe). Built-in: runs a dedicated uv-managed CPython/IPython environment in a separate process, but does not restrict access to the host filesystem. Docker: requires Docker to be installed and running and provides the strongest isolation; it is the safest option. The whitelist/blacklist applies to the dedicated system-command tools on the host, in the Built-in sandbox, and in Docker.

