[LOCALE]
auto_attach.description = हर बातचीत के सिस्टम प्रॉम्प्ट में सक्रिय वैश्विक या प्रोजेक्ट मेमोरी स्वतः जोड़ता है।
auto_attach.label = हर बातचीत में मेमोरी स्वतः जोड़ें
auto_attach.tooltip = हर बातचीत के सिस्टम प्रॉम्प्ट में सक्रिय वैश्विक या प्रोजेक्ट मेमोरी स्वतः जोड़ता है।
auto_attach_project.description = जब वर्तमान बातचीत किसी प्रोजेक्ट से संबंधित हो, तब मेमोरी को सिस्टम प्रॉम्प्ट में स्वतः जोड़ता है।
auto_attach_project.label = केवल प्रोजेक्ट में मेमोरी स्वतः जोड़ें
auto_attach_project.tooltip = जब वर्तमान बातचीत किसी प्रोजेक्ट से संबंधित हो, तब मेमोरी को सिस्टम प्रॉम्प्ट में स्वतः जोड़ता है।
cmd.memory_add.description = वर्तमान ग्लोबल या प्रोजेक्ट मेमोरी में केवल बहुत महत्वपूर्ण और लंबे समय तक उपयोगी जानकारी जोड़ें। इस टूल का कम उपयोग करें; नियमित, अस्थायी या कम-मूल्य विवरण न सहेजें।
cmd.memory_add.label = मेमोरी में जोड़ें
cmd.memory_add.tooltip = केवल महत्वपूर्ण और टिकाऊ जानकारी जोड़ें। memory_add का कम उपयोग करें।
cmd.memory_clear.description = वर्तमान दायरे की मेमोरी साफ करता है। मॉडल को पहले उपयोगकर्ता से स्पष्ट पुष्टि मांगनी चाहिए और पुष्टि मिलने के बाद ही इस टूल को कॉल करना चाहिए।
cmd.memory_clear.label = मेमोरी साफ करें
cmd.memory_clear.tooltip = वर्तमान दायरे की मेमोरी साफ करता है। मॉडल को पहले उपयोगकर्ता से स्पष्ट पुष्टि मांगनी चाहिए और पुष्टि मिलने के बाद ही इस टूल को कॉल करना चाहिए।
cmd.memory_get.description = वर्तमान वैश्विक या प्रोजेक्ट दायरे की पूरी मेमोरी पढ़ता है।
cmd.memory_get.label = मेमोरी पढ़ें
cmd.memory_get.tooltip = वर्तमान वैश्विक या प्रोजेक्ट दायरे की पूरी मेमोरी पढ़ता है।
cmd.memory_update.description = वर्तमान वैश्विक या प्रोजेक्ट दायरे की पूरी मेमोरी सामग्री को बदलता है।
cmd.memory_update.label = मेमोरी अपडेट करें
cmd.memory_update.tooltip = वर्तमान वैश्विक या प्रोजेक्ट दायरे की पूरी मेमोरी सामग्री को बदलता है।
max_chars.description = अक्षरों में मेमोरी का लक्षित अधिकतम आकार। मॉडल को इस सीमा के भीतर रहने के लिए कहा जाता है; हार्ड ट्रंकेशन से पहले 300 अतिरिक्त अक्षरों का सुरक्षा मार्जिन दिया जाता है।
max_chars.label = मेमोरी के अधिकतम अक्षर
max_chars.tooltip = अक्षरों में लक्षित मेमोरी आकार; हार्ड ट्रंकेशन से पहले 300 अक्षरों का सुरक्षा मार्जिन दिया जाता है।
model_update.description = स्वचालित मेमोरी अपडेट और सक्षम होने पर memory_add ऑपरेशनों को परिष्कृत करने के लिए उपयोग किया जाने वाला मॉडल।
model_update.label = मेमोरी अपडेट मॉडल
model_update.tooltip = मेमोरी अपडेट और परिष्कृत करने वाला मॉडल।
refine_add.description = यह केवल मैनुअल memory_add कॉल पर लागू होता है। सक्षम होने पर कॉन्फ़िगर किया गया मेमोरी अपडेट मॉडल जोड़ी गई जानकारी को मौजूदा मेमोरी में मिलाकर पुनर्लेखित करता है, कच्चा टेक्स्ट सीधे नहीं जोड़ता। कॉन्टेक्स्ट के अंत में होने वाले स्वचालित मेमोरी अपडेट इस सेटिंग की परवाह किए बिना हमेशा मॉडल द्वारा परिष्कृत किए जाते हैं।
refine_add.label = जोड़ने से पहले मेमोरी को परिष्कृत करें
refine_add.tooltip = मैनुअल memory_add कॉल को कॉन्फ़िगर किए गए मॉडल से परिष्कृत करें। स्वचालित मेमोरी अपडेट हमेशा परिष्कृत होते हैं।
key_search_content.label = Search memory key content
key_search_content.description = Also search stored key values/content in memory_key_search. Key names are always searched with LIKE. Disabled by default to avoid scanning stored content.
key_search_content.tooltip = Also search key content in memory_key_search. Disabled by default.
cmd.memory_key_get.description = Read raw database-backed memory records by one key or a list of keys from the current global or project scope.
cmd.memory_key_get.label = Read keyed memory
cmd.memory_key_get.tooltip = Read raw keyed memory records from the current global or project scope.
cmd.memory_key_add.description = Store a new raw database value by key for later use in the current global or project scope. Use only for truly important data; existing keys are not overwritten.
cmd.memory_key_add.label = Add keyed memory
cmd.memory_key_add.tooltip = Store a new raw value by key. Use only for truly important data.
cmd.memory_key_append.description = Append raw content exactly as provided to an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_append.label = Append keyed memory
cmd.memory_key_append.tooltip = Append raw content to an existing key without LLM processing.
cmd.memory_key_update.description = Replace the raw content of an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_update.label = Update keyed memory
cmd.memory_key_update.tooltip = Replace raw content for an existing key without LLM processing.
cmd.memory_key_list.description = List only the stored memory key names for the current global or project scope, without content.
cmd.memory_key_list.label = List memory keys
cmd.memory_key_list.tooltip = List memory key names without content.
cmd.memory_key_search.description = Search keyed memory with LIKE matching on key names. Content is searched only when the Search memory key content option is enabled.
cmd.memory_key_search.label = Search memory keys
cmd.memory_key_search.tooltip = Search key names with LIKE and optionally search stored content.
cmd.memory_key_remove.description = Remove one database-backed memory key or a list of keys from the current global or project scope.
cmd.memory_key_remove.label = Remove memory keys
cmd.memory_key_remove.tooltip = Remove one or more stored memory keys from the current scope.
plugin.description = स्थानीय डेटाबेस में संग्रहीत वैश्विक और प्रति-प्रोजेक्ट दीर्घकालिक मेमोरी प्रदान करता है।
plugin.name = Memory (inline)
