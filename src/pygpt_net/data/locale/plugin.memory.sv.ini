[LOCALE]
auto_attach.description = Lägger automatiskt till det aktiva globala eller projektspecifika minnet i systemprompten för varje samtal.
auto_attach.label = Bifoga minne automatiskt till varje samtal
auto_attach.tooltip = Lägger automatiskt till det aktiva globala eller projektspecifika minnet i systemprompten för varje samtal.
auto_attach_project.description = Lägger automatiskt till minnet i systemprompten när den aktuella samtalet tillhör ett projekt.
auto_attach_project.label = Bifoga minne automatiskt endast i projekt
auto_attach_project.tooltip = Lägger automatiskt till minnet i systemprompten när den aktuella samtalet tillhör ett projekt.
cmd.memory_add.description = Lägg endast till mycket viktig och varaktig information i det aktuella globala eller projektspecifika minnet. Använd verktyget sparsamt; spara inte rutinmässiga, tillfälliga eller mindre värdefulla detaljer.
cmd.memory_add.label = Lägg till i minne
cmd.memory_add.tooltip = Lägg endast till viktig varaktig information. Använd memory_add sparsamt.
cmd.memory_clear.description = Rensar minnet för det aktuella området. Modellen måste först be användaren om uttrycklig bekräftelse och får bara anropa verktyget efter bekräftelsen.
cmd.memory_clear.label = Rensa minne
cmd.memory_clear.tooltip = Rensar minnet för det aktuella området. Modellen måste först be användaren om uttrycklig bekräftelse och får bara anropa verktyget efter bekräftelsen.
cmd.memory_get.description = Läser hela minnet för det aktuella globala eller projektspecifika området.
cmd.memory_get.label = Läs minne
cmd.memory_get.tooltip = Läser hela minnet för det aktuella globala eller projektspecifika området.
cmd.memory_update.description = Ersätter hela minnesinnehållet för det aktuella globala eller projektspecifika området.
cmd.memory_update.label = Uppdatera minne
cmd.memory_update.tooltip = Ersätter hela minnesinnehållet för det aktuella globala eller projektspecifika området.
max_chars.description = Mål för maximal minnesstorlek i tecken. Modellen ombeds hålla sig inom denna gräns; ytterligare 300 tecken tillåts som säkerhetsmarginal före hård trunkering.
max_chars.label = Maximalt antal minnes­tecken
max_chars.tooltip = Målstorlek för minnet i tecken; en säkerhetsmarginal på 300 tecken tillåts före hård trunkering.
model_update.description = Modell för automatiska minnesuppdateringar och, när aktiverat, för att förfina memory_add-operationer.
model_update.label = Modell för minnesuppdatering
model_update.tooltip = Modell för att uppdatera och förfina minnet.
refine_add.description = Gäller endast manuella memory_add-anrop. När det är aktiverat slår den konfigurerade modellen samman och skriver om den tillagda informationen i befintligt minne i stället för att lägga till rå text. Automatiska minnesuppdateringar i slutet av kontexten förfinas alltid av modellen oavsett denna inställning.
refine_add.label = Förfina minnet före tillägg
refine_add.tooltip = Förfina manuella memory_add-anrop med den konfigurerade modellen. Automatiska minnesuppdateringar förfinas alltid.
key_search_content.label = Search memory key content
key_search_content.description = Also search stored key values/content in memory_key_search. Key names are always searched with LIKE. Disabled by default to avoid scanning stored content.
key_search_content.tooltip = Also search key content in memory_key_search. Disabled by default.
cmd.memory_key_get.description = Read raw database-backed memory records by one key or a list of keys from the current global or project scope.
cmd.memory_key_get.label = Read keyed memory
cmd.memory_key_get.tooltip = Read raw keyed memory records from the current global or project scope.
cmd.memory_key_add.description = Store a new raw database value by key for later use in the current global or project scope. Use only for truly important data; existing keys are not overwritten.
cmd.memory_key_add.label = Add keyed memory
cmd.memory_key_add.tooltip = Store a new raw value by key. Use only for truly important data.
cmd.memory_key_append.description = Append raw content exactly as provided to an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_append.label = Append keyed memory
cmd.memory_key_append.tooltip = Append raw content to an existing key without LLM processing.
cmd.memory_key_update.description = Replace the raw content of an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_update.label = Update keyed memory
cmd.memory_key_update.tooltip = Replace raw content for an existing key without LLM processing.
cmd.memory_key_list.description = List only the stored memory key names for the current global or project scope, without content.
cmd.memory_key_list.label = List memory keys
cmd.memory_key_list.tooltip = List memory key names without content.
cmd.memory_key_search.description = Search keyed memory with LIKE matching on key names. Content is searched only when the Search memory key content option is enabled.
cmd.memory_key_search.label = Search memory keys
cmd.memory_key_search.tooltip = Search key names with LIKE and optionally search stored content.
cmd.memory_key_remove.description = Remove one database-backed memory key or a list of keys from the current global or project scope.
cmd.memory_key_remove.label = Remove memory keys
cmd.memory_key_remove.tooltip = Remove one or more stored memory keys from the current scope.
plugin.description = Ger globalt och projektspecifikt långtidsminne som lagras i den lokala databasen.
plugin.name = Minne (inline)

