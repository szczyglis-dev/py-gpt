[LOCALE]
plugin.name = Plátno (inline)
plugin.description = BETA. Poskytuje interní prostředí plátna/prohlížeče pro HTML a JavaScript, prototypování webů, interakci omezenou na prohlížeč, automatizaci Playwright, anotace a lehký náhledový server. Tato funkce bude v budoucích verzích dále rozšiřována.
use_sandbox.label = Použít sandbox (Playwright)
use_sandbox.description = Zapne izolovaný backend prohlížeče Playwright. Je-li vypnutý, Canvas používá vestavěný QWebEngine a Playwright nespouští.
playwright_engine.label = Engine Playwright
playwright_engine.description = Engine prohlížeče používaný izolovaným backendem Playwright.
playwright_path.label = Adresář prohlížečů Playwright
playwright_path.description = Volitelný PLAYWRIGHT_BROWSERS_PATH. Nechte prázdné pro výchozí hodnotu Playwright.
playwright_args.label = Argumenty prohlížeče Playwright
playwright_args.description = Volitelné spouštěcí argumenty Chromium/Playwright oddělené čárkami.
default_width.label = Výchozí šířka viewportu
default_width.description = Výchozí šířka viewportu prohlížeče v pixelech.
default_height.label = Výchozí výška viewportu
default_height.description = Výchozí výška viewportu prohlížeče v pixelech.
auto_open_split.label = Automaticky otevřít prohlížeč v rozděleném zobrazení
auto_open_split.description = Při prvním otevření prohlížeče agentem v relaci vytvoří nebo zaměří kartu Canvas ve druhém sloupci a zobrazí rozdělené zobrazení. Po ručním skrytí jej v téže relaci znovu nevynucuje.
annotation_prompt.label = Zpřístupnit anotace uživatele modelu
annotation_prompt.description = Přidá čekající anotace prohlížeče/plátna do systémového promptu běhu.
max_annotations.label = Maximální počet anotací
max_annotations.description = Maximální počet anotací uchovaných v aktuální relaci prohlížeče.
console_limit.label = Limit protokolu konzole
console_limit.description = Maximální počet položek konzole prohlížeče uchovaných v paměti.
cmd.canvas_open.label = Povolit: canvas_open
cmd.canvas_open.description = Otevře nebo naviguje trvalé prostředí plátna/prohlížeče. Výchozí je QWebEngine; Playwright jen po povolení v nastavení pluginu.
cmd.canvas_change_resolution.label = Povolit: canvas_change_resolution
cmd.canvas_change_resolution.description = Změní velikost a orientaci viewportu plátna/prohlížeče.
cmd.canvas_set_html.label = Povolit: canvas_set_html
cmd.canvas_set_html.description = Vyrenderuje libovolné HTML/CSS/JavaScript v trvalém prostředí plátna/prohlížeče.
cmd.canvas_get_html.label = Povolit: canvas_get_html
cmd.canvas_get_html.description = Vrátí aktuální URL plátna/prohlížeče a serializovaný HTML dokument.
cmd.canvas_current.label = Povolit: canvas_current
cmd.canvas_current.description = Vrátí aktuální stav relace plátna/prohlížeče.
cmd.canvas_close.label = Povolit: canvas_close
cmd.canvas_close.description = Zavře viditelnou kartu plátna v PyGPT bez ukončení relace prohlížeče na pozadí.
cmd.canvas_prev.label = Povolit: canvas_prev
cmd.canvas_prev.description = Přejde zpět v historii plátna/prohlížeče.
cmd.canvas_next.label = Povolit: canvas_next
cmd.canvas_next.description = Přejde vpřed v historii plátna/prohlížeče.
cmd.canvas_reload.label = Povolit: canvas_reload
cmd.canvas_reload.description = Znovu načte aktuální dokument plátna/prohlížeče.
cmd.canvas_screenshot.label = Povolit: canvas_screenshot
cmd.canvas_screenshot.description = Pořídí snímek aktuálního viewportu plátna/prohlížeče včetně virtuálního kurzoru modelu.
cmd.canvas_inspect.label = Povolit: canvas_inspect
cmd.canvas_inspect.description = Prozkoumá viditelné/interaktivní prvky DOM a vrátí stabilní selektory a hranice.
cmd.canvas_click.label = Povolit: canvas_click
cmd.canvas_click.description = Klikne na prvek nebo souřadnice pouze uvnitř plátna/prohlížeče.
cmd.canvas_hover.label = Povolit: canvas_hover
cmd.canvas_hover.description = Přesune virtuální kurzor modelu a provede hover uvnitř plátna/prohlížeče.
cmd.canvas_type.label = Povolit: canvas_type
cmd.canvas_type.description = Zaměří editovatelný prvek a zadá text v plátně/prohlížeči.
cmd.canvas_key.label = Povolit: canvas_key
cmd.canvas_key.description = Odešle klávesu nebo klávesovou zkratku pouze do plátna/prohlížeče.
cmd.canvas_scroll.label = Povolit: canvas_scroll
cmd.canvas_scroll.description = Posune viewport plátna/prohlížeče.
cmd.canvas_drag.label = Povolit: canvas_drag
cmd.canvas_drag.description = Přetáhne mezi dvěma souřadnicemi viewportu v plátně/prohlížeči.
cmd.canvas_wait.label = Povolit: canvas_wait
cmd.canvas_wait.description = Počká na selektor nebo krátkou dobu v prostředí plátna/prohlížeče.
cmd.canvas_eval.label = Povolit: canvas_eval
cmd.canvas_eval.description = Spustí JavaScript na aktuální stránce plátna/prohlížeče.
cmd.canvas_select.label = Povolit: canvas_select
cmd.canvas_select.description = Vybere možnost v prvku select v plátně/prohlížeči.
cmd.canvas_check.label = Povolit: canvas_check
cmd.canvas_check.description = Nastaví stav zaškrtávacího nebo přepínacího prvku v plátně/prohlížeči.
cmd.canvas_upload.label = Povolit: canvas_upload
cmd.canvas_upload.description = Nahraje bezpečnostně ověřený hostitelský soubor přes souborový vstup Playwright v plátně/prohlížeči.
cmd.canvas_console.label = Povolit: canvas_console
cmd.canvas_console.description = Vrátí nedávné zprávy konzole JavaScript a chyby stránky z plátna/prohlížeče.
cmd.canvas_annotations.label = Povolit: canvas_annotations
cmd.canvas_annotations.description = Vrátí anotace uživatele z aktuální relace plátna/prohlížeče.
cmd.canvas_clear_annotations.label = Povolit: canvas_clear_annotations
cmd.canvas_clear_annotations.description = Vymaže anotace plátna/prohlížeče.
cmd.web_server_start.label = Povolit: web_server_start
cmd.web_server_start.description = Spustí statický náhledový server dostupný pouze přes loopback pro vybraný pracovní adresář.
cmd.web_server_current.label = Povolit: web_server_current
cmd.web_server_current.description = Vrátí aktuální stav náhledového serveru.
cmd.web_server_stop.label = Povolit: web_server_stop
cmd.web_server_stop.description = Zastaví náhledový server.
