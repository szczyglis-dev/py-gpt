[LOCALE]
cmd.camera_capture.description = Active l'exécution de la commande camera_capture.\nSi activé, le modèle pourra capturer des images depuis la caméra elle-même. L'option "Exécuter les commandes" doit être activée.
cmd.camera_capture.label = Activer : capture d'images depuis la caméra
cmd.camera_capture.tooltip = Exemple de prompt: Capture l'image de ma webcam.
cmd.make_screenshot.description = Active l'exécution de la commande make_screenshot.\nSi activé, le modèle pourra prendre lui-même des captures d'écran. L'option "Exécuter les commandes" doit être activée.
cmd.make_screenshot.label = Activer : prise de captures d'écran
cmd.make_screenshot.tooltip = Exemple de prompt: Fais une capture d'écran et décris ce que tu vois.
model.description = Modèle de Chat compatible avec les images, utilisé temporairement pour leur analyse. Tout fournisseur pris en charge peut être utilisé ; le modèle par défaut est "gpt-4o".
model.label = Modèle
plugin.description = Ajoute l’analyse d’images aux modes de chat pris en charge. Lorsqu’un contenu image est détecté, PyGPT achemine temporairement la requête via le mode Chat avec le modèle compatible image configuré. Les modèles de tout fournisseur pris en charge peuvent être sélectionnés.
plugin.name = Vision (inline)
prompt.description = Prompt utilisé pour l’analyse d’images en ligne. Il est ajouté au prompt système actuel ou le remplace pendant l’utilisation temporaire du modèle compatible image en mode Chat.
prompt.label = Prompt
replace_prompt.description = Remplace tout le prompt système par le prompt d’analyse d’image au lieu de l’ajouter au prompt actuel.
replace_prompt.label = Remplacer prompt
