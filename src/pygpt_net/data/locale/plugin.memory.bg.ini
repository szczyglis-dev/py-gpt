[LOCALE]
auto_attach.description = Автоматично добавя активната глобална или проектна памет към системния промпт на всеки разговор.
auto_attach.label = Автоматично добавяне на памет към всеки разговор
auto_attach.tooltip = Автоматично добавя активната глобална или проектна памет към системния промпт на всеки разговор.
auto_attach_project.description = Автоматично добавя памет към системния промпт, когато текущият разговор принадлежи към проект.
auto_attach_project.label = Автоматично добавяне на памет само в проекти
auto_attach_project.tooltip = Автоматично добавя памет към системния промпт, когато текущият разговор принадлежи към проект.
cmd.memory_add.description = Добавяйте само много важна и трайна информация към текущата глобална или проектна памет. Използвайте инструмента пестеливо; не записвайте рутинни, временни или маловажни подробности.
cmd.memory_add.label = Добави към паметта
cmd.memory_add.tooltip = Добавяйте само важна трайна информация. Използвайте memory_add пестеливо.
cmd.memory_clear.description = Изчиства паметта за текущия обхват. Моделът трябва първо да поиска изрично потвърждение от потребителя и да извика този инструмент едва след потвърждение.
cmd.memory_clear.label = Изчисти паметта
cmd.memory_clear.tooltip = Изчиства паметта за текущия обхват. Моделът трябва първо да поиска изрично потвърждение от потребителя и да извика този инструмент едва след потвърждение.
cmd.memory_get.description = Прочита цялата памет за текущия глобален или проектен обхват.
cmd.memory_get.label = Прочети паметта
cmd.memory_get.tooltip = Прочита цялата памет за текущия глобален или проектен обхват.
cmd.memory_update.description = Заменя цялото съдържание на паметта за текущия глобален или проектен обхват.
cmd.memory_update.label = Обнови паметта
cmd.memory_update.tooltip = Заменя цялото съдържание на паметта за текущия глобален или проектен обхват.
max_chars.description = Целевият максимален размер на паметта в знаци. Моделът трябва да остане в този лимит; преди твърдото изрязване се допуска допълнителен предпазен резерв от 300 знака.
max_chars.label = Максимален брой знаци в паметта
max_chars.tooltip = Целеви размер на паметта в знаци; допуска се предпазен резерв от 300 знака преди твърдото изрязване.
model_update.description = Модел за автоматични обновявания на паметта и, когато е включено, за редактиране на memory_add операции.
model_update.label = Модел за обновяване на паметта
model_update.tooltip = Модел за обновяване и редактиране на паметта.
refine_add.description = Важи само за ръчни извиквания на memory_add. Когато е включено, конфигурираният модел за обновяване на паметта обединява и преформулира добавената информация със съществуващата памет вместо да добавя суров текст. Автоматичните обновявания на паметта в края на контекста винаги се редактират от модела независимо от тази настройка.
refine_add.label = Редактиране на паметта преди добавяне
refine_add.tooltip = Редактира ръчните извиквания на memory_add с конфигурирания модел. Автоматичните обновявания на паметта винаги се редактират.
key_search_content.label = Search memory key content
key_search_content.description = Also search stored key values/content in memory_key_search. Key names are always searched with LIKE. Disabled by default to avoid scanning stored content.
key_search_content.tooltip = Also search key content in memory_key_search. Disabled by default.
cmd.memory_key_get.description = Read raw database-backed memory records by one key or a list of keys from the current global or project scope.
cmd.memory_key_get.label = Read keyed memory
cmd.memory_key_get.tooltip = Read raw keyed memory records from the current global or project scope.
cmd.memory_key_add.description = Store a new raw database value by key for later use in the current global or project scope. Use only for truly important data; existing keys are not overwritten.
cmd.memory_key_add.label = Add keyed memory
cmd.memory_key_add.tooltip = Store a new raw value by key. Use only for truly important data.
cmd.memory_key_append.description = Append raw content exactly as provided to an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_append.label = Append keyed memory
cmd.memory_key_append.tooltip = Append raw content to an existing key without LLM processing.
cmd.memory_key_update.description = Replace the raw content of an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_update.label = Update keyed memory
cmd.memory_key_update.tooltip = Replace raw content for an existing key without LLM processing.
cmd.memory_key_list.description = List only the stored memory key names for the current global or project scope, without content.
cmd.memory_key_list.label = List memory keys
cmd.memory_key_list.tooltip = List memory key names without content.
cmd.memory_key_search.description = Search keyed memory with LIKE matching on key names. Content is searched only when the Search memory key content option is enabled.
cmd.memory_key_search.label = Search memory keys
cmd.memory_key_search.tooltip = Search key names with LIKE and optionally search stored content.
cmd.memory_key_remove.description = Remove one database-backed memory key or a list of keys from the current global or project scope.
cmd.memory_key_remove.label = Remove memory keys
cmd.memory_key_remove.tooltip = Remove one or more stored memory keys from the current scope.
plugin.description = Осигурява глобална и проектна дългосрочна памет, съхранявана в локалната база данни.
plugin.name = Памет (inline)

