plugin.name = Python yorumlayıcısı
sandbox.label = Korumalı alan
sandbox.description = Devre dışı: Python/IPython'ı doğrudan ana sistemde çalıştırır (güvenli değil). Yerleşik korumalı alan: uv tarafından yönetilen yerleşik bir CPython/IPython ortamını, kullanılabildiğinde işletim sistemi düzeyinde yalıtımla çalıştırır (orta düzey güvenlik). Docker: Docker'ın kurulu ve çalışıyor olmasını gerektirir ve en güçlü yalıtımı sağlar; en güvenli seçenektir.
