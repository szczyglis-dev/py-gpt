[LOCALE]
plugin.name = الوضع المستقل
plugin.description = يفعّل الوضع المستقل في أي وضع دردشة. تحذير: استخدمه بحذر، فقد يؤدي مع الإضافات الأخرى إلى نتائج غير متوقعة.

dynamic_continue.description = بعد كل مرور مكتمل، يعمل استدعاء مخفي باستخدام النموذج المحدد كمُحكِّم، ويراجع الجزء الأخير المحدد بالإعداد من تشغيل Human/Assistant الحالي، ويولّد تعليمات المرور التالي.
dynamic_continue.label = موجّه متابعة ديناميكي
dynamic_continue_messages.description = عدد أحدث ردود Assistant في الوضع المستقل التي يتم تضمينها في كل طلب إلى المُحكِّم. يتم دائمًا تضمين إدخال المستخدم الأصلي. اضبط القيمة على 0 لتضمين جميع الردود التي تم إنتاجها منذ إدخال المستخدم هذا.
dynamic_continue_messages.label = الردود المراد تقييمها
