[LOCALE]
plugin.name = Tela (inline)
plugin.description = Fornece um ambiente interno de tela/navegador para HTML e JavaScript, prototipagem de sites, interação limitada ao navegador, automação Playwright, anotações e um servidor leve de pré-visualização. Esta funcionalidade será ampliada em versões futuras.
use_sandbox.label = Usar sandbox (Playwright)
use_sandbox.description = Ativa o backend isolado do navegador Playwright. Quando desativado, Canvas usa o navegador QWebEngine integrado e não inicia o Playwright.
playwright_engine.label = Motor Playwright
playwright_engine.description = Motor do navegador usado pelo backend isolado do Playwright.
playwright_path.label = Diretório dos navegadores Playwright
playwright_path.description = PLAYWRIGHT_BROWSERS_PATH opcional. Deixe vazio para usar o padrão do Playwright.
playwright_args.label = Argumentos do navegador Playwright
playwright_args.description = Argumentos de inicialização opcionais do Chromium/Playwright, separados por vírgulas.
default_width.label = Largura padrão da viewport
default_width.description = Largura padrão da viewport do navegador em pixels.
default_height.label = Altura padrão da viewport
default_height.description = Altura padrão da viewport do navegador em pixels.
auto_open_split.label = Abrir navegador automaticamente em tela dividida
auto_open_split.description = Na primeira abertura do navegador por um agente na sessão, cria ou foca a aba Canvas na segunda coluna e mostra a tela dividida. Se o usuário a ocultar depois, ela não será forçada novamente nessa sessão.
annotation_prompt.label = Expor anotações do usuário ao modelo
annotation_prompt.description = Adiciona as anotações pendentes do navegador/tela ao prompt de sistema do runtime.
max_annotations.label = Máximo de anotações
max_annotations.description = Número máximo de anotações mantidas na sessão atual do navegador.
console_limit.label = Limite do log do console
console_limit.description = Número máximo de entradas do console do navegador mantidas na memória.
cmd.canvas_open.label = Ativar: canvas_open
cmd.canvas_open.description = Abre ou navega no ambiente persistente de tela/navegador. QWebEngine é usado por padrão; Playwright somente quando ativado nas configurações do plugin.
cmd.canvas_change_resolution.label = Ativar: canvas_change_resolution
cmd.canvas_change_resolution.description = Altera o tamanho e a orientação da viewport da tela/navegador.
cmd.canvas_set_html.label = Ativar: canvas_set_html
cmd.canvas_set_html.description = Renderiza HTML/CSS/JavaScript arbitrário no ambiente persistente de tela/navegador.
cmd.canvas_get_html.label = Ativar: canvas_get_html
cmd.canvas_get_html.description = Obtém a URL atual da tela/navegador e o documento HTML serializado.
cmd.canvas_current.label = Ativar: canvas_current
cmd.canvas_current.description = Obtém o estado atual da sessão de tela/navegador.
cmd.canvas_close.label = Ativar: canvas_close
cmd.canvas_close.description = Fecha a aba visível da tela no PyGPT sem destruir a sessão do navegador em segundo plano.
cmd.canvas_prev.label = Ativar: canvas_prev
cmd.canvas_prev.description = Volta no histórico da tela/navegador.
cmd.canvas_next.label = Ativar: canvas_next
cmd.canvas_next.description = Avança no histórico da tela/navegador.
cmd.canvas_reload.label = Ativar: canvas_reload
cmd.canvas_reload.description = Recarrega o documento atual da tela/navegador.
cmd.canvas_screenshot.label = Ativar: canvas_screenshot
cmd.canvas_screenshot.description = Captura a viewport atual da tela/navegador com o cursor virtual do modelo.
cmd.canvas_inspect.label = Ativar: canvas_inspect
cmd.canvas_inspect.description = Inspeciona elementos DOM visíveis/interativos e retorna seletores estáveis e limites.
cmd.canvas_click.label = Ativar: canvas_click
cmd.canvas_click.description = Clica em um elemento ou coordenadas apenas dentro da tela/navegador.
cmd.canvas_hover.label = Ativar: canvas_hover
cmd.canvas_hover.description = Move o cursor virtual do modelo e faz hover dentro da tela/navegador.
cmd.canvas_type.label = Ativar: canvas_type
cmd.canvas_type.description = Foca um elemento editável e digita texto na tela/navegador.
cmd.canvas_key.label = Ativar: canvas_key
cmd.canvas_key.description = Envia uma tecla ou atalho somente para a tela/navegador.
cmd.canvas_scroll.label = Ativar: canvas_scroll
cmd.canvas_scroll.description = Rola a viewport da tela/navegador.
cmd.canvas_drag.label = Ativar: canvas_drag
cmd.canvas_drag.description = Arrasta entre duas coordenadas da viewport dentro da tela/navegador.
cmd.canvas_wait.label = Ativar: canvas_wait
cmd.canvas_wait.description = Aguarda um seletor ou um curto período no ambiente de tela/navegador.
cmd.canvas_eval.label = Ativar: canvas_eval
cmd.canvas_eval.description = Executa JavaScript na página atual da tela/navegador.
cmd.canvas_select.label = Ativar: canvas_select
cmd.canvas_select.description = Seleciona uma opção em um elemento select na tela/navegador.
cmd.canvas_check.label = Ativar: canvas_check
cmd.canvas_check.description = Define o estado de uma caixa de seleção ou botão de opção na tela/navegador.
cmd.canvas_upload.label = Ativar: canvas_upload
cmd.canvas_upload.description = Envia um arquivo do host validado pela segurança por um campo de arquivo Playwright na tela/navegador.
cmd.canvas_console.label = Ativar: canvas_console
cmd.canvas_console.description = Obtém mensagens recentes do console JavaScript e erros de página da tela/navegador.
cmd.canvas_annotations.label = Ativar: canvas_annotations
cmd.canvas_annotations.description = Obtém anotações do usuário deixadas na sessão atual de tela/navegador.
cmd.canvas_clear_annotations.label = Ativar: canvas_clear_annotations
cmd.canvas_clear_annotations.description = Limpa as anotações da tela/navegador.
cmd.web_server_start.label = Ativar: web_server_start
cmd.web_server_start.description = Inicia um servidor estático de pré-visualização somente em loopback para um diretório de trabalho selecionado.
cmd.web_server_current.label = Ativar: web_server_current
cmd.web_server_current.description = Obtém o estado atual do servidor de pré-visualização.
cmd.web_server_stop.label = Ativar: web_server_stop
cmd.web_server_stop.description = Para o servidor de pré-visualização.
ui.back = Voltar
ui.next = Avançar
ui.reload = Recarregar
ui.open_url = Abrir URL
ui.address_placeholder = Digite uma URL ou caminho local e pressione Enter
ui.enable_hint = Ative o plugin Tela
ui.copy = Copiar
ui.select_all = Selecionar tudo
ui.annotate_selection = Anotar seleção para IA…
ui.annotate_element = Anotar elemento para IA…
ui.annotation_title = Anotar para IA
ui.annotation_selection_prompt = Comentário / instrução para o conteúdo selecionado:
ui.annotation_element_prompt = Comentário / instrução para este elemento:
ui.annotation_added = Anotação de tela/navegador adicionada para IA
ui.annotation_removed = Anotação de tela/navegador removida
ui.show_source = Mostrar fonte
ui.back_to_canvas = Voltar para tela / HTML
ui.cancel = Cancelar
ui.add = Adicionar
ui.remove_annotation = Remover anotação
