[LOCALE]
plugin.name = Autonomní režim
plugin.description = Aktivuje autonomní režim v libovolném režimu chatu. UPOZORNĚNÍ: používejte opatrně; v kombinaci s dalšími pluginy může vést k neočekávaným výsledkům.

dynamic_continue.description = Po každém dokončeném průchodu funguje skryté volání s vybraným modelem jako hodnotitel, zkontroluje nastavený konec aktuálního běhu Human/Assistant a vygeneruje instrukci pro další průchod.
dynamic_continue.label = Dynamický prompt pokračování
dynamic_continue_messages.description = Počet nejnovějších odpovědí asistenta v autonomním režimu zahrnutých do každého požadavku hodnotitele. Původní vstup uživatele je zahrnut vždy. Nastavením 0 zahrnete všechny odpovědi vytvořené od tohoto vstupu uživatele.
dynamic_continue_messages.label = Odpovědi k posouzení
