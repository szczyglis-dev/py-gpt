[LOCALE]
plugin.description = Giver adgang til eksterne værktøjer via Model Context Protocol (MCP), herunder stdio, SSE og Streamable HTTP, med tillad/bloker-filtrering pr. server, understøttelse af Authorization-header og værktøjscache.
plugin.name = MCP
servers.description = Konfigurer MCP-servere. Understøttede transporter: 'stdio: <command ...>' til stdio, 'http(s)://...' til Streamable HTTP og 'http(s)://.../sse' (eller 'sse://', 'sse+http(s)://') til SSE. Brug 'label' som et kort servernavn, 'authorization' til Authorization-headeren ved HTTP/SSE, 'allowed_commands' (kommasepareret) til at tillade bestemte værktøjer og 'disabled_commands' til at blokere værktøjer.
servers.label = MCP-servere
servers.tooltip = Kræver MCP Python SDK. Installér: pip install "mcp[cli]"
tools_cache_enabled.description = Aktiverer en hukommelsescache for fundne værktøjer, så de ikke skal opdages igen ved hver forespørgsel.
tools_cache_enabled.label = Cache værktøjsliste
tools_cache_enabled.tooltip = Når funktionen er aktiveret, caches resultaterne af værktøjsregistreringen pr. server i TTL-perioden.
tools_cache_ttl.description = Levetid for værktøjscachen pr. server.
tools_cache_ttl.label = Cache-TTL (sekunder)
tools_cache_ttl.tooltip = Sæt til 0 for at deaktivere TTL (anbefales ikke).
