[LOCALE]
plugin.name = Interpretador de Python
sandbox.label = Sandbox
sandbox.description = Desativado: executa Python/IPython diretamente no host (não seguro). Integrado: executa um ambiente CPython/IPython dedicado gerido pelo uv num processo separado, mas não restringe o acesso ao sistema de ficheiros do host. Docker: requer Docker instalado e em execução e fornece o isolamento mais forte; é a opção mais segura.

