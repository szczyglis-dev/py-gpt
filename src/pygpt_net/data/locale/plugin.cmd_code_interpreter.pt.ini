[LOCALE]
plugin.name = Interpretador de Python
sandbox.label = Sandbox
sandbox.description = Desativado: executa Python/IPython diretamente no host (inseguro). Sandbox integrada: executa um ambiente CPython/IPython integrado gerido pelo uv com isolamento ao nível do sistema operativo quando disponível (segurança média). Docker: requer Docker instalado e em execução e oferece o isolamento mais forte; é a opção mais segura.
