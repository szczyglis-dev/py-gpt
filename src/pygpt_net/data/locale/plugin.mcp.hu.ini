[LOCALE]
plugin.description = Távoli eszközökhöz biztosít hozzáférést a Model Context Protocolon (MCP) keresztül, stdio, SSE és Streamable HTTP átvitellel, szerverenkénti engedélyezési/tiltási szűrőkkel, Authorization fejléc támogatással és eszköz-gyorsítótárral.
plugin.name = MCP
servers.description = MCP-szerverek beállítása. Támogatott átvitelek: 'stdio: <command ...>' a stdio-hoz, 'http(s)://...' a Streamable HTTP-hez és 'http(s)://.../sse' (vagy 'sse://', 'sse+http(s)://') az SSE-hez. A 'label' rövid szervernév, az 'authorization' HTTP/SSE Authorization fejlécet ad meg, az 'allowed_commands' (vesszővel elválasztva) csak a felsorolt eszközöket engedélyezi, a 'disabled_commands' pedig letiltja a megadott eszközöket.
servers.label = MCP-szerverek
servers.tooltip = Az MCP Python SDK szükséges. Telepítés: pip install "mcp[cli]"
tools_cache_enabled.description = Memóriabeli gyorsítótárat használ a felderített eszközökhöz, így nem kell minden kérésnél újra felderíteni őket.
tools_cache_enabled.label = Eszközlista gyorsítótárazása
tools_cache_enabled.tooltip = Bekapcsolva az eszközfelderítés eredményei szerverenként a TTL időtartamára gyorsítótárba kerülnek.
tools_cache_ttl.description = Az eszköz-gyorsítótár élettartama szerverenként.
tools_cache_ttl.label = Gyorsítótár TTL (másodperc)
tools_cache_ttl.tooltip = A TTL kikapcsolásához állítsa 0-ra (nem ajánlott).
