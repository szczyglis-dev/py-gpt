[LOCALE]
plugin.name = Toile
plugin.description = BETA. Fournit un environnement interne de canevas/navigateur pour HTML et JavaScript, le prototypage de sites, les interactions limitées au navigateur, l’automatisation Playwright, les annotations et un serveur d’aperçu léger. Cette fonctionnalité sera enrichie dans les prochaines versions.
use_sandbox.label = Utiliser le bac à sable (Playwright)
use_sandbox.description = Active le moteur de navigateur Playwright isolé. Lorsqu’il est désactivé, Canvas utilise le navigateur QWebEngine intégré et ne lance pas Playwright.
playwright_engine.label = Moteur Playwright
playwright_engine.description = Moteur de navigateur utilisé par le backend Playwright isolé.
playwright_path.label = Répertoire des navigateurs Playwright
playwright_path.description = PLAYWRIGHT_BROWSERS_PATH facultatif. Laissez vide pour utiliser la valeur par défaut de Playwright.
playwright_args.label = Arguments du navigateur Playwright
playwright_args.description = Arguments de lancement Chromium/Playwright facultatifs, séparés par des virgules.
default_width.label = Largeur de vue par défaut
default_width.description = Largeur par défaut de la zone d’affichage du navigateur en pixels.
default_height.label = Hauteur de vue par défaut
default_height.description = Hauteur par défaut de la zone d’affichage du navigateur en pixels.
auto_open_split.label = Ouvrir automatiquement le navigateur en écran partagé
auto_open_split.description = Lors de la première ouverture par un agent dans une session, crée ou active l’onglet Canvas dans la deuxième colonne et affiche l’écran partagé. Si l’utilisateur le réduit ensuite, ne pas le forcer à nouveau dans cette session.
annotation_prompt.label = Exposer les annotations utilisateur au modèle
annotation_prompt.description = Ajoute les annotations en attente du navigateur/canevas au prompt système d’exécution.
max_annotations.label = Nombre maximal d’annotations
max_annotations.description = Nombre maximal d’annotations conservées dans la session de navigateur courante.
console_limit.label = Limite du journal de console
console_limit.description = Nombre maximal d’entrées de console du navigateur conservées en mémoire.
cmd.canvas_open.label = Activer: canvas_open
cmd.canvas_open.description = Ouvre ou parcourt l’environnement persistant canevas/navigateur. QWebEngine est utilisé par défaut; Playwright uniquement s’il est activé dans les réglages du plugin.
cmd.canvas_change_resolution.label = Activer: canvas_change_resolution
cmd.canvas_change_resolution.description = Modifie la taille et l’orientation de la zone d’affichage du canevas/navigateur.
cmd.canvas_set_html.label = Activer: canvas_set_html
cmd.canvas_set_html.description = Affiche du HTML/CSS/JavaScript arbitraire dans l’environnement persistant canevas/navigateur.
cmd.canvas_get_html.label = Activer: canvas_get_html
cmd.canvas_get_html.description = Récupère l’URL courante du canevas/navigateur et le document HTML sérialisé.
cmd.canvas_current.label = Activer: canvas_current
cmd.canvas_current.description = Récupère l’état courant de la session canevas/navigateur.
cmd.canvas_close.label = Activer: canvas_close
cmd.canvas_close.description = Ferme l’onglet visible du canevas dans PyGPT sans détruire la session de navigateur en arrière-plan.
cmd.canvas_prev.label = Activer: canvas_prev
cmd.canvas_prev.description = Revient en arrière dans l’historique du canevas/navigateur.
cmd.canvas_next.label = Activer: canvas_next
cmd.canvas_next.description = Avance dans l’historique du canevas/navigateur.
cmd.canvas_reload.label = Activer: canvas_reload
cmd.canvas_reload.description = Recharge le document courant du canevas/navigateur.
cmd.canvas_screenshot.label = Activer: canvas_screenshot
cmd.canvas_screenshot.description = Capture la vue courante du canevas/navigateur avec le curseur virtuel du modèle.
cmd.canvas_inspect.label = Activer: canvas_inspect
cmd.canvas_inspect.description = Inspecte les éléments DOM visibles/interactifs et renvoie des sélecteurs stables et leurs limites.
cmd.canvas_click.label = Activer: canvas_click
cmd.canvas_click.description = Clique sur un élément ou des coordonnées uniquement dans le canevas/navigateur.
cmd.canvas_hover.label = Activer: canvas_hover
cmd.canvas_hover.description = Déplace le curseur virtuel du modèle et survole dans le canevas/navigateur.
cmd.canvas_type.label = Activer: canvas_type
cmd.canvas_type.description = Place le focus sur un élément modifiable et saisit du texte dans le canevas/navigateur.
cmd.canvas_key.label = Activer: canvas_key
cmd.canvas_key.description = Envoie une touche ou un raccourci uniquement au canevas/navigateur.
cmd.canvas_scroll.label = Activer: canvas_scroll
cmd.canvas_scroll.description = Fait défiler la vue du canevas/navigateur.
cmd.canvas_drag.label = Activer: canvas_drag
cmd.canvas_drag.description = Effectue un glisser entre deux coordonnées de la vue du canevas/navigateur.
cmd.canvas_wait.label = Activer: canvas_wait
cmd.canvas_wait.description = Attend un sélecteur ou une courte durée dans l’environnement canevas/navigateur.
cmd.canvas_eval.label = Activer: canvas_eval
cmd.canvas_eval.description = Exécute du JavaScript dans la page courante du canevas/navigateur.
cmd.canvas_select.label = Activer: canvas_select
cmd.canvas_select.description = Sélectionne une option dans un élément select du canevas/navigateur.
cmd.canvas_check.label = Activer: canvas_check
cmd.canvas_check.description = Définit l’état d’une case à cocher ou d’un bouton radio dans le canevas/navigateur.
cmd.canvas_upload.label = Activer: canvas_upload
cmd.canvas_upload.description = Téléverse un fichier hôte validé par la sécurité via un champ de fichier Playwright dans le canevas/navigateur.
cmd.canvas_console.label = Activer: canvas_console
cmd.canvas_console.description = Récupère les messages récents de la console JavaScript et les erreurs de page du canevas/navigateur.
cmd.canvas_annotations.label = Activer: canvas_annotations
cmd.canvas_annotations.description = Récupère les annotations utilisateur laissées dans la session canevas/navigateur courante.
cmd.canvas_clear_annotations.label = Activer: canvas_clear_annotations
cmd.canvas_clear_annotations.description = Efface les annotations du canevas/navigateur.
cmd.web_server_start.label = Activer: web_server_start
cmd.web_server_start.description = Démarre un serveur d’aperçu statique accessible uniquement en boucle locale pour un répertoire de travail choisi.
cmd.web_server_current.label = Activer: web_server_current
cmd.web_server_current.description = Récupère l’état courant du serveur d’aperçu.
cmd.web_server_stop.label = Activer: web_server_stop
cmd.web_server_stop.description = Arrête le serveur d’aperçu.
ui.back = Retour
ui.next = Suivant
ui.reload = Recharger
ui.open_url = Ouvrir l’URL
ui.address_placeholder = Saisissez une URL ou un chemin local puis appuyez sur Entrée
ui.copy = Copier
ui.select_all = Tout sélectionner
ui.annotate_selection = Annoter la sélection pour l’IA…
ui.annotate_element = Annoter l’élément pour l’IA…
ui.annotation_title = Annoter pour l’IA
ui.annotation_selection_prompt = Commentaire / instruction pour le contenu sélectionné :
ui.annotation_element_prompt = Commentaire / instruction pour cet élément :
ui.annotation_added = Annotation canevas/navigateur ajoutée pour l’IA
ui.annotation_removed = Annotation canevas/navigateur supprimée
ui.show_source = Afficher la source
ui.back_to_canvas = Retour au canevas / HTML
ui.cancel = Annuler
ui.add = Ajouter
ui.remove_annotation = Supprimer l’annotation
