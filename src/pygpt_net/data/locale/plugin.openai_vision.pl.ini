[LOCALE]
cmd.camera_capture.description = Włącza wykonanie polecenia camera_capture.\nJeśli włączone, model będzie mógł samodzielnie wykonywać zdjęcia z kamery. Opcja Wykonaj polecenia musi być włączona.
cmd.camera_capture.label = Włącz: wykonywanie zdjęć z kamery
cmd.camera_capture.tooltip = Przykładowy prompt: Zrób zdjęcie z mojej kamery internetowej.
cmd.make_screenshot.description = Włącza wykonanie polecenia make_screenshot.\nJeśli włączone, model będzie mógł samodzielnie robić zrzuty ekranu. Opcja Wykonaj polecenia musi być włączona.
cmd.make_screenshot.label = Włącz: robienie zrzutów ekranu
cmd.make_screenshot.tooltip = Przykładowy prompt: Zrób zrzut ekranu i opisz co widzisz.
model.description = Model obsługujący obrazy, używany tymczasowo do analizy obrazu w trybie Czat. Można użyć modelu dowolnego obsługiwanego dostawcy; domyślnie jest to "gpt-4o".
model.label = Model
plugin.description = Dodaje analizę obrazów do obsługiwanych trybów rozmowy. Po wykryciu obrazu PyGPT tymczasowo kieruje to zapytanie przez tryb Czat z skonfigurowanym modelem obsługującym obrazy. Można wybrać model dowolnego obsługiwanego dostawcy.
plugin.name = Vision (inline)
prompt.description = Prompt używany do analizy obrazów inline. Jest dodawany do bieżącego promptu systemowego lub go zastępuje podczas tymczasowego użycia modelu obsługującego obrazy w trybie Czat.
prompt.label = Prompt
replace_prompt.description = Zastąp cały prompt systemowy promptem analizy obrazu zamiast dodawać go do bieżącego promptu.
replace_prompt.label = Zastąp prompt
