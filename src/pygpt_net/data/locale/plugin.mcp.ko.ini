[LOCALE]
plugin.description = Model Context Protocol(MCP)을 통해 원격 도구에 접근합니다. stdio, SSE, Streamable HTTP 전송 방식과 서버별 허용/차단 필터, Authorization 헤더, 도구 캐시를 지원합니다.
plugin.name = MCP
servers.description = MCP 서버를 구성합니다. 지원 전송 방식: stdio는 'stdio: <command ...>', Streamable HTTP는 'http(s)://...', SSE는 'http(s)://.../sse'(또는 'sse://', 'sse+http(s)://'). 'label'은 도구 이름에 사용할 짧은 서버 이름, 'authorization'은 HTTP/SSE Authorization 헤더, 'allowed_commands'(쉼표로 구분)는 허용할 도구 목록, 'disabled_commands'는 차단할 도구 목록입니다.
servers.label = MCP 서버
servers.tooltip = MCP Python SDK가 필요합니다. 설치: pip install "mcp[cli]"
tools_cache_enabled.description = 발견된 도구를 메모리에 캐시하여 매 요청마다 다시 검색하지 않도록 합니다.
tools_cache_enabled.label = 도구 목록 캐시
tools_cache_enabled.tooltip = 활성화하면 도구 검색 결과가 서버별로 TTL 기간 동안 캐시됩니다.
tools_cache_ttl.description = 서버별 도구 캐시의 유효 시간입니다.
tools_cache_ttl.label = 캐시 TTL(초)
tools_cache_ttl.tooltip = TTL을 비활성화하려면 0으로 설정합니다(권장하지 않음).
