[LOCALE]
plugin.description = Ermöglicht den Zugriff auf entfernte Tools über das Model Context Protocol (MCP), einschließlich stdio, SSE und Streamable HTTP, mit serverbezogenen Zulassungs-/Sperrfiltern, Authorization-Header-Unterstützung und Tool-Cache.
plugin.name = MCP
servers.description = MCP-Server konfigurieren. Unterstützte Transporte: 'stdio: <command ...>' für stdio, 'http(s)://...' für Streamable HTTP und 'http(s)://.../sse' (oder 'sse://', 'sse+http(s)://') für SSE. 'label' ist ein kurzer Servername für Tool-Namen, 'authorization' sendet einen Authorization-Header bei HTTP/SSE, 'allowed_commands' (kommagetrennt) erlaubt nur angegebene Tools und 'disabled_commands' sperrt Tools dieses Servers.
servers.label = MCP-Server
servers.tooltip = Erfordert das MCP Python SDK. Installation: pip install "mcp[cli]"
tools_cache_enabled.description = Aktiviert einen In-Memory-Cache für erkannte Tools, damit sie nicht bei jeder Anfrage erneut ermittelt werden.
tools_cache_enabled.label = Tool-Liste zwischenspeichern
tools_cache_enabled.tooltip = Wenn aktiviert, werden die Ergebnisse der Tool-Erkennung pro Server für die TTL-Dauer zwischengespeichert.
tools_cache_ttl.description = Gültigkeitsdauer des Tool-Caches pro Server.
tools_cache_ttl.label = Cache-TTL (Sekunden)
tools_cache_ttl.tooltip = Auf 0 setzen, um TTL zu deaktivieren (nicht empfohlen).
