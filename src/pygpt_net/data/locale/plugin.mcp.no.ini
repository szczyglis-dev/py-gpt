[LOCALE]
plugin.description = Gir tilgang til eksterne verktøy via Model Context Protocol (MCP), inkludert stdio, SSE og Streamable HTTP, med tillat/blokker-filtrering per server, støtte for Authorization-header og verktøybuffer.
plugin.name = MCP
servers.description = Konfigurer MCP-servere. Støttede transporter: 'stdio: <command ...>' for stdio, 'http(s)://...' for Streamable HTTP og 'http(s)://.../sse' (eller 'sse://', 'sse+http(s)://') for SSE. Bruk 'label' som et kort servernavn, 'authorization' for Authorization-header ved HTTP/SSE, 'allowed_commands' (kommaseparert) for å tillate bestemte verktøy og 'disabled_commands' for å blokkere verktøy fra serveren.
servers.label = MCP-servere
servers.tooltip = Krever MCP Python SDK. Installer: pip install "mcp[cli]"
tools_cache_enabled.description = Aktiverer en minnebuffer for oppdagede verktøy slik at de ikke må oppdages på nytt for hver forespørsel.
tools_cache_enabled.label = Bufre verktøylisten
tools_cache_enabled.tooltip = Når aktivert, bufres resultatene av verktøyoppdagelsen per server i TTL-perioden.
tools_cache_ttl.description = Levetid for verktøybufferen per server.
tools_cache_ttl.label = Buffer-TTL (sekunder)
tools_cache_ttl.tooltip = Sett til 0 for å deaktivere TTL (anbefales ikke).
