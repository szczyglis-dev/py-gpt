[LOCALE]
plugin.name = Vászon
plugin.description = BETA. Belső vászon/böngésző környezetet biztosít HTML és JavaScript, webes prototípusok, böngészőre korlátozott interakció, Playwright-automatizálás, megjegyzések és könnyű előnézeti szerver számára. A funkció a jövőbeli kiadásokban tovább bővül.
use_sandbox.label = Sandbox használata (Playwright)
use_sandbox.description = Bekapcsolja az izolált Playwright böngésző-backendet. Kikapcsolva a Canvas a beépített QWebEngine böngészőt használja, és nem indítja el a Playwrightot.
playwright_engine.label = Playwright motor
playwright_engine.description = Az izolált Playwright backend által használt böngészőmotor.
playwright_path.label = Playwright böngészők könyvtára
playwright_path.description = Opcionális PLAYWRIGHT_BROWSERS_PATH. Hagyja üresen a Playwright alapértékéhez.
playwright_args.label = Playwright böngésző argumentumok
playwright_args.description = Opcionális, vesszővel elválasztott Chromium/Playwright indítási argumentumok.
default_width.label = Alapértelmezett nézet-szélesség
default_width.description = A böngésző nézetének alapértelmezett szélessége pixelben.
default_height.label = Alapértelmezett nézet-magasság
default_height.description = A böngésző nézetének alapértelmezett magassága pixelben.
auto_open_split.label = Böngésző automatikus megnyitása osztott nézetben
auto_open_split.description = Az első ügynök által indított böngészőmegnyitáskor létrehozza vagy fókuszálja a Canvas lapot a második oszlopban, és megjeleníti az osztott nézetet. Ha a felhasználó később elrejti, ugyanabban a munkamenetben nem kényszeríti újra.
annotation_prompt.label = Felhasználói megjegyzések átadása a modellnek
annotation_prompt.description = A függőben lévő böngésző/vászon megjegyzéseket hozzáadja a futtatási rendszerprompthoz.
max_annotations.label = Megjegyzések maximális száma
max_annotations.description = Az aktuális böngészőmunkamenetben tárolt megjegyzések maximális száma.
console_limit.label = Konzolnapló korlát
console_limit.description = A memóriában tárolt böngészőkonzol-bejegyzések maximális száma.
cmd.canvas_open.label = Engedélyezés: canvas_open
cmd.canvas_open.description = Megnyitja vagy navigálja a tartós vászon/böngésző környezetet. Alapértelmezésben QWebEngine használatos; Playwright csak a plugin beállításaiban engedélyezve.
cmd.canvas_change_resolution.label = Engedélyezés: canvas_change_resolution
cmd.canvas_change_resolution.description = Módosítja a vászon/böngésző nézetének méretét és tájolását.
cmd.canvas_set_html.label = Engedélyezés: canvas_set_html
cmd.canvas_set_html.description = Tetszőleges HTML/CSS/JavaScript tartalmat renderel a tartós vászon/böngésző környezetben.
cmd.canvas_get_html.label = Engedélyezés: canvas_get_html
cmd.canvas_get_html.description = Lekéri az aktuális vászon/böngésző URL-t és a sorosított HTML dokumentumot.
cmd.canvas_current.label = Engedélyezés: canvas_current
cmd.canvas_current.description = Lekéri a vászon/böngésző munkamenet aktuális állapotát.
cmd.canvas_close.label = Engedélyezés: canvas_close
cmd.canvas_close.description = Bezárja a PyGPT látható vászonlapját a háttérben futó böngészőmunkamenet megszüntetése nélkül.
cmd.canvas_prev.label = Engedélyezés: canvas_prev
cmd.canvas_prev.description = Visszalép a vászon/böngésző előzményeiben.
cmd.canvas_next.label = Engedélyezés: canvas_next
cmd.canvas_next.description = Előrelép a vászon/böngésző előzményeiben.
cmd.canvas_reload.label = Engedélyezés: canvas_reload
cmd.canvas_reload.description = Újratölti az aktuális vászon/böngésző dokumentumot.
cmd.canvas_screenshot.label = Engedélyezés: canvas_screenshot
cmd.canvas_screenshot.description = Képet készít az aktuális vászon/böngésző nézetről a modell virtuális kurzorával.
cmd.canvas_inspect.label = Engedélyezés: canvas_inspect
cmd.canvas_inspect.description = Megvizsgálja a látható/interaktív DOM elemeket, és stabil szelektorokat és határokat ad vissza.
cmd.canvas_click.label = Engedélyezés: canvas_click
cmd.canvas_click.description = Elemre vagy koordinátára kattint kizárólag a vászon/böngésző területén.
cmd.canvas_hover.label = Engedélyezés: canvas_hover
cmd.canvas_hover.description = Mozgatja a modell virtuális kurzorát és hover műveletet végez a vászon/böngésző területén.
cmd.canvas_type.label = Engedélyezés: canvas_type
cmd.canvas_type.description = Fókuszál egy szerkeszthető elemet és szöveget ír a vászon/böngésző területén.
cmd.canvas_key.label = Engedélyezés: canvas_key
cmd.canvas_key.description = Billentyűt vagy billentyűkombinációt küld kizárólag a vászon/böngésző számára.
cmd.canvas_scroll.label = Engedélyezés: canvas_scroll
cmd.canvas_scroll.description = Görgeti a vászon/böngésző nézetét.
cmd.canvas_drag.label = Engedélyezés: canvas_drag
cmd.canvas_drag.description = Két nézetkoordináta között húz a vászon/böngésző területén.
cmd.canvas_wait.label = Engedélyezés: canvas_wait
cmd.canvas_wait.description = Szelektorra vagy rövid ideig vár a vászon/böngésző környezetben.
cmd.canvas_eval.label = Engedélyezés: canvas_eval
cmd.canvas_eval.description = JavaScriptet futtat az aktuális vászon/böngésző oldalon.
cmd.canvas_select.label = Engedélyezés: canvas_select
cmd.canvas_select.description = Opciót választ egy select elemben a vászon/böngésző területén.
cmd.canvas_check.label = Engedélyezés: canvas_check
cmd.canvas_check.description = Beállítja egy jelölőnégyzet vagy rádiógomb állapotát a vászon/böngésző területén.
cmd.canvas_upload.label = Engedélyezés: canvas_upload
cmd.canvas_upload.description = Biztonságilag ellenőrzött gazdafájlt tölt fel Playwright fájlmezőn keresztül a vászon/böngésző területén.
cmd.canvas_console.label = Engedélyezés: canvas_console
cmd.canvas_console.description = Lekéri a legutóbbi JavaScript konzolüzeneteket és oldalhibákat a vászon/böngészőből.
cmd.canvas_annotations.label = Engedélyezés: canvas_annotations
cmd.canvas_annotations.description = Lekéri a felhasználói megjegyzéseket az aktuális vászon/böngésző munkamenetből.
cmd.canvas_clear_annotations.label = Engedélyezés: canvas_clear_annotations
cmd.canvas_clear_annotations.description = Törli a vászon/böngésző megjegyzéseket.
cmd.web_server_start.label = Engedélyezés: web_server_start
cmd.web_server_start.description = Csak loopbacken elérhető statikus előnézeti szervert indít a kiválasztott munkakönyvtárhoz.
cmd.web_server_current.label = Engedélyezés: web_server_current
cmd.web_server_current.description = Lekéri az előnézeti szerver aktuális állapotát.
cmd.web_server_stop.label = Engedélyezés: web_server_stop
cmd.web_server_stop.description = Leállítja az előnézeti szervert.
