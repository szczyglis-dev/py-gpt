[LOCALE]
sandbox.label = Sandbox
sandbox.description = Desativado: executa comandos do sistema diretamente no host (não seguro). Integrado: executa comandos num ambiente CPython dedicado gerido pelo uv num processo separado, mas não restringe o acesso ao sistema de ficheiros do host. Docker: requer Docker instalado e em execução e fornece o isolamento mais forte; é a opção mais segura.

