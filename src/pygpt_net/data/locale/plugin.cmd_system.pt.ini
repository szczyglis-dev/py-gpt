[LOCALE]
sandbox.label = Sandbox
sandbox.description = Desativado: executa comandos do sistema diretamente no host (inseguro). Sandbox integrada: executa comandos num ambiente CPython integrado gerido pelo uv com isolamento ao nível do sistema operativo quando disponível (segurança média). Docker: requer Docker instalado e em execução e oferece o isolamento mais forte; é a opção mais segura.
