[LOCALE]
plugin.name = Lerret (inline)
plugin.description = BETA. Gir et internt lerret-/nettlesermiljø for HTML og JavaScript, webprototyper, nettleseravgrenset interaksjon, Playwright-automatisering, merknader og en lett forhåndsvisningsserver. Funksjonen vil bli utvidet i fremtidige versjoner.
use_sandbox.label = Bruk sandbox (Playwright)
use_sandbox.description = Aktiverer den isolerte Playwright-nettleserbackenden. Når den er slått av, bruker Canvas den innebygde QWebEngine-nettleseren og starter ikke Playwright.
playwright_engine.label = Playwright-motor
playwright_engine.description = Nettlesermotor brukt av den isolerte Playwright-backenden.
playwright_path.label = Playwright-nettlesermappe
playwright_path.description = Valgfri PLAYWRIGHT_BROWSERS_PATH. La feltet stå tomt for å bruke Playwright-standarden.
playwright_args.label = Playwright-nettleserargumenter
playwright_args.description = Valgfrie, kommaseparerte startargumenter for Chromium/Playwright.
default_width.label = Standard bredde for visningsområde
default_width.description = Standard bredde for nettleserens visningsområde i piksler.
default_height.label = Standard høyde for visningsområde
default_height.description = Standard høyde for nettleserens visningsområde i piksler.
auto_open_split.label = Åpne nettleseren automatisk i delt visning
auto_open_split.description = Ved første agentstyrte nettleseråpning i en økt opprettes eller fokuseres fanen Canvas i andre kolonne, og delt visning vises. Hvis brukeren skjuler den senere, tvinges den ikke frem igjen i samme økt.
annotation_prompt.label = Vis brukermerknader til modellen
annotation_prompt.description = Legger ventende nettleser-/lerretmerknader til runtime-systemprompten.
max_annotations.label = Maksimalt antall merknader
max_annotations.description = Maksimalt antall merknader som beholdes i gjeldende nettleserøkt.
console_limit.label = Grense for konsolllogg
console_limit.description = Maksimalt antall nettleserkonsolloppføringer som beholdes i minnet.
cmd.canvas_open.label = Aktiver: canvas_open
cmd.canvas_open.description = Åpner eller navigerer i det vedvarende lerret-/nettlesermiljøet. QWebEngine brukes som standard; Playwright bare når det er aktivert i plugininnstillingene.
cmd.canvas_change_resolution.label = Aktiver: canvas_change_resolution
cmd.canvas_change_resolution.description = Endrer størrelse og retning på lerretets/nettleserens visningsområde.
cmd.canvas_set_html.label = Aktiver: canvas_set_html
cmd.canvas_set_html.description = Renderer vilkårlig HTML/CSS/JavaScript i det vedvarende lerret-/nettlesermiljøet.
cmd.canvas_get_html.label = Aktiver: canvas_get_html
cmd.canvas_get_html.description = Henter gjeldende lerret-/nettleser-URL og det serialiserte HTML-dokumentet.
cmd.canvas_current.label = Aktiver: canvas_current
cmd.canvas_current.description = Henter gjeldende øktstatus for lerret/nettleser.
cmd.canvas_close.label = Aktiver: canvas_close
cmd.canvas_close.description = Lukker den synlige lerretfanen i PyGPT uten å avslutte nettleserøkten i bakgrunnen.
cmd.canvas_prev.label = Aktiver: canvas_prev
cmd.canvas_prev.description = Går tilbake i lerretets/nettleserens historikk.
cmd.canvas_next.label = Aktiver: canvas_next
cmd.canvas_next.description = Går frem i lerretets/nettleserens historikk.
cmd.canvas_reload.label = Aktiver: canvas_reload
cmd.canvas_reload.description = Laster inn gjeldende lerret-/nettleserdokument på nytt.
cmd.canvas_screenshot.label = Aktiver: canvas_screenshot
cmd.canvas_screenshot.description = Tar et skjermbilde av gjeldende lerret-/nettleservisning med modellens virtuelle peker.
cmd.canvas_inspect.label = Aktiver: canvas_inspect
cmd.canvas_inspect.description = Inspiserer synlige/interaktive DOM-elementer og returnerer stabile selektorer og grenser.
cmd.canvas_click.label = Aktiver: canvas_click
cmd.canvas_click.description = Klikker et element eller koordinater bare inne i lerret/nettleser.
cmd.canvas_hover.label = Aktiver: canvas_hover
cmd.canvas_hover.description = Flytter modellens virtuelle peker og utfører hover inne i lerret/nettleser.
cmd.canvas_type.label = Aktiver: canvas_type
cmd.canvas_type.description = Fokuserer et redigerbart element og skriver tekst i lerret/nettleser.
cmd.canvas_key.label = Aktiver: canvas_key
cmd.canvas_key.description = Sender en tast eller tastekombinasjon bare til lerret/nettleser.
cmd.canvas_scroll.label = Aktiver: canvas_scroll
cmd.canvas_scroll.description = Ruller lerretets/nettleserens visningsområde.
cmd.canvas_drag.label = Aktiver: canvas_drag
cmd.canvas_drag.description = Drar mellom to visningskoordinater inne i lerret/nettleser.
cmd.canvas_wait.label = Aktiver: canvas_wait
cmd.canvas_wait.description = Venter på en selektor eller en kort periode i lerret-/nettlesermiljøet.
cmd.canvas_eval.label = Aktiver: canvas_eval
cmd.canvas_eval.description = Kjører JavaScript på gjeldende lerret-/nettleserside.
cmd.canvas_select.label = Aktiver: canvas_select
cmd.canvas_select.description = Velger et alternativ i et select-element i lerret/nettleser.
cmd.canvas_check.label = Aktiver: canvas_check
cmd.canvas_check.description = Setter tilstanden til en avkrysningsboks eller radioknapp i lerret/nettleser.
cmd.canvas_upload.label = Aktiver: canvas_upload
cmd.canvas_upload.description = Laster opp en sikkerhetsvalidert vertsfil via et Playwright-filfelt i lerret/nettleser.
cmd.canvas_console.label = Aktiver: canvas_console
cmd.canvas_console.description = Henter nylige JavaScript-konsollmeldinger og sidefeil fra lerret/nettleser.
cmd.canvas_annotations.label = Aktiver: canvas_annotations
cmd.canvas_annotations.description = Henter brukermerknader fra gjeldende lerret-/nettleserøkt.
cmd.canvas_clear_annotations.label = Aktiver: canvas_clear_annotations
cmd.canvas_clear_annotations.description = Fjerner lerret-/nettlesermerknader.
cmd.web_server_start.label = Aktiver: web_server_start
cmd.web_server_start.description = Starter en statisk forhåndsvisningsserver bare på loopback for en valgt arbeidsmappe.
cmd.web_server_current.label = Aktiver: web_server_current
cmd.web_server_current.description = Henter gjeldende status for forhåndsvisningsserveren.
cmd.web_server_stop.label = Aktiver: web_server_stop
cmd.web_server_stop.description = Stopper forhåndsvisningsserveren.
