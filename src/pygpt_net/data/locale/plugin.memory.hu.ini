[LOCALE]
auto_attach.description = Automatikusan hozzáadja az aktív globális vagy projektmemóriát minden beszélgetés rendszerpromptjához.
auto_attach.label = Memória automatikus csatolása minden beszélgetéshez
auto_attach.tooltip = Automatikusan hozzáadja az aktív globális vagy projektmemóriát minden beszélgetés rendszerpromptjához.
auto_attach_project.description = Automatikusan hozzáadja a memóriát a rendszerprompthoz, ha az aktuális beszélgetés projekthez tartozik.
auto_attach_project.label = Memória automatikus csatolása csak projektekben
auto_attach_project.tooltip = Automatikusan hozzáadja a memóriát a rendszerprompthoz, ha az aktuális beszélgetés projekthez tartozik.
cmd.memory_add.description = Csak nagyon fontos és tartós információkat adjon az aktuális globális vagy projektmemóriához. Használja takarékosan; ne tároljon rutinszerű, ideiglenes vagy kis értékű részleteket.
cmd.memory_add.label = Hozzáadás a memóriához
cmd.memory_add.tooltip = Csak fontos, tartós információkat adjon hozzá. A memory_add használata legyen ritka.
cmd.memory_clear.description = Törli az aktuális hatókör memóriáját. A modellnek először kifejezett megerősítést kell kérnie a felhasználótól, és csak ezután hívhatja meg ezt az eszközt.
cmd.memory_clear.label = Memória törlése
cmd.memory_clear.tooltip = Törli az aktuális hatókör memóriáját. A modellnek először kifejezett megerősítést kell kérnie a felhasználótól, és csak ezután hívhatja meg ezt az eszközt.
cmd.memory_get.description = Beolvassa az aktuális globális vagy projekt hatókör teljes memóriáját.
cmd.memory_get.label = Memória olvasása
cmd.memory_get.tooltip = Beolvassa az aktuális globális vagy projekt hatókör teljes memóriáját.
cmd.memory_update.description = Lecseréli az aktuális globális vagy projekt hatókör teljes memóriatartalmát.
cmd.memory_update.label = Memória frissítése
cmd.memory_update.tooltip = Lecseréli az aktuális globális vagy projekt hatókör teljes memóriatartalmát.
max_chars.description = A memória célzott maximális mérete karakterben. A modellnek ezen a határon belül kell maradnia; a kemény csonkolás előtt további 300 karakter biztonsági tartalék engedélyezett.
max_chars.label = A memória maximális karakterszáma
max_chars.tooltip = A memória célmérete karakterben; a kemény csonkolás előtt 300 karakter biztonsági tartalék engedélyezett.
model_update.description = Az automatikus memóriafrissítésekhez és engedélyezés esetén a memory_add műveletek finomításához használt modell.
model_update.label = Memóriafrissítő modell
model_update.tooltip = A memória frissítéséhez és finomításához használt modell.
refine_add.description = Csak a kézi memory_add hívásokra vonatkozik. Bekapcsolva a beállított memóriafrissítő modell a hozzáadott információt beolvasztja és újrafogalmazza a meglévő memóriában a nyers szöveg hozzáfűzése helyett. A kontextus végén futó automatikus memóriafrissítéseket a modell ettől a beállítástól függetlenül mindig finomítja.
refine_add.label = Memória finomítása hozzáadás előtt
refine_add.tooltip = A kézi memory_add hívásokat a beállított modellel finomítja. Az automatikus memóriafrissítések mindig finomításra kerülnek.
key_search_content.label = Search memory key content
key_search_content.description = Also search stored key values/content in memory_key_search. Key names are always searched with LIKE. Disabled by default to avoid scanning stored content.
key_search_content.tooltip = Also search key content in memory_key_search. Disabled by default.
cmd.memory_key_get.description = Read raw database-backed memory records by one key or a list of keys from the current global or project scope.
cmd.memory_key_get.label = Read keyed memory
cmd.memory_key_get.tooltip = Read raw keyed memory records from the current global or project scope.
cmd.memory_key_add.description = Store a new raw database value by key for later use in the current global or project scope. Use only for truly important data; existing keys are not overwritten.
cmd.memory_key_add.label = Add keyed memory
cmd.memory_key_add.tooltip = Store a new raw value by key. Use only for truly important data.
cmd.memory_key_append.description = Append raw content exactly as provided to an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_append.label = Append keyed memory
cmd.memory_key_append.tooltip = Append raw content to an existing key without LLM processing.
cmd.memory_key_update.description = Replace the raw content of an existing database-backed memory key in the current global or project scope. Use only for truly important data.
cmd.memory_key_update.label = Update keyed memory
cmd.memory_key_update.tooltip = Replace raw content for an existing key without LLM processing.
cmd.memory_key_list.description = List only the stored memory key names for the current global or project scope, without content.
cmd.memory_key_list.label = List memory keys
cmd.memory_key_list.tooltip = List memory key names without content.
cmd.memory_key_search.description = Search keyed memory with LIKE matching on key names. Content is searched only when the Search memory key content option is enabled.
cmd.memory_key_search.label = Search memory keys
cmd.memory_key_search.tooltip = Search key names with LIKE and optionally search stored content.
cmd.memory_key_remove.description = Remove one database-backed memory key or a list of keys from the current global or project scope.
cmd.memory_key_remove.label = Remove memory keys
cmd.memory_key_remove.tooltip = Remove one or more stored memory keys from the current scope.
plugin.description = Globális és projektenkénti hosszú távú memóriát biztosít a helyi adatbázisban.
plugin.name = Memory (inline)
