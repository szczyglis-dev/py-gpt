plugin.name = Python-fortolker
sandbox.label = Sandbox
sandbox.description = Deaktiveret: kører Python/IPython direkte på værten (usikkert). Indbygget sandbox: kører et indbygget uv-administreret CPython/IPython-miljø med OS-niveau-isolering, hvor det er tilgængeligt (middel sikkerhed). Docker: kræver, at Docker er installeret og kører, og giver den stærkeste isolation; det er den sikreste mulighed.
