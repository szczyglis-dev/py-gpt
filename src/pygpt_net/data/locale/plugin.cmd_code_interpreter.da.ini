plugin.name = Python-fortolker
sandbox.label = Sandbox
sandbox.description = Deaktiveret: kører Python/IPython direkte på værten (usikkert). Indbygget: kører et dedikeret uv-administreret CPython/IPython-miljø i en separat proces, men begrænser ikke adgangen til værtens filsystem. Docker: kræver, at Docker er installeret og kører, og giver den stærkeste isolation; det er den sikreste mulighed.

