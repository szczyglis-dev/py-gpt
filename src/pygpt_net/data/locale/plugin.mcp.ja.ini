[LOCALE]
plugin.description = Model Context Protocol（MCP）を介してリモートツールにアクセスします。stdio、SSE、Streamable HTTP、サーバーごとの許可/拒否フィルター、Authorization ヘッダー、ツールキャッシュをサポートします。
plugin.name = MCP
servers.description = MCP サーバーを設定します。対応トランスポート: stdio は 'stdio: <command ...>'、Streamable HTTP は 'http(s)://...'、SSE は 'http(s)://.../sse'（または 'sse://'、'sse+http(s)://'）。'label' はツール名に使う短いサーバー名、'authorization' は HTTP/SSE の Authorization ヘッダー、'allowed_commands'（カンマ区切り）は許可するツール、'disabled_commands' は無効化するツールを指定します。
servers.label = MCP サーバー
servers.tooltip = MCP Python SDK が必要です。インストール: pip install "mcp[cli]"
tools_cache_enabled.description = 検出済みツールをメモリにキャッシュし、プロンプトごとの再検出を回避します。
tools_cache_enabled.label = ツール一覧をキャッシュ
tools_cache_enabled.tooltip = 有効にすると、ツール検出結果がサーバーごとに TTL の期間キャッシュされます。
tools_cache_ttl.description = サーバーごとのツールキャッシュの有効期間です。
tools_cache_ttl.label = キャッシュ TTL（秒）
tools_cache_ttl.tooltip = TTL を無効にするには 0 を設定します（非推奨）。
allow_self_mcp.label = 自己定義 MCP 接続を許可
allow_self_mcp.description = モデルが実行時に HTTP/SSE 経由で MCP サーバーを定義して接続できるようにします。無効時は self-connect ツールおよびそのサーバーのツールをモデルに公開しません。
allow_self_mcp.tooltip = 既定では無効です。モデルが実行時に定義した MCP 接続にのみ適用されます。
allow_self_mcp_stdio.label = 自己定義 MCP stdio を許可
allow_self_mcp_stdio.description = モデルがローカルコマンドを起動する MCP stdio 接続を定義できるようにします。この権限は HTTP/SSE とは独立しており、既定では無効です。
allow_self_mcp_stdio.tooltip = 警告: stdio 接続はローカルプロセスを起動できます。明示的に必要な場合のみ有効にしてください。
