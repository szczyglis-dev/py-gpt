[LOCALE]
plugin.name = Canvas
plugin.description = BETA. Предоставляет внутреннюю среду холста/браузера для HTML и JavaScript, прототипирования сайтов, действий в пределах браузера, автоматизации Playwright, аннотаций и лёгкого сервера предпросмотра. Эта функция будет расширяться в будущих версиях.
use_sandbox.label = Использовать песочницу (Playwright)
use_sandbox.description = Включает изолированный браузерный backend Playwright. Если выключено, Canvas использует встроенный QWebEngine и не запускает Playwright.
playwright_engine.label = Движок Playwright
playwright_engine.description = Движок браузера для изолированного backend Playwright.
playwright_path.label = Каталог браузеров Playwright
playwright_path.description = Необязательный PLAYWRIGHT_BROWSERS_PATH. Оставьте пустым для значения Playwright по умолчанию.
playwright_args.label = Аргументы браузера Playwright
playwright_args.description = Необязательные аргументы запуска Chromium/Playwright через запятую.
default_width.label = Ширина области просмотра по умолчанию
default_width.description = Ширина области просмотра браузера по умолчанию в пикселях.
default_height.label = Высота области просмотра по умолчанию
default_height.description = Высота области просмотра браузера по умолчанию в пикселях.
auto_open_split.label = Автоматически открывать браузер в разделённом виде
auto_open_split.description = При первом открытии браузера агентом в сессии создаёт или фокусирует вкладку Canvas во второй колонке и показывает разделённый вид. После ручного скрытия не открывает его принудительно снова в этой сессии.
annotation_prompt.label = Передавать аннотации пользователя модели
annotation_prompt.description = Добавляет ожидающие аннотации браузера/холста в системный prompt среды выполнения.
max_annotations.label = Максимум аннотаций
max_annotations.description = Максимальное число аннотаций, хранимых в текущей сессии браузера.
console_limit.label = Лимит журнала консоли
console_limit.description = Максимальное число записей консоли браузера, хранимых в памяти.
cmd.canvas_open.label = Включить: canvas_open
cmd.canvas_open.description = Открывает или выполняет навигацию в постоянной среде холста/браузера. По умолчанию используется QWebEngine; Playwright — только если включён в настройках плагина.
cmd.canvas_change_resolution.label = Включить: canvas_change_resolution
cmd.canvas_change_resolution.description = Изменяет размер и ориентацию области просмотра холста/браузера.
cmd.canvas_set_html.label = Включить: canvas_set_html
cmd.canvas_set_html.description = Отображает произвольный HTML/CSS/JavaScript в постоянной среде холста/браузера.
cmd.canvas_get_html.label = Включить: canvas_get_html
cmd.canvas_get_html.description = Возвращает текущий URL холста/браузера и сериализованный HTML-документ.
cmd.canvas_current.label = Включить: canvas_current
cmd.canvas_current.description = Возвращает текущее состояние сессии холста/браузера.
cmd.canvas_close.label = Включить: canvas_close
cmd.canvas_close.description = Закрывает видимую вкладку холста в PyGPT, не уничтожая фоновую сессию браузера.
cmd.canvas_prev.label = Включить: canvas_prev
cmd.canvas_prev.description = Переходит назад по истории холста/браузера.
cmd.canvas_next.label = Включить: canvas_next
cmd.canvas_next.description = Переходит вперёд по истории холста/браузера.
cmd.canvas_reload.label = Включить: canvas_reload
cmd.canvas_reload.description = Перезагружает текущий документ холста/браузера.
cmd.canvas_screenshot.label = Включить: canvas_screenshot
cmd.canvas_screenshot.description = Создаёт снимок текущей области просмотра холста/браузера с виртуальным курсором модели.
cmd.canvas_inspect.label = Включить: canvas_inspect
cmd.canvas_inspect.description = Проверяет видимые/интерактивные DOM-элементы и возвращает стабильные селекторы и границы.
cmd.canvas_click.label = Включить: canvas_click
cmd.canvas_click.description = Нажимает элемент или координаты только внутри холста/браузера.
cmd.canvas_hover.label = Включить: canvas_hover
cmd.canvas_hover.description = Перемещает виртуальный курсор модели и выполняет наведение внутри холста/браузера.
cmd.canvas_type.label = Включить: canvas_type
cmd.canvas_type.description = Фокусирует редактируемый элемент и вводит текст в холсте/браузере.
cmd.canvas_key.label = Включить: canvas_key
cmd.canvas_key.description = Отправляет клавишу или сочетание только в холст/браузер.
cmd.canvas_scroll.label = Включить: canvas_scroll
cmd.canvas_scroll.description = Прокручивает область просмотра холста/браузера.
cmd.canvas_drag.label = Включить: canvas_drag
cmd.canvas_drag.description = Выполняет перетаскивание между двумя координатами области просмотра холста/браузера.
cmd.canvas_wait.label = Включить: canvas_wait
cmd.canvas_wait.description = Ждёт селектор или короткий интервал в среде холста/браузера.
cmd.canvas_eval.label = Включить: canvas_eval
cmd.canvas_eval.description = Выполняет JavaScript на текущей странице холста/браузера.
cmd.canvas_select.label = Включить: canvas_select
cmd.canvas_select.description = Выбирает вариант в элементе select холста/браузера.
cmd.canvas_check.label = Включить: canvas_check
cmd.canvas_check.description = Устанавливает состояние флажка или переключателя в холсте/браузере.
cmd.canvas_upload.label = Включить: canvas_upload
cmd.canvas_upload.description = Загружает проверенный по правилам безопасности файл хоста через файловое поле Playwright в холсте/браузере.
cmd.canvas_console.label = Включить: canvas_console
cmd.canvas_console.description = Возвращает последние сообщения консоли JavaScript и ошибки страницы холста/браузера.
cmd.canvas_annotations.label = Включить: canvas_annotations
cmd.canvas_annotations.description = Возвращает аннотации пользователя текущей сессии холста/браузера.
cmd.canvas_clear_annotations.label = Включить: canvas_clear_annotations
cmd.canvas_clear_annotations.description = Очищает аннотации холста/браузера.
cmd.web_server_start.label = Включить: web_server_start
cmd.web_server_start.description = Запускает статический сервер предпросмотра только на loopback для выбранного рабочего каталога.
cmd.web_server_current.label = Включить: web_server_current
cmd.web_server_current.description = Возвращает текущее состояние сервера предпросмотра.
cmd.web_server_stop.label = Включить: web_server_stop
cmd.web_server_stop.description = Останавливает сервер предпросмотра.
ui.back = Назад
ui.next = Вперёд
ui.reload = Перезагрузить
ui.open_url = Открыть URL
ui.address_placeholder = Введите URL или локальный путь и нажмите Enter
ui.copy = Копировать
ui.select_all = Выбрать всё
ui.annotate_selection = Аннотировать выделение для ИИ…
ui.annotate_element = Аннотировать элемент для ИИ…
ui.annotation_title = Аннотация для ИИ
ui.annotation_selection_prompt = Комментарий / инструкция для выделенного содержимого:
ui.annotation_element_prompt = Комментарий / инструкция для этого элемента:
ui.annotation_added = Аннотация холста/браузера добавлена для ИИ
ui.annotation_removed = Аннотация холста/браузера удалена
ui.show_source = Показать исходный код
ui.back_to_canvas = Назад к холсту / HTML
ui.cancel = Отмена
ui.add = Добавить
ui.remove_annotation = Удалить аннотацию
