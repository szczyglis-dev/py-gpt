[LOCALE]
plugin.name = Автономный режим
plugin.description = Включает автономный режим в любом режиме чата. ВНИМАНИЕ: используйте осторожно; вместе с другими плагинами возможны неожиданные результаты.

dynamic_continue.description = После каждого завершённого прохода скрытый вызов с выбранной моделью выступает в роли судьи, проверяет настроенный хвост текущего запуска Human/Assistant и формирует инструкцию для следующего прохода.
dynamic_continue.label = Динамический промпт продолжения
dynamic_continue_messages.description = Количество последних ответов Assistant в автономном режиме, включаемых в каждый запрос к судье. Исходный ввод пользователя включается всегда. Установите 0, чтобы включать все ответы, созданные после этого ввода пользователя.
dynamic_continue_messages.label = Ответы для оценки
