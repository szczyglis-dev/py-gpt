[LOCALE]
crontab.description = Adicione aqui as suas tarefas em estilo cron. Serão executadas automaticamente nas horas especificadas no formato de job baseado em cron. Se não conhece Cron, consulte a página Crontab Guru para obter ajuda.
crontab.label = As suas tarefas
new_ctx.description = Se ativado, será criado um novo contexto em cada execução do job.
new_ctx.label = Criar novo contexto ao executar job
plugin.description = Este plugin fornece agendamento de jobs em estilo cron - pode agendar prompts para serem enviados a qualquer momento usando sintaxe baseada em cron para configurar tarefas.
plugin.name = Crontab / Agendador de tarefas
show_notify.description = Se ativado, será mostrada uma notificação na bandeja em cada execução do job.
show_notify.label = Mostrar notificação ao executar job
