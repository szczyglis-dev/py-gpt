[LOCALE]
crontab.description = Добавете cron задачи тук. Те ще се изпълняват автоматично в зададените времена във формат cron. Ако не познавате Cron, посетете Crontab Guru за помощ.
crontab.label = Вашите задачи
new_ctx.description = Ако е включено, при всяко изпълнение на задачата ще се създава нов контекст.
new_ctx.label = Създаване на нов контекст при изпълнение на задача
plugin.description = Този plugin предоставя планиране на задачи в cron стил - можете да планирате изпращане на prompts по всяко време чрез cron синтаксис.
plugin.name = Crontab / Планировчик на задачи
show_notify.description = Ако е включено, при всяко изпълнение на задачата ще се показва tray известие.
show_notify.label = Показване на известие при изпълнение на задача
