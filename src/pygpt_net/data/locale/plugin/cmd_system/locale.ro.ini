[LOCALE]
sandbox.label = Sandbox
sandbox.description = Dezactivat: rulează comenzile de sistem direct pe gazdă (nesigur). Integrat: rulează comenzile într-un mediu CPython dedicat, gestionat de uv, într-un proces separat, dar nu restricționează accesul la sistemul de fișiere al gazdei. Docker: necesită Docker instalat și pornit și oferă cea mai puternică izolare; este cea mai sigură opțiune. Lista albă/neagră se aplică instrumentelor dedicate pentru comenzi de sistem pe gazdă, în sandboxul integrat și în Docker.

builtin_packages.label = Pachete de instalat
builtin_packages.description = Cerințe pentru pachetele Python instalate în sandbox-ul integrat. Introduceți câte o specificație de pachet pe fiecare linie. Recreați venv-ul integrat pentru a aplica imediat modificările; în caz contrar, acesta va fi recreat automat la următoarea utilizare a sandbox-ului integrat.
