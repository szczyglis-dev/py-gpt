sandbox.label = Sandbox
sandbox.description = Disabilitato: esegue i comandi di sistema direttamente sull’host (non sicuro). Integrato: esegue i comandi in un ambiente CPython dedicato gestito da uv in un processo separato, ma non limita l’accesso al file system dell’host. Docker: richiede Docker installato e in esecuzione e offre l’isolamento più forte; è l’opzione più sicura. La whitelist/blacklist si applica agli strumenti dedicati ai comandi di sistema sull’host, nel sandbox integrato e in Docker.

