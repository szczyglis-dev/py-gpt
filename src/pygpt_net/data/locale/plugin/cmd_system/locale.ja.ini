[LOCALE]
sandbox.label = サンドボックス
sandbox.description = 無効: システムコマンドをホスト上で直接実行します（安全ではありません）。組み込み: uv 管理の専用 CPython 環境でコマンドを別プロセスとして実行しますが、ホストのファイルシステムへのアクセスは制限しません。Docker: Docker のインストールと起動が必要で、最も強い分離を提供します。最も安全な選択肢です。 ホワイトリスト/ブラックリストは、ホスト、組み込みサンドボックス、Docker の専用システムコマンドツールに適用されます。

builtin_packages.label = インストールするパッケージ
builtin_packages.description = 組み込みサンドボックスにインストールする Python パッケージ要件です。1 行に 1 つのパッケージ指定を入力してください。変更をすぐに適用するには組み込み venv を再作成してください。そうしない場合は、次回組み込みサンドボックスを使用するときに自動的に再作成されます。
auto_cwd.description = 現在の作業ディレクトリを shell_exec コマンドに自動追加します。
