[LOCALE]
sandbox.label = Sandkasse
sandbox.description = Deaktivert: kjører systemkommandoer direkte på verten (usikkert). Innebygd: kjører kommandoer i et dedikert uv-administrert CPython-miljø i en separat prosess, men begrenser ikke tilgangen til vertens filsystem. Docker: krever at Docker er installert og kjører og gir den sterkeste isolasjonen; det er det sikreste alternativet. Hviteliste/svarteliste gjelder for de dedikerte systemkommandoverktøyene på verten, i den innebygde sandboxen og i Docker.

builtin_packages.label = Pakker som skal installeres
builtin_packages.description = Python-pakkekrav som installeres i den innebygde sandkassen. Skriv inn én pakkespesifikasjon per linje. Opprett den innebygde venv-en på nytt for å bruke endringene med én gang; ellers opprettes den automatisk på nytt neste gang den innebygde sandkassen brukes.
