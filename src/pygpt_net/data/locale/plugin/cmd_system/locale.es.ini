sandbox.label = Sandbox
sandbox.description = Desactivado: ejecuta comandos del sistema directamente en el host (no seguro). Integrado: ejecuta comandos en un entorno CPython dedicado administrado por uv en un proceso separado, pero no restringe el acceso al sistema de archivos del host. Docker: requiere Docker instalado y en ejecución y proporciona el aislamiento más fuerte; es la opción más segura. La lista blanca/negra se aplica a las herramientas dedicadas de comandos del sistema en el host, en el sandbox integrado y en Docker.

