docker_run_as_root.label = Ejecutar como root
docker_run_as_root.description = Ejecuta el sandbox de Docker como root. Cuando está desactivado, la imagen de sandbox predeterminada se ejecuta como el usuario sin privilegios 'pygpt' y se puede usar sudo sin contraseña para los comandos que requieren privilegios de root.

