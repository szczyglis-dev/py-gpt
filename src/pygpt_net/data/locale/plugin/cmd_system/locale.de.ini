sandbox.label = Sandbox
sandbox.description = Deaktiviert: führt Systembefehle direkt auf dem Host aus (unsicher). Integriert: führt Befehle in einer dedizierten, von uv verwalteten CPython-Umgebung in einem separaten Prozess aus, beschränkt jedoch nicht den Zugriff auf das Host-Dateisystem. Docker: erfordert eine installierte und laufende Docker-Umgebung und bietet die stärkste Isolation; dies ist die sicherste Option. Die Whitelist/Blacklist gilt für die dedizierten Systembefehl-Tools auf dem Host, in der integrierten Sandbox und in Docker.

builtin_packages.label = Zu installierende Pakete
builtin_packages.description = Python-Paketanforderungen, die in der integrierten Sandbox installiert werden. Geben Sie pro Zeile eine Paketspezifikation ein. Erstellen Sie das integrierte venv neu, um Änderungen sofort anzuwenden; andernfalls wird es bei der nächsten Verwendung der integrierten Sandbox automatisch neu erstellt.
