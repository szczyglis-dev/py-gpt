[LOCALE]
sandbox.label = Sandbox
sandbox.description = Изключено: стартира системни команди директно на хоста (небезопасно). Вградено: изпълнява командите в отделна CPython среда, управлявана от uv, в отделен процес, но не ограничава достъпа до файловата система на хоста. Docker: изисква инсталиран и работещ Docker и осигурява най-силна изолация; това е най-безопасната опция. Белият/черният списък се прилага към специалните инструменти за системни команди на хоста, във вградения sandbox и в Docker.

builtin_packages.label = Пакети за инсталиране
builtin_packages.description = Изисквания за Python пакети, инсталирани във вградения sandbox. Въведете по една спецификация на пакет на ред. Създайте отново вграденото venv, за да приложите промените веднага; в противен случай то ще бъде създадено автоматично при следващото използване на вградения sandbox.
