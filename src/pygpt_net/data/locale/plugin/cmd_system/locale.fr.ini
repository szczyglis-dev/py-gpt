docker_run_as_root.label = Exécuter en tant que root
docker_run_as_root.description = Exécute le bac à sable Docker en tant que root. Lorsque cette option est désactivée, l’image de bac à sable par défaut s’exécute avec l’utilisateur non privilégié 'pygpt' et sudo sans mot de passe peut être utilisé pour les commandes nécessitant les privilèges root.

