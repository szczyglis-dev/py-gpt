sandbox.label = Bac à sable
sandbox.description = Désactivé : exécute les commandes système directement sur l’hôte (non sécurisé). Intégré : exécute les commandes dans un environnement CPython dédié géré par uv dans un processus séparé, mais ne restreint pas l’accès au système de fichiers de l’hôte. Docker : nécessite que Docker soit installé et en cours d’exécution et offre l’isolation la plus forte ; c’est l’option la plus sûre. La liste blanche/noire s’applique aux outils dédiés de commandes système sur l’hôte, dans le sandbox intégré et dans Docker.

