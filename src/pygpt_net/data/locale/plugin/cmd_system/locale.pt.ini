plugin.name = Sistema (OS)
sandbox_docker.description = Executa todos os comandos de sistema num ambiente sandbox (contentor Docker). O Docker tem de estar instalado e em execução.
sandbox_docker_image.description = Especifica a imagem Docker a utilizar para a sandbox.
sandbox_docker_image.label = Imagem Docker
sandbox_docker.label = Sandbox (contentor Docker)
winapi_enabled.description = Ativar funcionalidades da API do Windows no Microsoft Windows.
winapi_enabled.label = Ativar WinAPI
