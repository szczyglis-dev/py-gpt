[LOCALE]
sandbox.label = Sandbox
sandbox.description = Desativado: executa comandos do sistema diretamente no host (não seguro). Integrado: executa comandos num ambiente CPython dedicado gerido pelo uv num processo separado, mas não restringe o acesso ao sistema de ficheiros do host. Docker: requer Docker instalado e em execução e fornece o isolamento mais forte; é a opção mais segura. A lista branca/negra aplica-se às ferramentas dedicadas de comandos do sistema no host, no sandbox integrado e no Docker.

builtin_packages.label = Pacotes a instalar
builtin_packages.description = Requisitos de pacotes Python instalados no sandbox integrado. Insira uma especificação de pacote por linha. Recrie o venv integrado para aplicar as alterações imediatamente; caso contrário, ele será recriado automaticamente no próximo uso do sandbox integrado.
