docker_run_as_root.label = Executar como root
docker_run_as_root.description = Executar a sandbox Docker como root. Quando desativado, a imagem de sandbox padrão corre como o utilizador não privilegiado 'pygpt' e pode ser usado sudo sem palavra-passe para comandos que exigem privilégios root.
