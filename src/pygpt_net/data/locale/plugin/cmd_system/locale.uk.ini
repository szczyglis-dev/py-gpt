sandbox.label = Пісочниця
sandbox.description = Вимкнено: запускає системні команди безпосередньо на хості (небезпечно). Вбудований: запускає команди в окремому середовищі CPython під керуванням uv в окремому процесі, але не обмежує доступ до файлової системи хоста. Docker: потребує встановленого й запущеного Docker та забезпечує найсильнішу ізоляцію; це найбезпечніший варіант. Білий/чорний список застосовується до виділених інструментів системних команд на хості, у вбудованій пісочниці та в Docker.

