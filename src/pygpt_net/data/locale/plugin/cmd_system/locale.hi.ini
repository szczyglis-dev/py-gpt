[LOCALE]
sandbox.label = सैंडबॉक्स
sandbox.description = अक्षम: सिस्टम कमांड सीधे होस्ट पर चलाता है (असुरक्षित)। बिल्ट-इन: uv द्वारा प्रबंधित समर्पित CPython वातावरण में कमांड को अलग प्रोसेस में चलाता है, लेकिन होस्ट फ़ाइल सिस्टम तक पहुँच को सीमित नहीं करता। Docker: Docker का इंस्टॉल और चालू होना आवश्यक है और यह सबसे मजबूत आइसोलेशन देता है; यह सबसे सुरक्षित विकल्प है।. व्हाइटलिस्ट/ब्लैकलिस्ट होस्ट, बिल्ट-इन सैंडबॉक्स और Docker में समर्पित सिस्टम-कमांड टूल्स पर लागू होती है।

builtin_packages.label = इंस्टॉल किए जाने वाले पैकेज
builtin_packages.description = Built-in sandbox में इंस्टॉल होने वाली Python पैकेज आवश्यकताएँ। हर पंक्ति में एक पैकेज स्पेसिफिकेशन दर्ज करें। बदलाव तुरंत लागू करने के लिए built-in venv दोबारा बनाएँ; अन्यथा built-in sandbox के अगले उपयोग पर यह अपने आप दोबारा बनाया जाएगा।
