docker_entrypoint.label = Docker Entrypoint
dockerfile.description = Dockerfile образа можно настроить, изменив конфигурацию выше и пересобрав образ через Tools -> Rebuild Docker sandbox Images.
dockerfile.label = Dockerfile
docker_ports.description = Сопоставление портов Docker: docker <> host. Протокол можно указать (в ключе DOCKER) как 8888/tcp или оставить часть протокола пустой для использования значения по умолчанию (TCP)
docker_ports.label = Порты Docker
docker_volumes.description = Сопоставление томов Docker: docker <> host, {workdir} — заполнитель текущего рабочего каталога на хост-машине. Используется режим r/w.
