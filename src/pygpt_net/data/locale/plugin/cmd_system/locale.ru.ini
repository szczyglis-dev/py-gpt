docker_run_as_root.label = Запускать от root
docker_run_as_root.description = Запускать Docker sandbox от root. Если отключено, стандартный образ sandbox запускается от непривилегированного пользователя 'pygpt', а для команд, требующих прав root, можно использовать sudo без пароля.
enable_system.label = Включить систему (ОС)
enable_system.description = Включает поддержку и доступ к инструментам этого раздела.
