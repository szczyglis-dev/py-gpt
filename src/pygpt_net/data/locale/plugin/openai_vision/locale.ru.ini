model.description = Chat-модель с поддержкой изображений, временно используемая для анализа изображений. Можно использовать любого поддерживаемого провайдера; по умолчанию — "gpt-4o".
model.label = Модель
prompt.description = Промпт для inline-анализа изображений. Он добавляется к текущему системному промпту или заменяет его, пока временная модель с поддержкой изображений используется в режиме Chat.
prompt.label = Промпт
replace_prompt.description = Заменить весь системный промпт промптом анализа изображения вместо добавления к текущему промпту.
