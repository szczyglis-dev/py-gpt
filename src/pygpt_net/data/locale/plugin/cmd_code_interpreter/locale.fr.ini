use_ipython.label = Utiliser IPython
use_ipython.description = Utiliser l’interpréteur IPython. Lorsqu’il est désactivé, l’interpréteur Python standard est utilisé.
sandbox.label = Bac à sable
sandbox.description = Désactivé : exécute Python/IPython directement sur l’hôte (non sécurisé). Intégré : exécute un environnement CPython/IPython dédié géré par uv dans un processus séparé, mais ne restreint pas l’accès au système de fichiers de l’hôte. Docker : nécessite que Docker soit installé et en cours d’exécution et offre l’isolation la plus forte ; c’est l’option la plus sûre. La liste blanche/noire s’applique aux outils dédiés de commandes système sur l’hôte, dans le sandbox intégré et dans Docker.

builtin_packages.label = Paquets à installer
builtin_packages.description = Exigences de paquets Python installées dans le sandbox intégré. Saisissez une spécification de paquet par ligne. Recréez le venv intégré pour appliquer immédiatement les modifications ; sinon, il sera recréé automatiquement lors de la prochaine utilisation du sandbox intégré.
