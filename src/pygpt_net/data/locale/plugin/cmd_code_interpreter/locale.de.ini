sandbox.label = Sandbox
sandbox.description = Deaktiviert: führt Python/IPython direkt auf dem Host aus (unsicher). Integriert: führt eine dedizierte, von uv verwaltete CPython/IPython-Umgebung in einem separaten Prozess aus, beschränkt jedoch nicht den Zugriff auf das Host-Dateisystem. Docker: erfordert eine installierte und laufende Docker-Umgebung und bietet die stärkste Isolation; dies ist die sicherste Option. Die Whitelist/Blacklist gilt für die dedizierten Systembefehl-Tools auf dem Host, in der integrierten Sandbox und in Docker.

