[LOCALE]
plugin.name = Interpret Python
sandbox.label = Sandbox
sandbox.description = Dezactivat: rulează Python/IPython direct pe gazdă (nesigur). Integrat: rulează un mediu CPython/IPython dedicat, gestionat de uv, într-un proces separat, dar nu restricționează accesul la sistemul de fișiere al gazdei. Docker: necesită Docker instalat și pornit și oferă cea mai puternică izolare; este cea mai sigură opțiune. Lista albă/neagră se aplică instrumentelor dedicate pentru comenzi de sistem pe gazdă, în sandboxul integrat și în Docker.

builtin_packages.label = Pachete de instalat
builtin_packages.description = Cerințe pentru pachetele Python instalate în sandbox-ul integrat. Introduceți câte o specificație de pachet pe fiecare linie. Recreați venv-ul integrat pentru a aplica imediat modificările; în caz contrar, acesta va fi recreat automat la următoarea utilizare a sandbox-ului integrat.
attach_output.description = Atașează intrarea/ieșirea codului la fereastra interpretorului Python.
attach_output.label = Conectare la fereastra interpretorului Python
output_max_entries.description = Numărul maxim de blocuri de intrare/ieșire păstrate în fereastra interpretorului Python. Setați 0 pentru fără limită.
output_max_entries.label = Max. intrări în fereastra interpretorului
auto_cwd.description = Adaugă automat directorul de lucru curent la comanda shell_exec.
auto_cwd.label = Adaugă automat CWD la shell_exec
cmd.python_exec_file.description = Permite executarea codului Python dintr-un fișier .py existent.
cmd.python_exec_file.label = Activează: executare cod Python (din fișier)
cmd.python_exec.label = Activează: executare cod Python
cmd.ipython_sys_exec.description = Permite rularea comenzilor de sistem/shell în același mediu ca interpretorul IPython (în containerul Docker IPython când este izolat, sau pe gazdă în caz contrar). Whitelist/blacklist se aplică instrumentelor dedicate de comandă de sistem pe gazdă, în sandbox-ul încorporat și în Docker.
cmd.ipython_sys_exec.label = Activează: executare comandă de sistem IPython
cmd.python_sys_exec.description = Permite rularea comenzilor de sistem/shell în același mediu ca vechiul Python Interpreter (în containerul său Docker când este izolat, sau pe gazdă în caz contrar). Whitelist/blacklist se aplică instrumentelor dedicate de comandă de sistem pe gazdă, în sandbox-ul încorporat și în Docker.
cmd.python_sys_exec.label = Activează: executare comandă de sistem Python legacy
cmd.shell_exec.description = Permite executarea comenzilor de sistem. Whitelist/blacklist se aplică instrumentelor dedicate de comandă de sistem pe gazdă, în sandbox-ul încorporat și în Docker.
cmd.shell_exec.label = Activează: executare comandă de sistem
