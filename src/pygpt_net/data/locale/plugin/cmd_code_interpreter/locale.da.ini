[LOCALE]
plugin.name = Python-fortolker
sandbox.label = Sandbox
sandbox.description = Deaktiveret: kører Python/IPython direkte på værten (usikkert). Indbygget: kører et dedikeret uv-administreret CPython/IPython-miljø i en separat proces, men begrænser ikke adgangen til værtens filsystem. Docker: kræver, at Docker er installeret og kører, og giver den stærkeste isolation; det er den sikreste mulighed. Whitelist/blacklist gælder for de dedikerede systemkommandoværktøjer på værten, i den indbyggede sandbox og i Docker.

builtin_packages.label = Pakker der skal installeres
builtin_packages.description = Python-pakkekrav, der installeres i den indbyggede sandbox. Indtast én pakkespecifikation pr. linje. Genopret den indbyggede venv for at anvende ændringer med det samme; ellers genoprettes den automatisk næste gang den indbyggede sandbox bruges.
