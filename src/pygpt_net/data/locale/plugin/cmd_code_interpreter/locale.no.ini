[LOCALE]
plugin.name = Python-tolker
sandbox.label = Sandkasse
sandbox.description = Deaktivert: kjører Python/IPython direkte på verten (usikkert). Innebygd: kjører et dedikert uv-administrert CPython/IPython-miljø i en separat prosess, men begrenser ikke tilgangen til vertens filsystem. Docker: krever at Docker er installert og kjører og gir den sterkeste isolasjonen; det er det sikreste alternativet. Hviteliste/svarteliste gjelder for de dedikerte systemkommandoverktøyene på verten, i den innebygde sandboxen og i Docker.

builtin_packages.label = Pakker som skal installeres
builtin_packages.description = Python-pakkekrav som installeres i den innebygde sandkassen. Skriv inn én pakkespesifikasjon per linje. Opprett den innebygde venv-en på nytt for å bruke endringene med én gang; ellers opprettes den automatisk på nytt neste gang den innebygde sandkassen brukes.
attach_output.description = Koble kodeinndata/-utdata til Python-tolkvinduet.
attach_output.label = Koble til Python-tolkvinduet
output_max_entries.description = Maksimalt antall inn-/utdatablokker som beholdes i Python-tolkvinduet. Sett til 0 for ingen grense.
output_max_entries.label = Maks. oppføringer i tolk-vinduet
auto_cwd.description = Legg automatisk til gjeldende arbeidskatalog i shell_exec-kommandoen.
auto_cwd.label = Legg CWD automatisk til shell_exec
