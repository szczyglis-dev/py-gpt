[LOCALE]
plugin.name = Интерпретатор на Python
sandbox.label = Sandbox
sandbox.description = Изключено: стартира Python/IPython директно на хоста (небезопасно). Вградено: стартира отделна CPython/IPython среда, управлявана от uv, в отделен процес, но не ограничава достъпа до файловата система на хоста. Docker: изисква инсталиран и работещ Docker и осигурява най-силна изолация; това е най-безопасната опция. Белият/черният списък се прилага към специалните инструменти за системни команди на хоста, във вградения sandbox и в Docker.

builtin_packages.label = Пакети за инсталиране
builtin_packages.description = Изисквания за Python пакети, инсталирани във вградения sandbox. Въведете по една спецификация на пакет на ред. Създайте отново вграденото venv, за да приложите промените веднага; в противен случай то ще бъде създадено автоматично при следващото използване на вградения sandbox.
attach_output.description = Прикачва входа/изхода на кода към прозореца на Python интерпретатора.
attach_output.label = Свързване с прозореца на Python интерпретатора
output_max_entries.description = Максимален брой входно-изходни блокове, запазвани в прозореца на Python интерпретатора. Задайте 0 за без ограничение.
output_max_entries.label = Макс. записи в прозореца на интерпретатора
auto_cwd.description = Автоматично добавя текущата работна директория към командата sys_exec.
auto_cwd.label = Автоматично добавяне на CWD към sys_exec
cmd.python_exec.description = Изпълнява Python код директно.
cmd.python_exec_file.description = Позволява изпълнение на Python код от съществуващ .py файл.
cmd.python_exec_file.label = Включи: изпълнение на Python код (от файл)
cmd.python_exec.label = Включи: изпълнение на Python код
cmd.ipython_sys_exec.description = Позволява системни/shell команди да се изпълняват в същата среда като IPython интерпретатора (в IPython Docker контейнера при sandbox или на хоста в противен случай). Белият/черният списък се прилага за специализираните инструменти за системни команди на хоста, в Built-in sandbox и в Docker.
cmd.ipython_sys_exec.label = Включи: изпълнение на IPython системна команда
cmd.python_sys_exec.description = Позволява системни/shell команди да се изпълняват в същата среда като стария Python Interpreter (в неговия Docker контейнер при sandbox или на хоста в противен случай). Белият/черният списък се прилага за специализираните инструменти за системни команди на хоста, в Built-in sandbox и в Docker.
cmd.python_sys_exec.label = Включи: изпълнение на стара Python системна команда
cmd.sys_exec.description = Предоставя изпълнение на системни команди. Белият/черният списък се прилага за специализираните инструменти за системни команди на хоста, в Built-in sandbox и в Docker.
cmd.sys_exec.label = Включи: изпълнение на системна команда
container_name.description = Персонализирано име на контейнер
container_name.label = Име на Docker контейнер
