dockerfile.description = Можете да персонализирате Dockerfile за образа, като редактирате конфигурацията по-горе и преизградите образа чрез Tools -> Rebuild IPython Docker Image.
dockerfile.label = Dockerfile
docker_ports.description = Съответствие на Docker портове: docker <> host. Можете да зададете протокол (в ключа DOCKER) с 8888/tcp или да оставите протокола празен за използване на стандартния (TCP)
