[LOCALE]
plugin.name = מפרש Python
sandbox.label = ארגז חול
sandbox.description = מושבת: מריץ Python/IPython ישירות על המארח (לא בטוח). מובנה: מריץ סביבת CPython/IPython ייעודית המנוהלת ב-uv בתהליך נפרד, אך אינו מגביל גישה למערכת הקבצים של המארח. Docker: דורש ש-Docker יהיה מותקן ופועל ומספק את הבידוד החזק ביותר; זו האפשרות הבטוחה ביותר. רשימת ההרשאה/חסימה חלה על כלי פקודות המערכת הייעודיים במארח, בארגז החול המובנה וב-Docker.

builtin_packages.label = חבילות להתקנה
builtin_packages.description = דרישות חבילות Python המותקנות בארגז החול המובנה. הזן מפרט חבילה אחד בכל שורה. צור מחדש את ה-venv המובנה כדי להחיל את השינויים מיד; אחרת הוא ייווצר מחדש אוטומטית בשימוש הבא בארגז החול המובנה.
attach_output.description = צרף קלט/פלט קוד לחלון מפרש Python.
attach_output.label = התחבר לחלון מפרש Python
output_max_entries.description = מספר מרבי של בלוקי קלט/פלט הנשמרים בחלון מפרש Python. הגדר 0 ללא הגבלה.
output_max_entries.label = מספר מרבי של רשומות בחלון המפרש
auto_cwd.description = הוסף אוטומטית את תיקיית העבודה הנוכחית לפקודת shell_exec.
auto_cwd.label = הוסף CWD אוטומטית ל-shell_exec
cmd.python_exec_file.description = מאפשר ביצוע קוד Python מקובץ .py קיים.
