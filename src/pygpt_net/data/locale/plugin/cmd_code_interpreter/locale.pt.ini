[LOCALE]
plugin.name = Interpretador de Python
sandbox.label = Sandbox
sandbox.description = Desativado: executa Python/IPython diretamente no host (não seguro). Integrado: executa um ambiente CPython/IPython dedicado gerido pelo uv num processo separado, mas não restringe o acesso ao sistema de ficheiros do host. Docker: requer Docker instalado e em execução e fornece o isolamento mais forte; é a opção mais segura. A lista branca/negra aplica-se às ferramentas dedicadas de comandos do sistema no host, no sandbox integrado e no Docker.

builtin_packages.label = Pacotes a instalar
builtin_packages.description = Requisitos de pacotes Python instalados no sandbox integrado. Insira uma especificação de pacote por linha. Recrie o venv integrado para aplicar as alterações imediatamente; caso contrário, ele será recriado automaticamente no próximo uso do sandbox integrado.
attach_output.description = Anexar entrada/saída de código à janela do interpretador Python.
attach_output.label = Ligar à janela do interpretador Python
output_max_entries.description = Número máximo de blocos de entrada/saída mantidos na janela do interpretador Python. Defina 0 para não haver limite.
output_max_entries.label = Máx. entradas da janela do interpretador
auto_cwd.description = Adicionar automaticamente o diretório de trabalho atual ao comando sys_exec.
auto_cwd.label = Adicionar CWD automaticamente ao sys_exec
cmd.python_exec.description = Executa código Python diretamente.
cmd.python_exec_file.description = Permite executar código Python a partir de um ficheiro .py existente.
cmd.python_exec_file.label = Ativar: executar código Python (a partir de ficheiro)
cmd.python_exec.label = Ativar: executar código Python
cmd.ipython_sys_exec.description = Permite executar comandos de sistema/shell no mesmo ambiente do interpretador IPython (dentro do contentor Docker do IPython quando em sandbox, ou no host caso contrário). A whitelist/blacklist aplica-se às ferramentas dedicadas de comandos de sistema no host, na sandbox incorporada e no Docker.
cmd.ipython_sys_exec.label = Ativar: executar comando de sistema IPython
cmd.python_sys_exec.description = Permite executar comandos de sistema/shell no mesmo ambiente do Python Interpreter legado (dentro do respetivo contentor Docker quando em sandbox, ou no host caso contrário). A whitelist/blacklist aplica-se às ferramentas dedicadas de comandos de sistema no host, na sandbox incorporada e no Docker.
cmd.python_sys_exec.label = Ativar: executar comando de sistema Python legado
cmd.sys_exec.description = Permite executar comandos de sistema. A whitelist/blacklist aplica-se às ferramentas dedicadas de comandos de sistema no host, na sandbox incorporada e no Docker.
cmd.sys_exec.label = Ativar: executar comando de sistema
container_name.description = Nome personalizado do contentor
container_name.label = Nome do contentor Docker
docker_entrypoint.description = Comando a executar ao iniciar o contentor
docker_entrypoint.label = Docker Entrypoint
dockerfile.description = Pode personalizar o Dockerfile da imagem editando a configuração acima e reconstruindo a imagem através de Tools -> Rebuild IPython Docker Image.
dockerfile.label = Dockerfile
docker_ports.description = Mapeamento de portas Docker: docker <> host. Pode definir o protocolo (na chave DOCKER) com 8888/tcp ou deixar a parte do protocolo vazia para usar o predefinido (TCP)
docker_ports.label = Portas Docker
docker_volumes.description = Mapeamento de volumes Docker: docker <> host, {workdir} - placeholder para o diretório de trabalho atual na máquina host. Será usado o modo r/w.
docker_volumes.label = Volumes Docker
fresh_kernel.description = Executar sempre o código usando Run num kernel novo.
fresh_kernel.label = Executar sempre o código num kernel novo
html_get_output.description = Permite obter saída HTML/JS do HTML Canvas
html_get_output.label = Ativar: obter saída HTML do HTML Canvas
image_name.description = Nome personalizado da imagem
image_name.label = Nome da imagem Docker
ipython_conn_addr.description = Predefinição: 127.0.0.1
ipython_conn_addr.label = Endereço de ligação
