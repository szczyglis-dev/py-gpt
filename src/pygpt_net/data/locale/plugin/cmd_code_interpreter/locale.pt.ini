sandbox_ipython.label = Sandbox (contentor Docker)
docker_run_as_root.label = Executar como root
docker_run_as_root.description = Executar a sandbox Docker Python como root. Quando desativado, a imagem de sandbox padrão corre como o utilizador não privilegiado 'pygpt' e pode ser usado sudo sem palavra-passe para comandos que exigem privilégios root.
ipython_run_as_root.label = Executar como root
ipython_run_as_root.description = Executar a sandbox Docker IPython como root. Quando desativado, a imagem de sandbox padrão corre como o utilizador não privilegiado 'pygpt' e pode ser usado sudo sem palavra-passe para comandos que exigem privilégios root.
cmd.ipython_exec.description = Executar código Python no kernel IPython atual.
