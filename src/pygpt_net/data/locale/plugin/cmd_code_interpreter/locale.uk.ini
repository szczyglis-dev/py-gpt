cmd.ipython_sys_exec.description = Дозволяє запускати системні/shell-команди в тому самому середовищі, що й інтерпретатор IPython (у Docker-контейнері IPython у режимі sandbox або на хості, якщо sandbox вимкнено). Білий/чорний список застосовується до виділених інструментів системних команд на хості, у вбудованій пісочниці та в Docker.
cmd.ipython_sys_exec.label = Увімкнути: системна команда IPython
