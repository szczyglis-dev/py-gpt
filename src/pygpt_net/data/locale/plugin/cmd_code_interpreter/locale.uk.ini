use_ipython.label = Використовувати IPython
use_ipython.description = Використовувати інтерпретатор IPython. Якщо вимкнено, використовується стандартний інтерпретатор Python.
sandbox.label = Пісочниця
sandbox.description = Вимкнено: запускає Python/IPython безпосередньо на хості (небезпечно). Вбудований: запускає окреме середовище CPython/IPython під керуванням uv в окремому процесі, але не обмежує доступ до файлової системи хоста. Docker: потребує встановленого й запущеного Docker та забезпечує найсильнішу ізоляцію; це найбезпечніший варіант. Білий/чорний список застосовується до виділених інструментів системних команд на хості, у вбудованій пісочниці та в Docker.

