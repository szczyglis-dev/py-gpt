docker_run_as_root.label = Запускати як root
docker_run_as_root.description = Запускає пісочницю Docker Python від імені root. Якщо вимкнено, стандартний образ пісочниці працює від непривілейованого користувача 'pygpt', а для команд, яким потрібні права root, можна використовувати sudo без пароля.
ipython_run_as_root.label = Запускати як root
ipython_run_as_root.description = Запускає пісочницю Docker IPython від імені root. Якщо вимкнено, стандартний образ пісочниці працює від непривілейованого користувача 'pygpt', а для команд, яким потрібні права root, можна використовувати sudo без пароля.

