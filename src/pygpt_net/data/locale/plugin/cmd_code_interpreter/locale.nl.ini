plugin.name = Python-interpreter
sandbox.label = Sandbox
sandbox.description = Uitgeschakeld: voert Python/IPython rechtstreeks op de host uit (onveilig). Ingebouwd: voert een speciale door uv beheerde CPython/IPython-omgeving uit in een afzonderlijk proces, maar beperkt de toegang tot het bestandssysteem van de host niet. Docker: vereist dat Docker is geïnstalleerd en actief is en biedt de sterkste isolatie; dit is de veiligste optie. De whitelist/blacklist geldt voor de speciale systeemopdrachttools op de host, in de ingebouwde sandbox en in Docker.

builtin_packages.label = Te installeren pakketten
