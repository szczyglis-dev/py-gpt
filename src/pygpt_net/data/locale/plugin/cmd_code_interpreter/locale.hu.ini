cmd.ipython_sys_exec.description = Lehetővé teszi rendszer-/shellparancsok futtatását ugyanabban a környezetben, mint az IPython-értelmező (sandbox esetén az IPython Docker-konténerben, egyébként a gazdagépen). A whitelist/blacklist a dedikált rendszerparancs-eszközökre vonatkozik a gazdagépen, a beépített sandboxban és Dockerben.
