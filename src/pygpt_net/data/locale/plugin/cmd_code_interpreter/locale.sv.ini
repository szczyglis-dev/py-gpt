cmd.python_exec.label = Aktivera: kör Python-kod
cmd.ipython_sys_exec.description = Tillåter system-/shellkommandon att köras i samma miljö som IPython-tolken (i IPython Docker-containern när sandbox används, annars på värden). Whitelist/blacklist gäller de dedikerade systemkommandoverktygen på värden, i den inbyggda sandboxen och i Docker.
cmd.ipython_sys_exec.label = Aktivera: kör IPython-systemkommando
cmd.python_sys_exec.description = Tillåter system-/shellkommandon att köras i samma miljö som den äldre Python Interpreter (i dess Docker-container när sandbox används, annars på värden). Whitelist/blacklist gäller de dedikerade systemkommandoverktygen på värden, i den inbyggda sandboxen och i Docker.
cmd.python_sys_exec.label = Aktivera: kör legacy Python-systemkommando
cmd.sys_exec.description = Ger möjlighet att köra systemkommandon. Whitelist/blacklist gäller de dedikerade systemkommandoverktygen på värden, i den inbyggda sandboxen och i Docker.
