[LOCALE]
plugin.name = Python-tolk
sandbox.label = Sandlåda
sandbox.description = Inaktiverad: kör Python/IPython direkt på värden (osäkert). Inbyggd: kör en dedikerad uv-hanterad CPython/IPython-miljö i en separat process, men begränsar inte åtkomsten till värdens filsystem. Docker: kräver att Docker är installerat och körs och ger den starkaste isoleringen; det är det säkraste alternativet. Vitlista/svartlista gäller för de dedikerade systemkommandoverktygen på värden, i den inbyggda sandboxen och i Docker.

builtin_packages.label = Paket att installera
builtin_packages.description = Python-paketkrav som installeras i den inbyggda sandboxen. Ange en paketspecifikation per rad. Återskapa den inbyggda venv-miljön för att tillämpa ändringar direkt; annars återskapas den automatiskt nästa gång den inbyggda sandboxen används.
attach_output.description = Koppla kodens in-/utdata till Python-tolkfönstret.
attach_output.label = Anslut till Python-tolkfönstret
output_max_entries.description = Maximalt antal in-/utdatablock som sparas i Python-tolkfönstret. Ange 0 för ingen gräns.
output_max_entries.label = Max. poster i tolkfönstret
auto_cwd.description = Lägg automatiskt till aktuell arbetskatalog i kommandot sys_exec.
auto_cwd.label = Lägg automatiskt till CWD i sys_exec
cmd.python_exec.description = Kör Python-kod direkt.
cmd.python_exec_file.description = Gör det möjligt att köra Python-kod från en befintlig .py-fil.
