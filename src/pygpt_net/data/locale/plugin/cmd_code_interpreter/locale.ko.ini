[LOCALE]
plugin.name = Python 인터프리터
sandbox.label = 샌드박스
sandbox.description = 비활성화: Python/IPython을 호스트에서 직접 실행합니다(안전하지 않음). 내장: uv가 관리하는 전용 CPython/IPython 환경을 별도 프로세스에서 실행하지만 호스트 파일 시스템 접근은 제한하지 않습니다. Docker: Docker가 설치되어 실행 중이어야 하며 가장 강력한 격리를 제공합니다. 가장 안전한 옵션입니다. 화이트리스트/블랙리스트는 호스트, 내장 샌드박스 및 Docker의 전용 시스템 명령 도구에 적용됩니다.

builtin_packages.label = 설치할 패키지
builtin_packages.description = 내장 샌드박스에 설치할 Python 패키지 요구 사항입니다. 한 줄에 하나의 패키지 사양을 입력하세요. 변경 사항을 즉시 적용하려면 내장 venv를 다시 만드세요. 그렇지 않으면 다음에 내장 샌드박스를 사용할 때 자동으로 다시 만들어집니다.
attach_output.description = 코드 입력/출력을 Python 인터프리터 창에 연결합니다.
attach_output.label = Python 인터프리터 창에 연결
output_max_entries.description = Python 인터프리터 창에 유지할 입력/출력 블록의 최대 수입니다. 0은 제한 없음입니다.
output_max_entries.label = 인터프리터 창 최대 항목 수
auto_cwd.description = 현재 작업 디렉터리를 sys_exec 명령에 자동으로 추가합니다.
auto_cwd.label = sys_exec에 CWD 자동 추가
cmd.python_exec.description = Python 코드를 직접 실행합니다.
cmd.python_exec_file.description = 기존 .py 파일에서 Python 코드를 실행할 수 있습니다.
cmd.python_exec_file.label = 활성화: Python 코드 실행(파일에서)
cmd.python_exec.label = 활성화: Python 코드 실행
cmd.ipython_sys_exec.description = IPython 인터프리터와 동일한 환경에서 시스템/셸 명령을 실행할 수 있습니다(샌드박스 사용 시 IPython Docker 컨테이너 내부, 아니면 호스트에서). whitelist/blacklist는 호스트, 내장 샌드박스 및 Docker의 전용 시스템 명령 도구에 적용됩니다.
cmd.ipython_sys_exec.label = 활성화: IPython 시스템 명령 실행
cmd.python_sys_exec.description = 레거시 Python Interpreter와 동일한 환경에서 시스템/셸 명령을 실행할 수 있습니다(샌드박스 사용 시 해당 Docker 컨테이너 내부, 아니면 호스트에서). whitelist/blacklist는 호스트, 내장 샌드박스 및 Docker의 전용 시스템 명령 도구에 적용됩니다.
cmd.python_sys_exec.label = 활성화: 레거시 Python 시스템 명령 실행
cmd.sys_exec.description = 시스템 명령 실행 기능을 제공합니다. whitelist/blacklist는 호스트, 내장 샌드박스 및 Docker의 전용 시스템 명령 도구에 적용됩니다.
cmd.sys_exec.label = 활성화: 시스템 명령 실행
