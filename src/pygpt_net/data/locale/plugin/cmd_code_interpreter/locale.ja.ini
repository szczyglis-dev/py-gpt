[LOCALE]
plugin.name = Pythonインタープリター
sandbox.label = サンドボックス
sandbox.description = 無効: Python/IPython をホスト上で直接実行します（安全ではありません）。組み込み: uv 管理の専用 CPython/IPython 環境を別プロセスで実行しますが、ホストのファイルシステムへのアクセスは制限しません。Docker: Docker のインストールと起動が必要で、最も強い分離を提供します。最も安全な選択肢です。 ホワイトリスト/ブラックリストは、ホスト、組み込みサンドボックス、Docker の専用システムコマンドツールに適用されます。

builtin_packages.label = インストールするパッケージ
builtin_packages.description = 組み込みサンドボックスにインストールする Python パッケージ要件です。1 行に 1 つのパッケージ指定を入力してください。変更をすぐに適用するには組み込み venv を再作成してください。そうしない場合は、次回組み込みサンドボックスを使用するときに自動的に再作成されます。
attach_output.description = コードの入出力を Python インタープリターウィンドウに接続します。
attach_output.label = Python インタープリターウィンドウに接続
output_max_entries.description = Python インタープリターウィンドウに保持する入出力ブロックの最大数。0 にすると無制限です。
output_max_entries.label = インタープリターウィンドウの最大エントリ数
auto_cwd.description = 現在の作業ディレクトリを shell_exec コマンドに自動追加します。
auto_cwd.label = shell_exec に CWD を自動追加
cmd.python_exec_file.description = 既存の .py ファイルから Python コードを実行できます。
cmd.python_exec_file.label = 有効化: Python コードを実行（ファイルから）
cmd.python_exec.label = 有効化: Python コードを実行
cmd.ipython_sys_exec.description = IPython インタープリターと同じ環境でシステム/シェルコマンドを実行できるようにします（サンドボックス時は IPython Docker コンテナ内、それ以外はホスト上）。ホワイトリスト/ブラックリストは、ホスト、組み込みサンドボックス、Docker の専用システムコマンドツールに適用されます。
cmd.ipython_sys_exec.label = 有効化: IPython システムコマンド実行
cmd.python_sys_exec.description = 旧 Python Interpreter と同じ環境でシステム/シェルコマンドを実行できるようにします（サンドボックス時はその Docker コンテナ内、それ以外はホスト上）。ホワイトリスト/ブラックリストは、ホスト、組み込みサンドボックス、Docker の専用システムコマンドツールに適用されます。
cmd.python_sys_exec.label = 有効化: 旧 Python システムコマンド実行
cmd.shell_exec.description = システムコマンドを実行できます。ホワイトリスト/ブラックリストは、ホスト、組み込みサンドボックス、Docker の専用システムコマンドツールに適用されます。
cmd.shell_exec.label = 有効化: システムコマンド実行
