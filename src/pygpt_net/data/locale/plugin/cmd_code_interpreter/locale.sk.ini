[LOCALE]
plugin.name = Interpret Pythonu
sandbox.label = Sandbox
sandbox.description = Vypnuté: spúšťa Python/IPython priamo na hostiteľovi (nebezpečné). Vstavané: spúšťa vyhradené prostredie CPython/IPython spravované pomocou uv v samostatnom procese, ale neobmedzuje prístup k súborovému systému hostiteľa. Docker: vyžaduje nainštalovaný a spustený Docker a poskytuje najsilnejšiu izoláciu; je to najbezpečnejšia možnosť. Biely/čierny zoznam sa vzťahuje na vyhradené nástroje systémových príkazov na hostiteľovi, vo vstavanom sandboxe aj v Dockeri.

builtin_packages.label = Balíky na inštaláciu
builtin_packages.description = Požiadavky na Python balíky inštalované do vstavaného sandboxu. Zadajte jednu špecifikáciu balíka na riadok. Ak chcete zmeny použiť okamžite, znovu vytvorte vstavané venv; inak sa automaticky znovu vytvorí pri ďalšom použití vstavaného sandboxu.
attach_output.description = Pripojiť vstup/výstup kódu k oknu interpretera Python.
attach_output.label = Pripojiť k oknu interpretera Python
output_max_entries.description = Maximálny počet vstupných/výstupných blokov uchovávaných v okne interpretera Python. 0 = bez obmedzenia.
output_max_entries.label = Max. položiek okna interpretera
auto_cwd.description = Automaticky pridať aktuálny pracovný adresár k príkazu shell_exec.
auto_cwd.label = Automaticky pridať CWD k shell_exec
cmd.python_exec_file.description = Umožňuje spustiť Python kód z existujúceho súboru .py.
cmd.python_exec_file.label = Povoliť: spustiť Python kód (zo súboru)
cmd.python_exec.label = Povoliť: spustiť Python kód
cmd.ipython_sys_exec.description = Umožňuje spúšťať systémové/shell príkazy v rovnakom prostredí ako interpreter IPython (v kontajneri IPython Docker pri sandboxe, inak na hostiteľovi). Whitelist/blacklist sa vzťahuje na vyhradené nástroje systémových príkazov na hostiteľovi, vo vstavanom sandboxe a v Dockeri.
cmd.ipython_sys_exec.label = Povoliť: spustiť systémový príkaz IPython
cmd.python_sys_exec.description = Umožňuje spúšťať systémové/shell príkazy v rovnakom prostredí ako starší Python Interpreter (v jeho Docker kontajneri pri sandboxe, inak na hostiteľovi). Whitelist/blacklist sa vzťahuje na vyhradené nástroje systémových príkazov na hostiteľovi, vo vstavanom sandboxe a v Dockeri.
cmd.python_sys_exec.label = Povoliť: spustiť systémový príkaz legacy Python
cmd.shell_exec.description = Umožňuje spúšťať systémové príkazy. Whitelist/blacklist sa vzťahuje na vyhradené nástroje systémových príkazov na hostiteľovi, vo vstavanom sandboxe a v Dockeri.
cmd.shell_exec.label = Povoliť: spustiť systémový príkaz
