[LOCALE]
plugin.name = Interpret Pythonu
sandbox.label = Sandbox
sandbox.description = Vypnuto: spouští Python/IPython přímo na hostiteli (nebezpečné). Vestavěné: spouští vyhrazené prostředí CPython/IPython spravované pomocí uv v samostatném procesu, ale neomezuje přístup k souborovému systému hostitele. Docker: vyžaduje nainstalovaný a spuštěný Docker a poskytuje nejsilnější izolaci; je to nejbezpečnější možnost. Bílá/černá listina se vztahuje na vyhrazené nástroje systémových příkazů na hostiteli, ve vestavěném sandboxu i v Dockeru.

builtin_packages.label = Balíčky k instalaci
builtin_packages.description = Požadavky na Python balíčky instalované do vestavěného sandboxu. Zadejte jednu specifikaci balíčku na řádek. Pro okamžité použití změn znovu vytvořte vestavěné venv; jinak se automaticky znovu vytvoří při příštím použití vestavěného sandboxu.
