[LOCALE]
plugin.name = Интерпретатор Python
sandbox.label = Песочница
sandbox.description = Отключено: запускает Python/IPython непосредственно на хосте (небезопасно). Встроенный: запускает выделенную среду CPython/IPython под управлением uv в отдельном процессе, но не ограничивает доступ к файловой системе хоста. Docker: требует установленного и запущенного Docker и обеспечивает самую сильную изоляцию; это самый безопасный вариант. Белый/чёрный список применяется к выделенным инструментам системных команд на хосте, во встроенной песочнице и в Docker.

builtin_packages.label = Пакеты для установки
builtin_packages.description = Требования к пакетам Python, устанавливаемым во встроенную песочницу. Укажите по одной спецификации пакета в строке. Пересоздайте встроенное venv, чтобы применить изменения сразу; иначе оно будет автоматически пересоздано при следующем использовании встроенной песочницы.
attach_output.description = Подключать ввод/вывод кода к окну интерпретатора Python.
attach_output.label = Подключиться к окну интерпретатора Python
output_max_entries.description = Максимальное количество блоков ввода/вывода, сохраняемых в окне интерпретатора Python. 0 = без ограничений.
output_max_entries.label = Макс. записей в окне интерпретатора
auto_cwd.description = Автоматически добавлять текущий рабочий каталог к команде sys_exec.
auto_cwd.label = Автодобавление CWD к sys_exec
cmd.python_exec.description = Выполняет код Python напрямую.
cmd.python_exec_file.description = Позволяет выполнять код Python из существующего файла .py.
cmd.python_exec_file.label = Включить: выполнение кода Python (из файла)
cmd.python_exec.label = Включить: выполнение кода Python
cmd.ipython_sys_exec.description = Позволяет запускать системные/shell-команды в той же среде, что и интерпретатор IPython (в контейнере IPython Docker при использовании sandbox или на хосте в противном случае). Whitelist/blacklist применяется к выделенным инструментам системных команд на хосте, во встроенном sandbox и в Docker.
cmd.ipython_sys_exec.label = Включить: выполнение системной команды IPython
cmd.python_sys_exec.description = Позволяет запускать системные/shell-команды в той же среде, что и устаревший Python Interpreter (в его Docker-контейнере при использовании sandbox или на хосте в противном случае). Whitelist/blacklist применяется к выделенным инструментам системных команд на хосте, во встроенном sandbox и в Docker.
cmd.python_sys_exec.label = Включить: выполнение системной команды legacy Python
cmd.sys_exec.description = Позволяет выполнять системные команды. Whitelist/blacklist применяется к выделенным инструментам системных команд на хосте, во встроенном sandbox и в Docker.
cmd.sys_exec.label = Включить: выполнение системной команды
container_name.description = Пользовательское имя контейнера
container_name.label = Имя Docker-контейнера
docker_entrypoint.description = Команда, выполняемая при запуске контейнера
docker_entrypoint.label = Docker Entrypoint
dockerfile.description = Dockerfile образа можно настроить, изменив конфигурацию выше и пересобрав образ через Tools -> Rebuild IPython Docker Image.
dockerfile.label = Dockerfile
docker_ports.description = Сопоставление портов Docker: docker <> host. Протокол можно указать (в ключе DOCKER) как 8888/tcp или оставить часть протокола пустой для использования значения по умолчанию (TCP)
docker_ports.label = Порты Docker
docker_volumes.description = Сопоставление томов Docker: docker <> host, {workdir} — заполнитель текущего рабочего каталога на хост-машине. Используется режим r/w.
docker_volumes.label = Тома Docker
fresh_kernel.description = Всегда выполнять код через Run в новом ядре.
fresh_kernel.label = Всегда выполнять код в новом ядре
html_get_output.description = Позволяет получать HTML/JS-вывод из HTML Canvas
html_get_output.label = Включить: получить HTML-вывод из HTML Canvas
image_name.description = Пользовательское имя образа
image_name.label = Имя Docker-образа
ipython_conn_addr.description = По умолчанию: 127.0.0.1
ipython_conn_addr.label = Адрес подключения
ipython_container_name.description = Пользовательское имя контейнера
ipython_container_name.label = Имя Docker-контейнера
ipython_dockerfile.description = Dockerfile образа, используемого IPython, можно настроить, изменив конфигурацию выше и пересобрав образ через Tools -> Rebuild IPython Docker Image.
ipython_dockerfile.label = Dockerfile
ipython_image_name.description = Пользовательское имя образа
ipython_image_name.label = Имя Docker-образа
ipython_port_control.description = По умолчанию: 5558
ipython_port_control.label = Порт: control
ipython_port_hb.description = По умолчанию: 5559
ipython_port_hb.label = Порт: hb
ipython_port_iopub.description = По умолчанию: 5556
ipython_port_iopub.label = Порт: iopub
ipython_port_shell.description = По умолчанию: 5555
ipython_port_shell.label = Порт: shell
ipython_port_stdin.description = По умолчанию: 5557
ipython_port_stdin.label = Порт: stdin
ipython_session_key.description = Должен соответствовать ключу, указанному в Dockerfile.
ipython_session_key.label = Ключ сессии
plugin.description = Позволяет выполнять код Python
python_cmd_tpl.description = Шаблон команды Python для выполнения; используйте {filename} как заполнитель имени файла.
python_cmd_tpl.label = Шаблон команды Python
html_render_output.description = Позволяет отображать HTML/JS-код в HTML Canvas
html_render_output.label = Включить: отображать HTML-вывод в Canvas
sandbox_docker.description = Выполняет код Python (legacy) в sandbox (Docker-контейнере). Docker должен быть установлен и запущен.
sandbox_docker_image.description = Docker-образ для sandbox.
sandbox_docker_image.label = Docker-образ
sandbox_docker.label = Sandbox (Docker-контейнер)
sandbox_ipython.description = Выполняет код IPython и Python в sandbox (Docker-контейнере). Docker должен быть установлен и запущен.
sandbox_ipython.label = Sandbox (Docker-контейнер)
docker_run_as_root.label = Запускать от root
docker_run_as_root.description = Запускать Python Docker sandbox от root. Если отключено, стандартный образ sandbox запускается от непривилегированного пользователя 'pygpt', а для команд, требующих прав root, можно использовать sudo без пароля.
ipython_run_as_root.label = Запускать от root
ipython_run_as_root.description = Запускать IPython Docker sandbox от root. Если отключено, стандартный образ sandbox запускается от непривилегированного пользователя 'pygpt', а для команд, требующих прав root, можно использовать sudo без пароля.
cmd.ipython_exec.description = Выполнять код Python в текущем ядре IPython.
cmd.ipython_kernel_restart.description = Перезапустить ядро IPython.
cmd.html_render_output.description = Отобразить HTML/JS в HTML Canvas.
cmd.html_get_output.description = Получить текущий вывод HTML Canvas.
use_ipython.label = Использовать IPython
use_ipython.description = Использовать интерпретатор IPython. Если отключено, использовать стандартный интерпретатор Python.
