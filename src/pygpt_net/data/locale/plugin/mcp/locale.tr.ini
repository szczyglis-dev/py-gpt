[LOCALE]
plugin.description = Model Context Protocol (MCP) üzerinden uzak araçlara erişim sağlar; stdio, SSE ve Streamable HTTP aktarımlarını, sunucu bazında izin/verme engelleme filtrelerini, Authorization başlığını ve araç önbelleğini destekler.
plugin.name = MCP
servers.description = MCP sunucularını yapılandırın. Desteklenen aktarımlar: stdio için 'stdio: <command ...>', Streamable HTTP için 'http(s)://...' ve SSE için 'http(s)://.../sse' (veya 'sse://', 'sse+http(s)://'). Kısa sunucu adı için 'label', HTTP/SSE Authorization başlığı için 'authorization', yalnızca belirli araçlara izin vermek için virgülle ayrılmış 'allowed_commands' ve araçları engellemek için 'disabled_commands' kullanın.
servers.label = MCP sunucuları
servers.tooltip = MCP Python SDK gerekir. Kurulum: pip install "mcp[cli]"
tools_cache_enabled.description = Bulunan araçları bellekte önbelleğe alarak her istekte yeniden keşfedilmelerini önler.
tools_cache_enabled.label = Araç listesini önbelleğe al
tools_cache_enabled.tooltip = Etkinleştirildiğinde araç keşif sonuçları her sunucu için TTL süresi boyunca önbelleğe alınır.
tools_cache_ttl.description = Her sunucu için araç önbelleğinin yaşam süresi.
tools_cache_ttl.label = Önbellek TTL (saniye)
tools_cache_ttl.tooltip = TTL’yi devre dışı bırakmak için 0 ayarlayın (önerilmez).
allow_self_mcp.label = Kendinden tanımlı MCP bağlantılarına izin ver
allow_self_mcp.description = Modelin çalışma zamanında HTTP/SSE üzerinden MCP sunucuları tanımlayıp bağlanmasına izin verir. Kapalıyken self-connect aracı ve bu sunucuların araçları modele sunulmaz.
allow_self_mcp.tooltip = Varsayılan olarak kapalıdır. Yalnızca modelin çalışma zamanında tanımladığı MCP bağlantıları için geçerlidir.
allow_self_mcp_stdio.label = Kendinden tanımlı MCP stdio’ya izin ver
allow_self_mcp_stdio.description = Modelin yerel komutları başlatan MCP stdio bağlantıları tanımlamasına izin verir. Bu izin HTTP/SSE’den bağımsızdır ve varsayılan olarak kapalıdır.
allow_self_mcp_stdio.tooltip = Uyarı: stdio bağlantıları yerel süreçler başlatabilir. Yalnızca açıkça gerektiğinde etkinleştirin.
