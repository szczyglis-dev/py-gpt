[LOCALE]
plugin.description = Tarjoaa pääsyn etätyökaluihin Model Context Protocolin (MCP) kautta. Tukee stdio-, SSE- ja Streamable HTTP -siirtoja, palvelinkohtaisia sallinta-/estolistoja, Authorization-otsaketta ja työkaluvälimuistia.
plugin.name = MCP
servers.description = Määritä MCP-palvelimet. Tuetut siirtotavat: 'stdio: <command ...>' stdio-palvelimille, 'http(s)://...' Streamable HTTP:lle ja 'http(s)://.../sse' (tai 'sse://', 'sse+http(s)://') SSE:lle. Käytä 'label'-kenttää lyhyenä palvelinnimenä, 'authorization'-kenttää Authorization-otsakkeelle, 'allowed_commands'-kenttää (pilkuin eroteltuna) sallittujen työkalujen luettelona ja 'disabled_commands'-kenttää estettyjen työkalujen luettelona.
servers.label = MCP-palvelimet
servers.tooltip = Vaatii MCP Python SDK:n. Asenna: pip install "mcp[cli]"
tools_cache_enabled.description = Ottaa käyttöön löydettyjen työkalujen muistivälimuistin, jotta niitä ei tarvitse etsiä uudelleen jokaisella pyynnöllä.
tools_cache_enabled.label = Välimuistita työkaluluettelo
tools_cache_enabled.tooltip = Kun käytössä, työkalujen etsinnän tulokset välimuistitetaan palvelinkohtaisesti TTL-ajaksi.
tools_cache_ttl.description = Työkaluvälimuistin elinaika palvelinta kohden.
tools_cache_ttl.label = Välimuistin TTL (sekuntia)
tools_cache_ttl.tooltip = Aseta arvoksi 0 poistaaksesi TTL:n käytöstä (ei suositella).
allow_self_mcp.label = Salli itse määritetyt MCP-yhteydet
allow_self_mcp.description = Sallii mallin määrittää ja yhdistää MCP-palvelimiin HTTP/SSE:n kautta ajon aikana. Kun pois käytöstä, self-connect-työkalua tai tällaisten palvelimien työkaluja ei näytetä.
allow_self_mcp.tooltip = Pois käytöstä oletuksena. Koskee vain mallin ajon aikana määrittämiä MCP-yhteyksiä.
allow_self_mcp_stdio.label = Salli itse määritetty MCP stdio
allow_self_mcp_stdio.description = Sallii mallin määrittää MCP stdio -yhteyksiä, jotka käynnistävät paikallisia komentoja. Lupa on erillinen HTTP/SSE:stä ja pois käytöstä oletuksena.
allow_self_mcp_stdio.tooltip = Varoitus: stdio-yhteydet voivat käynnistää paikallisia prosesseja. Ota käyttöön vain tarvittaessa.
