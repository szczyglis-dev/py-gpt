[LOCALE]
plugin.description = يوفّر الوصول إلى الأدوات البعيدة عبر بروتوكول سياق النموذج (MCP)، مع دعم stdio وSSE وStreamable HTTP، وقوائم السماح/الحظر لكل خادم، وترويسة Authorization، وذاكرة مؤقتة للأدوات.
plugin.name = MCP
servers.description = إعداد خوادم MCP. وسائل النقل المدعومة: 'stdio: <command ...>' لخوادم stdio، و'http(s)://...' لـ Streamable HTTP، و'http(s)://.../sse' (أو 'sse://' و'sse+http(s)://') لـ SSE. استخدم 'label' اسماً قصيراً وواضحاً للخادم يظهر في أسماء الأدوات، و'authorization' لإرسال ترويسة Authorization لاتصالات HTTP/SSE. استخدم 'allowed_commands' (مفصولة بفواصل) للسماح بأدوات محددة فقط، و'disabled_commands' لحظر أدوات من هذا الخادم.
servers.label = خوادم MCP
servers.tooltip = يتطلب MCP Python SDK. للتثبيت: pip install "mcp[cli]"
tools_cache_enabled.description = يفعّل ذاكرة مؤقتة في الذاكرة للأدوات المكتشفة لتجنب إعادة اكتشافها مع كل طلب.
tools_cache_enabled.label = تخزين قائمة الأدوات مؤقتاً
tools_cache_enabled.tooltip = عند التفعيل، تُخزَّن نتائج اكتشاف الأدوات مؤقتاً لكل خادم طوال مدة TTL.
tools_cache_ttl.description = مدة صلاحية ذاكرة الأدوات المؤقتة لكل خادم.
tools_cache_ttl.label = مدة TTL للذاكرة المؤقتة (ثوانٍ)
tools_cache_ttl.tooltip = اضبطها على 0 لتعطيل TTL (غير مستحسن).
allow_self_mcp.label = السماح باتصالات MCP المعرّفة ذاتيًا
allow_self_mcp.description = يسمح للنموذج بتعريف خوادم MCP والاتصال بها عبر HTTP/SSE أثناء التشغيل. عند التعطيل، لا يتم عرض أداة الاتصال الذاتي ولا أدوات هذه الخوادم.
allow_self_mcp.tooltip = معطل افتراضيًا. ينطبق فقط على اتصالات MCP التي يعرّفها النموذج أثناء التشغيل.
allow_self_mcp_stdio.label = السماح بـ MCP stdio المعرّف ذاتيًا
allow_self_mcp_stdio.description = يسمح للنموذج بتعريف اتصالات MCP عبر stdio التي تشغّل أوامر محلية. هذا الإذن مستقل عن HTTP/SSE ومعطل افتراضيًا.
allow_self_mcp_stdio.tooltip = تحذير: يمكن لاتصالات stdio تشغيل عمليات محلية. فعّلها فقط عند الحاجة الصريحة.
