[LOCALE]
plugin.description = Zapewnia dostęp do zdalnych narzędzi przez Model Context Protocol (MCP), w tym transporty stdio, SSE i Streamable HTTP, filtrowanie dozwolonych/zablokowanych narzędzi per serwer, obsługę nagłówka Authorization i pamięć podręczną narzędzi.
plugin.name = MCP
servers.description = Skonfiguruj serwery MCP. Obsługiwane transporty: 'stdio: <command ...>' dla stdio, 'http(s)://...' dla Streamable HTTP oraz 'http(s)://.../sse' (lub 'sse://', 'sse+http(s)://') dla SSE. Użyj 'label' jako krótkiej nazwy serwera używanej w nazwach narzędzi, 'authorization' do wysyłania nagłówka Authorization dla HTTP/SSE, 'allowed_commands' (rozdzielane przecinkami) jako listy dozwolonych narzędzi oraz 'disabled_commands' jako listy narzędzi blokowanych na tym serwerze. Importowane connectory mogą dodatkowo definiować transport, zmienne środowiskowe, nagłówki HTTP, katalog roboczy i timeouty serwera.
servers.label = Serwery MCP
servers.tooltip = Wymaga MCP Python SDK. Instalacja: pip install "mcp[cli]"
tools_cache_enabled.description = Włącza pamięć podręczną wykrytych narzędzi, aby nie wyszukiwać ich ponownie przy każdym zapytaniu.
tools_cache_enabled.label = Buforuj listę narzędzi
tools_cache_enabled.tooltip = Po włączeniu wyniki wykrywania narzędzi są buforowane osobno dla każdego serwera przez czas TTL.
tools_cache_ttl.description = Czas życia pamięci podręcznej narzędzi dla każdego serwera.
tools_cache_ttl.label = TTL pamięci podręcznej (sekundy)
tools_cache_ttl.tooltip = Ustaw 0, aby wyłączyć TTL (niezalecane).
allow_self_mcp.label = Zezwalaj na samodzielnie definiowane połączenia MCP
allow_self_mcp.description = Pozwala modelowi definiować i łączyć się w czasie działania z serwerami MCP przez HTTP/SSE. Gdy wyłączone, narzędzie self-connect ani narzędzia z takich serwerów nie są udostępniane modelowi.
allow_self_mcp.tooltip = Domyślnie wyłączone. Dotyczy wyłącznie połączeń MCP definiowanych przez model w czasie działania.
allow_self_mcp_stdio.label = Zezwalaj na samodzielnie definiowane MCP stdio
allow_self_mcp_stdio.description = Pozwala modelowi definiować połączenia MCP stdio uruchamiające lokalne polecenia. Uprawnienie jest niezależne od HTTP/SSE i domyślnie wyłączone.
allow_self_mcp_stdio.tooltip = Uwaga: połączenia stdio mogą uruchamiać lokalne procesy. Włączaj tylko wtedy, gdy jest to wyraźnie potrzebne.
