[LOCALE]
plugin.description = Предоставляет доступ к удалённым инструментам через Model Context Protocol (MCP), включая stdio, SSE и Streamable HTTP, с фильтрами разрешения/запрета для каждого сервера, поддержкой заголовка Authorization и кэшем инструментов.
plugin.name = MCP
servers.description = Настройте серверы MCP. Поддерживаемые транспорты: 'stdio: <command ...>' для stdio, 'http(s)://...' для Streamable HTTP и 'http(s)://.../sse' (или 'sse://', 'sse+http(s)://') для SSE. Используйте 'label' как короткое имя сервера, 'authorization' для заголовка Authorization при HTTP/SSE, 'allowed_commands' (через запятую) для списка разрешённых инструментов и 'disabled_commands' для блокировки инструментов этого сервера.
servers.label = Серверы MCP
servers.tooltip = Требуется MCP Python SDK. Установка: pip install "mcp[cli]"
tools_cache_enabled.description = Включает кэш обнаруженных инструментов в памяти, чтобы не выполнять обнаружение при каждом запросе.
tools_cache_enabled.label = Кэшировать список инструментов
tools_cache_enabled.tooltip = Если включено, результаты обнаружения инструментов кэшируются отдельно для каждого сервера на время TTL.
tools_cache_ttl.description = Время жизни кэша инструментов для каждого сервера.
tools_cache_ttl.label = TTL кэша (секунды)
tools_cache_ttl.tooltip = Установите 0, чтобы отключить TTL (не рекомендуется).
allow_self_mcp.label = Разрешить самостоятельно задаваемые MCP-подключения
allow_self_mcp.description = Позволяет модели во время работы задавать и подключать MCP-серверы через HTTP/SSE. Если выключено, инструмент self-connect и инструменты таких серверов модели не предоставляются.
allow_self_mcp.tooltip = По умолчанию выключено. Относится только к MCP-подключениям, задаваемым моделью во время работы.
allow_self_mcp_stdio.label = Разрешить самостоятельно задаваемый MCP stdio
allow_self_mcp_stdio.description = Позволяет модели задавать MCP stdio-подключения, запускающие локальные команды. Это разрешение независимо от HTTP/SSE и по умолчанию выключено.
allow_self_mcp_stdio.tooltip = Внимание: stdio-подключения могут запускать локальные процессы. Включайте только при явной необходимости.
