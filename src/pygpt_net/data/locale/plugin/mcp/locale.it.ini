[LOCALE]
plugin.description = Fornisce accesso a strumenti remoti tramite Model Context Protocol (MCP), inclusi i trasporti stdio, SSE e Streamable HTTP, con filtri consenti/blocca per server, supporto dell’header Authorization e cache degli strumenti.
plugin.name = MCP
servers.description = Configura i server MCP. Trasporti supportati: 'stdio: <command ...>' per stdio, 'http(s)://...' per Streamable HTTP e 'http(s)://.../sse' (oppure 'sse://', 'sse+http(s)://') per SSE. Usa 'label' come nome breve del server, 'authorization' per inviare l’header Authorization con HTTP/SSE, 'allowed_commands' (separati da virgole) per consentire solo determinati strumenti e 'disabled_commands' per bloccare strumenti del server.
servers.label = Server MCP
servers.tooltip = Richiede MCP Python SDK. Installazione: pip install "mcp[cli]"
tools_cache_enabled.description = Abilita una cache in memoria degli strumenti rilevati per evitare di rilevarli di nuovo a ogni richiesta.
tools_cache_enabled.label = Memorizza in cache l’elenco strumenti
tools_cache_enabled.tooltip = Se abilitato, i risultati del rilevamento degli strumenti vengono memorizzati in cache per server per la durata del TTL.
tools_cache_ttl.description = Tempo di vita della cache degli strumenti per server.
tools_cache_ttl.label = TTL cache (secondi)
tools_cache_ttl.tooltip = Imposta 0 per disabilitare il TTL (non consigliato).
allow_self_mcp.label = Consenti connessioni MCP autodefinite
allow_self_mcp.description = Consente al modello di definire e connettere server MCP via HTTP/SSE durante l’esecuzione. Se disattivato, lo strumento di auto-connessione e gli strumenti di tali server non vengono esposti.
allow_self_mcp.tooltip = Disattivato per impostazione predefinita. Si applica solo alle connessioni MCP definite dal modello a runtime.
allow_self_mcp_stdio.label = Consenti MCP stdio autodefinito
allow_self_mcp_stdio.description = Consente al modello di definire connessioni MCP stdio che avviano comandi locali. Questa autorizzazione è indipendente da HTTP/SSE ed è disattivata per impostazione predefinita.
allow_self_mcp_stdio.tooltip = Avviso: le connessioni stdio possono avviare processi locali. Abilitare solo quando necessario.
