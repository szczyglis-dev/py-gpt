[LOCALE]
plugin.description = מספק גישה לכלים מרוחקים באמצעות Model Context Protocol ‏(MCP), כולל תעבורות stdio,‏ SSE ו-Streamable HTTP, סינון הרשאה/חסימה לכל שרת, תמיכה בכותרת Authorization ומטמון כלים.
plugin.name = MCP
servers.description = הגדרת שרתי MCP. תעבורות נתמכות: 'stdio: <command ...>' עבור stdio,‏ 'http(s)://...' עבור Streamable HTTP ו-'http(s)://.../sse' (או 'sse://', 'sse+http(s)://') עבור SSE. השתמש ב-'label' כשם קצר לשרת, ב-'authorization' לשליחת כותרת Authorization בחיבורי HTTP/SSE, ב-'allowed_commands' (מופרדים בפסיקים) לרשימת כלים מורשים וב-'disabled_commands' לחסימת כלים מהשרת.
servers.label = שרתי MCP
servers.tooltip = דורש MCP Python SDK. התקנה: pip install "mcp[cli]"
tools_cache_enabled.description = מפעיל מטמון בזיכרון לכלים שהתגלו כדי למנוע גילוי מחדש בכל בקשה.
tools_cache_enabled.label = שמירת רשימת הכלים במטמון
tools_cache_enabled.tooltip = כאשר מופעל, תוצאות גילוי הכלים נשמרות במטמון לכל שרת למשך זמן ה-TTL.
tools_cache_ttl.description = משך החיים של מטמון הכלים לכל שרת.
tools_cache_ttl.label = TTL של המטמון (שניות)
tools_cache_ttl.tooltip = הגדר 0 כדי להשבית TTL (לא מומלץ).
allow_self_mcp.label = אפשר חיבורי MCP בהגדרת המודל
allow_self_mcp.description = מאפשר למודל להגדיר ולהתחבר בזמן ריצה לשרתי MCP דרך HTTP/SSE. כאשר כבוי, כלי החיבור העצמי וכלים משרתים כאלה אינם נחשפים למודל.
allow_self_mcp.tooltip = כבוי כברירת מחדל. חל רק על חיבורי MCP שהמודל מגדיר בזמן ריצה.
allow_self_mcp_stdio.label = אפשר MCP stdio בהגדרת המודל
allow_self_mcp_stdio.description = מאפשר למודל להגדיר חיבורי MCP מסוג stdio שמפעילים פקודות מקומיות. הרשאה זו עצמאית מ-HTTP/SSE וכבויה כברירת מחדל.
allow_self_mcp_stdio.tooltip = אזהרה: חיבורי stdio יכולים להפעיל תהליכים מקומיים. יש להפעיל רק כשנדרש במפורש.
