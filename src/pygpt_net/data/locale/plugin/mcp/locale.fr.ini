[LOCALE]
plugin.description = Donne accès à des outils distants via le Model Context Protocol (MCP), avec les transports stdio, SSE et Streamable HTTP, des filtres d’autorisation/interdiction par serveur, la prise en charge de l’en-tête Authorization et un cache des outils.
plugin.name = MCP
servers.description = Configurez les serveurs MCP. Transports pris en charge : 'stdio: <command ...>' pour stdio, 'http(s)://...' pour Streamable HTTP et 'http(s)://.../sse' (ou 'sse://', 'sse+http(s)://') pour SSE. Utilisez 'label' comme nom court du serveur, 'authorization' pour envoyer l’en-tête Authorization en HTTP/SSE, 'allowed_commands' (séparés par des virgules) pour n’autoriser que certains outils et 'disabled_commands' pour bloquer des outils de ce serveur.
servers.label = Serveurs MCP
servers.tooltip = Nécessite le SDK Python MCP. Installation : pip install "mcp[cli]"
tools_cache_enabled.description = Active un cache en mémoire des outils découverts afin d’éviter une nouvelle détection à chaque requête.
tools_cache_enabled.label = Mettre en cache la liste des outils
tools_cache_enabled.tooltip = Si activé, les résultats de détection des outils sont mis en cache par serveur pendant la durée du TTL.
tools_cache_ttl.description = Durée de vie du cache des outils pour chaque serveur.
tools_cache_ttl.label = TTL du cache (secondes)
tools_cache_ttl.tooltip = Définissez 0 pour désactiver le TTL (non recommandé).
allow_self_mcp.label = Autoriser les connexions MCP autodéfinies
allow_self_mcp.description = Autorise le modèle à définir et connecter des serveurs MCP via HTTP/SSE à l’exécution. Si désactivé, l’outil d’auto-connexion et les outils de ces serveurs ne sont pas exposés.
allow_self_mcp.tooltip = Désactivé par défaut. S’applique uniquement aux connexions MCP définies par le modèle à l’exécution.
allow_self_mcp_stdio.label = Autoriser MCP stdio autodéfini
allow_self_mcp_stdio.description = Autorise le modèle à définir des connexions MCP stdio lançant des commandes locales. Cette autorisation est indépendante de HTTP/SSE et désactivée par défaut.
allow_self_mcp_stdio.tooltip = Attention : les connexions stdio peuvent lancer des processus locaux. À activer uniquement si nécessaire.
