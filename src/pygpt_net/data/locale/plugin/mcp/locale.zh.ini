[LOCALE]
plugin.description = 通过 Model Context Protocol（MCP）访问远程工具，支持 stdio、SSE 和 Streamable HTTP 传输、按服务器允许/禁用过滤、Authorization 标头以及工具缓存。
plugin.name = MCP
servers.description = 配置 MCP 服务器。支持的传输方式：stdio 使用 'stdio: <command ...>'，Streamable HTTP 使用 'http(s)://...'，SSE 使用 'http(s)://.../sse'（或 'sse://'、'sse+http(s)://'）。使用 'label' 设置工具名称中使用的简短服务器名，使用 'authorization' 为 HTTP/SSE 发送 Authorization 标头，使用逗号分隔的 'allowed_commands' 仅允许指定工具，使用 'disabled_commands' 禁用该服务器上的工具。
servers.label = MCP 服务器
servers.tooltip = 需要 MCP Python SDK。安装：pip install "mcp[cli]"
tools_cache_enabled.description = 启用已发现工具的内存缓存，避免每次请求时重新发现工具。
tools_cache_enabled.label = 缓存工具列表
tools_cache_enabled.tooltip = 启用后，工具发现结果会按服务器缓存，并在 TTL 到期前有效。
tools_cache_ttl.description = 每个服务器的工具缓存生存时间。
tools_cache_ttl.label = 缓存 TTL（秒）
tools_cache_ttl.tooltip = 设置为 0 可禁用 TTL（不推荐）。
allow_self_mcp.label = 允许模型自定义 MCP 连接
allow_self_mcp.description = 允许模型在运行时通过 HTTP/SSE 定义并连接 MCP 服务器。关闭后，不会向模型暴露 self-connect 工具以及这些服务器的工具。
allow_self_mcp.tooltip = 默认关闭。仅适用于模型在运行时定义的 MCP 连接。
allow_self_mcp_stdio.label = 允许模型自定义 MCP stdio
allow_self_mcp_stdio.description = 允许模型定义可启动本地命令的 MCP stdio 连接。此权限独立于 HTTP/SSE，默认关闭。
allow_self_mcp_stdio.tooltip = 警告：stdio 连接可以启动本地进程。仅在明确需要时启用。
