[LOCALE]
plugin.description = Осигурява достъп до отдалечени инструменти чрез Model Context Protocol (MCP), включително stdio, SSE и Streamable HTTP, с филтри за разрешаване/забраняване по сървър, поддръжка на Authorization header и кеш на инструментите.
plugin.name = MCP
servers.description = Конфигурирайте MCP сървъри. Поддържани транспорти: 'stdio: <command ...>' за stdio, 'http(s)://...' за Streamable HTTP и 'http(s)://.../sse' (или 'sse://', 'sse+http(s)://') за SSE. Използвайте 'label' за кратко име на сървъра, 'authorization' за Authorization header при HTTP/SSE, 'allowed_commands' (разделени със запетая) за списък с разрешени инструменти и 'disabled_commands' за забранени инструменти.
servers.label = MCP сървъри
servers.tooltip = Изисква MCP Python SDK. Инсталиране: pip install "mcp[cli]"
tools_cache_enabled.description = Включва кеш в паметта за откритите инструменти, за да не се откриват отново при всяка заявка.
tools_cache_enabled.label = Кеширане на списъка с инструменти
tools_cache_enabled.tooltip = Когато е включено, резултатите от откриването се кешират за всеки сървър за периода TTL.
tools_cache_ttl.description = Време на живот на кеша с инструменти за всеки сървър.
tools_cache_ttl.label = TTL на кеша (секунди)
tools_cache_ttl.tooltip = Задайте 0, за да изключите TTL (не се препоръчва).
allow_self_mcp.label = Разрешаване на самодефинирани MCP връзки
allow_self_mcp.description = Позволява на модела по време на работа да дефинира и свързва MCP сървъри чрез HTTP/SSE. Когато е изключено, инструментът self-connect и инструментите от тези сървъри не се предоставят.
allow_self_mcp.tooltip = Изключено по подразбиране. Отнася се само за MCP връзки, дефинирани от модела по време на работа.
allow_self_mcp_stdio.label = Разрешаване на самодефиниран MCP stdio
allow_self_mcp_stdio.description = Позволява на модела да дефинира MCP stdio връзки, които стартират локални команди. Разрешението е независимо от HTTP/SSE и е изключено по подразбиране.
allow_self_mcp_stdio.tooltip = Предупреждение: stdio връзките могат да стартират локални процеси. Включвайте само при изрична необходимост.
