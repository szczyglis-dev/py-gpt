[LOCALE]
plugin.description = Proporciona acceso a herramientas remotas mediante Model Context Protocol (MCP), incluidos los transportes stdio, SSE y Streamable HTTP, con filtros de permitir/bloquear por servidor, soporte del encabezado Authorization y caché de herramientas.
plugin.name = MCP
servers.description = Configura servidores MCP. Transportes compatibles: 'stdio: <command ...>' para stdio, 'http(s)://...' para Streamable HTTP y 'http(s)://.../sse' (o 'sse://', 'sse+http(s)://') para SSE. Usa 'label' como nombre corto del servidor, 'authorization' para enviar el encabezado Authorization en HTTP/SSE, 'allowed_commands' (separados por comas) para permitir solo herramientas concretas y 'disabled_commands' para bloquear herramientas del servidor.
servers.label = Servidores MCP
servers.tooltip = Requiere el SDK de MCP para Python. Instalar: pip install "mcp[cli]"
tools_cache_enabled.description = Activa una caché en memoria de las herramientas detectadas para evitar volver a descubrirlas en cada solicitud.
tools_cache_enabled.label = Guardar en caché la lista de herramientas
tools_cache_enabled.tooltip = Si está activado, los resultados del descubrimiento de herramientas se almacenan en caché por servidor durante el TTL.
tools_cache_ttl.description = Tiempo de vida de la caché de herramientas por servidor.
tools_cache_ttl.label = TTL de caché (segundos)
tools_cache_ttl.tooltip = Establece 0 para desactivar el TTL (no recomendado).
allow_self_mcp.label = Permitir conexiones MCP autodefinidas
allow_self_mcp.description = Permite que el modelo defina y conecte servidores MCP mediante HTTP/SSE en tiempo de ejecución. Si está desactivado, no se exponen la herramienta de autoconexión ni las herramientas de esos servidores.
allow_self_mcp.tooltip = Desactivado de forma predeterminada. Solo afecta a conexiones MCP definidas por el modelo en tiempo de ejecución.
allow_self_mcp_stdio.label = Permitir MCP stdio autodefinido
allow_self_mcp_stdio.description = Permite que el modelo defina conexiones MCP stdio que inician comandos locales. Este permiso es independiente de HTTP/SSE y está desactivado de forma predeterminada.
allow_self_mcp_stdio.tooltip = Advertencia: las conexiones stdio pueden iniciar procesos locales. Actívelo solo cuando sea necesario.
