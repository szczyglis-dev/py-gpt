[LOCALE]
plugin.name = RAG (inline)

cmd.get_context.description = استرجاع سياق إضافي من الفهرس.
append_meta.description = إذا كان مفعّلًا، فستُلحق البيانات الوصفية من LlamaIndex بالسياق الإضافي
