ask_llama_first.description = عند التفعيل، سيتم سؤال LlamaIndex أولًا واستخدام الرد كمعرفة إضافية في الموجّه. عند التعطيل، لن يُسأل LlamaIndex إلا عند الحاجة. معلومات: معطّل في الوضع المستقل (عبر الملحق)!
ask_llama_first.label = اسأل LlamaIndex أولًا
idx.description = الفهارس العالمية المستخدمة عند الاستعلام عن سياق إضافي. يمكنك اختيار أكثر من واحد. عند تفعيل "Use project index if in use" وكانت المحادثة الحالية داخل مشروع، يُستخدم فهرس المشروع المعزول بدلًا من ذلك.
idx.label = الفهارس المستخدمة
max_question_chars.description = الحد الأقصى لأحرف السؤال عند الاستعلام من LlamaIndex، ‏0 = بلا حد.
max_question_chars.label = الحد الأقصى لأحرف السؤال
model_prepare_question.description = النموذج المستخدم لإعداد السؤال قبل سؤال LlamaIndex، الافتراضي: %MODEL_DEFAULT_MINI%
model_prepare_question.label = نموذج إعداد السؤال
model_query.description = النموذج المستخدم للاستعلام من LlamaIndex، الافتراضي: %MODEL_DEFAULT_MINI%.
