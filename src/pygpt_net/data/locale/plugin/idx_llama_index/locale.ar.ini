model_image.description = النموذج المستخدم لتحليل الصور في محمّلات البيانات، الافتراضي: gpt-4o.
model_image.label = نموذج الصور
plugin.description = يدمج تخزين LlamaIndex (الدردشة مع الملفات) في أي دردشة ويوفّر معرفة إضافية للسياق (من الملفات ومن سجل السياق في قاعدة البيانات)
prepare_question.description = عند التفعيل، سيتم إعداد السؤال قبل سؤال LlamaIndex لإنشاء أفضل استعلام.
prepare_question.label = إعداد السؤال تلقائيًا قبل سؤال LlamaIndex أولًا
prepare_question_max_tokens.description = الحد الأقصى للرموز المميزة في الإخراج عند إعداد سؤال قبل سؤال LlamaIndex.
