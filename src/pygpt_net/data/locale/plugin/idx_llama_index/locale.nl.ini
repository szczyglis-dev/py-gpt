model_prepare_question.description = Model voor het voorbereiden van een vraag vóór het bevragen van LlamaIndex, standaard: %MODEL_DEFAULT_MINI%
model_prepare_question.label = Model voor vraagvoorbereiding
model_query.description = Model voor het bevragen van LlamaIndex, standaard: %MODEL_DEFAULT_MINI%.
