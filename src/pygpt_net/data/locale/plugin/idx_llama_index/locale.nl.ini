ask_llama_first.description = Wanneer ingeschakeld wordt LlamaIndex eerst bevraagd en wordt het antwoord als extra kennis in de prompt gebruikt. Wanneer uitgeschakeld wordt LlamaIndex alleen bevraagd wanneer nodig. INFO: Uitgeschakeld in autonome modus (via plugin)!
ask_llama_first.label = LlamaIndex eerst bevragen
