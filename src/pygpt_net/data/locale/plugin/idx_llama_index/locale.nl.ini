model_image.description = Model voor het analyseren van afbeeldingen in dataloaders, standaard: gpt-4o.
model_image.label = Afbeeldingsmodel
plugin.description = Integreert LlamaIndex-opslag (Chat with files) in elke chat en biedt extra kennis in de context (uit bestanden en uit contextgeschiedenis in de database)
