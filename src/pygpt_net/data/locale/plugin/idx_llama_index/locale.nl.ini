syntax_prepare_question.label = Prompt voor vraagvoorbereiding
use_project_index.label = Projectindex gebruiken indien actief
use_project_index.description = Wanneer het huidige gesprek zich in een project bevindt, gebruik de geïsoleerde index van dat project in plaats van de geconfigureerde globale index(en).
