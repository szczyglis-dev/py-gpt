plugin.description = Integrálja a LlamaIndex (Chat with files) tárolását bármely chatbe, és kiegészítő tudást biztosít a kontextushoz (fájlokból és az adatbázis kontextuselőzményeiből)
prepare_question.description = Ha engedélyezve van, a kérdés előkészítésre kerül a LlamaIndex megkérdezése előtt a legjobb lekérdezés létrehozásához.
prepare_question.label = Kérdés automatikus előkészítése a LlamaIndex első lekérdezése előtt
