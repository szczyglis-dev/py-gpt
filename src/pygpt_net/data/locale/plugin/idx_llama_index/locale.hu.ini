ask_llama_first.description = Ha engedélyezve van, először a LlamaIndex kerül lekérdezésre, és a válasz kiegészítő tudásként kerül a promptba. Kikapcsolva a LlamaIndex csak szükség esetén lesz lekérdezve. INFO: Autonóm módban letiltva (bővítményen keresztül)!
ask_llama_first.label = LlamaIndex megkérdezése először
idx.description = Kiegészítő kontextus lekérdezéséhez használt globális indexek. Több is kiválasztható. Ha a "Use project index if in use" engedélyezve van és az aktuális beszélgetés projektben van, a projekt izolált indexe használatos.
idx.label = Használandó indexek
max_question_chars.description = A kérdés maximális karakterszáma LlamaIndex lekérdezésekor, 0 = nincs korlát.
max_question_chars.label = Kérdés maximális karakterszáma
model_prepare_question.description = A kérdés előkészítéséhez használt modell a LlamaIndex lekérdezése előtt, alapértelmezett: %MODEL_DEFAULT_MINI%
model_prepare_question.label = Modell kérdés-előkészítéshez
model_query.description = A LlamaIndex lekérdezéséhez használt modell, alapértelmezett: %MODEL_DEFAULT_MINI%.
model_query.label = Modell
model_image.description = Az adatbetöltőkben lévő képek elemzéséhez használt modell, alapértelmezett: gpt-4o.
