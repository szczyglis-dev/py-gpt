[LOCALE]
plugin.name = RAG (inline)

cmd.get_context.description = Получение дополнительного контекста из индекса.
append_meta.description = Если включено, метаданные LlamaIndex будут добавлены в дополнительный контекст
append_meta.label = Добавлять метаданные в контекст
ask_llama_first.description = Если включено, сначала будет запрошен LlamaIndex, а ответ будет использован как дополнительное знание в промпте. Если отключено, LlamaIndex будет запрашиваться только при необходимости. ИНФО: Отключено в автономном режиме (через плагин)!
ask_llama_first.label = Сначала запрашивать LlamaIndex
idx.description = Глобальные индексы для запроса дополнительного контекста. Можно выбрать несколько. Если включено "Use project index if in use" и текущий разговор находится в проекте, вместо них используется изолированный индекс проекта.
idx.label = Используемые индексы
max_question_chars.description = Максимальное число символов в вопросе при запросе LlamaIndex, 0 = без ограничений.
max_question_chars.label = Максимум символов в вопросе
model_prepare_question.description = Модель для подготовки вопроса перед запросом LlamaIndex, по умолчанию: %MODEL_DEFAULT_MINI%
model_prepare_question.label = Модель для подготовки вопроса
model_query.description = Модель для запроса LlamaIndex, по умолчанию: %MODEL_DEFAULT_MINI%.
model_query.label = Модель
model_image.description = Модель для анализа изображений в загрузчиках данных, по умолчанию: gpt-4o.
model_image.label = Модель изображений
plugin.description = Интегрирует хранилище LlamaIndex (Chat with files) в любой чат и предоставляет дополнительное знание в контексте (из файлов и истории контекстов в базе данных)
prepare_question.description = Если включено, вопрос будет подготовлен перед запросом LlamaIndex для создания наилучшего запроса.
prepare_question.label = Автоматически готовить вопрос перед первым запросом LlamaIndex
prepare_question_max_tokens.description = Максимальное число выходных токенов при подготовке вопроса перед запросом LlamaIndex.
prepare_question_max_tokens.label = Максимум выходных токенов для подготовки вопроса
prompt.description = Промпт с инструкциями по использованию дополнительных данных от LlamaIndex.
prompt.label = Промпт
syntax_prepare_question.description = Системный промпт для подготовки вопроса.
syntax_prepare_question.label = Промпт для подготовки вопроса
use_project_index.label = Использовать индекс проекта, если он активен
use_project_index.description = Если текущий разговор находится в проекте, использовать изолированный индекс проекта вместо настроенных глобальных индексов.
