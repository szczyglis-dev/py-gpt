[LOCALE]
plugin.name = RAG (inline)

cmd.get_context.description = Извличане на допълнителен контекст от индекса.
append_meta.description = Ако е включено, метаданните от LlamaIndex ще се добавят към допълнителния контекст
append_meta.label = Добавяне на метаданни към контекста
ask_llama_first.description = Когато е включено, първо ще бъде попитан LlamaIndex и отговорът ще се използва като допълнително знание в prompt. Когато е изключено, LlamaIndex ще се пита само при нужда. INFO: Изключено в автономен режим (чрез plugin)!
ask_llama_first.label = Първо попитай LlamaIndex
idx.description = Глобални индекси за допълнителен контекст. Можете да изберете повече от един. Когато „Use project index if in use“ е включено и разговорът е в проект, вместо тях се използва изолираният проектен индекс.
idx.label = Индекси за използване
max_question_chars.description = Максимален брой знаци във въпрос към LlamaIndex, 0 = без ограничение.
max_question_chars.label = Максимален брой знаци във въпроса
model_prepare_question.description = Модел за подготовка на въпрос преди заявка към LlamaIndex, по подразбиране: %MODEL_DEFAULT_MINI%
model_prepare_question.label = Модел за подготовка на въпроса
model_query.description = Модел за заявка към LlamaIndex, по подразбиране: %MODEL_DEFAULT_MINI%.
model_query.label = Модел
model_image.description = Модел за анализ на изображения в data loaders, по подразбиране: gpt-4o.
model_image.label = Модел за изображения
plugin.description = Интегрира LlamaIndex (Chat with files) хранилище във всеки чат и добавя знания към контекста (от файлове и историята на контекста в базата данни)
prepare_question.description = Когато е включено, въпросът ще бъде подготвен преди LlamaIndex, за да се създаде най-добрата заявка.
prepare_question.label = Автоматична подготовка на въпроса преди първа заявка към LlamaIndex
prepare_question_max_tokens.description = Максимален брой токени в изхода при подготовка на въпрос преди LlamaIndex.
prepare_question_max_tokens.label = Максимални изходни токени за подготовка на въпрос
prompt.description = Prompt за указване как да се използват допълнителните данни от LlamaIndex.
prompt.label = Prompt
syntax_prepare_question.description = Системен prompt за подготовка на въпрос.
syntax_prepare_question.label = Prompt за подготовка на въпрос
use_project_index.label = Използване на проектния индекс, ако се използва
use_project_index.description = Когато текущият разговор е в проект, използвайте изолирания индекс на проекта вместо конфигурираните глобални индекси.
