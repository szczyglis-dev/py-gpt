[LOCALE]
plugin.name = RAG (inline)

cmd.get_context.description = Recuperar contexto adicional do índice.
append_meta.description = Se ativado, metadados do LlamaIndex serão anexados ao contexto adicional
append_meta.label = Anexar metadados ao contexto
ask_llama_first.description = Quando ativado, o LlamaIndex será consultado primeiro e a resposta será usada como conhecimento adicional no prompt. Quando desativado, o LlamaIndex só será consultado quando necessário. INFO: Desativado no modo autónomo (via plugin)!
ask_llama_first.label = Consultar LlamaIndex primeiro
idx.description = Índices globais a usar ao consultar contexto adicional. Pode selecionar mais do que um. Quando "Use project index if in use" estiver ativado e a conversa atual estiver num projeto, será usado o índice isolado do projeto.
idx.label = Índices a usar
max_question_chars.description = Máximo de caracteres numa pergunta ao consultar o LlamaIndex, 0 = sem limite.
max_question_chars.label = Máximo de caracteres na pergunta
model_prepare_question.description = Modelo usado para preparar uma pergunta antes de consultar o LlamaIndex, predefinição: %MODEL_DEFAULT_MINI%
model_prepare_question.label = Modelo para preparação da pergunta
model_query.description = Modelo usado para consultar o LlamaIndex, predefinição: %MODEL_DEFAULT_MINI%.
model_query.label = Modelo
model_image.description = Modelo usado para analisar imagens nos data loaders, predefinição: gpt-4o.
model_image.label = Modelo de imagem
plugin.description = Integra o armazenamento LlamaIndex (Chat with files) em qualquer chat e fornece conhecimento adicional ao contexto (a partir de ficheiros e do histórico de contexto na base de dados)
prepare_question.description = Quando ativado, a pergunta será preparada antes de consultar o LlamaIndex para criar a melhor consulta.
prepare_question.label = Preparar automaticamente a pergunta antes de consultar primeiro o LlamaIndex
prepare_question_max_tokens.description = Máximo de tokens de saída ao preparar uma pergunta antes de consultar o LlamaIndex.
prepare_question_max_tokens.label = Máximo de tokens de saída para preparação da pergunta
prompt.description = Prompt usado para instruir como utilizar os dados adicionais fornecidos pelo LlamaIndex.
prompt.label = Prompt
syntax_prepare_question.description = Prompt de sistema para preparação da pergunta.
syntax_prepare_question.label = Prompt para preparação da pergunta
use_project_index.label = Usar índice do projeto se estiver em uso
use_project_index.description = Quando a conversa atual estiver num projeto, usar o índice isolado desse projeto em vez dos índices globais configurados.
