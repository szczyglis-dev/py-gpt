[LOCALE]
plugin.name = RAG (inline)

cmd.get_context.description = Získanie dodatočného kontextu z indexu.
append_meta.description = Ak je povolené, metadáta z LlamaIndex sa pridajú k dodatočnému kontextu
append_meta.label = Pridať metadáta ku kontextu
ask_llama_first.description = Keď je povolené, najprv sa opýta LlamaIndex a odpoveď sa použije ako dodatočná znalosť v prompte. Keď je vypnuté, LlamaIndex sa opýta iba v prípade potreby. INFO: V autonómnom režime je vypnuté (cez plugin)!
ask_llama_first.label = Najprv sa opýtať LlamaIndex
idx.description = Globálne indexy používané pri dotazovaní dodatočného kontextu. Môžete vybrať viac ako jeden. Keď je povolené "Use project index if in use" a aktuálna konverzácia je v projekte, použije sa izolovaný index projektu.
idx.label = Použité indexy
max_question_chars.description = Maximálny počet znakov v otázke pri dotazovaní LlamaIndex, 0 = bez obmedzenia.
max_question_chars.label = Maximálny počet znakov v otázke
model_prepare_question.description = Model použitý na prípravu otázky pred dotazom na LlamaIndex, predvolené: %MODEL_DEFAULT_MINI%
model_prepare_question.label = Model na prípravu otázky
model_query.description = Model použitý na dotazovanie LlamaIndex, predvolené: %MODEL_DEFAULT_MINI%.
model_query.label = Model
model_image.description = Model použitý na analýzu obrázkov v data loaderoch, predvolené: gpt-4o.
model_image.label = Obrazový model
plugin.description = Integruje úložisko LlamaIndex (Chat with files) do ľubovoľného chatu a poskytuje dodatočné znalosti do kontextu (zo súborov a histórie kontextu v databáze)
prepare_question.description = Keď je povolené, otázka sa pripraví pred dotazom na LlamaIndex, aby sa vytvoril najlepší dotaz.
prepare_question.label = Automaticky pripraviť otázku pred prvým dotazom na LlamaIndex
prepare_question_max_tokens.description = Maximálny počet výstupných tokenov pri príprave otázky pred dotazom na LlamaIndex.
prepare_question_max_tokens.label = Max. výstupných tokenov pre prípravu otázky
prompt.description = Prompt používaný na inštrukcie, ako používať dodatočné dáta poskytnuté LlamaIndex.
prompt.label = Prompt
syntax_prepare_question.description = Systémový prompt na prípravu otázky.
syntax_prepare_question.label = Prompt na prípravu otázky
use_project_index.label = Použiť index projektu, ak sa používa
use_project_index.description = Keď je aktuálna konverzácia v projekte, použiť izolovaný index daného projektu namiesto nakonfigurovaných globálnych indexov.
