[LOCALE]
plugin.name = RAG (inline)

cmd.get_context.description = Hae lisäkontekstia indeksistä.
append_meta.description = Jos käytössä, LlamaIndexin metadata lisätään lisäkontekstiin
append_meta.label = Lisää metadata kontekstiin
ask_llama_first.description = Kun tämä on käytössä, LlamaIndexiltä kysytään ensin ja vastausta käytetään lisätietona kehotteessa. Kun tämä ei ole käytössä, LlamaIndexiltä kysytään vain tarvittaessa. INFO: Poistettu käytöstä autonomisessa tilassa (liitännäisen kautta)!
ask_llama_first.label = Kysy ensin LlamaIndexiltä
idx.description = Globaalit indeksit, joita käytetään lisäkontekstin kyselyssä. Voit valita useamman kuin yhden. Kun "Use project index if in use" on käytössä ja nykyinen keskustelu on projektissa, käytetään projektin eristettyä indeksiä.
idx.label = Käytettävät indeksit
max_question_chars.description = Kysymyksen enimmäismerkkimäärä LlamaIndex-kyselyssä, 0 = ei rajoitusta.
max_question_chars.label = Kysymyksen enimmäismerkit
model_prepare_question.description = Malli, jota käytetään kysymyksen valmisteluun ennen LlamaIndex-kyselyä, oletus: %MODEL_DEFAULT_MINI%
model_prepare_question.label = Malli kysymyksen valmisteluun
model_query.description = LlamaIndex-kyselyihin käytettävä malli, oletus: %MODEL_DEFAULT_MINI%.
model_query.label = Malli
model_image.description = Malli, jota käytetään kuvien analysointiin datalataajissa, oletus: gpt-4o.
model_image.label = Kuvamalli
plugin.description = Integroi LlamaIndexin (Chat with files) tallennuksen mihin tahansa keskusteluun ja tarjoaa lisätietoa kontekstiin (tiedostoista ja tietokannan kontekstihistoriasta)
prepare_question.description = Kun käytössä, kysymys valmistellaan ennen LlamaIndexiltä kysymistä parhaan kyselyn luomiseksi.
prepare_question.label = Valmistele kysymys automaattisesti ennen ensimmäistä LlamaIndex-kyselyä
prepare_question_max_tokens.description = Tulostokenien enimmäismäärä kysymyksen valmistelussa ennen LlamaIndex-kyselyä.
prepare_question_max_tokens.label = Kysymyksen valmistelun tulostokenien enimmäismäärä
prompt.description = Kehote, jolla ohjeistetaan LlamaIndexin tarjoamien lisätietojen käyttöä.
prompt.label = Kehote
syntax_prepare_question.description = Järjestelmäkehote kysymyksen valmistelua varten.
syntax_prepare_question.label = Kehote kysymyksen valmisteluun
use_project_index.label = Käytä projektin indeksiä, jos käytössä
