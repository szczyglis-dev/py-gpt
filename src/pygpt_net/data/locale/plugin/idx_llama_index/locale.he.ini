[LOCALE]
plugin.name = RAG (inline)

cmd.get_context.description = אחזור הקשר נוסף מהאינדקס.
append_meta.description = אם מופעל, מטא־נתונים מ־LlamaIndex יתווספו להקשר הנוסף
append_meta.label = הוסף מטא־נתונים להקשר
ask_llama_first.description = כאשר מופעל, LlamaIndex יישאל ראשון והתשובה תשמש כידע נוסף בהנחיה. כאשר מושבת, LlamaIndex יישאל רק בעת הצורך. מידע: מושבת במצב אוטונומי (באמצעות התוסף)!
ask_llama_first.label = שאל את LlamaIndex תחילה
idx.description = אינדקסים גלובליים לשימוש בעת שאילתת הקשר נוסף. ניתן לבחור יותר מאחד. כאשר "Use project index if in use" מופעל והשיחה הנוכחית נמצאת בתוך פרויקט, ייעשה שימוש באינדקס המבודד של הפרויקט במקום זאת.
idx.label = אינדקסים לשימוש
max_question_chars.description = מספר התווים המרבי בשאלה בעת שאילתת LlamaIndex, ‏0 = ללא הגבלה.
max_question_chars.label = מספר תווים מרבי בשאלה
model_prepare_question.description = המודל המשמש להכנת שאלה לפני שאילתת LlamaIndex, ברירת מחדל: %MODEL_DEFAULT_MINI%
model_prepare_question.label = מודל להכנת שאלה
model_query.description = המודל המשמש לשאילתת LlamaIndex, ברירת מחדל: %MODEL_DEFAULT_MINI%.
model_query.label = מודל
model_image.description = המודל המשמש לניתוח תמונות בטועני נתונים, ברירת מחדל: gpt-4o.
model_image.label = מודל תמונה
plugin.description = משלב את אחסון LlamaIndex (Chat with files) בכל צ'אט ומספק ידע נוסף להקשר (מקבצים ומהיסטוריית ההקשר במסד הנתונים)
prepare_question.description = כאשר מופעל, השאלה תוכן לפני שאילתת LlamaIndex כדי ליצור את השאילתה הטובה ביותר.
prepare_question.label = הכן אוטומטית את השאלה לפני שאילתת LlamaIndex הראשונה
prepare_question_max_tokens.description = מספר הטוקנים המרבי בפלט בעת הכנת שאלה לפני שאילתת LlamaIndex.
prepare_question_max_tokens.label = מספר טוקני פלט מרבי להכנת שאלה
prompt.description = הנחיה המשמשת להסבר כיצד להשתמש בנתונים הנוספים שסופקו מ־LlamaIndex.
prompt.label = פרומפט
syntax_prepare_question.description = הנחיית מערכת להכנת שאלה.
syntax_prepare_question.label = הנחיה להכנת שאלה
use_project_index.label = השתמש באינדקס הפרויקט אם הוא בשימוש
use_project_index.description = כאשר השיחה הנוכחית נמצאת בתוך פרויקט, השתמש באינדקס המבודד של הפרויקט במקום באינדקסים הגלובליים שהוגדרו.
