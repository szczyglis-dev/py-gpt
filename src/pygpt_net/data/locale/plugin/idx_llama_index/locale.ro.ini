[LOCALE]
plugin.name = RAG (inline)

cmd.get_context.description = Obținerea unui context suplimentar din index.
append_meta.description = Dacă este activat, metadatele din LlamaIndex vor fi adăugate la contextul suplimentar
append_meta.label = Adaugă metadate la context
ask_llama_first.description = Când este activat, LlamaIndex va fi întrebat primul, iar răspunsul va fi folosit ca informație suplimentară în prompt. Când este dezactivat, LlamaIndex va fi întrebat doar când este necesar. INFO: Dezactivat în modul autonom (prin plugin)!
ask_llama_first.label = Întreabă LlamaIndex mai întâi
idx.description = Indexuri globale de utilizat la interogarea contextului suplimentar. Puteți selecta mai mult de unul. Când "Use project index if in use" este activat și conversația curentă se află într-un proiect, se utilizează în schimb indexul izolat al proiectului.
idx.label = Indexuri de utilizat
max_question_chars.description = Numărul maxim de caractere într-o întrebare la interogarea LlamaIndex, 0 = fără limită.
max_question_chars.label = Numărul maxim de caractere în întrebare
model_prepare_question.description = Model utilizat pentru pregătirea unei întrebări înainte de a întreba LlamaIndex, implicit: %MODEL_DEFAULT_MINI%
model_prepare_question.label = Model pentru pregătirea întrebării
model_query.description = Model utilizat pentru interogarea LlamaIndex, implicit: %MODEL_DEFAULT_MINI%.
model_query.label = Model
model_image.description = Model utilizat pentru analiza imaginilor în data loaders, implicit: gpt-4o.
model_image.label = Model imagine
plugin.description = Integrează stocarea LlamaIndex (Chat with files) în orice chat și oferă informații suplimentare în context (din fișiere și din istoricul contextului din baza de date)
prepare_question.description = Când este activat, întrebarea va fi pregătită înainte de a întreba LlamaIndex pentru a crea cea mai bună interogare.
prepare_question.label = Pregătește automat întrebarea înainte de a întreba LlamaIndex mai întâi
prepare_question_max_tokens.description = Numărul maxim de tokeni de ieșire la pregătirea unei întrebări înainte de a întreba LlamaIndex.
prepare_question_max_tokens.label = Tokeni maximi de ieșire pentru pregătirea întrebării
prompt.description = Prompt utilizat pentru a indica modul de utilizare a datelor suplimentare furnizate de LlamaIndex.
prompt.label = Prompt
syntax_prepare_question.description = Prompt de sistem pentru pregătirea întrebării.
syntax_prepare_question.label = Prompt pentru pregătirea întrebării
use_project_index.label = Utilizează indexul proiectului dacă este activ
use_project_index.description = Când conversația curentă se află într-un proiect, utilizează indexul izolat al proiectului în locul indexurilor globale configurate.
