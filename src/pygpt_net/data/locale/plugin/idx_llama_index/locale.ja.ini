[LOCALE]
plugin.name = RAG (inline)

cmd.get_context.description = インデックスから追加コンテキストを取得します。
append_meta.description = 有効にすると、LlamaIndex のメタデータが追加コンテキストに付加されます
append_meta.label = メタデータをコンテキストに追加
ask_llama_first.description = 有効にすると最初に LlamaIndex に問い合わせ、その応答をプロンプトの追加知識として使用します。無効にすると、必要な場合のみ LlamaIndex に問い合わせます。情報: 自律モードでは（プラグイン経由で）無効です！
ask_llama_first.label = 最初に LlamaIndex に問い合わせる
idx.description = 追加コンテキストの問い合わせに使用するグローバルインデックス。複数選択できます。"Use project index if in use" が有効で、現在の会話がプロジェクト内にある場合は、代わりにそのプロジェクトの分離インデックスを使用します。
idx.label = 使用するインデックス
max_question_chars.description = LlamaIndex への問い合わせ時の質問の最大文字数。0 = 無制限。
max_question_chars.label = 質問の最大文字数
model_prepare_question.description = LlamaIndex への問い合わせ前に質問を準備するためのモデル。デフォルト: %MODEL_DEFAULT_MINI%
model_prepare_question.label = 質問準備用モデル
model_query.description = LlamaIndex への問い合わせに使用するモデル。デフォルト: %MODEL_DEFAULT_MINI%。
model_query.label = モデル
model_image.description = データローダー内の画像解析に使用するモデル。デフォルト: gpt-4o。
model_image.label = 画像モデル
plugin.description = LlamaIndex（Chat with files）ストレージを任意のチャットに統合し、コンテキストに追加知識を提供します（ファイルおよびデータベース内のコンテキスト履歴から）
prepare_question.description = 有効にすると、最適な問い合わせを作成するために LlamaIndex へ問い合わせる前に質問を準備します。
prepare_question.label = LlamaIndex へ最初に問い合わせる前に質問を自動準備
prepare_question_max_tokens.description = LlamaIndex への問い合わせ前に質問を準備する際の最大出力トークン数。
prepare_question_max_tokens.label = 質問準備の最大出力トークン数
prompt.description = LlamaIndex から提供された追加データの使用方法を指示するプロンプト。
prompt.label = プロンプト
syntax_prepare_question.description = 質問準備用のシステムプロンプト。
syntax_prepare_question.label = 質問準備用プロンプト
use_project_index.label = 使用中の場合はプロジェクトインデックスを使用
use_project_index.description = 現在の会話がプロジェクト内にある場合、設定されたグローバルインデックスの代わりにそのプロジェクトの分離インデックスを使用します。
