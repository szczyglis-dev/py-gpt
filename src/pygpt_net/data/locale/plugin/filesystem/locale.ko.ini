native_packages.description = Pixi가 호스트가 아닌 내장 샌드박스에 설치하는 패키지입니다. 줄마다 conda-forge 패키지 이름 하나를 입력하세요. 변경 사항을 적용하려면 샌드박스를 다시 구축하세요. 비워 두면 시스템 패키지를 설치하지 않습니다.
