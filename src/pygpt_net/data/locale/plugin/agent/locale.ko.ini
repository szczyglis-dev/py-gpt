[LOCALE]
plugin.name = 자율 모드
plugin.description = 모든 채팅 모드에서 자율 모드를 활성화합니다. 경고: 다른 플러그인과 함께 사용할 경우 예기치 않은 결과가 발생할 수 있으므로 주의하세요.

dynamic_continue.description = 각 패스가 완료된 후 선택한 모델을 사용하는 숨겨진 호출이 심사자 역할을 하며, 현재 Human/Assistant 실행의 설정된 마지막 구간을 검토하고 다음 패스의 지시를 생성합니다.
dynamic_continue.label = 동적 연속 프롬프트
dynamic_continue_messages.description = 각 심사 요청에 포함할 Autonomous Assistant의 최근 응답 수입니다. 원래 사용자 입력은 항상 포함됩니다. 0으로 설정하면 해당 사용자 입력 이후 생성된 모든 응답을 포함합니다.
dynamic_continue_messages.label = 심사할 응답 수
always_continue.description = 활성화하면 수동으로 중지할 때까지 에이전트가 추론을 계속합니다.
always_continue.label = 항상 계속...
always_continue.tooltip = 활성화하면 수동으로 중지할 때까지 에이전트가 추론을 계속합니다.
auto_stop.description = 활성화하면 목표에 도달한 후 플러그인이 중지됩니다.
auto_stop.label = 목표 달성 후 자동 중지
auto_stop.tooltip = 활성화하면 목표에 도달한 후 플러그인이 중지됩니다.
iterations.description = 몇 번 반복할까요? 0 = 무한.\n경고: 0으로 설정하면 많은 요청과 높은 토큰 사용량이 발생할 수 있습니다!
iterations.label = 반복 횟수
iterations.tooltip = 몇 번 반복할까요? 0 = 무한.\n경고: 0으로 설정하면 많은 요청과 높은 토큰 사용량이 발생할 수 있습니다!
prompts.description = 자율 모드를 처리하는 방법을 지정하는 프롬프트입니다. 원하는 만큼 만들 수 있습니다. 목록에서 첫 번째로 활성화된 프롬프트가 자율 모드에 사용됩니다. 정보: 활성 프롬프트가 최소 하나 필요합니다!
prompts.label = 프롬프트
prompts.tooltip = 자율 모드를 처리하는 방법을 지정하는 프롬프트입니다.
reverse_roles.description = 활성화하면 반복 사이에서 역할이 반대로 바뀝니다(Completion 모드에서만).
reverse_roles.label = 반복 사이 역할 반전
reverse_roles.tooltip = 활성화하면 반복 사이에서 역할이 반대로 바뀝니다.
use_extended.description = 활성화하면 표준 프롬프트 대신 확장 프롬프트가 사용됩니다.
use_extended.label = 확장 프롬프트 사용
