[LOCALE]
plugin.name = Autonom modus
plugin.description = Aktiverer autonom modus i alle chatmoduser. ADVARSEL: bruk med forsiktighet; sammen med andre programtillegg kan det gi uventede resultater.

dynamic_continue.description = Etter hver fullførte runde fungerer et skjult kall med den valgte modellen som dommer, gjennomgår den konfigurerte halen av den gjeldende Human/Assistant-kjøringen og genererer instruksjonen for neste runde.
dynamic_continue.label = Dynamisk fortsettelsesprompt
dynamic_continue_messages.description = Antall av de nyeste Assistant-svarene i autonom modus som tas med i hver dommerforespørsel. Den opprinnelige brukerinndataen tas alltid med. Sett til 0 for å ta med alle svar som er produsert siden denne brukerinndataen.
dynamic_continue_messages.label = Svar som skal vurderes
always_continue.description = Hvis aktivert fortsetter agenten å resonnere til den stoppes manuelt.
always_continue.label = Fortsett alltid...
always_continue.tooltip = Hvis aktivert fortsetter agenten å resonnere til den stoppes manuelt.
auto_stop.description = Hvis aktivert stopper programtillegget når målet er nådd.
auto_stop.label = Stopp automatisk når målet er nådd
auto_stop.tooltip = Hvis aktivert stopper programtillegget når målet er nådd.
iterations.description = Hvor mange iterasjoner skal kjøres? 0 = uendelig.\nADVARSEL: Hvis dette settes til 0, kan det føre til mange forespørsler og stort tokenforbruk!
iterations.label = Iterasjoner
iterations.tooltip = Hvor mange iterasjoner skal kjøres? 0 = uendelig.\nADVARSEL: Hvis dette settes til 0, kan det føre til mange forespørsler og stort tokenforbruk!
prompts.description = Ledetekst som brukes til å angi hvordan autonom modus skal håndteres; du kan opprette så mange ledetekster du vil. Den første aktive ledeteksten i listen brukes for autonom modus. INFO: Minst én aktiv ledetekst kreves!
prompts.label = Ledetekster
prompts.tooltip = Ledetekster som brukes til å angi hvordan autonom modus skal håndteres.
reverse_roles.description = Hvis aktivert byttes rollene mellom iterasjoner (bare i Completion-modus).
reverse_roles.label = Bytt roller mellom iterasjoner
reverse_roles.tooltip = Hvis aktivert byttes rollene mellom iterasjoner.
use_extended.description = Når aktivert brukes den utvidede ledeteksten i stedet for standardledeteksten.
use_extended.label = Bruk utvidet ledetekst
