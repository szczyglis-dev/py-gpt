[LOCALE]
plugin.name = Autonome modus
plugin.description = Schakelt de autonome modus in voor elke chatmodus. WAARSCHUWING: gebruik dit voorzichtig; in combinatie met andere plugins kunnen onverwachte resultaten ontstaan.

dynamic_continue.description = Na elke voltooide ronde werkt een verborgen aanroep met het geselecteerde model als beoordelaar, bekijkt de geconfigureerde staart van de huidige Human/Assistant-run en genereert de instructie voor de volgende ronde.
dynamic_continue.label = Dynamische vervolgprompt
dynamic_continue_messages.description = Aantal meest recente Assistant-antwoorden in de autonome modus dat in elke beoordelaarsaanroep wordt opgenomen. De oorspronkelijke gebruikersinvoer wordt altijd toegevoegd. Stel in op 0 om alle antwoorden sinds die gebruikersinvoer op te nemen.
dynamic_continue_messages.label = Te beoordelen antwoorden
always_continue.description = Indien ingeschakeld blijft de agent redeneren totdat deze handmatig wordt gestopt.
always_continue.label = Altijd doorgaan...
always_continue.tooltip = Indien ingeschakeld blijft de agent redeneren totdat deze handmatig wordt gestopt.
auto_stop.description = Indien ingeschakeld stopt de plug-in nadat het doel is bereikt.
auto_stop.label = Automatisch stoppen nadat het doel is bereikt
auto_stop.tooltip = Indien ingeschakeld stopt de plug-in nadat het doel is bereikt.
iterations.description = Hoeveel iteraties uitvoeren? 0 = oneindig.\nWAARSCHUWING: Instellen op 0 kan veel aanvragen en een hoog tokenverbruik veroorzaken!
iterations.label = Iteraties
iterations.tooltip = Hoeveel iteraties uitvoeren? 0 = oneindig.\nWAARSCHUWING: Instellen op 0 kan veel aanvragen en een hoog tokenverbruik veroorzaken!
prompts.description = Prompt die bepaalt hoe de autonome modus wordt afgehandeld; u kunt zoveel prompts maken als u wilt. De eerste actieve prompt in de lijst wordt gebruikt voor de autonome modus. INFO: Er is minstens één actieve prompt vereist!
prompts.label = Prompts
prompts.tooltip = Prompts die bepalen hoe de autonome modus wordt afgehandeld.
reverse_roles.description = Indien ingeschakeld worden de rollen tussen iteraties omgedraaid (alleen in Completion-modus).
reverse_roles.label = Rollen omdraaien tussen iteraties
reverse_roles.tooltip = Indien ingeschakeld worden de rollen tussen iteraties omgedraaid.
use_extended.description = Indien ingeschakeld wordt de uitgebreide prompt gebruikt in plaats van de standaardprompt.
use_extended.label = Uitgebreide prompt gebruiken
