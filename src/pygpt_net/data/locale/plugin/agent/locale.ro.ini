[LOCALE]
plugin.name = Mod autonom
plugin.description = Activează modul autonom în orice mod de chat. AVERTISMENT: utilizați cu atenție; împreună cu alte pluginuri poate produce rezultate neașteptate.

dynamic_continue.description = După fiecare trecere finalizată, un apel ascuns care folosește modelul selectat acționează ca arbitru, analizează coada configurată a rulării Human/Assistant curente și generează instrucțiunea pentru trecerea următoare.
dynamic_continue.label = Prompt dinamic de continuare
dynamic_continue_messages.description = Numărul celor mai recente răspunsuri ale asistentului din modul Autonom incluse în fiecare cerere către arbitru. Intrarea originală a utilizatorului este inclusă întotdeauna. Setați 0 pentru a include toate răspunsurile produse de la acea intrare a utilizatorului.
dynamic_continue_messages.label = Răspunsuri de evaluat
always_continue.description = Dacă este activat, agentul va continua raționamentul până când este oprit manual.
always_continue.label = Continuă întotdeauna...
always_continue.tooltip = Dacă este activat, agentul va continua raționamentul până când este oprit manual.
auto_stop.description = Dacă este activat, pluginul se va opri după atingerea obiectivului.
auto_stop.label = Oprire automată după atingerea obiectivului
auto_stop.tooltip = Dacă este activat, pluginul se va opri după atingerea obiectivului.
iterations.description = Câte iterații să fie rulate? 0 = infinit.\nAVERTISMENT: Setarea la 0 poate genera multe solicitări și un consum ridicat de tokenuri!
iterations.label = Iterații
iterations.tooltip = Câte iterații să fie rulate? 0 = infinit.\nAVERTISMENT: Setarea la 0 poate genera multe solicitări și un consum ridicat de tokenuri!
prompts.description = Prompt utilizat pentru a indica modul de gestionare a modului autonom; puteți crea oricâte prompturi doriți. Primul prompt activ din listă va fi utilizat pentru modul autonom. INFO: Este necesar cel puțin un prompt activ!
prompts.label = Prompturi
prompts.tooltip = Prompturi utilizate pentru a indica modul de gestionare a modului autonom.
reverse_roles.description = Dacă este activat, rolurile vor fi inversate între iterații (doar în modul Completion).
reverse_roles.label = Inversează rolurile între iterații
reverse_roles.tooltip = Dacă este activat, rolurile vor fi inversate între iterații.
use_extended.description = Când este activat, promptul extins va fi utilizat în locul celui standard.
use_extended.label = Utilizează promptul extins
