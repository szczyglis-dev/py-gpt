[LOCALE]
plugin.name = स्वायत्त मोड
plugin.description = किसी भी चैट मोड में स्वायत्त मोड सक्षम करता है। चेतावनी: सावधानी से उपयोग करें; अन्य प्लगइनों के साथ अप्रत्याशित परिणाम हो सकते हैं।

dynamic_continue.description = हर पूर्ण पास के बाद चुने गए मॉडल की एक छिपी हुई कॉल जज की तरह काम करती है, मौजूदा Human/Assistant रन के कॉन्फ़िगर किए गए अंतिम हिस्से की समीक्षा करती है और अगले पास के लिए निर्देश बनाती है।
dynamic_continue.label = डायनेमिक कंटिन्यूएशन प्रॉम्प्ट
dynamic_continue_messages.description = हर जज अनुरोध में शामिल की जाने वाली Autonomous Assistant की सबसे हाल की प्रतिक्रियाओं की संख्या। मूल उपयोगकर्ता इनपुट हमेशा शामिल रहता है। उस उपयोगकर्ता इनपुट के बाद बनी सभी प्रतिक्रियाएँ शामिल करने के लिए 0 सेट करें।
dynamic_continue_messages.label = जज के लिए प्रतिक्रियाएँ
always_continue.description = यदि सक्षम है, तो एजेंट तब तक तर्क करता रहेगा जब तक उसे मैन्युअल रूप से रोका न जाए।
always_continue.label = हमेशा जारी रखें...
always_continue.tooltip = यदि सक्षम है, तो एजेंट तब तक तर्क करता रहेगा जब तक उसे मैन्युअल रूप से रोका न जाए।
auto_stop.description = यदि सक्षम है, तो लक्ष्य प्राप्त होने के बाद प्लगइन रुक जाएगा।
auto_stop.label = लक्ष्य प्राप्त होने पर स्वतः रोकें
auto_stop.tooltip = यदि सक्षम है, तो लक्ष्य प्राप्त होने के बाद प्लगइन रुक जाएगा।
iterations.description = कितने पुनरावर्तन चलाने हैं? 0 = अनंत।\nचेतावनी: इसे 0 पर सेट करने से बहुत अधिक अनुरोध और टोकन उपयोग हो सकता है!
iterations.label = पुनरावर्तन
iterations.tooltip = कितने पुनरावर्तन चलाने हैं? 0 = अनंत।\nचेतावनी: इसे 0 पर सेट करने से बहुत अधिक अनुरोध और टोकन उपयोग हो सकता है!
prompts.description = स्वायत्त मोड को कैसे संभालना है यह बताने वाला प्रॉम्प्ट; आप जितने चाहें प्रॉम्प्ट बना सकते हैं। सूची का पहला सक्रिय प्रॉम्प्ट स्वायत्त मोड के लिए उपयोग होगा। जानकारी: कम से कम एक सक्रिय प्रॉम्प्ट आवश्यक है!
prompts.label = प्रॉम्प्ट
prompts.tooltip = स्वायत्त मोड को कैसे संभालना है यह बताने वाले प्रॉम्प्ट।
reverse_roles.description = यदि सक्षम है, तो पुनरावर्तनों के बीच भूमिकाएँ उलट दी जाएँगी (केवल Completion मोड में)।
reverse_roles.label = पुनरावर्तनों के बीच भूमिकाएँ उलटें
reverse_roles.tooltip = यदि सक्षम है, तो पुनरावर्तनों के बीच भूमिकाएँ उलट दी जाएँगी।
use_extended.description = सक्षम होने पर मानक प्रॉम्प्ट के बजाय विस्तारित प्रॉम्प्ट का उपयोग किया जाएगा।
use_extended.label = विस्तारित प्रॉम्प्ट उपयोग करें
