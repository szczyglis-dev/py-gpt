[LOCALE]
plugin.name = Autonom tilstand
plugin.description = Aktiverer autonom tilstand i enhver chattilstand. ADVARSEL: Brug med forsigtighed; sammen med andre plugins kan det give uventede resultater.

dynamic_continue.description = Efter hver fuldført gennemgang fungerer et skjult kald med den valgte model som dommer, gennemgår den konfigurerede hale af den aktuelle Human/Assistant-kørsel og genererer instruktionen til næste gennemgang.
dynamic_continue.label = Dynamisk fortsættelsesprompt
dynamic_continue_messages.description = Antallet af de seneste Assistant-svar i autonom tilstand, der medtages i hver dommeranmodning. Det oprindelige brugerinput medtages altid. Sæt til 0 for at medtage alle svar, der er produceret siden dette brugerinput.
dynamic_continue_messages.label = Svar til bedømmelse
always_continue.description = Hvis aktiveret fortsætter agenten med at ræsonnere, indtil den stoppes manuelt.
always_continue.label = Fortsæt altid...
always_continue.tooltip = Hvis aktiveret fortsætter agenten med at ræsonnere, indtil den stoppes manuelt.
auto_stop.description = Hvis aktiveret stopper pluginet, når målet er nået.
auto_stop.label = Stop automatisk, når målet er nået
auto_stop.tooltip = Hvis aktiveret stopper pluginet, når målet er nået.
iterations.description = Hvor mange iterationer skal køres? 0 = uendeligt.\nADVARSEL: Hvis denne værdi sættes til 0, kan det medføre mange forespørgsler og et stort tokenforbrug!
iterations.label = Iterationer
iterations.tooltip = Hvor mange iterationer skal køres? 0 = uendeligt.\nADVARSEL: Hvis denne værdi sættes til 0, kan det medføre mange forespørgsler og et stort tokenforbrug!
prompts.description = Prompt, der bruges til at angive, hvordan autonom tilstand skal håndteres; du kan oprette så mange prompts, du ønsker. Den første aktive prompt på listen bruges til autonom tilstand. INFO: Der kræves mindst én aktiv prompt!
prompts.label = Prompts
prompts.tooltip = Prompts, der bruges til at angive, hvordan autonom tilstand skal håndteres.
reverse_roles.description = Hvis aktiveret byttes rollerne mellem iterationer (kun i Completion-tilstand).
reverse_roles.label = Byt roller mellem iterationer
reverse_roles.tooltip = Hvis aktiveret byttes rollerne mellem iterationer.
use_extended.description = Når aktiveret bruges den udvidede prompt i stedet for standardprompten.
use_extended.label = Brug udvidet prompt
