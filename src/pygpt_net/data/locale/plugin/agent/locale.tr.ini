[LOCALE]
plugin.name = Otonom mod
plugin.description = Herhangi bir sohbet modunda otonom modu etkinleştirir. UYARI: dikkatli kullanın; diğer eklentilerle birlikte beklenmeyen sonuçlar üretebilir.

dynamic_continue.description = Tamamlanan her geçişten sonra seçilen modeli kullanan gizli bir çağrı hakem gibi davranır, mevcut Human/Assistant çalışmasının yapılandırılmış son bölümünü inceler ve sonraki geçiş için talimat üretir.
dynamic_continue.label = Dinamik devam istemi
dynamic_continue_messages.description = Her hakem isteğine dahil edilen en son Otonom Assistant yanıtlarının sayısı. Orijinal kullanıcı girdisi her zaman dahil edilir. Bu kullanıcı girdisinden sonra üretilen tüm yanıtları dahil etmek için 0 olarak ayarlayın.
dynamic_continue_messages.label = Değerlendirilecek yanıtlar
