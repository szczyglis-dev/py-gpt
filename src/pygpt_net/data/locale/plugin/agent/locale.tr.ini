[LOCALE]
plugin.name = Otonom mod
plugin.description = Herhangi bir sohbet modunda otonom modu etkinleştirir. UYARI: dikkatli kullanın; diğer eklentilerle birlikte beklenmeyen sonuçlar üretebilir.

dynamic_continue.description = Tamamlanan her geçişten sonra seçilen modeli kullanan gizli bir çağrı hakem gibi davranır, mevcut Human/Assistant çalışmasının yapılandırılmış son bölümünü inceler ve sonraki geçiş için talimat üretir.
dynamic_continue.label = Dinamik devam istemi
dynamic_continue_messages.description = Her hakem isteğine dahil edilen en son Otonom Assistant yanıtlarının sayısı. Orijinal kullanıcı girdisi her zaman dahil edilir. Bu kullanıcı girdisinden sonra üretilen tüm yanıtları dahil etmek için 0 olarak ayarlayın.
dynamic_continue_messages.label = Değerlendirilecek yanıtlar
always_continue.description = Etkinleştirilirse aracı, elle durdurulana kadar akıl yürütmeye devam eder.
always_continue.label = Her zaman devam et...
always_continue.tooltip = Etkinleştirilirse aracı, elle durdurulana kadar akıl yürütmeye devam eder.
auto_stop.description = Etkinleştirilirse eklenti, hedefe ulaşıldıktan sonra durur.
auto_stop.label = Hedefe ulaşıldığında otomatik durdur
auto_stop.tooltip = Etkinleştirilirse eklenti, hedefe ulaşıldıktan sonra durur.
iterations.description = Kaç yineleme çalıştırılsın? 0 = sonsuz.\nUYARI: Bunu 0 olarak ayarlamak çok sayıda isteğe ve yüksek token kullanımına neden olabilir!
iterations.label = Yinelemeler
iterations.tooltip = Kaç yineleme çalıştırılsın? 0 = sonsuz.\nUYARI: Bunu 0 olarak ayarlamak çok sayıda isteğe ve yüksek token kullanımına neden olabilir!
prompts.description = Otonom modun nasıl ele alınacağını belirleyen istem; istediğiniz kadar istem oluşturabilirsiniz. Listedeki ilk etkin istem otonom mod için kullanılır. BİLGİ: En az bir etkin istem gereklidir!
prompts.label = İstemler
prompts.tooltip = Otonom modun nasıl ele alınacağını belirleyen istemler.
reverse_roles.description = Etkinleştirilirse roller yinelemeler arasında tersine çevrilir (yalnızca Completion modunda).
reverse_roles.label = Yinelemeler arasında rolleri tersine çevir
reverse_roles.tooltip = Etkinleştirilirse roller yinelemeler arasında tersine çevrilir.
use_extended.description = Etkinleştirildiğinde standart istem yerine genişletilmiş istem kullanılır.
use_extended.label = Genişletilmiş istemi kullan
