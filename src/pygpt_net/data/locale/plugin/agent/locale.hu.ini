[LOCALE]
plugin.name = Autonóm mód
plugin.description = Bekapcsolja az autonóm módot bármely csevegési módban. FIGYELEM: óvatosan használja; más bővítményekkel együtt váratlan eredményeket okozhat.

dynamic_continue.description = Minden befejezett menet után a kiválasztott modellt használó rejtett hívás bíróként működik, áttekinti az aktuális Human/Assistant futás beállított végét, és előállítja a következő menet utasítását.
dynamic_continue.label = Dinamikus folytatási prompt
dynamic_continue_messages.description = Az autonóm mód legutóbbi Assistant-válaszainak száma, amely minden bírókérésbe bekerül. Az eredeti felhasználói bemenet mindig szerepel. A 0 érték az adott felhasználói bemenet óta létrehozott összes választ elküldi.
dynamic_continue_messages.label = Értékelendő válaszok
always_continue.description = Ha engedélyezve van, az ügynök addig folytatja a következtetést, amíg kézzel le nem állítják.
always_continue.label = Mindig folytassa...
always_continue.tooltip = Ha engedélyezve van, az ügynök addig folytatja a következtetést, amíg kézzel le nem állítják.
auto_stop.description = Ha engedélyezve van, a bővítmény leáll a cél elérése után.
auto_stop.label = Automatikus leállítás a cél elérése után
auto_stop.tooltip = Ha engedélyezve van, a bővítmény leáll a cél elérése után.
iterations.description = Hány iteráció fusson? 0 = végtelen.\nFIGYELMEZTETÉS: A 0 érték sok kérést és nagy tokenfelhasználást okozhat!
iterations.label = Iterációk
iterations.tooltip = Hány iteráció fusson? 0 = végtelen.\nFIGYELMEZTETÉS: A 0 érték sok kérést és nagy tokenfelhasználást okozhat!
prompts.description = Az autonóm mód kezelését meghatározó prompt; tetszőleges számú prompt hozható létre. A lista első aktív promptja lesz használva az autonóm módhoz. INFÓ: Legalább egy aktív prompt szükséges!
prompts.label = Promptok
prompts.tooltip = Az autonóm mód kezelését meghatározó promptok.
reverse_roles.description = Ha engedélyezve van, a szerepek iterációnként felcserélődnek (csak Completion módban).
reverse_roles.label = Szerepek felcserélése az iterációk között
reverse_roles.tooltip = Ha engedélyezve van, a szerepek iterációnként felcserélődnek.
use_extended.description = Ha engedélyezve van, a kibővített prompt lesz használva a normál helyett.
use_extended.label = Kibővített prompt használata
