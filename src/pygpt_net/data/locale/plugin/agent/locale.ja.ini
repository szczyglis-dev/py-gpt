[LOCALE]
plugin.name = 自律モード
plugin.description = 任意のチャットモードで自律モードを有効にします。警告: 他のプラグインと組み合わせると予期しない結果になる場合があるため、注意して使用してください。

dynamic_continue.description = 各パスの完了後、選択中のモデルへの非表示呼び出しが判定役として動作し、現在の Human/Assistant 実行の設定された末尾を確認して、次のパスへの指示を生成します。
dynamic_continue.label = 動的継続プロンプト
dynamic_continue_messages.description = 各判定リクエストに含める Autonomous の Assistant 応答のうち、直近何件を送るかを指定します。元のユーザー入力は常に含まれます。0 にすると、そのユーザー入力以降に生成されたすべての応答を含めます。
dynamic_continue_messages.label = 判定対象の応答数
always_continue.description = 有効にすると、手動で停止するまでエージェントが推論を続けます。
always_continue.label = 常に続行...
always_continue.tooltip = 有効にすると、手動で停止するまでエージェントが推論を続けます。
auto_stop.description = 有効にすると、目標達成後にプラグインが停止します。
auto_stop.label = 目標達成後に自動停止
auto_stop.tooltip = 有効にすると、目標達成後にプラグインが停止します。
iterations.description = 実行する反復回数を指定します。0 = 無制限。\n警告: 0 に設定すると、多数のリクエストと大量のトークン消費が発生する可能性があります！
iterations.label = 反復回数
iterations.tooltip = 実行する反復回数を指定します。0 = 無制限。\n警告: 0 に設定すると、多数のリクエストと大量のトークン消費が発生する可能性があります！
prompts.description = 自律モードの処理方法を指定するプロンプトです。必要な数だけ作成できます。リスト内の最初の有効なプロンプトが自律モードで使用されます。情報: 少なくとも1つの有効なプロンプトが必要です！
prompts.label = プロンプト
prompts.tooltip = 自律モードの処理方法を指定するプロンプトです。
reverse_roles.description = 有効にすると、反復ごとに役割を入れ替えます（Completion モードのみ）。
reverse_roles.label = 反復ごとに役割を入れ替える
reverse_roles.tooltip = 有効にすると、反復ごとに役割を入れ替えます。
use_extended.description = 有効にすると、標準プロンプトの代わりに拡張プロンプトを使用します。
use_extended.label = 拡張プロンプトを使用
