[LOCALE]
plugin.name = Autonominen tila
plugin.description = Ottaa autonomisen tilan käyttöön missä tahansa keskustelutilassa. VAROITUS: käytä varoen; yhdessä muiden lisäosien kanssa se voi tuottaa odottamattomia tuloksia.

dynamic_continue.description = Jokaisen valmistuneen kierroksen jälkeen valittua mallia käyttävä piilotettu kutsu toimii arvioijana, tarkistaa nykyisen Human/Assistant-ajon määritetyn loppuosan ja luo ohjeen seuraavaa kierrosta varten.
dynamic_continue.label = Dynaaminen jatkokehote
dynamic_continue_messages.description = Kuinka monta uusinta autonomisen tilan Assistant-vastausta sisällytetään kuhunkin arviointipyyntöön. Alkuperäinen käyttäjän syöte sisällytetään aina. Arvo 0 sisällyttää kaikki kyseisen käyttäjäsyötteen jälkeen tuotetut vastaukset.
dynamic_continue_messages.label = Arvioitavat vastaukset
always_continue.description = Jos käytössä, agentti jatkaa päättelyä, kunnes se pysäytetään manuaalisesti.
always_continue.label = Jatka aina...
always_continue.tooltip = Jos käytössä, agentti jatkaa päättelyä, kunnes se pysäytetään manuaalisesti.
auto_stop.description = Jos käytössä, liitännäinen pysähtyy, kun tavoite on saavutettu.
auto_stop.label = Pysäytä automaattisesti tavoitteen saavuttamisen jälkeen
auto_stop.tooltip = Jos käytössä, liitännäinen pysähtyy, kun tavoite on saavutettu.
iterations.description = Kuinka monta iteraatiota suoritetaan? 0 = ääretön.\nVAROITUS: Arvon 0 käyttäminen voi aiheuttaa paljon pyyntöjä ja suuren token-kulutuksen!
iterations.label = Iteraatiot
iterations.tooltip = Kuinka monta iteraatiota suoritetaan? 0 = ääretön.\nVAROITUS: Arvon 0 käyttäminen voi aiheuttaa paljon pyyntöjä ja suuren token-kulutuksen!
prompts.description = Kehote, jolla määritetään autonomisen tilan käsittely; voit luoda niin monta kehotetta kuin haluat. Luettelon ensimmäistä aktiivista kehotetta käytetään autonomisen tilan käsittelyyn. INFO: Vähintään yksi aktiivinen kehote vaaditaan!
prompts.label = Kehotteet
prompts.tooltip = Kehotteet, joilla määritetään autonomisen tilan käsittely.
reverse_roles.description = Jos käytössä, roolit vaihdetaan iteraatioiden välillä (vain Completion-tilassa).
reverse_roles.label = Vaihda roolit iteraatioiden välillä
reverse_roles.tooltip = Jos käytössä, roolit vaihdetaan iteraatioiden välillä.
use_extended.description = Kun käytössä, laajennettua kehotetta käytetään tavallisen sijasta.
use_extended.label = Käytä laajennettua kehotetta
