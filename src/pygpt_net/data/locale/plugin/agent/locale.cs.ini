[LOCALE]
plugin.name = Autonomní režim
plugin.description = Aktivuje autonomní režim v libovolném režimu chatu. UPOZORNĚNÍ: používejte opatrně; v kombinaci s dalšími pluginy může vést k neočekávaným výsledkům.

dynamic_continue.description = Po každém dokončeném průchodu funguje skryté volání s vybraným modelem jako hodnotitel, zkontroluje nastavený konec aktuálního běhu Human/Assistant a vygeneruje instrukci pro další průchod.
dynamic_continue.label = Dynamický prompt pokračování
dynamic_continue_messages.description = Počet nejnovějších odpovědí asistenta v autonomním režimu zahrnutých do každého požadavku hodnotitele. Původní vstup uživatele je zahrnut vždy. Nastavením 0 zahrnete všechny odpovědi vytvořené od tohoto vstupu uživatele.
dynamic_continue_messages.label = Odpovědi k posouzení
always_continue.description = Je-li povoleno, agent bude pokračovat v uvažování, dokud nebude ručně zastaven.
always_continue.label = Vždy pokračovat...
always_continue.tooltip = Je-li povoleno, agent bude pokračovat v uvažování, dokud nebude ručně zastaven.
auto_stop.description = Je-li povoleno, plugin se zastaví po dosažení cíle.
auto_stop.label = Automaticky zastavit po dosažení cíle
auto_stop.tooltip = Je-li povoleno, plugin se zastaví po dosažení cíle.
iterations.description = Kolik iterací spustit? 0 = nekonečno.\nVAROVÁNÍ: Nastavení na 0 může způsobit mnoho požadavků a vysokou spotřebu tokenů!
iterations.label = Iterace
iterations.tooltip = Kolik iterací spustit? 0 = nekonečno.\nVAROVÁNÍ: Nastavení na 0 může způsobit mnoho požadavků a vysokou spotřebu tokenů!
prompts.description = Prompt určující způsob práce autonomního režimu; můžete vytvořit libovolný počet promptů. Pro autonomní režim se použije první aktivní prompt v seznamu. INFO: Je vyžadován alespoň jeden aktivní prompt!
prompts.label = Prompty
prompts.tooltip = Prompty určující způsob práce autonomního režimu.
reverse_roles.description = Je-li povoleno, role se budou mezi iteracemi obracet (pouze v režimu Completion).
reverse_roles.label = Obracet role mezi iteracemi
reverse_roles.tooltip = Je-li povoleno, role se budou mezi iteracemi obracet.
use_extended.description = Je-li povoleno, místo standardního promptu se použije rozšířený prompt.
use_extended.label = Použít rozšířený prompt
