[LOCALE]
plugin.name = Автономный режим
plugin.description = Включает автономный режим в любом режиме чата. ВНИМАНИЕ: используйте осторожно; вместе с другими плагинами возможны неожиданные результаты.

dynamic_continue.description = После каждого завершённого прохода скрытый вызов с выбранной моделью выступает в роли судьи, проверяет настроенный хвост текущего запуска Human/Assistant и формирует инструкцию для следующего прохода.
dynamic_continue.label = Динамический промпт продолжения
dynamic_continue_messages.description = Количество последних ответов Assistant в автономном режиме, включаемых в каждый запрос к судье. Исходный ввод пользователя включается всегда. Установите 0, чтобы включать все ответы, созданные после этого ввода пользователя.
dynamic_continue_messages.label = Ответы для оценки
always_continue.description = Если включено, агент будет продолжать рассуждение, пока его не остановят вручную.
always_continue.label = Всегда продолжать...
always_continue.tooltip = Если включено, агент будет продолжать рассуждение, пока его не остановят вручную.
auto_stop.description = Если включено, плагин остановится после достижения цели.
auto_stop.label = Автоматически остановить после достижения цели
auto_stop.tooltip = Если включено, плагин остановится после достижения цели.
iterations.description = Сколько итераций выполнить? 0 = бесконечно.\nПРЕДУПРЕЖДЕНИЕ: Значение 0 может привести к большому числу запросов и высокому расходу токенов!
iterations.label = Итерации
iterations.tooltip = Сколько итераций выполнить? 0 = бесконечно.\nПРЕДУПРЕЖДЕНИЕ: Значение 0 может привести к большому числу запросов и высокому расходу токенов!
prompts.description = Промпт, задающий способ работы автономного режима; можно создать любое количество промптов. Для автономного режима будет использован первый активный промпт в списке. ИНФО: Требуется как минимум один активный промпт!
prompts.label = Промпты
prompts.tooltip = Промпты, задающие способ работы автономного режима.
reverse_roles.description = Если включено, роли будут меняться местами между итерациями (только в режиме Completion).
reverse_roles.label = Менять роли между итерациями
reverse_roles.tooltip = Если включено, роли будут меняться местами между итерациями.
use_extended.description = Если включено, вместо стандартного промпта будет использоваться расширенный.
use_extended.label = Использовать расширенный промпт
