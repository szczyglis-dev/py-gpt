plugin.description = 在任何聊天模式中启用自主模式。警告：请谨慎使用；与其他插件配合时可能产生意外结果。
plugin.name = 自主模式
prompts.description = 用于指导如何处理自治模式的提示；您可以根据需要创建任意数量的提示。列表中的第一个有效提示将被用来处理自治模式。信息：至少需要一个有效的提示！
prompts.label = 提示
prompts.tooltip = 用于指导如何处理自治模式的提示。
reverse_roles.description = 如果启用，在每次迭代之间角色将被反转（仅在完成模式中）。
reverse_roles.label = 迭代间角色反转
reverse_roles.tooltip = 如果启用，在每次迭代之间角色将被反转。
use_extended.description = 启用时，将使用扩展提示而不是标准提示。
use_extended.label = 使用扩展提示
always_continue.description = 启用后，代理将持续推理，直到手动停止。
always_continue.label = 始终继续...
always_continue.tooltip = 启用后，代理将持续推理，直到手动停止。

dynamic_continue.description = 每次执行完成后，会使用所选模型进行一次隐藏调用作为评审，检查当前 Human/Assistant 自主运行中按设置保留的尾部内容，并生成下一次执行的指令。
dynamic_continue.label = 动态连续提示词
dynamic_continue_messages.description = 每次评审请求中包含的最近 Autonomous Assistant 回复数量。原始用户输入始终会被包含。设为 0 时，将包含自该用户输入以来生成的全部回复。
dynamic_continue_messages.label = 送交评审的回复数
