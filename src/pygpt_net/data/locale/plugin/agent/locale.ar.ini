[LOCALE]
plugin.name = الوضع المستقل
plugin.description = يفعّل الوضع المستقل في أي وضع دردشة. تحذير: استخدمه بحذر، فقد يؤدي مع الإضافات الأخرى إلى نتائج غير متوقعة.

dynamic_continue.description = بعد كل مرور مكتمل، يعمل استدعاء مخفي باستخدام النموذج المحدد كمُحكِّم، ويراجع الجزء الأخير المحدد بالإعداد من تشغيل Human/Assistant الحالي، ويولّد تعليمات المرور التالي.
dynamic_continue.label = موجّه متابعة ديناميكي
dynamic_continue_messages.description = عدد أحدث ردود Assistant في الوضع المستقل التي يتم تضمينها في كل طلب إلى المُحكِّم. يتم دائمًا تضمين إدخال المستخدم الأصلي. اضبط القيمة على 0 لتضمين جميع الردود التي تم إنتاجها منذ إدخال المستخدم هذا.
dynamic_continue_messages.label = الردود المراد تقييمها
always_continue.description = إذا كان مفعّلًا، فسيواصل الوكيل الاستدلال حتى يتم إيقافه يدويًا.
always_continue.label = المتابعة دائمًا...
always_continue.tooltip = إذا كان مفعّلًا، فسيواصل الوكيل الاستدلال حتى يتم إيقافه يدويًا.
auto_stop.description = إذا كان مفعّلًا، فسيتوقف الملحق بعد الوصول إلى الهدف.
auto_stop.label = إيقاف تلقائي بعد الوصول إلى الهدف
auto_stop.tooltip = إذا كان مفعّلًا، فسيتوقف الملحق بعد الوصول إلى الهدف.
iterations.description = كم عدد التكرارات المطلوب تشغيلها؟ 0 = بلا نهاية.\nتحذير: ضبط هذه القيمة على 0 قد يسبب عددًا كبيرًا من الطلبات واستهلاكًا مرتفعًا للرموز المميزة!
iterations.label = التكرارات
iterations.tooltip = كم عدد التكرارات المطلوب تشغيلها؟ 0 = بلا نهاية.\nتحذير: ضبط هذه القيمة على 0 قد يسبب عددًا كبيرًا من الطلبات واستهلاكًا مرتفعًا للرموز المميزة!
prompts.description = الموجّه المستخدم لتحديد كيفية التعامل مع الوضع المستقل؛ يمكنك إنشاء أي عدد من الموجّهات. سيُستخدم أول موجّه نشط في القائمة للتعامل مع الوضع المستقل. معلومات: يلزم وجود موجّه نشط واحد على الأقل!
prompts.label = الموجّهات
prompts.tooltip = الموجّهات المستخدمة لتحديد كيفية التعامل مع الوضع المستقل.
reverse_roles.description = إذا كان مفعّلًا، فسيتم عكس الأدوار بين التكرارات (في وضع الإكمال فقط).
reverse_roles.label = عكس الأدوار بين التكرارات
reverse_roles.tooltip = إذا كان مفعّلًا، فسيتم عكس الأدوار بين التكرارات.
use_extended.description = عند التفعيل، سيُستخدم الموجّه الموسّع بدلًا من القياسي.
use_extended.label = استخدام الموجّه الموسّع
