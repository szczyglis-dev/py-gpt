[LOCALE]
plugin.name = Autonómny režim
plugin.description = Aktivuje autonómny režim v ľubovoľnom režime chatu. UPOZORNENIE: používajte opatrne; s ďalšími pluginmi môže viesť k neočakávaným výsledkom.

dynamic_continue.description = Po každom dokončenom priechode funguje skryté volanie s vybraným modelom ako hodnotiteľ, skontroluje nastavený koniec aktuálneho behu Human/Assistant a vygeneruje inštrukciu pre ďalší priechod.
dynamic_continue.label = Dynamický prompt pokračovania
dynamic_continue_messages.description = Počet najnovších odpovedí asistenta v autonómnom režime zahrnutých do každej požiadavky hodnotiteľa. Pôvodný vstup používateľa je zahrnutý vždy. Nastavením 0 zahrniete všetky odpovede vytvorené od tohto vstupu používateľa.
dynamic_continue_messages.label = Odpovede na posúdenie
always_continue.description = Ak je povolené, agent bude pokračovať v uvažovaní, kým nebude ručne zastavený.
always_continue.label = Vždy pokračovať...
always_continue.tooltip = Ak je povolené, agent bude pokračovať v uvažovaní, kým nebude ručne zastavený.
auto_stop.description = Ak je povolené, plugin sa zastaví po dosiahnutí cieľa.
auto_stop.label = Automaticky zastaviť po dosiahnutí cieľa
auto_stop.tooltip = Ak je povolené, plugin sa zastaví po dosiahnutí cieľa.
iterations.description = Koľko iterácií spustiť? 0 = nekonečno.\nUPOZORNENIE: Nastavenie na 0 môže spôsobiť veľa požiadaviek a vysokú spotrebu tokenov!
iterations.label = Iterácie
iterations.tooltip = Koľko iterácií spustiť? 0 = nekonečno.\nUPOZORNENIE: Nastavenie na 0 môže spôsobiť veľa požiadaviek a vysokú spotrebu tokenov!
prompts.description = Prompt určujúci, ako spracovať autonómny režim; môžete vytvoriť ľubovoľný počet promptov. Pre autonómny režim sa použije prvý aktívny prompt v zozname. INFO: Vyžaduje sa aspoň jeden aktívny prompt!
prompts.label = Prompty
prompts.tooltip = Prompty určujúce, ako spracovať autonómny režim.
reverse_roles.description = Ak je povolené, roly sa budú medzi iteráciami obracať (iba v režime Completion).
reverse_roles.label = Obracať roly medzi iteráciami
reverse_roles.tooltip = Ak je povolené, roly sa budú medzi iteráciami obracať.
use_extended.description = Ak je povolené, namiesto štandardného promptu sa použije rozšírený prompt.
use_extended.label = Použiť rozšírený prompt
