[LOCALE]
plugin.name = Modo autónomo
plugin.description = Ativa o modo autónomo em qualquer modo de chat. AVISO: use com cuidado; em conjunto com outros plugins pode produzir resultados inesperados.

dynamic_continue.description = Após cada passagem concluída, uma chamada oculta usando o modelo selecionado atua como juiz, analisa a cauda configurada da execução Human/Assistant atual e gera a instrução para a próxima passagem.
dynamic_continue.label = Prompt de continuação dinâmico
dynamic_continue_messages.description = Número das respostas mais recentes do assistente no modo Autônomo incluídas em cada solicitação ao juiz. A entrada original do usuário é sempre incluída. Defina 0 para incluir todas as respostas produzidas desde essa entrada do usuário.
dynamic_continue_messages.label = Respostas para avaliar
always_continue.description = Se ativado, o agente continuará a raciocinar até ser interrompido manualmente.
always_continue.label = Continuar sempre...
always_continue.tooltip = Se ativado, o agente continuará a raciocinar até ser interrompido manualmente.
auto_stop.description = Se ativado, o plugin irá parar após o objetivo ser alcançado.
auto_stop.label = Parar automaticamente após atingir o objetivo
auto_stop.tooltip = Se ativado, o plugin irá parar após o objetivo ser alcançado.
iterations.description = Quantas iterações executar? 0 = infinito.\nAVISO: Definir como 0 pode causar muitas solicitações e alto consumo de tokens!
iterations.label = Iterações
iterations.tooltip = Quantas iterações executar? 0 = infinito.\nAVISO: Definir como 0 pode causar muitas solicitações e alto consumo de tokens!
prompts.description = Prompt usado para definir como tratar o modo autônomo; você pode criar quantos prompts quiser. O primeiro prompt ativo da lista será usado no modo autônomo. INFO: É necessário pelo menos um prompt ativo!
prompts.label = Prompts
prompts.tooltip = Prompts usados para definir como tratar o modo autônomo.
reverse_roles.description = Se ativado, os papéis serão invertidos entre as iterações (somente no modo Completion).
reverse_roles.label = Inverter papéis entre iterações
reverse_roles.tooltip = Se ativado, os papéis serão invertidos entre as iterações.
use_extended.description = Quando ativado, o prompt estendido será usado em vez do padrão.
use_extended.label = Usar prompt estendido
