[LOCALE]
plugin.name = Автономен режим
plugin.description = Активира автономен режим във всеки чат режим. ВНИМАНИЕ: използвайте внимателно, защото с други плъгини може да доведе до неочаквани резултати.

dynamic_continue.description = След всеки завършен проход скрито извикване с избрания модел действа като съдия, преглежда конфигурирания край на текущото изпълнение Human/Assistant и генерира инструкцията за следващия проход.
dynamic_continue.label = Динамичен prompt за продължаване
dynamic_continue_messages.description = Брой на най-скорошните отговори на асистента в автономен режим, включвани във всяка заявка към съдията. Оригиналният вход на потребителя винаги се включва. Задайте 0, за да включите всички отговори, създадени след този потребителски вход.
dynamic_continue_messages.label = Отговори за оценяване
always_continue.description = Ако е активирано, агентът ще продължи да разсъждава, докато не бъде спрян ръчно.
always_continue.label = Винаги продължавай...
always_continue.tooltip = Ако е активирано, агентът ще продължи да разсъждава, докато не бъде спрян ръчно.
auto_stop.description = Ако е активирано, плъгинът ще спре след достигане на целта.
auto_stop.label = Автоматично спиране след достигане на целта
auto_stop.tooltip = Ако е активирано, плъгинът ще спре след достигане на целта.
iterations.description = Колко итерации да се изпълнят? 0 = безкрайно.\nПРЕДУПРЕЖДЕНИЕ: Задаването на 0 може да предизвика много заявки и голям разход на токени!
iterations.label = Итерации
iterations.tooltip = Колко итерации да се изпълнят? 0 = безкрайно.\nПРЕДУПРЕЖДЕНИЕ: Задаването на 0 може да предизвика много заявки и голям разход на токени!
prompts.description = Подкана, използвана за указване как да се обработва автономният режим; можете да създадете колкото пожелаете подкани. Първата активна подкана в списъка ще се използва за автономния режим. ИНФО: Необходима е поне една активна подкана!
prompts.label = Подкани
prompts.tooltip = Подкани, използвани за указване как да се обработва автономният режим.
reverse_roles.description = Ако е активирано, ролите ще се разменят между итерациите (само в режим Completion).
reverse_roles.label = Размяна на ролите между итерациите
reverse_roles.tooltip = Ако е активирано, ролите ще се разменят между итерациите.
use_extended.description = Когато е активирано, разширената подкана ще се използва вместо стандартната.
use_extended.label = Използвай разширена подкана
