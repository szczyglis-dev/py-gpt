[LOCALE]
plugin.name = מצב אוטונומי
plugin.description = מפעיל מצב אוטונומי בכל מצב צ׳אט. אזהרה: יש להשתמש בזהירות; בשילוב תוספים אחרים עלולות להתקבל תוצאות בלתי צפויות.

dynamic_continue.description = לאחר כל מעבר שהושלם, קריאה מוסתרת המשתמשת במודל שנבחר פועלת כשופטת, בודקת את הזנב המוגדר של הרצת Human/Assistant הנוכחית ומייצרת את ההנחיה למעבר הבא.
dynamic_continue.label = הנחיית המשך דינמית
dynamic_continue_messages.description = מספר תגובות ה-Assistant האחרונות במצב אוטונומי שנכללות בכל בקשת שופט. קלט המשתמש המקורי נכלל תמיד. הגדר 0 כדי לכלול את כל התגובות שנוצרו מאז קלט המשתמש הזה.
dynamic_continue_messages.label = תגובות לשיפוט
always_continue.description = אם האפשרות מופעלת, הסוכן ימשיך להסיק עד שיעצר ידנית.
always_continue.label = המשך תמיד...
always_continue.tooltip = אם האפשרות מופעלת, הסוכן ימשיך להסיק עד שיעצר ידנית.
auto_stop.description = אם האפשרות מופעלת, התוסף ייעצר לאחר השגת היעד.
auto_stop.label = עצירה אוטומטית לאחר השגת היעד
auto_stop.tooltip = אם האפשרות מופעלת, התוסף ייעצר לאחר השגת היעד.
iterations.description = כמה איטרציות להריץ? 0 = ללא הגבלה.\nאזהרה: הגדרת הערך ל-0 עלולה לגרום לבקשות רבות ולשימוש כבד בטוקנים!
iterations.label = איטרציות
iterations.tooltip = כמה איטרציות להריץ? 0 = ללא הגבלה.\nאזהרה: הגדרת הערך ל-0 עלולה לגרום לבקשות רבות ולשימוש כבד בטוקנים!
prompts.description = פרומפט המשמש להנחיה כיצד לטפל במצב אוטונומי; ניתן ליצור כמה פרומפטים שתרצה. הפרומפט הפעיל הראשון ברשימה ישמש לטיפול במצב האוטונומי. מידע: נדרש לפחות פרומפט פעיל אחד!
prompts.label = פרומפטים
prompts.tooltip = פרומפטים המשמשים להנחיה כיצד לטפל במצב אוטונומי.
reverse_roles.description = אם האפשרות מופעלת, התפקידים יתהפכו בין איטרציות (רק במצב Completion).
reverse_roles.label = היפוך תפקידים בין איטרציות
reverse_roles.tooltip = אם האפשרות מופעלת, התפקידים יתהפכו בין איטרציות.
use_extended.description = כאשר האפשרות מופעלת, ייעשה שימוש בפרומפט המורחב במקום ברגיל.
use_extended.label = השתמש בפרומפט מורחב
