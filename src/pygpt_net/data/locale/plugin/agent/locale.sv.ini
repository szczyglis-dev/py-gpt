[LOCALE]
plugin.name = Autonomt läge
plugin.description = Aktiverar autonomt läge i alla chattlägen. VARNING: använd försiktigt; tillsammans med andra plugins kan det ge oväntade resultat.

dynamic_continue.description = Efter varje slutförd körning fungerar ett dolt anrop med den valda modellen som domare, granskar den konfigurerade svansen av den aktuella Human/Assistant-körningen och genererar instruktionen för nästa körning.
dynamic_continue.label = Dynamisk fortsättningsprompt
dynamic_continue_messages.description = Antal av de senaste Assistant-svaren i autonomt läge som inkluderas i varje domaranrop. Den ursprungliga användarinmatningen inkluderas alltid. Ange 0 för att inkludera alla svar som har producerats sedan den användarinmatningen.
dynamic_continue_messages.label = Svar att bedöma
always_continue.description = Om aktiverat fortsätter agenten att resonera tills den stoppas manuellt.
always_continue.label = Fortsätt alltid...
always_continue.tooltip = Om aktiverat fortsätter agenten att resonera tills den stoppas manuellt.
auto_stop.description = Om aktiverat stoppas pluginet när målet har nåtts.
auto_stop.label = Stoppa automatiskt när målet har nåtts
auto_stop.tooltip = Om aktiverat stoppas pluginet när målet har nåtts.
iterations.description = Hur många iterationer ska köras? 0 = oändligt.\nVARNING: Om detta sätts till 0 kan det orsaka många förfrågningar och hög tokenförbrukning!
iterations.label = Iterationer
iterations.tooltip = Hur många iterationer ska köras? 0 = oändligt.\nVARNING: Om detta sätts till 0 kan det orsaka många förfrågningar och hög tokenförbrukning!
prompts.description = Prompt som används för att ange hur autonomt läge ska hanteras; du kan skapa hur många promptar du vill. Den första aktiva prompten i listan används för autonomt läge. INFO: Minst en aktiv prompt krävs!
prompts.label = Promptar
prompts.tooltip = Promptar som används för att ange hur autonomt läge ska hanteras.
reverse_roles.description = Om aktiverat byts rollerna mellan iterationer (endast i Completion-läge).
reverse_roles.label = Byt roller mellan iterationer
reverse_roles.tooltip = Om aktiverat byts rollerna mellan iterationer.
use_extended.description = När aktiverat används den utökade prompten i stället för standardprompten.
use_extended.label = Använd utökad prompt
