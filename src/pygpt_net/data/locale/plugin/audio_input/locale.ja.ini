recognition_energy_threshold.label = energy_threshold
recognition_pause_threshold.description = フレーズの終了として認識される最小無音時間（秒）を表します。既定値: 0.8。
recognition_pause_threshold.label = pause_threshold
stop_words.description = 停止語を指定します。いずれかを受信するとリスニングを停止します。カンマで区切るか、空欄にすると無効になります。既定値: stop, exit, quit, end, finish, close, terminate, kill, halt, abort。
stop_words.label = 停止語
timeout.description = 音声認識のタイムアウト。既定値: 5。
timeout.label = タイムアウト
timeout.tooltip = タイムアウト、既定値: 5。
wait_response.description = 次の入力を聞く前に応答を待ちます。既定値: True。
wait_response.label = 応答を待つ
whisper_local_model.description = ローカル Whisper モデルを選択します。リストのサイズはディスク上の checkpoint の概算ダウンロードサイズであり、RAM/VRAM 使用量ではありません。既定値: base。
whisper_local_model.label = モデル
whisper_local_model_custom.description = 任意のカスタムモデル名またはローカル checkpoint パス。設定すると、上で選択したモデルよりこの値が優先されます。選択したモデルを使う場合は空欄にします。
whisper_local_model_custom.label = カスタムモデル名で上書き
whisper_local_keep_in_memory.description = 文字起こし間でローカル Whisper モデルを RAM に保持します。RAM 使用量を減らすには無効にします。その場合、各文字起こしでローカルキャッシュからモデルを読み込みます。既定値: True。
whisper_local_keep_in_memory.label = モデルを RAM に保持
whisper_model.description = モデルを指定します。既定値: whisper-1。
whisper_model.label = モデル
