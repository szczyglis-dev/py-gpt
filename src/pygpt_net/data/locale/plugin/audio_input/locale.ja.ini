prefix_words.description = プレフィックス語を指定します。設定すると、これらの語で始まるフレーズだけが送信され、残りは無視されます。単語はカンマで区切ります（例: 'OK, Okay, GPT'）。無効にするには空欄にします。
prefix_words.label = プレフィックス語
