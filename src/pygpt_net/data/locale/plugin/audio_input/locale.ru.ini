recognition_adjust_for_ambient_noise_duration.description = Параметр duration — максимальное число секунд, в течение которых порог будет динамически настраиваться перед возвратом. По умолчанию: 1.
recognition_adjust_for_ambient_noise_duration.label = adjust_for_ambient_noise: длительность
recognition_dynamic_energy_adjustment_damping.description = Приблизительно определяет долю текущего энергетического порога, сохраняемую после одной секунды динамической настройки порога. По умолчанию: 0.15.
