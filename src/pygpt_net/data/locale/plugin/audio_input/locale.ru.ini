recognition_energy_threshold.label = energy_threshold
recognition_pause_threshold.description = Определяет минимальную длительность тишины (в секундах), которая считается концом фразы. По умолчанию: 0.8.
recognition_pause_threshold.label = pause_threshold
stop_words.description = Укажите стоп-слова: при получении любого из них прослушивание прекращается. Разделяйте слова запятыми или оставьте поле пустым для отключения; по умолчанию: stop, exit, quit, end, finish, close, terminate, kill, halt, abort.
stop_words.label = Стоп-слова
