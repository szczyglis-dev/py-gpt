wait_response.description = Ждать ответа перед прослушиванием следующего ввода. По умолчанию: True.
wait_response.label = Ждать ответа
whisper_local_model.description = Выберите локальную модель Whisper. Размер в списке — приблизительный размер загрузки checkpoint на диск, а не потребление RAM/VRAM. По умолчанию: base.
whisper_local_model.label = Модель
