use_loaders.description = File reading (`fs_read_file` command) के लिए LlamaIndex data loaders उपयोग करें।
use_loaders.label = Data loaders उपयोग करें
use_project_index.label = यदि उपयोग में हो तो project index उपयोग करें
use_project_index.description = जब वर्तमान conversation किसी project के भीतर हो, तो files को configured global index(es) के बजाय उस project के isolated index में index करें।
enable_filesystem.label = फ़ाइल सिस्टम सक्षम करें
enable_filesystem.description = इस अनुभाग के टूल का समर्थन और उन तक पहुँच सक्षम करता है।
cmd.fs_deliver_file_to_user.description = तैयार फ़ाइल को उत्तर के परिणाम के रूप में उपयोगकर्ता को देता है।
cmd.fs_runtime_artifacts.description = बनाई या डाउनलोड की गई फ़ाइलों को स्थानीय टूल के लिए तैयार करता है और उनके पथ लौटाता है।
