idx.description = File indexing के लिए उपयोग किए जाने वाले एक या अधिक global indexes चुनें। जब "Use project index if in use" सक्षम हो और वर्तमान conversation किसी project के भीतर हो, तो उसके स्थान पर isolated project index उपयोग किया जाता है।
idx.label = Files index करते समय उपयोग किए जाने वाले indexes
idx.tooltip = Index नाम
model_tmp_query.description = `fs_query_file` command के लिए temporary index query में उपयोग किया जाने वाला model (in-memory index)।
