use_loaders.description = 파일 읽기(`fs_read_file` 명령)에 LlamaIndex 데이터 로더를 사용합니다.
use_loaders.label = 데이터 로더 사용
use_project_index.label = 사용 중이면 프로젝트 인덱스 사용
use_project_index.description = 현재 대화가 프로젝트 안에 있으면 설정된 전역 인덱스 대신 해당 프로젝트의 격리된 인덱스에 파일을 인덱싱합니다.
enable_filesystem.label = 파일 시스템 활성화
enable_filesystem.description = 이 섹션의 도구 지원 및 접근을 활성화합니다.
cmd.fs_deliver_file_to_user.description = 완성된 파일을 응답 결과물로 사용자에게 전달합니다.
cmd.fs_runtime_artifacts.description = 생성되거나 다운로드된 파일을 로컬 도구에서 사용할 수 있도록 준비하고 경로를 반환합니다.
