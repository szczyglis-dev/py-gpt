idx.description = 파일 인덱싱에 사용할 하나 이상의 전역 인덱스를 선택합니다. "Use project index if in use"가 활성화되어 있고 현재 대화가 프로젝트 안에 있으면 대신 해당 프로젝트의 격리된 인덱스를 사용합니다.
idx.label = 파일 인덱싱에 사용할 인덱스
idx.tooltip = 인덱스 이름
model_tmp_query.description = `fs_query_file` 명령의 임시 인덱스 질의에 사용할 모델(메모리 내 인덱스).
