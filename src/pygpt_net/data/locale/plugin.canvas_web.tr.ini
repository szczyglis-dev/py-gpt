[LOCALE]
plugin.name = Tuval
plugin.description = BETA. HTML ve JavaScript, web sitesi prototipleme, tarayıcıyla sınırlı etkileşim, Playwright otomasyonu, açıklamalar ve hafif bir önizleme sunucusu için dahili tuval/tarayıcı çalışma ortamı sağlar. Bu özellik gelecek sürümlerde daha da geliştirilecektir.
use_sandbox.label = Sandbox kullan (Playwright)
use_sandbox.description = Yalıtılmış Playwright tarayıcı backendini etkinleştirir. Devre dışıyken Canvas yerleşik QWebEngine tarayıcısını kullanır ve Playwrightı başlatmaz.
playwright_engine.label = Playwright motoru
playwright_engine.description = Yalıtılmış Playwright backendinin kullandığı tarayıcı motoru.
playwright_path.label = Playwright tarayıcı dizini
playwright_path.description = İsteğe bağlı PLAYWRIGHT_BROWSERS_PATH. Playwright varsayılanını kullanmak için boş bırakın.
playwright_args.label = Playwright tarayıcı argümanları
playwright_args.description = İsteğe bağlı, virgülle ayrılmış Chromium/Playwright başlatma argümanları.
default_width.label = Varsayılan görünüm genişliği
default_width.description = Tarayıcı görünümünün piksel cinsinden varsayılan genişliği.
default_height.label = Varsayılan görünüm yüksekliği
default_height.description = Tarayıcı görünümünün piksel cinsinden varsayılan yüksekliği.
auto_open_split.label = Tarayıcıyı bölünmüş görünümde otomatik aç
auto_open_split.description = Bir oturumda tarayıcı ilk kez bir ajan tarafından açıldığında ikinci sütunda Canvas sekmesini oluşturur veya odaklar ve bölünmüş görünümü gösterir. Kullanıcı daha sonra gizlerse aynı oturumda tekrar zorlamaz.
annotation_prompt.label = Kullanıcı açıklamalarını modele göster
annotation_prompt.description = Bekleyen tarayıcı/tuval açıklamalarını çalışma zamanı sistem promptuna ekler.
max_annotations.label = Maksimum açıklama sayısı
max_annotations.description = Geçerli tarayıcı oturumunda tutulan maksimum açıklama sayısı.
console_limit.label = Konsol günlüğü sınırı
console_limit.description = Bellekte tutulan maksimum tarayıcı konsolu girdisi sayısı.
cmd.canvas_open.label = Etkinleştir: canvas_open
cmd.canvas_open.description = Kalıcı tuval/tarayıcı ortamını açar veya içinde gezinir. Varsayılan olarak QWebEngine kullanılır; Playwright yalnızca plugin ayarlarında etkinse kullanılır.
cmd.canvas_change_resolution.label = Etkinleştir: canvas_change_resolution
cmd.canvas_change_resolution.description = Tuval/tarayıcı görünümünün boyutunu ve yönünü değiştirir.
cmd.canvas_set_html.label = Etkinleştir: canvas_set_html
cmd.canvas_set_html.description = Kalıcı tuval/tarayıcı ortamında istenen HTML/CSS/JavaScript içeriğini işler.
cmd.canvas_get_html.label = Etkinleştir: canvas_get_html
cmd.canvas_get_html.description = Geçerli tuval/tarayıcı URL’sini ve serileştirilmiş HTML belgesini getirir.
cmd.canvas_current.label = Etkinleştir: canvas_current
cmd.canvas_current.description = Geçerli tuval/tarayıcı oturumu durumunu getirir.
cmd.canvas_close.label = Etkinleştir: canvas_close
cmd.canvas_close.description = Arka plandaki tarayıcı oturumunu yok etmeden PyGPT’deki görünür tuval sekmesini kapatır.
cmd.canvas_prev.label = Etkinleştir: canvas_prev
cmd.canvas_prev.description = Tuval/tarayıcı geçmişinde geri gider.
cmd.canvas_next.label = Etkinleştir: canvas_next
cmd.canvas_next.description = Tuval/tarayıcı geçmişinde ileri gider.
cmd.canvas_reload.label = Etkinleştir: canvas_reload
cmd.canvas_reload.description = Geçerli tuval/tarayıcı belgesini yeniden yükler.
cmd.canvas_screenshot.label = Etkinleştir: canvas_screenshot
cmd.canvas_screenshot.description = Modelin sanal imleciyle birlikte geçerli tuval/tarayıcı görünümünü yakalar.
cmd.canvas_inspect.label = Etkinleştir: canvas_inspect
cmd.canvas_inspect.description = Görünür/etkileşimli DOM öğelerini inceler ve kararlı seçiciler ile sınırları döndürür.
cmd.canvas_click.label = Etkinleştir: canvas_click
cmd.canvas_click.description = Yalnızca tuval/tarayıcı içinde bir öğeye veya koordinata tıklar.
cmd.canvas_hover.label = Etkinleştir: canvas_hover
cmd.canvas_hover.description = Modelin sanal imlecini hareket ettirir ve tuval/tarayıcı içinde hover yapar.
cmd.canvas_type.label = Etkinleştir: canvas_type
cmd.canvas_type.description = Düzenlenebilir bir öğeye odaklanır ve tuval/tarayıcı içinde metin yazar.
cmd.canvas_key.label = Etkinleştir: canvas_key
cmd.canvas_key.description = Yalnızca tuval/tarayıcıya bir tuş veya tuş kombinasyonu gönderir.
cmd.canvas_scroll.label = Etkinleştir: canvas_scroll
cmd.canvas_scroll.description = Tuval/tarayıcı görünümünü kaydırır.
cmd.canvas_drag.label = Etkinleştir: canvas_drag
cmd.canvas_drag.description = Tuval/tarayıcı içinde iki görünüm koordinatı arasında sürükler.
cmd.canvas_wait.label = Etkinleştir: canvas_wait
cmd.canvas_wait.description = Tuval/tarayıcı ortamında bir seçiciyi veya kısa bir süreyi bekler.
cmd.canvas_eval.label = Etkinleştir: canvas_eval
cmd.canvas_eval.description = Geçerli tuval/tarayıcı sayfasında JavaScript çalıştırır.
cmd.canvas_select.label = Etkinleştir: canvas_select
cmd.canvas_select.description = Tuval/tarayıcıdaki select öğesinde bir seçenek seçer.
cmd.canvas_check.label = Etkinleştir: canvas_check
cmd.canvas_check.description = Tuval/tarayıcıdaki onay kutusu veya radyo düğmesinin durumunu ayarlar.
cmd.canvas_upload.label = Etkinleştir: canvas_upload
cmd.canvas_upload.description = Güvenlik doğrulamasından geçmiş bir host dosyasını Playwright dosya alanı üzerinden tuval/tarayıcıya yükler.
cmd.canvas_console.label = Etkinleştir: canvas_console
cmd.canvas_console.description = Tuval/tarayıcıdan son JavaScript konsolu mesajlarını ve sayfa hatalarını getirir.
cmd.canvas_annotations.label = Etkinleştir: canvas_annotations
cmd.canvas_annotations.description = Geçerli tuval/tarayıcı oturumundaki kullanıcı açıklamalarını getirir.
cmd.canvas_clear_annotations.label = Etkinleştir: canvas_clear_annotations
cmd.canvas_clear_annotations.description = Tuval/tarayıcı açıklamalarını temizler.
cmd.web_server_start.label = Etkinleştir: web_server_start
cmd.web_server_start.description = Seçilen çalışma dizini için yalnızca loopback üzerinde statik önizleme sunucusu başlatır.
cmd.web_server_current.label = Etkinleştir: web_server_current
cmd.web_server_current.description = Önizleme sunucusunun geçerli durumunu getirir.
cmd.web_server_stop.label = Etkinleştir: web_server_stop
cmd.web_server_stop.description = Önizleme sunucusunu durdurur.
