plugin.name = Interpret Pythonu
sandbox.label = Sandbox
sandbox.description = Vypnuto: spouští Python/IPython přímo na hostiteli (nebezpečné). Vestavěný sandbox: spouští vestavěné prostředí CPython/IPython spravované pomocí uv s izolací na úrovni OS, pokud je dostupná (střední úroveň zabezpečení). Docker: vyžaduje nainstalovaný a spuštěný Docker a poskytuje nejsilnější izolaci; je to nejbezpečnější možnost.
