plugin.name = Interpret Pythonu
sandbox.label = Sandbox
sandbox.description = Vypnuto: spouští Python/IPython přímo na hostiteli (nebezpečné). Vestavěné: spouští vyhrazené prostředí CPython/IPython spravované pomocí uv v samostatném procesu, ale neomezuje přístup k souborovému systému hostitele. Docker: vyžaduje nainstalovaný a spuštěný Docker a poskytuje nejsilnější izolaci; je to nejbezpečnější možnost.

