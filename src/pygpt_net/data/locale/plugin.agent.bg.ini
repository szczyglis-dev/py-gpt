[LOCALE]
plugin.name = Автономен режим
plugin.description = Активира автономен режим във всеки чат режим. ВНИМАНИЕ: използвайте внимателно, защото с други плъгини може да доведе до неочаквани резултати.

dynamic_continue.description = След всеки завършен проход скрито извикване с избрания модел действа като съдия, преглежда конфигурирания край на текущото изпълнение Human/Assistant и генерира инструкцията за следващия проход.
dynamic_continue.label = Динамичен prompt за продължаване
dynamic_continue_messages.description = Брой на най-скорошните отговори на асистента в автономен режим, включвани във всяка заявка към съдията. Оригиналният вход на потребителя винаги се включва. Задайте 0, за да включите всички отговори, създадени след този потребителски вход.
dynamic_continue_messages.label = Отговори за оценяване
